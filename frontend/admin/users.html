<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원 계정 관리 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/reset.css" />
  <link rel="stylesheet" href="../shared/css/main.css" />
  
  <style>
    body { 
      margin: 0; padding: 0; 
      width: 100%; max-width: none; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .table-scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }
    .table-scroll-container::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .admin-table-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .col-phone { width: 45%; }
    .col-date { width: 35%; }
    .col-actions { width: 20%; }

    .table-actions-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
    }

    .search-input {
      padding: 10px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fff;
      color: #0f172a;
      width: 320px;
      box-sizing: border-box;
    }

    .search-input:focus {
      border-color: var(--primary, #475569);
      box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.15);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">User Account Management</span>
          <h1>회원 계정 관리</h1>
          <p class="header-desc">일반 관광객 회원을 조회하고 관리합니다.</p>
        </div>
      </header>

      <!-- 회원 목록 외부 타이틀 -->
      <div class="subpage-title-area">
        <h2 class="page-subtitle">회원 목록</h2>
      </div>

      <!-- 검색 바 -->
      <div class="table-actions-bar">
        <input type="text" class="search-input" id="search-phone" placeholder="전화번호 뒷 4자리 검색" />
      </div>

      <!-- 회원 목록 카드 -->
      <div class="admin-card">
        <div class="table-scroll-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th class="col-phone">전화번호</th>
                <th class="col-date">가입 일시</th>
                <th class="col-actions">관리</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="3" class="table-placeholder">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./users.js"></script>
</body>
</html>
