<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원 상세 정보 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  
  <style>
    body { 
      margin: 0; padding: 0; 
      width: 100%; max-width: none; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a;
    }
    .back-link svg {
      transition: transform 0.2s;
      width: 16px;
      height: 16px;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    /* 프로필 위젯 디자인 */
    .profile-container {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 24px;
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    }
    .profile-detail-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #f1f5f9;
      transition: all 0.2s;
    }
    .profile-detail-card:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .profile-detail-icon {
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-detail-icon svg {
      width: 20px;
      height: 20px;
    }
    .profile-detail-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .profile-detail-label {
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 500;
    }
    .profile-detail-value {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
    }

    /* 탭 디자인 */
    .coupon-tabs-outer {
      margin-bottom: 24px;
      display: flex;
      justify-content: flex-start;
    }
    .coupon-tabs-container {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 20px;
      gap: 2px;
    }
    .coupon-tab-pill {
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #475569;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: none;
      border: none;
    }
    .coupon-tab-pill:hover {
      color: #0f172a;
    }
    .coupon-tab-pill.active {
      background: #475569;
      color: #fff;
      box-shadow: 0 2px 8px rgba(71, 85, 105, 0.25);
    }
    .tab-count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      color: inherit;
    }
    .coupon-tab-pill.active .tab-count-badge {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 쿠폰 카드 목록 그리드 및 카드 디자인 */
    .coupon-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .coupon-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .coupon-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04);
    }
    .coupon-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .badge-available {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .badge-used {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .badge-expired {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .badge-cancelled {
      background: #ffedd5;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }
    .coupon-amount {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
    }
    .coupon-card-divider {
      border-top: 1px dashed #e2e8f0;
      margin: 2px 0;
    }
    .coupon-card-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .coupon-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      color: #1e293b;
      font-weight: 600;
    }
    .info-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-section-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .info-section-divider {
      border-top: 1px solid #f1f5f9;
      margin: 4px 0;
    }
    .status-red {
      color: #ef4444;
    }
    .card-placeholder {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      background: #fff;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">User Account Management</span>
          <h1>회원 계정 관리</h1>
          <p class="header-desc">일반 관광객 회원을 조회하고 관리합니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="users.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            목록으로
          </a>
        </div>
        <h2 class="page-subtitle">회원 상세 정보</h2>
      </div>

      <!-- 프로필 정보 요약 -->
      <div class="profile-container">
        <div class="profile-detail-card">
          <div class="profile-detail-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
            </svg>
          </div>
          <div class="profile-detail-info">
            <span class="profile-detail-label">전화번호</span>
            <span class="profile-detail-value" id="profile-phone">-</span>
          </div>
        </div>
        <div class="profile-detail-card">
          <div class="profile-detail-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
            </svg>
          </div>
          <div class="profile-detail-info">
            <span class="profile-detail-label">가입 일시</span>
            <span class="profile-detail-value" id="profile-regdate">-</span>
          </div>
        </div>
      </div>

      <!-- 3탭 버튼 영역 (목록 컨테이너와 분리됨) -->
      <div class="coupon-tabs-outer">
        <div class="coupon-tabs-container">
          <button class="coupon-tab-pill active" id="tab-btn-available" onclick="window.switchTab('available')">
            사용 전
            <span class="tab-count-badge" id="count-available">0</span>
          </button>
          <button class="coupon-tab-pill" id="tab-btn-used" onclick="window.switchTab('used')">
            사용 완료
            <span class="tab-count-badge" id="count-used">0</span>
          </button>
          <button class="coupon-tab-pill" id="tab-btn-expired" onclick="window.switchTab('expired')">
            만료
            <span class="tab-count-badge" id="count-expired">0</span>
          </button>
        </div>
      </div>

      <!-- 쿠폰 카드 목록 -->
      <div class="coupon-cards-grid" id="couponsCardContainer">
        <div class="card-placeholder">쿠폰 내역이 로드되는 중입니다...</div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast } from '../shared/js/api.js';
    import { requireAdminAuth, getAdminToken } from '../shared/js/admin-guard.js';

    await requireAdminAuth();
    const token = getAdminToken();

    // URL에서 userId 추출
    const urlParams = new URLSearchParams(window.location.search);
    const userId = parseInt(urlParams.get('id'));

    if (!userId) {
      showToast('잘못된 접근입니다.', 'error');
      setTimeout(() => {
        window.location.href = 'users.html';
      }, 1500);
    } else {
      loadUserDetails();
      loadUserCoupons();
    }

    function getMaskedPhone(nickname) {
      return nickname || '미인증';
    }

    async function loadUserDetails() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          const user = data.data.find(u => u.id === userId);
          if (!user) {
            showToast('존재하지 않는 회원입니다.', 'error');
            setTimeout(() => {
              window.location.href = 'users.html';
            }, 1500);
            return;
          }
          
          const phoneStr = getMaskedPhone(user.nickname);
          const regDateStr = user.created_at ? new Date(user.created_at).toLocaleString('ko-KR') : '—';

          document.getElementById('profile-phone').innerText = phoneStr;
          document.getElementById('profile-regdate').innerText = regDateStr;
        } else {
          showToast('회원 정보를 불러오지 못했습니다.', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('서버 통신 실패', 'error');
      }
    }

    let userCoupons = [];
    let currentTab = 'available';

    window.switchTab = function(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.coupon-tab-pill').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      renderCoupons();
    };

    function updateTabCounts() {
      const availableCount = userCoupons.filter(c => c.status === 'available').length;
      const usedCount = userCoupons.filter(c => c.status === 'used').length;
      const expiredCount = userCoupons.filter(c => c.status === 'expired' || c.status === 'cancelled').length;

      document.getElementById('count-available').innerText = availableCount;
      document.getElementById('count-used').innerText = usedCount;
      document.getElementById('count-expired').innerText = expiredCount;
    }

    function renderCoupons() {
      const container = document.getElementById('couponsCardContainer');
      container.innerHTML = '';

      const filtered = userCoupons.filter(c => {
        if (currentTab === 'available') {
          return c.status === 'available';
        } else if (currentTab === 'used') {
          return c.status === 'used';
        } else {
          return c.status === 'expired' || c.status === 'cancelled';
        }
      });

      if (filtered.length === 0) {
        const msg = {
          'available': '보유한 사용 전 쿠폰이 없습니다.',
          'used': '사용 완료된 쿠폰이 없습니다.',
          'expired': '만료되거나 취소된 쿠폰이 없습니다.'
        }[currentTab];
        container.innerHTML = `<div class="card-placeholder">${msg}</div>`;
        return;
      }

      filtered.forEach(c => {
        const issuerStr = c.issuer_name ? c.issuer_name : '키오스크 / 기타';
        const issuedDateStr = c.issued_at ? new Date(c.issued_at).toLocaleDateString('ko-KR') : '—';
        const amountStr = `${Number(c.face_value).toLocaleString()}원`;

        if (currentTab === 'available') {
          const card = document.createElement('div');
          card.className = 'coupon-card type-available';
          card.innerHTML = `
            <div class="coupon-card-top">
              <span class="coupon-amount">${amountStr}</span>
            </div>
            <div class="coupon-card-divider"></div>
            <div class="coupon-card-body">
              <div class="coupon-info-row">
                <span class="info-label">발행처</span>
                <span class="info-value">${issuerStr}</span>
              </div>
              <div class="coupon-info-row">
                <span class="info-label">발급일</span>
                <span class="info-value">${issuedDateStr}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        } else if (currentTab === 'used') {
          const merchantStr = c.merchant_name ? c.merchant_name : '—';
          const usedDateStr = c.used_at ? new Date(c.used_at).toLocaleDateString('ko-KR') : '—';
          const card = document.createElement('div');
          card.className = 'coupon-card type-used';
          card.innerHTML = `
            <div class="coupon-card-top">
              <span class="status-badge badge-used">사용 완료</span>
              <span class="coupon-amount">${amountStr}</span>
            </div>
            <div class="coupon-card-divider"></div>
            <div class="coupon-card-body">
              <div class="info-section">
                <div class="info-section-title">발행 정보</div>
                <div class="coupon-info-row">
                  <span class="info-label">발행처</span>
                  <span class="info-value">${issuerStr}</span>
                </div>
                <div class="coupon-info-row">
                  <span class="info-label">발급일</span>
                  <span class="info-value">${issuedDateStr}</span>
                </div>
              </div>
              <div class="info-section-divider"></div>
              <div class="info-section">
                <div class="info-section-title">사용 정보</div>
                <div class="coupon-info-row">
                  <span class="info-label">사용처</span>
                  <span class="info-value">${merchantStr}</span>
                </div>
                <div class="coupon-info-row">
                  <span class="info-label">사용일</span>
                  <span class="info-value">${usedDateStr}</span>
                </div>
              </div>
            </div>
          `;
          container.appendChild(card);
        } else {
          const statusLabel = c.status === 'expired' ? '만료' : '취소됨';
          const badgeClass = c.status === 'expired' ? 'badge-expired' : 'badge-cancelled';
          const statusDetail = c.status === 'expired' ? '기한 만료' : '발행 취소';
          
          const card = document.createElement('div');
          card.className = 'coupon-card type-expired';
          card.innerHTML = `
            <div class="coupon-card-top">
              <span class="status-badge ${badgeClass}">${statusLabel}</span>
              <span class="coupon-amount">${amountStr}</span>
            </div>
            <div class="coupon-card-divider"></div>
            <div class="coupon-card-body">
              <div class="coupon-info-row">
                <span class="info-label">발행처</span>
                <span class="info-value">${issuerStr}</span>
              </div>
              <div class="coupon-info-row">
                <span class="info-label">발급일</span>
                <span class="info-value">${issuedDateStr}</span>
              </div>
              <div class="coupon-info-row">
                <span class="info-label">처리 상태</span>
                <span class="info-value status-red">${statusDetail}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        }
      });
    }

    async function loadUserCoupons() {
      try {
        const res = await fetch(`/api/admin/users/${userId}/coupons`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          userCoupons = data.data;
          updateTabCounts();
          renderCoupons();
        } else {
          document.getElementById('couponsCardContainer').innerHTML = '<div class="card-placeholder status-red">쿠폰 내역 조회 실패</div>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('couponsCardContainer').innerHTML = '<div class="card-placeholder status-red">서버 오류 발생</div>';
      }
    }
  </script>
</body>
</html>
