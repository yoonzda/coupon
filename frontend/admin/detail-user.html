<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원 상세 정보 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  
  <style>
    body { 
      margin: 0; padding: 0; 
      width: 100%; max-width: none; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a;
    }
    .back-link svg {
      transition: transform 0.2s;
      width: 16px;
      height: 16px;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    .profile-card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .profile-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .profile-label {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .profile-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
    }
    .table-scroll-container::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .col-third { width: 33.33%; }
    .col-25 { width: 25%; }
    .col-15 { width: 15%; }
    .col-20 { width: 20%; }
    /* 탭 디자인 */
    .tab-header {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }

    .tab-btn {
      padding: 16px 24px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #64748b;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #0f172a;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">User Account Management</span>
          <h1>회원 계정 관리</h1>
          <p class="header-desc">일반 관광객 회원을 조회하고 관리합니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="users.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            목록으로
          </a>
        </div>
        <h2 class="page-subtitle">회원 상세 정보</h2>
      </div>

      <!-- 프로필 정보 요약 -->
      <div class="profile-card">
        <div class="profile-item">
          <span class="profile-label">전화번호</span>
          <div class="profile-value" id="profile-phone">-</div>
        </div>
        <div class="profile-item">
          <span class="profile-label">가입 일시</span>
          <div class="profile-value" id="profile-regdate">-</div>
        </div>
      </div>

      <!-- 쿠폰 보유 및 사용 내역 -->
      <div class="admin-card">
        <!-- 탭 헤더 -->
        <div class="tab-header">
          <button class="tab-btn active" id="tab-btn-available" onclick="window.switchTab('available')">사용 가능 쿠폰</button>
          <button class="tab-btn" id="tab-btn-used" onclick="window.switchTab('used')">사용 완료 / 만료 쿠폰</button>
        </div>
        <div class="table-scroll-container">
          <table class="admin-table">
            <thead>
              <tr id="table-header-row">
                <!-- 동적 헤더 로드 -->
              </tr>
            </thead>
            <tbody id="couponsTableBody">
              <tr><td colspan="3" class="table-placeholder">쿠폰 내역이 로드되는 중입니다...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast } from '../shared/js/api.js';
    import { requireAdminAuth, getAdminToken } from '../shared/js/admin-guard.js';

    await requireAdminAuth();
    const token = getAdminToken();

    // URL에서 userId 추출
    const urlParams = new URLSearchParams(window.location.search);
    const userId = parseInt(urlParams.get('id'));

    if (!userId) {
      showToast('잘못된 접근입니다.', 'error');
      setTimeout(() => {
        window.location.href = 'users.html';
      }, 1500);
    } else {
      loadUserDetails();
      loadUserCoupons();
    }

    function getMaskedPhone(nickname) {
      if (!nickname) return '미인증';
      const clean = nickname.replace(/[^0-9]/g, '');
      if (clean.startsWith('010') && clean.length >= 10) {
        const part1 = clean.substring(0, 3);
        const part3 = clean.substring(clean.length - 4);
        return `${part1}-****-${part3}`;
      }
      return nickname; // Fallback for seed nicknames (e.g. '바다별')
    }

    async function loadUserDetails() {
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          const user = data.data.find(u => u.id === userId);
          if (!user) {
            showToast('존재하지 않는 회원입니다.', 'error');
            setTimeout(() => {
              window.location.href = 'users.html';
            }, 1500);
            return;
          }
          
          const phoneStr = getMaskedPhone(user.nickname);
          const regDateStr = user.created_at ? new Date(user.created_at).toLocaleString('ko-KR') : '—';

          document.getElementById('profile-phone').innerText = phoneStr;
          document.getElementById('profile-regdate').innerText = regDateStr;
        } else {
          showToast('회원 정보를 불러오지 못했습니다.', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('서버 통신 실패', 'error');
      }
    }

    let userCoupons = [];
    let currentTab = 'available';

    window.switchTab = function(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      renderCoupons();
    };

    function renderCoupons() {
      const headerRow = document.getElementById('table-header-row');
      const tableBody = document.getElementById('couponsTableBody');
      tableBody.innerHTML = '';

      const filtered = userCoupons.filter(c => {
        if (currentTab === 'available') {
          return c.status === 'available';
        } else {
          return c.status !== 'available';
        }
      });

      if (currentTab === 'available') {
        headerRow.innerHTML = `
          <th class="col-25">금액</th>
          <th class="col-25">상태</th>
          <th class="col-25">발행처</th>
          <th class="col-25">발급일</th>
        `;

        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="table-placeholder">보유한 사용 가능 쿠폰이 없습니다.</td></tr>';
          return;
        }

        filtered.forEach(c => {
          const statusLabel = '<span class="status-available">사용 가능</span>';
          const issuerStr = c.issuer_name ? c.issuer_name : '키오스크 / 기타';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="coupon-face-value">${Number(c.face_value).toLocaleString()}원</td>
            <td>${statusLabel}</td>
            <td>${issuerStr}</td>
            <td class="coupon-date">${new Date(c.issued_at).toLocaleDateString()}</td>
          `;
          tableBody.appendChild(tr);
        });
      } else {
        headerRow.innerHTML = `
          <th class="col-15">금액</th>
          <th class="col-15">상태</th>
          <th class="col-20">발행처</th>
          <th class="col-15">발급일</th>
          <th class="col-20">사용처</th>
          <th class="col-15">사용일</th>
        `;

        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="6" class="table-placeholder">사용 완료 또는 만료된 쿠폰이 없습니다.</td></tr>';
          return;
        }

        filtered.forEach(c => {
          const statusLabel = {
            'used': '<span class="status-used">사용 완료</span>',
            'expired': '<span class="status-expired">만료</span>',
            'cancelled': '<span class="status-cancelled">취소됨</span>'
          }[c.status] || c.status;

          const issuerStr = c.issuer_name ? c.issuer_name : '키오스크 / 기타';
          const merchantStr = c.merchant_name ? c.merchant_name : '—';
          const usedDateStr = c.used_at ? new Date(c.used_at).toLocaleDateString() : '—';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="coupon-face-value">${Number(c.face_value).toLocaleString()}원</td>
            <td>${statusLabel}</td>
            <td>${issuerStr}</td>
            <td class="coupon-date">${new Date(c.issued_at).toLocaleDateString()}</td>
            <td>${merchantStr}</td>
            <td class="coupon-date">${usedDateStr}</td>
          `;
          tableBody.appendChild(tr);
        });
      }
    }

    async function loadUserCoupons() {
      try {
        const res = await fetch(`/api/admin/users/${userId}/coupons`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
          userCoupons = data.data;
          renderCoupons();
        } else {
          document.getElementById('couponsTableBody').innerHTML = '<tr><td colspan="4" class="table-placeholder status-expired">쿠폰 내역 조회 실패</td></tr>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('couponsTableBody').innerHTML = '<tr><td colspan="4" class="table-placeholder status-expired">서버 오류 발생</td></tr>';
      }
    }
  </script>
</body>
</html>
