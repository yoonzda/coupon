<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 수정 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a !important;
    }
    .back-link svg {
      transition: transform 0.2s;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Administrator Settings</span>
          <h1>관리자 계정 관리</h1>
          <p class="header-desc">관리자 계정을 추가하거나 권한을 설정할 수 있습니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="managers.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            뒤로가기
          </a>
        </div>
        <h2 class="page-subtitle">관리자 수정</h2>
      </div>

      <div class="form-container">
        <form id="form-edit-manager" onsubmit="updateManager(event)">
          <!-- 브라우저 자동완성 방지용 더미 필드 -->
          <input type="text" style="display:none;" aria-hidden="true" />
          <input type="password" style="display:none;" aria-hidden="true" />

          <div class="form-group">
            <label for="manager-name">관리자 이름</label>
            <input type="text" id="manager-name" placeholder="관리자 이름 입력" autocomplete="off" required />
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;">
              <label for="manager-username" style="margin-bottom: 0 !important;">아이디</label>
              <span style="font-size: 0.78rem; color: #94a3b8; font-weight: 500;">아이디는 수정할 수 없습니다</span>
            </div>
            <input type="text" id="manager-username" readonly style="background: #e2e8f0 !important; cursor: not-allowed;" autocomplete="new-username" />
          </div>
          <div class="form-group">
            <label for="manager-password">새 비밀번호</label>
            <input type="password" id="manager-password" placeholder="비밀번호 변경 시에만 입력" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="manager-role">권한 설정</label>
            <select id="manager-role" required>
              <option value="operator" selected>일반 운영자</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-sm" style="height: 42px; padding: 0 24px; border-radius: 6px; font-weight: 600; cursor: pointer;">수정하기</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast } from '../shared/js/api.js'
    import { requireAdminAuth } from '../shared/js/admin-guard.js'

    await requireAdminAuth();

    // URL에서 ID 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const managerId = urlParams.get('id');

    if (!managerId) {
      alert('잘못된 접근입니다.');
      location.href = 'managers.html';
    }

    let originalName = '';
    let originalRole = '';
    let isSubmitting = false;
    let isNavigatingAway = false;

    // 변경 사항이 있는지 확인
    function hasChanges() {
      const name = document.getElementById('manager-name').value.trim();
      const role = document.getElementById('manager-role').value;
      const password = document.getElementById('manager-password').value;

      return (name !== originalName && originalName !== '') || 
             (role !== originalRole && originalRole !== '') || 
             password !== '';
    }

    // 브라우저 뒤로가기 / 탭 닫기 / 새로고침 경고
    window.addEventListener('beforeunload', (e) => {
      if (hasChanges() && !isSubmitting && !isNavigatingAway) {
        e.preventDefault();
        e.returnValue = ''; // 크롬/최신 브라우저 필수
      }
    });

    // 페이지 내 링크 이동 경고 (뒤로가기 링크, 사이드바 등)
    document.addEventListener('click', (e) => {
      const anchor = e.target.closest('a');
      if (anchor && anchor.getAttribute('href') && !anchor.getAttribute('href').startsWith('#') && anchor.getAttribute('href') !== 'javascript:void(0)') {
        if (hasChanges() && !isSubmitting) {
          const confirmLeave = confirm('변경 사항이 저장되지 않았습니다. 정말 뒤로 가시겠습니까?');
          if (confirmLeave) {
            isNavigatingAway = true;
          } else {
            e.preventDefault();
          }
        }
      }
    });

    // 관리자 정보 불러오기
    async function loadManagerData() {
      try {
        const res = await api.get(`/admin/managers/${managerId}`);
        if (res.success && res.data) {
          if (res.data.role === 'super') {
            alert('최고 관리자는 수정할 수 없습니다.');
            location.href = 'managers.html';
            return;
          }
          document.getElementById('manager-name').value = res.data.name;
          document.getElementById('manager-username').value = res.data.username;
          document.getElementById('manager-role').value = res.data.role;
          originalName = res.data.name;
          originalRole = res.data.role;
        } else {
          showToast(res.message || '관리자 정보를 불러오지 못했습니다.', 'error');
          setTimeout(() => location.href = 'managers.html', 1500);
        }
      } catch (err) {
        showToast('정보 로딩 실패', 'error');
        console.error(err);
      }
    }

    // 폼 서브밋 핸들러
    window.updateManager = async function(e) {
      e.preventDefault();
      const name = document.getElementById('manager-name').value.trim();
      const role = document.getElementById('manager-role').value;
      const password = document.getElementById('manager-password').value;

      if (!name || !role) {
        showToast('필수 필드를 입력해 주세요.', 'error');
        return;
      }

      const payload = { name, role };
      if (password) {
        payload.password = password;
      }

      isSubmitting = true;

      try {
        const res = await api.put(`/admin/managers/${managerId}`, payload);
        showToast(res.message || '관리자 정보가 수정되었습니다.', 'success');
        
        setTimeout(() => {
          location.href = 'managers.html';
        }, 1000);
      } catch (err) {
        showToast(err.message || '정보 수정에 실패했습니다.', 'error');
        isSubmitting = false;
      }
    }

    loadManagerData();
  </script>
</body>
</html>
