<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>통계 및 보고서 | 옹진 관광 관리자</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }
    
    /* Top Controls */
    .controls { display: flex; gap: 12px; align-items: center; }
    .controls select, .controls input[type="date"] {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;
    }
    .btn-export {
      padding: 8px 16px; background: #334155; color: white; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-export:hover { background: #1e293b; }

    /* KPI Cards */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px;
    }
    .stat-card {
      background: #fff; padding: 24px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
    .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--text-primary); }
    .stat-trend { font-size: 0.8rem; margin-top: 8px; display: inline-block; padding: 2px 8px; border-radius: 12px; }
    .trend-up { background: #dcfce7; color: #166534; }
    .trend-down { background: #fee2e2; color: #991b1b; }

    /* Charts Area */
    .charts-grid {
      display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 32px;
    }
    @media (max-width: 1200px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card {
      background: #fff; padding: 24px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column;
    }
    .chart-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; color: var(--text-primary); }
    .chart-container { flex: 1; position: relative; min-height: 300px; }

    /* Data Table */
    .admin-card {
      background: #fff; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden;
    }
    .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 1.1rem; font-weight: 700; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { background: var(--surface-2); padding: 12px 24px; text-align: left; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .admin-table td { padding: 16px 24px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    .admin-table tr:hover { background: var(--surface-2); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Statistics & Reports</span>
          <h1>통계 및 보고서</h1>
          <p class="header-desc">플랫폼의 전반적인 성과와 지표를 분석합니다.</p>
        </div>
      </header>

      <!-- 필터 및 보고서 내보내기 -->
      <div class="stats-filter-bar" style="display: flex; gap: 12px; align-items: center; margin-bottom: 24px; justify-content: flex-start;">
        <select id="date-range" style="padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
          <option value="today">오늘</option>
          <option value="week">이번 주</option>
          <option value="month" selected>이번 달</option>
          <option value="year">올해</option>
        </select>
        <button class="btn-export" id="btn-export" style="height: 42px;" onclick="downloadReport()">보고서 다운로드 (Excel)</button>
      </div>

      <!-- 요약 KPI -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">총 쿠폰 발행량</div>
          <div class="stat-value" id="kpi-total-issued">0건</div>
          <div class="stat-trend" style="display: none;"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">누적 쿠폰 사용량</div>
          <div class="stat-value" id="kpi-total-used">0건</div>
          <div class="stat-trend" style="display: none;"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">누적 정산 완료액</div>
          <div class="stat-value" id="kpi-total-settled">₩0</div>
          <div class="stat-trend" style="display: none;"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">활성 가맹점 수</div>
          <div class="stat-value" id="kpi-active-merchants">0곳</div>
          <div class="stat-trend" style="display: none;"></div>
        </div>
      </div>

      <!-- 차트 영역 -->
      <div class="charts-grid">
        <!-- 막대 차트: 월별 쿠폰 추이 -->
        <div class="chart-card">
          <div class="chart-title"> 월별 쿠폰 발행 및 사용 추이</div>
          <div class="chart-container">
            <canvas id="barChart"></canvas>
          </div>
        </div>
        <!-- 파이 차트: 지역별 가맹점 매출 비중 -->
        <div class="chart-card">
          <div class="chart-title"> 지역별 쿠폰 소진 비중</div>
          <div class="chart-container" style="display: flex; justify-content: center; align-items: center;">
            <canvas id="pieChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 상위 가맹점 테이블 -->
      <div class="admin-card">
        <div class="card-header">
          <div class="card-title"> 우수 가맹점 Top 5 (사용량 기준)</div>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>가맹점명</th>
              <th>지역</th>
              <th>쿠폰 소진 건수</th>
              <th>정산 발생액</th>
            </tr>
          </thead>
          <tbody id="top-merchants-body">
            <tr>
              <td colspan="5" class="text-center" style="padding: 40px; text-align: center; color: #64748b;">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAdminAuth } from '../shared/js/admin-guard.js';
    import { api, fmtMoney } from '../shared/js/api.js';
    await requireAdminAuth();

    let barChart = null;
    let pieChart = null;

    async function loadStatsReport() {
      try {
        const res = await api.get('/admin/stats/reports');
        if (res.success && res.data) {
          const { kpis, monthlyTrend, regionDistribution, topMerchants } = res.data;

          // 1. KPI 카드 업데이트
          document.getElementById('kpi-total-issued').textContent = `${Number(kpis.totalIssued).toLocaleString()}건`;
          document.getElementById('kpi-total-used').textContent = `${Number(kpis.totalUsed).toLocaleString()}건`;
          document.getElementById('kpi-total-settled').textContent = fmtMoney(kpis.totalSettled);
          document.getElementById('kpi-active-merchants').textContent = `${kpis.activeMerchants}곳`;

          // 2. Bar Chart 업데이트
          const barLabels = [];
          const barIssuedData = [];
          const barUsedData = [];

          if (monthlyTrend && monthlyTrend.length > 0) {
            monthlyTrend.forEach(row => {
              const [year, month] = row.month.split('-');
              barLabels.push(`${parseInt(month)}월`);
              barIssuedData.push(row.issued_count);
              barUsedData.push(row.used_count);
            });
          } else {
            // 데이터가 없는 경우 최근 6개월 0건으로 라벨 생성
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
              const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
              barLabels.push(`${d.getMonth() + 1}월`);
              barIssuedData.push(0);
              barUsedData.push(0);
            }
          }
          renderBarChart(barLabels, barIssuedData, barUsedData);

          // 3. Pie Chart 업데이트
          const pieLabels = regionDistribution.map(r => r.name);
          const pieData = regionDistribution.map(r => r.value);
          const pieColors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1', '#a855f7'];

          if (pieLabels.length === 0) {
            pieLabels.push('소진 내역 없음');
            pieData.push(1);
            pieColors.splice(0, pieColors.length, '#e2e8f0');
          }
          renderPieChart(pieLabels, pieData, pieColors);

          // 4. 우수 가맹점 Top 5 업데이트
          const tbody = document.getElementById('top-merchants-body');
          if (!topMerchants || topMerchants.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 40px; text-align: center; color: #64748b;">실적이 있는 가맹점이 없습니다.</td></tr>`;
          } else {
            tbody.innerHTML = topMerchants.map((m, idx) => {
              const addr = m.address || '';
              const parts = addr.split(' ');
              const region = parts.find(p => p.endsWith('면') || p.endsWith('구') || p.endsWith('동') || p.endsWith('군')) || '기타';
              return `
                <tr>
                  <td>${idx + 1}</td>
                  <td><strong>${m.name}</strong></td>
                  <td>${region}</td>
                  <td>${Number(m.tx_count).toLocaleString()}건</td>
                  <td>${fmtMoney(m.total_amount)}</td>
                </tr>
              `;
            }).join('');
          }
        }
      } catch (err) {
        console.error('보고서 로드 실패', err);
        showToast('보고서 통계 로드 실패', 'error');
      }
    }

    function renderBarChart(labels, issued, used) {
      const ctxBar = document.getElementById('barChart').getContext('2d');
      if (barChart) barChart.destroy();
      barChart = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: '발행량',
              data: issued,
              backgroundColor: '#94a3b8',
              borderRadius: 4
            },
            {
              label: '사용량',
              data: used,
              backgroundColor: '#3b82f6',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'top' }
          },
          scales: {
            y: { beginAtZero: true, grid: { borderDash: [4, 4] } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function renderPieChart(labels, data, colors) {
      const ctxPie = document.getElementById('pieChart').getContext('2d');
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: colors,
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // 엑셀 다운로드 (실제 DB 데이터 기준 다운로드)
    window.downloadReport = function downloadReport() {
      const btn = document.getElementById('btn-export');
      const originalText = btn.innerHTML;
      btn.innerHTML = ' 엑셀 생성 중...';
      btn.style.opacity = '0.7';
      btn.disabled = true;

      // 실제 통계 데이터 기반 CSV 생성
      api.get('/admin/stats/reports').then(res => {
        if (res.success && res.data) {
          const { topMerchants } = res.data;
          let csvContent = "data:text/csv;charset=utf-8,\uFEFF"
            + "순위,가맹점명,소진건수,정산발생액\n";
          
          topMerchants.forEach((m, idx) => {
            csvContent += `${idx + 1},${m.name},${m.tx_count},${m.total_amount}\n`;
          });

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `statistics_report_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      }).catch(err => {
        alert('엑셀 파일 생성 실패: ' + err.message);
      }).finally(() => {
        btn.innerHTML = originalText;
        btn.style.opacity = '1';
        btn.disabled = false;
      });
    };

    // 초기 로드
    loadStatsReport();
  </script>
</body>
</html>
