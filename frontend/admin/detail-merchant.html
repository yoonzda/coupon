<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>가맹점 상세 정보 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  
  <style>
    body { 
      margin: 0; padding: 0; 
      width: 100%; max-width: none; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a;
    }
    .back-link svg {
      transition: transform 0.2s;
      width: 16px;
      height: 16px;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    /* 상세 페이지 레이아웃 */
    .detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }
    @media (max-width: 1024px) {
      .detail-container {
        grid-template-columns: 1fr;
      }
    }

    .merchant-detail-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.03);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg {
      width: 18px;
      height: 18px;
      color: #64748b;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px 10px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .info-label {
      font-weight: 700;
      color: #64748b;
    }
    .info-val {
      color: #1e293b;
    }
    .info-val-strong {
      font-weight: 800;
      color: #0f172a;
    }

    /* 이미지 갤러리 */
    .images-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    .gallery-img-box {
      width: 110px; height: 110px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: #f8fafc;
      transition: transform 0.2s, border-color 0.2s;
    }
    .gallery-img-box:hover {
      transform: scale(1.03);
      border-color: #94a3b8;
    }
    .gallery-img-box img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* 첨부 서류 이미지 */
    .document-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }
    @media (max-width: 640px) {
      .document-grid {
        grid-template-columns: 1fr;
      }
    }
    .document-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      background: #f8fafc;
    }
    .document-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 8px;
    }
    .doc-img-view {
      width: 100%;
      max-height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      object-fit: contain;
      background: #fff;
      display: block;
      transition: transform 0.2s;
    }
    .doc-img-view:hover {
      transform: scale(1.01);
    }

    /* 관리자 하단 버튼 영역 */
    .management-bar {
      margin-top: 32px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .status-badge-lg {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .status-approved { background: #dcfce7; color: #166534; }
    .status-pending { background: #fef9c3; color: #854d0e; }
    .status-rejected { background: #fee2e2; color: #991b1b; }

    /* 인쇄 전용 스타일 */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .admin-sidebar, 
      .dashboard-header, 
      .back-link-container, 
      .subpage-title-area, 
      .print-hide, 
      .management-bar,
      #toast-container {
        display: none !important;
      }
      .admin-content {
        margin-left: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .detail-container {
        grid-template-columns: 1fr !important;
        gap: 20px !important;
      }
      .merchant-detail-card {
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
      }
      .doc-img-view {
        max-height: 550px !important;
        width: auto !important;
        margin: 0 auto !important;
        display: block !important;
      }
      .print-page {
        page-break-after: always !important;
        break-after: page !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Merchant Management</span>
          <h1>가맹점 상세 정보</h1>
          <p class="header-desc">신청 가맹점의 모든 내역을 확인하고 승인/반려 처리를 관리합니다.</p>
        </div>
      </header>

      <div class="subpage-title-area" style="display: flex !important; flex-direction: row !important; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px;">
        <div class="back-link-container">
          <a href="merchants.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            목록으로
          </a>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;" class="print-hide" id="top-action-buttons">
          <button class="btn btn-neutral btn-sm" onclick="window.printMerchant()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:16px;height:16px;vertical-align:middle;margin-right:4px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.821V21h10.56v-7.179m-10.56 0a2.25 2.25 0 01-1.636-2.17V9.582a2.25 2.25 0 011.636-2.17m10.56 0a2.25 2.25 0 011.636 2.17v2.07a2.25 2.25 0 01-1.636 2.17m-10.56 0h10.56M9 3h6v4.5H9V3z" />
            </svg>
            PDF / 파일 저장
          </button>
        </div>
      </div>

      <div class="detail-container print-page">
        <!-- 1. 기본 정보 카드 -->
        <div class="merchant-detail-card">
          <h3 class="card-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h2.25m-2.25 0a2.25 2.25 0 002.25-2.25V11.08c0-.472-.121-.933-.353-1.34l-2.45-4.3A2.25 2.25 0 0015.48 4.25H8.52a2.25 2.25 0 00-1.97 1.13L4.1 9.68a2.25 2.25 0 00-.35 1.399v7.17A2.25 2.25 0 006 20.63m12 0v-2.25" />
            </svg>
            가맹점 기본 정보
          </h3>
          <div class="info-grid">
            <div class="info-label">상호명</div>
            <div class="info-val info-val-strong" id="info-name">-</div>

            <div class="info-label">대표자 성명</div>
            <div class="info-val" id="info-owner-name">-</div>

            <div class="info-label">연락처</div>
            <div class="info-val" id="info-phone">-</div>

            <div class="info-label">가게 전화번호</div>
            <div class="info-val" id="info-store-phone">-</div>

            <div class="info-label">카테고리</div>
            <div class="info-val" id="info-category">-</div>

            <div class="info-label">영업시간</div>
            <div class="info-val" id="info-business-hours">-</div>

            <div class="info-label">소재지 주소</div>
            <div class="info-val" id="info-address">-</div>
          </div>
        </div>

        <!-- 2. 서류 및 정산 정보 카드 -->
        <div class="merchant-detail-card">
          <h3 class="card-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
            </svg>
            서류 및 정산 정보
          </h3>
          <div class="info-grid">
            <div class="info-label">사업자번호</div>
            <div class="info-val info-val-strong" id="info-business-no">-</div>

            <div class="info-label">은행명</div>
            <div class="info-val" id="info-bank-name">-</div>

            <div class="info-label">정산 계좌번호</div>
            <div class="info-val info-val-strong" id="info-account-no">-</div>

            <div class="info-label">가입 희망 ID</div>
            <div class="info-val" id="info-username">-</div>

            <div class="info-label">신청 일시</div>
            <div class="info-val" id="info-applied-at">-</div>

            <div class="info-label">심사 상태</div>
            <div class="info-val" id="info-status">-</div>
          </div>
        </div>

      <!-- 3. 증빙 서류 카드: 사업자등록증 사본 (Page 2) -->
      <div class="merchant-detail-card print-page" style="margin-top: 24px;">
        <h3 class="card-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          입점 증빙 첨부서류 - 사업자등록증 사본
        </h3>
        <div class="document-box" style="background: #fff; border: none; padding: 0;">
          <div id="cert-img-container">등록된 파일이 없습니다.</div>
        </div>
      </div>

      <!-- 4. 증빙 서류 카드: 정산 통장 사본 (Page 3) -->
      <div class="merchant-detail-card" style="margin-top: 24px;">
        <h3 class="card-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          입점 증빙 첨부서류 - 정산 통장 사본
        </h3>
        <div class="document-box" style="background: #fff; border: none; padding: 0;">
          <div id="bankbook-img-container">등록된 파일이 없습니다.</div>
        </div>
      </div>

      <!-- 5. 가게 이미지 갤러리 카드 (홈페이지 전용, 인쇄 차단) -->
      <div class="merchant-detail-card print-hide" style="margin-top: 24px;">
        <h3 class="card-title">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375 0 11-.75 0 .375 0 01.75 0z" />
          </svg>
          등록 가게 이미지
        </h3>
        <div class="images-gallery" id="store-images-gallery">
          <!-- JS 렌더링 -->
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtDate } from '../shared/js/api.js';
    import { requireAdminAuth, getAdminToken } from '../shared/js/admin-guard.js';

    await requireAdminAuth();
    const token = getAdminToken();

    // URL 파라미터에서 id 추출
    const urlParams = new URLSearchParams(window.location.search);
    const merchantId = parseInt(urlParams.get('id'));

    if (!merchantId) {
      showToast('잘못된 접근입니다.', 'error');
      setTimeout(() => {
        window.location.href = 'merchants.html';
      }, 1500);
    } else {
      loadMerchantDetails();
    }

    window.openImageLarge = (src) => {
      const w = window.open();
      w.document.write(`<img src="${src}" style="max-width:100%; border:none; display:block; margin: 20px auto;" />`);
    };

    window.printMerchant = () => {
      window.print();
    };

    window.downloadImage = (src, filename) => {
      const a = document.createElement('a');
      a.href = src;
      let ext = 'png';
      if (src.startsWith('data:image/')) {
        const match = src.match(/data:image\/([a-zA-Z0-9+]+);/);
        if (match) {
          ext = match[1];
          if (ext === 'svg+xml') ext = 'svg';
          if (ext === 'jpeg') ext = 'jpg';
        }
      } else {
        const urlParts = src.split(/[#?]/)[0].split('.');
        if (urlParts.length > 1) {
          ext = urlParts.pop().toLowerCase();
        }
      }
      a.download = `${filename}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    async function loadMerchantDetails() {
      try {
        const res = await api.get(`/admin/merchants/${merchantId}`);
        if (res.success && res.data) {
          const m = res.data;
          
          // 기본정보 대입
          document.getElementById('info-name').innerText = m.name || '-';
          document.getElementById('info-owner-name').innerText = m.owner_name || '-';
          document.getElementById('info-phone').innerText = m.phone || '-';
          document.getElementById('info-store-phone').innerText = m.store_phone || '-';
          document.getElementById('info-category').innerText = m.category || '-';
          document.getElementById('info-business-hours').innerText = m.business_hours || '-';
          
          // 지도 검색 링크 생성
          if (m.address) {
            document.getElementById('info-address').innerHTML = `
              ${m.address}
              <a href="https://map.naver.com/v5/search/${encodeURIComponent(m.address)}" target="_blank" class="print-hide" style="margin-left: 8px; font-size: 0.8rem; color: #10b981; text-decoration: underline; font-weight: 600;">
                [네이버 지도 검색]
              </a>
            `;
          } else {
            document.getElementById('info-address').innerText = '-';
          }

          // 서류정보 대입
          document.getElementById('info-business-no').innerText = m.business_no || '-';
          document.getElementById('info-bank-name').innerText = m.bank_name || '-';
          document.getElementById('info-account-no').innerText = m.account_no || '-';
          document.getElementById('info-username').innerText = m.username || '-';
          document.getElementById('info-applied-at').innerText = m.applied_at ? fmtDate(m.applied_at) : '-';

          // 상태 배지 처리
          const statusLabels = {
            'pending': '승인 대기',
            'approved': '승인 완료',
            'rejected': '반려됨',
            'suspended': '정지됨'
          };
          const statusLabel = statusLabels[m.status] || m.status;
          document.getElementById('info-status').innerHTML = `
            <span class="status-badge-lg status-${m.status || 'pending'}">${statusLabel}</span>
            ${m.status === 'rejected' && m.rejection_reason ? `
              <div style="margin-top: 8px; padding: 10px; background: #fee2e2; border-radius: 6px; color: #991b1b; font-size: 0.8rem;">
                <strong>반려 사유:</strong> ${m.rejection_reason}
              </div>
            ` : ''}
          `;

          // 첨부서류 이미지 바인딩
          if (m.business_cert_image) {
            document.getElementById('cert-img-container').innerHTML = `
              <img class="doc-img-view" src="${m.business_cert_image}" onclick="window.openImageLarge('${m.business_cert_image}')" alt="사업자등록증" />
            `;
          }
          if (m.bankbook_image) {
            document.getElementById('bankbook-img-container').innerHTML = `
              <img class="doc-img-view" src="${m.bankbook_image}" onclick="window.openImageLarge('${m.bankbook_image}')" alt="통장사본" />
            `;
          }

          // 가게 이미지 갤러리 바인딩
          const imagesList = m.images ? JSON.parse(m.images) : [];
          const gallery = document.getElementById('store-images-gallery');
          if (imagesList.length > 0) {
            gallery.innerHTML = imagesList.map((img, idx) => `
              <div class="gallery-img-box-wrapper" style="display: flex; flex-direction: column; gap: 6px; align-items: center;">
                <div class="gallery-img-box" onclick="window.openImageLarge('${img}')">
                  <img src="${img}" alt="가게 이미지" />
                </div>
                <button class="btn btn-xs btn-neutral-outline print-hide" onclick="event.stopPropagation(); window.downloadImage('${img}', 'store-image-${idx+1}')" style="width: 100%; padding: 4px 8px !important; font-size: 0.75rem;">
                  다운로드
                </button>
              </div>
            `).join('');
          } else {
            gallery.innerHTML = '<span style="color:#94a3b8;font-size:0.85rem;padding: 10px 0;">등록된 가게 이미지가 없습니다.</span>';
          }

          // 상단 조작 버튼 렌더링 (승인/반려)
          const topActions = document.getElementById('top-action-buttons');
          if (m.status === 'pending') {
            topActions.insertAdjacentHTML('beforeend', `
              <button class="btn btn-primary btn-sm" onclick="window.updateMerchantStatus('approved')">입점 승인</button>
              <button class="btn btn-neutral-outline btn-sm" onclick="window.updateMerchantStatus('rejected')">입점 반려</button>
            `);
          }

        } else {
          showToast('가맹점 정보를 조회할 수 없습니다.', 'error');
        }
      } catch (err) {
        console.error(err);
        showToast('서버 통신 오류', 'error');
      }
    }

    window.updateMerchantStatus = async (status) => {
      const label = status === 'approved' ? '승인' : '반려';
      let reason = '';

      if (status === 'rejected') {
        reason = prompt('반려 사유를 입력해주세요:', '서류 미비 (사업자등록증 확인 불가)');
        if (!reason) return;
      } else {
        if (!confirm(`가맹점을 ${label} 처리하시겠습니까?`)) return;
      }

      try {
        await api.patch(`/admin/merchants/${merchantId}/status`, { status, reason });
        showToast(`${label} 처리가 완료되었습니다.`, 'success');
        setTimeout(() => {
          window.location.reload();
        }, 1200);
      } catch (err) {
        showToast(`처리 실패: ${err.message}`, 'error');
      }
    };
  </script>
</body>
</html>
