<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예산 설정 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a !important;
    }
    .back-link svg {
      transition: transform 0.2s;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    .btn-register-submit {
      height: 42px;
      padding: 0 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
      border: none;
      transition: background-color 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-register-submit:hover {
      background: #1e293b;
      opacity: 0.95;
      box-shadow: 0 0 10px rgba(15, 23, 42, 0.15);
    }
    .btn-register-submit:active {
      background: #0f172a;
    }

    /* 스핀박스 화살표 제거 */
    .no-spin::-webkit-outer-spin-button,
    .no-spin::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .no-spin[type=number] {
      -moz-appearance: textfield;
    }

    /* input-unit 스타일 */
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .form-container .form-group .input-group input {
      width: 100%;
      padding-right: 36px !important;
      text-align: right;
    }
    .input-group .input-unit {
      position: absolute;
      right: 16px;
      font-size: 0.9rem;
      color: #334155;
      font-weight: 600;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Coupon Management</span>
          <h1>쿠폰 관리</h1>
          <p class="header-desc">쿠폰 배정에 사용될 플랫폼 전체 예산을 확인하고 변경 등록합니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="coupons.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            뒤로가기
          </a>
        </div>
        <h2 class="page-subtitle">전체 예산 설정</h2>
      </div>

      <div class="form-container">
        <form id="form-set-budget" onsubmit="saveBudget(event)">
          <div class="form-group" style="margin-bottom: 24px;">
            <label for="input-total-budget" style="display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem;">전체 예산 금액</label>
            <div class="input-group">
              <input type="text" id="input-total-budget" placeholder="예: 10,000,000" required />
              <span class="input-unit">원</span>
            </div>
            <div id="error-message-area" style="color: #ef4444; font-size: 0.82rem; margin-top: 6px; display: none; font-weight: 500; line-height: 1.4; word-break: keep-all;"></div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-register-submit">저장하기</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtMoney } from '../shared/js/api.js'
    import { requireAdminAuth } from '../shared/js/admin-guard.js'

    await requireAdminAuth();

    let allocatedBudget = 0;
    const errorEl = document.getElementById('error-message-area');
    const inputEl = document.getElementById('input-total-budget');

    async function loadCurrentBudget() {
      try {
        const res = await api.get('/admin/budget');
        if (res.success && res.data) {
          const total = res.data.totalBudget;
          allocatedBudget = res.data.allocatedBudget;
          inputEl.value = Number(total).toLocaleString('ko-KR');
        }
      } catch (err) {
        console.error('현재 예산 로드 실패', err);
      }
    }

    inputEl.addEventListener('input', (e) => {
      const selectionStart = e.target.selectionStart;
      const originalLen = e.target.value.length;
      
      const clean = e.target.value.replace(/[^0-9]/g, '');
      if (clean === '') {
        e.target.value = '';
        errorEl.style.display = 'none';
        errorEl.textContent = '';
      } else {
        const val = Number(clean);
        e.target.value = val.toLocaleString('ko-KR');
        
        const newLen = e.target.value.length;
        let pos = selectionStart + (newLen - originalLen);
        pos = Math.max(0, Math.min(pos, newLen));
        e.target.setSelectionRange(pos, pos);

        if (val < allocatedBudget) {
          errorEl.textContent = `설정하려는 예산 금액이 이미 배정된 쿠폰 예산 총액(${fmtMoney(allocatedBudget)})보다 작을 수 없습니다.`;
          errorEl.style.display = 'block';
        } else {
          errorEl.style.display = 'none';
          errorEl.textContent = '';
        }
      }
    });

    window.saveBudget = async function(e) {
      e.preventDefault();
      const rawVal = inputEl.value.replace(/[^0-9]/g, '');
      const totalBudget = Number(rawVal);

      if (isNaN(totalBudget) || totalBudget < 0 || rawVal === '') {
        errorEl.textContent = '올바른 예산 금액을 입력해주세요.';
        errorEl.style.display = 'block';
        return;
      }

      if (totalBudget < allocatedBudget) {
        errorEl.textContent = `설정하려는 예산 금액이 이미 배정된 쿠폰 예산 총액(${fmtMoney(allocatedBudget)})보다 작을 수 없습니다.`;
        errorEl.style.display = 'block';
        return;
      }

      try {
        const res = await api.post('/admin/budget', { totalBudget });
        showToast(res.message || '전체 예산이 성공적으로 저장되었습니다.', 'success');
        
        setTimeout(() => {
          location.href = 'coupons.html';
        }, 1000);
      } catch (err) {
        errorEl.textContent = err.message || '예산 저장에 실패했습니다.';
        errorEl.style.display = 'block';
      }
    }

    loadCurrentBudget();
  </script>
</body>
</html>
