<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDS 모니터링 | 옹진 관광 쿠폰</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      
      background: #f1f5f9;
      font-family: var(--font-main); color: #1e293b; 
    }
    
    .app-shell { 
      display: flex !important; flex-direction: column; 
      min-height: 100vh; width: 100% !important; max-width: none !important;
    }
    
    @media (min-width: 1024px) {
      .app-shell { display: block !important; }
      .admin-sidebar { 
        width: 240px !important; 
        min-width: 240px;
        height: 100vh;
        background: #0f172a;
        color: #fff;
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .admin-content { margin-left: 240px;  
        flex: 1 !important; 
        padding: 40px; 
        background: #f1f5f9; 
        min-width: 0;
      }
      .bottom-nav { display: none; }
    }
    .admin-sidebar .logo {
      padding: 24px; font-size: 1.1rem; font-weight: 900; 
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 10px; color: #fff;
      white-space: nowrap;
    }
    .admin-nav { padding: 16px 0; flex: 1; }
    .admin-nav a {
      display: flex; align-items: center; gap: 12px; padding: 12px 24px;
      color: #94a3b8; text-decoration: none; font-weight: 500; transition: all 0.2s;
      white-space: nowrap; font-size: 0.95rem;
    }
    .admin-nav a:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .admin-nav a.active { color: #fff; background: var(--primary); font-weight: 700; }

    .admin-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { background: var(--surface-2); padding: 12px 24px; text-align: left; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .admin-table td { padding: 16px 24px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
    
    .rule-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-bottom: 4px; }
    .rule-DUPLICATE { background: #fee2e2; color: #ef4444; }
    .rule-HIGH_FREQ { background: #ffedd5; color: #f97316; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="admin-sidebar">
      <div class="logo">옹진 관광 <span>ADMIN</span></div>
      <nav class="admin-nav">
        <a href="/admin/index.html">대시보드</a>
        <a href="/admin/merchants.html">가맹점 관리</a>
        <a href="/admin/settlement.html">정산 관리</a>
        <a href="/admin/fds.html" class="active">FDS 모니터링</a>
        <a href="/admin/coupons.html">쿠폰 및 발행처 관리</a>
        <a href="/admin/statistics.html">통계 및 보고서</a>
      </nav>
    </aside>

    <main class="admin-content">
      <header style="margin-bottom: 32px;">
        <h1 style="font-size: 1.5rem; font-weight: 900;">FDS 모니터링</h1>
        <p style="color: var(--text-secondary);">시스템이 탐지한 이상 거래 의심 내역을 검토합니다.</p>
      </header>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>탐지 정보</th>
              <th>가맹점/사용자</th>
              <th>설명</th>
              <th>상태</th>
              <th>조치</th>
            </tr>
          </thead>
          <tbody id="fds-list">
            <tr><td colspan="5" class="text-center" style="padding: 40px;">데이터 로드 중...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, showToast, fmtDate } from '../shared/js/api.js'
    import { requireAdminAuth } from '../shared/js/admin-guard.js'

    // 관리자 인증 체크 (실패 시 login.html로 자동 리다이렉트)
    await requireAdminAuth();

    async function loadFDS() {
      const list = document.getElementById('fds-list');
      try {
        const { data } = await api.get('/admin/fds');
        if (!data || data.length === 0) {
          list.innerHTML = `
            <tr><td colspan="5" style="padding: 60px; text-align: center; color: #64748b;">
              <div style="font-size: 2rem; margin-bottom: 8px;"></div>
              탐지된 이상 거래가 없습니다.
            </td></tr>`;
          return;
        }
        list.innerHTML = data.map(item => `
          <tr>
            <td>
              <span class="rule-tag rule-${item.rule_id}">${item.rule_id}</span><br>
              <small>${fmtDate(item.detected_at)}</small>
            </td>
            <td>
              <strong>${item.merchant_name || '-'}</strong><br>
              <small>${item.user_nickname || '익명 사용자'}</small>
            </td>
            <td>${item.description || '-'}</td>
            <td>
              <span class="badge ${item.resolved ? 'badge-success' : 'badge-danger'}">
                ${item.resolved ? '해결됨' : '미결'}
              </span>
            </td>
            <td>
              ${!item.resolved ? `<button class="btn btn-outline btn-xs" onclick="resolveFDS(${item.id})">확인 완료</button>` : '-'}
            </td>
          </tr>
        `).join('');
      } catch (e) {
        console.error('[FDS] 로드 실패:', e);
        // 인증 오류(401)인 경우 로그인 안내, 그 외엔 오류 표시
        const isAuth = e.message?.includes('인증') || e.message?.includes('토큰');
        list.innerHTML = `
          <tr><td colspan="5" style="padding: 60px; text-align: center; color: #ef4444;">
            <div style="font-size: 2rem; margin-bottom: 8px;">${isAuth ? '' : '️'}</div>
            <strong>${isAuth ? '로그인이 필요합니다' : 'FDS 데이터 로드 실패'}</strong><br>
            <small style="color: #94a3b8; margin-top: 8px; display: block;">${e.message}</small>
            ${isAuth ? `<a href="/tourist/index.html" style="margin-top:16px; display:inline-block; padding: 8px 20px; background:#3b82f6; color:#fff; border-radius:8px; text-decoration:none;">로그인 페이지로</a>` : ''}
          </td></tr>`;
      }
    }

    window.resolveFDS = async (id) => {
      try {
        await api.patch(`/admin/fds/${id}/resolve`);
        showToast('해결 상태로 변경되었습니다.', 'success');
        loadFDS();
      } catch (e) {
        showToast(e.message, 'error');
      }
    };

    loadFDS();
  </script>
</body>
</html>
