<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발행처 수정 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a !important;
    }
    .back-link svg {
      transition: transform 0.2s;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    /* 수정 버튼 호버 효과 (떠오르지 않고 색상 변화) */
    .btn-register-submit {
      height: 42px;
      padding: 0 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
      border: none;
      transition: background-color 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-register-submit:hover {
      background: #1e293b;
      opacity: 0.95;
      box-shadow: 0 0 10px rgba(15, 23, 42, 0.15);
    }
    .btn-register-submit:active {
      background: #0f172a;
    }
    /* input-group & input-unit 스타일 */
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-group input {
      width: 100%;
      padding-right: 36px !important;
      text-align: right;
    }
    .input-group .input-unit {
      position: absolute;
      right: 14px;
      font-size: 0.88rem;
      color: #64748b;
      font-weight: 600;
      pointer-events: none;
    }
    @media (max-width: 540px) {
      .product-grid-row {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Issuer Management</span>
          <h1>발행처 관리</h1>
          <p class="header-desc">발행처 계정을 생성하고 발행처를 등록하고 관리합니다. 각 발행처의 쿠폰 현황을 확인할 수 있습니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="issuers.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            뒤로가기
          </a>
        </div>
        <h2 class="page-subtitle">발행처 수정</h2>
      </div>

      <div class="form-container">
        
        <form id="form-edit-issuer" onsubmit="updateIssuer(event)">
          <div class="form-group">
            <label for="issuer-name">기관명</label>
            <input type="text" id="issuer-name" required />
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;">
              <label for="issuer-username" style="margin-bottom: 0 !important;">아이디</label>
              <span style="font-size: 0.78rem; color: #94a3b8; font-weight: 500;">아이디는 수정할 수 없습니다</span>
            </div>
            <input type="text" id="issuer-username" readonly style="background: #e2e8f0 !important; cursor: not-allowed;" />
          </div>
          <div class="form-group">
            <label for="issuer-phone">전화번호</label>
            <input type="text" id="issuer-phone" placeholder="예: 032-899-3810" />
          </div>
          <div class="form-group">
            <label for="issuer-address">위치</label>
            <input type="text" id="issuer-address" placeholder="예: 인천광역시 옹진군 자월면 소야리" />
          </div>
          <div class="form-group">
            <label for="issuer-password">새 비밀번호</label>
            <input type="password" id="issuer-password" placeholder="변경 시에만 입력" />
          </div>

          <!-- 상품 입력 영역 (상품명, 금액 2열 배치) -->
          <div id="product-list-container">
            <!-- dynamic products -->
          </div>

          <div style="margin-top: 4px; margin-bottom: 24px;">
            <button type="button" class="btn btn-neutral-outline btn-sm" onclick="window.addProductRow()" style="height: 36px; padding: 0 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" style="width: 14px; height: 14px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              상품 추가
            </button>
          </div>

          <div class="form-actions" style="margin-top: 16px;">
            <button type="submit" class="btn-register-submit">수정하기</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast } from '../shared/js/api.js'
    import { requireAdminAuth } from '../shared/js/admin-guard.js'

    await requireAdminAuth();

    // 쿼리 파라미터 파싱
    const urlParams = new URLSearchParams(window.location.search);
    const issuerId = urlParams.get('id');

    if (!issuerId) {
      showToast('잘못된 접근입니다.', 'error');
      setTimeout(() => { location.href = 'issuers.html'; }, 1000);
    }

    const productContainer = document.getElementById('product-list-container');

    window.addProductRow = function(name = '', price = '') {
      const currentCount = productContainer.querySelectorAll('.product-item').length;
      const rowId = 'prod-item-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
      const itemEl = document.createElement('div');
      itemEl.className = 'product-item';
      itemEl.id = rowId;
      itemEl.style.marginBottom = '20px';

      const formattedPrice = (price !== '' && price !== null && price !== undefined)
        ? Number(price).toLocaleString('ko-KR')
        : '';

      if (currentCount > 0) {
        itemEl.style.marginTop = '20px';
        itemEl.style.paddingTop = '18px';
        itemEl.style.borderTop = '1px dashed #cbd5e1';
      }

      itemEl.innerHTML = `
        <div class="product-grid-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group" style="margin-bottom: 0;">
            <div style="display: flex; align-items: center; margin-bottom: 3px; min-height: 20px;">
              <label style="margin-bottom: 0;">상품명</label>
            </div>
            <input type="text" class="prod-name-input" placeholder="예: 입장권" required value="${escapeHtml(name)}" />
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; min-height: 20px;">
              <label style="margin-bottom: 0;">금액</label>
              ${currentCount > 0 ? `<button type="button" onclick="window.removeProductRow('${rowId}')" style="background: none; border: none; color: #be123c; font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 0 2px;">삭제</button>` : ''}
            </div>
            <div class="input-group">
              <input type="text" class="prod-price-input" placeholder="0" required autocomplete="off" value="${formattedPrice}" />
              <span class="input-unit">원</span>
            </div>
          </div>
        </div>
      `;

      productContainer.appendChild(itemEl);

      const priceInput = itemEl.querySelector('.prod-price-input');
      priceInput.addEventListener('input', (e) => {
        const clean = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = clean ? Number(clean).toLocaleString('ko-KR') : '';
      });
    };

    window.removeProductRow = function(rowId) {
      const items = productContainer.querySelectorAll('.product-item');
      if (items.length <= 1) {
        showToast('최소 1개 이상의 상품이 필요합니다.', 'error');
        return;
      }
      const target = document.getElementById(rowId);
      if (target) target.remove();
      renumberProducts();
    };

    function renumberProducts() {
      const items = productContainer.querySelectorAll('.product-item');
      items.forEach((item, index) => {
        if (index === 0) {
          item.style.marginTop = '0';
          item.style.paddingTop = '0';
          item.style.borderTop = 'none';
          const delBtn = item.querySelector('button[onclick*="removeProductRow"]');
          if (delBtn) delBtn.remove();
        }
      });
    }

    function escapeHtml(string) {
      if (!string) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(string).replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    async function loadIssuerData() {
      try {
        const res = await api.get(`/admin/issuers/${issuerId}`);
        if (res.success && res.data) {
          document.getElementById('issuer-name').value = res.data.name || '';
          document.getElementById('issuer-username').value = res.data.username || '';
          document.getElementById('issuer-phone').value = res.data.phone || '';
          document.getElementById('issuer-address').value = res.data.address || '';
          
          productContainer.innerHTML = '';
          const prods = res.data.products || [];
          if (prods.length > 0) {
            prods.forEach(p => {
              window.addProductRow(p.product_name, p.price);
            });
          } else if (res.data.product_name) {
            window.addProductRow(res.data.product_name, res.data.product_price);
          } else {
            window.addProductRow();
          }
        } else {
          showToast('발행처 정보를 찾을 수 없습니다.', 'error');
        }
      } catch (err) {
        showToast('발행처 정보 로드 실패: ' + err.message, 'error');
      }
    }

    window.updateIssuer = async function(e) {
      e.preventDefault();
      const name = document.getElementById('issuer-name').value.trim();
      const phone = document.getElementById('issuer-phone').value.trim();
      const address = document.getElementById('issuer-address').value.trim();
      const password = document.getElementById('issuer-password').value;

      if (!name) {
        showToast('기관명을 입력해주세요.', 'error');
        return;
      }

      // 상품 목록 수집
      const productItems = productContainer.querySelectorAll('.product-item');
      const products = [];
      for (const item of productItems) {
        const pName = item.querySelector('.prod-name-input').value.trim();
        const pPriceRaw = item.querySelector('.prod-price-input').value.replace(/[^0-9]/g, '');
        if (!pName || !pPriceRaw) {
          showToast('모든 상품명과 금액을 입력해주세요.', 'error');
          return;
        }
        const pPrice = Number(pPriceRaw);
        if (isNaN(pPrice) || pPrice < 0) {
          showToast('올바른 상품 금액을 입력해주세요.', 'error');
          return;
        }
        products.push({ productName: pName, price: pPrice });
      }

      if (products.length === 0) {
        showToast('최소 1개 이상의 상품을 등록해주세요.', 'error');
        return;
      }

      try {
        const payload = {
          name,
          phone,
          address,
          products
        };
        if (password) {
          payload.password = password;
        }
        const res = await api.put(`/admin/issuers/${issuerId}`, payload);
        showToast(res.message || '발행처 정보가 수정되었습니다.', 'success');
        
        setTimeout(() => {
          location.href = 'issuers.html';
        }, 1000);
      } catch (err) {
        showToast(err.message || '수정에 실패했습니다.', 'error');
      }
    };

    loadIssuerData();
  </script>
</body>
</html>
