<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예산 관리 | 옹진 관광 관리자</title>
  <link rel="icon" href="../shared/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: var(--bg);
      color: var(--text-primary); 
    }

    /* 통합 예산 디자인 (한 줄 구성 및 박스 제거) */
    .dashboard-budget-card {
      background: transparent;
      border: none;
      padding: 16px 0;
      box-shadow: none;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
    }

    /* 모달 레이아웃 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-container {
      background: var(--surface); border-radius: var(--radius); width: 440px; max-width: 90%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateY(20px); transition: transform 0.25s ease; overflow: hidden;
    }
    .modal-overlay.active .modal-container { transform: translateY(0); }
    
    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
    .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; line-height: 1; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }

    /* 등록 & 수정 폼 스타일 (쿠폰 배정 페이지 스타일 준수) */
    .form-group {
      width: 100%;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 10px 36px 10px 14px !important;
      text-align: right; /* 금액 인풋 우측 정렬 */
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem; /* 표준 글씨 크기 */
      font-weight: 600;
      height: 42px; /* 표준 높이 */
      outline: none;
      transition: all var(--dur) var(--ease);
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .input-group input:focus {
      border-color: var(--info);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .input-group .input-unit {
      position: absolute;
      right: 16px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Coupon Management</span>
          <h1>예산 관리</h1>
          <p class="header-desc">플랫폼 확보 예산의 전체 설정 금액을 확인하고 등록 및 수정합니다.</p>
        </div>
      </header>

      <!-- 테이블 조작 버튼 영역 -->
      <div class="table-actions-bar" id="budget-actions-bar" style="display: flex; gap: 12px; align-items: center; margin-bottom: 24px; justify-content: flex-start;">
        <button class="btn btn-neutral btn-sm" id="btn-action-trigger" onclick="enterEditMode()" style="height: 38px; display: inline-flex; align-items: center;">예산 금액 수정</button>
      </div>

      <div class="budget-container" style="max-width: 600px; margin: 0;">
        <!-- 단일 통합 관리 카드 -->
        <div class="dashboard-budget-card" id="budget-card">
          <!-- [조회 모드] -->
          <div id="view-mode" style="width: 100%; display: block;">
            <div style="display: flex; flex-direction: column; gap: 14px;">
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>전체 예산 :</span>
                <span id="display-total-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>배정 금액 :</span>
                <span id="display-allocated-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>발행 금액 :</span>
                <span id="display-issued-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>정산 금액 :</span>
                <span id="display-used-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 예산 등록/수정 모달 팝업 -->
  <div class="modal-overlay" id="budget-modal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">예산 금액 수정</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form onsubmit="saveBudget(event)">
        <div class="modal-body">
          <div class="form-group" style="position: relative;">
            <div class="input-group">
              <input type="text" id="input-total-budget" placeholder="0" required />
              <span class="input-unit">원</span>
            </div>
            <div id="error-message-area" style="color: var(--danger); font-size: 0.82rem; margin-top: 6px; text-align: left; display: none; font-weight: 500; line-height: 1.4; word-break: keep-all;"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="btn-submit-action" class="btn btn-primary" style="height: 40px; font-weight: 600; font-size: 0.9rem; border-radius: 6px;">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtMoney, fmtDate } from '../shared/js/api.js';
    import { requireAdminAuth } from '../shared/js/admin-guard.js';

    await requireAdminAuth();

    let totalBudget = 0;
    let allocatedBudget = 0;
    let hasLoadedBudget = false;

    const errorEl = document.getElementById('error-message-area');
    const inputEl = document.getElementById('input-total-budget');
    const submitBtn = document.getElementById('btn-submit-action');
    const displayEl = document.getElementById('display-total-budget');
    const displayAllocatedEl = document.getElementById('display-allocated-budget');
    const displayIssuedEl = document.getElementById('display-issued-budget');
    const displayUsedEl = document.getElementById('display-used-budget');
    const actionBtn = document.getElementById('btn-action-trigger');

    // 금액을 만/억 단위 한글 포맷으로 변환하는 유틸리티
    function getKoreanNumberText(num) {
      if (num === 0) return '0 원';
      if (!num || isNaN(num) || num < 0) return '';
      const units = ['', '만', '억', '조'];
      let result = [];
      let temp = num;
      let i = 0;
      
      while (temp > 0) {
        let chunk = temp % 10000;
        if (chunk > 0) {
          let chunkText = chunk.toLocaleString('ko-KR');
          result.unshift(chunkText + units[i]);
        }
        temp = Math.floor(temp / 10000);
        i++;
      }
      return result.join(' ') + ' 원';
    }

    async function loadBudgetStatus() {
      try {
        const res = await api.get('/admin/budget');
        if (res.success && res.data) {
          const data = res.data;
          totalBudget = data.totalBudget || 0;
          allocatedBudget = data.allocatedBudget || 0;
          hasLoadedBudget = totalBudget > 0;

          if (!hasLoadedBudget) {
            displayEl.innerText = '등록된 예산이 없습니다.';
            displayEl.style.color = 'var(--text-muted)';
            displayAllocatedEl.innerText = '—';
            displayIssuedEl.innerText = '—';
            displayUsedEl.innerText = '—';
            actionBtn.innerText = '예산 금액 등록';
            inputEl.value = '';
          } else {
            // 메인 화면에는 숫자를 제외하고 한글 포맷 결과만 직접 노출
            displayEl.innerText = getKoreanNumberText(totalBudget);
            displayEl.style.color = 'var(--text-primary)';
            displayAllocatedEl.innerText = getKoreanNumberText(allocatedBudget);
            displayIssuedEl.innerText = getKoreanNumberText(data.issuedBudget || 0);
            displayUsedEl.innerText = getKoreanNumberText(data.usedBudget || 0);
            actionBtn.innerText = '예산 금액 수정';
            inputEl.value = Number(totalBudget).toLocaleString('ko-KR');
          }
        }
      } catch (err) {
        console.error('예산 데이터 로드 실패', err);
        showToast('예산 정보를 불러오지 못했습니다.', 'error');
      }
    }

    window.enterEditMode = function() {
      document.getElementById('modal-title').innerText = hasLoadedBudget ? '예산 금액 수정' : '예산 금액 등록';
      submitBtn.innerText = '저장';
      
      const modal = document.getElementById('budget-modal');
      modal.classList.add('active');
      
      inputEl.focus();
      if (inputEl.value) {
        inputEl.setSelectionRange(0, inputEl.value.length);
      }
    }

    window.closeModal = function() {
      const modal = document.getElementById('budget-modal');
      modal.classList.remove('active');
      errorEl.style.display = 'none';
      
      if (hasLoadedBudget) {
        inputEl.value = Number(totalBudget).toLocaleString('ko-KR');
      } else {
        inputEl.value = '';
      }
    }

    inputEl.addEventListener('input', (e) => {
      const selectionStart = e.target.selectionStart;
      const originalLen = e.target.value.length;
      
      const clean = e.target.value.replace(/[^0-9]/g, '');
      if (clean === '') {
        e.target.value = '';
        errorEl.style.display = 'none';
        errorEl.textContent = '';
      } else {
        const val = Number(clean);
        e.target.value = val.toLocaleString('ko-KR');
        
        const newLen = e.target.value.length;
        let pos = selectionStart + (newLen - originalLen);
        pos = Math.max(0, Math.min(pos, newLen));
        e.target.setSelectionRange(pos, pos);

        if (val < allocatedBudget) {
          errorEl.textContent = `설정하려는 예산 금액이 이미 발행처에 배정된 쿠폰 예산 총액(${fmtMoney(allocatedBudget)})보다 작을 수 없습니다.`;
          errorEl.style.display = 'block';
        } else {
          errorEl.style.display = 'none';
          errorEl.textContent = '';
        }
      }
    });

    window.saveBudget = async function(e) {
      e.preventDefault();
      const rawVal = inputEl.value.replace(/[^0-9]/g, '');
      const newTotalBudget = Number(rawVal);

      if (isNaN(newTotalBudget) || newTotalBudget <= 0 || rawVal === '') {
        errorEl.textContent = '올바른 예산 금액을 입력해주세요. (0원보다 커야 합니다)';
        errorEl.style.display = 'block';
        return;
      }

      if (newTotalBudget < allocatedBudget) {
        errorEl.textContent = `설정하려는 예산 금액이 이미 발행처에 배정된 쿠폰 예산 총액(${fmtMoney(allocatedBudget)})보다 작을 수 없습니다.`;
        errorEl.style.display = 'block';
        return;
      }

      try {
        const res = await api.post('/admin/budget', { totalBudget: newTotalBudget });
        showToast(res.message || '예산이 성공적으로 저장되었습니다.', 'success');
        
        await loadBudgetStatus();
        closeModal();
      } catch (err) {
        errorEl.textContent = err.message || '예산 저장에 실패했습니다.';
        errorEl.style.display = 'block';
      }
    }

    loadBudgetStatus();
  </script>
</body>
</html>
