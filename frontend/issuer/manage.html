<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>발행처 관리 페이지 | 옹진 관광 쿠폰</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f4f8ff !important;
      background-image: 
        radial-gradient(circle at 50% 50%, #f4f8ff 0%, #eef4ff 100%) !important;
      position: relative;
      overflow-x: hidden;
      color: #0f172a;
      word-break: keep-all;
    }

    /* Decorative blurred glow circles */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.06) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
      pointer-events: none;
    }

    /* Layout Header & Title Group Styling */
    .manage-header {
      width: 100%;
      max-width: 1100px;
      margin: 16px auto 12px auto;
      padding: 0 24px;
    }
    .manage-title-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .manage-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .manage-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -1px;
      margin: 0;
    }
    .manage-badge-wrap {
      margin-top: 4px;
    }
    .manage-page-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(37, 99, 235, 0.08);
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.15);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: -0.2px;
    }

    /* 4 columns Horizontal Navigation Tab style */
    .tabs-nav-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 12px auto;
      padding: 0 24px;
      z-index: 10;
      position: relative;
    }
    
    .tab-nav-btn {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(37, 99, 235, 0.08);
      border-radius: 20px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.03);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      color: #64748b;
    }
    .tab-nav-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(37, 99, 235, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.1);
      color: #0f172a;
    }
    .tab-nav-btn.active {
      background: rgba(37, 99, 235, 0.08);
      border-color: #2563eb;
      border-width: 1.5px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.15);
      color: #1e3a8a;
    }
    
    .tab-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.05);
      color: #64748b;
      margin-bottom: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-nav-btn:hover .tab-icon-circle {
      transform: scale(1.05);
      color: #2563eb;
      background: rgba(37, 99, 235, 0.05);
      border-color: rgba(37, 99, 235, 0.15);
    }
    .tab-nav-btn.active .tab-icon-circle {
      color: #ffffff;
      background: #2563eb;
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    
    /* Logout button custom color hover */
    .tab-nav-btn.logout-tab:hover .tab-icon-circle {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
      border-color: rgba(239, 68, 68, 0.15);
    }
    .tab-nav-btn.logout-tab.active .tab-icon-circle {
      background: #ef4444;
      border-color: #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }
    
    .tab-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #64748b;
      transition: color 0.3s ease;
    }
    .tab-nav-btn:hover .tab-label {
      color: #0f172a;
    }
    .tab-nav-btn.active .tab-label {
      color: #2563eb;
      font-weight: 800;
    }
    .tab-nav-btn.logout-tab.active .tab-label {
      color: #ef4444;
    }

    /* Content Area Container */
    .content-area-container {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 12px auto;
      padding: 0 24px;
      z-index: 1;
      position: relative;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
    }
    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Stats top grid */
    .stats-top-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    /* Statistics styles */
    .stats-card-wrap {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(37, 99, 235, 0.1);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.05);
    }
    /* Unified Card Title Styles (No icons, clean text) */
    .stats-title,
    .chart-card-title,
    .settings-card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
      margin: 0 0 20px 0;
    }

    /* Coupon Status Layout */
    .coupon-status-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    .metric-card {
      background: #ffffff;
      border: 1px solid rgba(37, 99, 235, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.06);
      border-color: rgba(37, 99, 235, 0.2);
    }

    .metric-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
    }

    .metric-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0f172a;
    }

    .metric-card.highlight-issued .metric-value {
      color: #2563eb;
    }

    .metric-card.highlight-remaining .metric-value {
      color: #ea580c;
    }

    /* 실시간 발급 진행 상태바 */
    .progress-bar-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.04);
      border-radius: 99px;
      height: 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 99px;
      width: 0%;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* Insight Feed style */
    .insight-feed-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }
    .insight-item {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(37, 99, 235, 0.06);
      border-radius: 14px;
      align-items: flex-start;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.02);
    }
    .insight-item:hover {
      background: #ffffff;
      border-color: rgba(37, 99, 235, 0.15);
      transform: translateX(4px);
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.06);
    }
    .insight-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .insight-icon-wrap.blue { background: rgba(59, 130, 246, 0.1); color: #2563eb; }
    .insight-icon-wrap.green { background: rgba(16, 185, 129, 0.1); color: #16a34a; }
    .insight-icon-wrap.amber { background: rgba(245, 158, 11, 0.1); color: #d97706; }
    .insight-icon-wrap.rose { background: rgba(244, 63, 94, 0.1); color: #dc2626; }
    
    .insight-text-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .insight-item-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0f172a;
    }
    .insight-item-desc {
      font-size: 0.8rem;
      color: #475569;
      line-height: 1.55;
    }
    .insight-loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Date Picker styling */
    .chart-date-picker-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 6px 12px;
      border-radius: 12px;
    }

    .chart-date-picker-wrap label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin: 0;
    }

    .chart-date-input {
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      outline: none;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
      font-family: inherit;
    }

    .chart-date-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    /* ── Statistics Analysis Card ── */
    .chart-card {
      margin-top: 0;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chart-title-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chart-card-subtitle {
      font-size: 0.8rem;
      color: #475569;
    }

    .chart-filter-pills {
      display: flex;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .chart-filter-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chart-filter-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    /* 쿠폰 목표 달성도 및 누적 발급 추이 레이아웃 */
    .chart-split-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 24px;
      width: 100%;
      align-items: stretch;
    }
    
    @media (max-width: 992px) {
      .chart-split-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-progress-ring-card, .chart-cumulative-card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.03);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .progress-ring-title, .cumulative-chart-title {
      font-size: 0.95rem;
      font-weight: 850;
      color: #0f172a;
    }

    .progress-ring-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .progress-ring-wrapper canvas {
      max-height: 100%;
      max-width: 100%;
    }

    .progress-ring-center-text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .progress-percentage {
      font-size: 2.2rem;
      font-weight: 900;
      color: #2563eb;
      line-height: 1;
    }

    .progress-ratio {
      font-size: 0.78rem;
      font-weight: 700;
      color: #64748b;
      margin-top: 6px;
    }
    .yearly-card-item {
      flex: 1;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(37, 99, 235, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .yearly-card-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.1);
    }
    .yearly-card-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #64748b;
    }
    .yearly-card-val {
      font-size: 2rem;
      font-weight: 850;
      color: #0f172a;
      letter-spacing: -1px;
      margin: 8px 0;
    }
    .yearly-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      width: fit-content;
    }
    .yearly-card-badge.up {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }
    .yearly-card-badge.down {
      background: rgba(244, 63, 94, 0.1);
      color: #f43f5e;
    }
    .yearly-card-badge.none {
      background: rgba(100, 116, 139, 0.1);
      color: #64748b;
    }

    /* Settings/Account styles */
    .settings-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .settings-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(37, 99, 235, 0.1);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.05);
    }
    .settings-card-desc {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .form-row {
      margin-bottom: 20px;
    }
    .form-row label {
      display: block;
      font-size: 0.8rem;
      color: #475569;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }
    .form-row input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      color: #0f172a;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .form-row input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #ffffff;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .btn-submit-action {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-submit-action:hover {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }
    .btn-submit-action:active {
      transform: translateY(1px);
    }

    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    @media (max-width: 960px) {
      .tabs-nav-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .stats-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
    @media (max-width: 768px) {
      .coupon-status-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
    }
    @media (max-width: 480px) {
      .tabs-nav-container {
        grid-template-columns: 1fr;
      }
    }

    /* Password visibility toggle styles */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px !important;
    }
    .pw-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle-btn:hover svg {
      stroke: #1e293b;
    }
  </style>
</head>
<body>

  <!-- Global SVG definitions for icons -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Shared linear gradients -->
    </defs>
  </svg>

  <!-- 1. Header with title -->
  <header class="manage-header">
    <div class="manage-title-group">
      <span class="manage-subtitle">옹진 관광 쿠폰</span>
      <h1 class="manage-title" id="header-issuer-name">발행처</h1>
      <div class="manage-badge-wrap">
        <span class="manage-page-badge">관리 페이지</span>
      </div>
    </div>
  </header>

  <!-- 2. Horizontal Tab Navigation (4 columns) -->
  <nav class="tabs-nav-container">
    <!-- QR 화면 탭 -->
    <button class="tab-nav-btn" onclick="goToQrPage()">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <rect x="7" y="7" width="3" height="3"></rect>
          <rect x="14" y="7" width="3" height="3"></rect>
          <rect x="7" y="14" width="3" height="3"></rect>
          <rect x="14" y="14" width="3" height="3"></rect>
        </svg>
      </div>
      <span class="tab-label">QR 화면</span>
    </button>

    <!-- 쿠폰 발급 현황 탭 -->
    <button class="tab-nav-btn active" id="tab-btn-stats" onclick="switchTab('stats')">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>
      <span class="tab-label">쿠폰 발급 현황</span>
    </button>

    <!-- 계정 정보 탭 -->
    <button class="tab-nav-btn" id="tab-btn-account" onclick="switchTab('account')">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <span class="tab-label">계정 정보</span>
    </button>

    <!-- 로그아웃 탭 -->
    <button class="tab-nav-btn logout-tab" onclick="triggerLogout()">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <span class="tab-label">로그아웃</span>
    </button>
  </nav>

  <!-- 3. Dynamic Tab Content Area -->
  <main class="content-area-container">
    
    <!-- ── 탭 A. 쿠폰 발급 현황 ── -->
    <section id="content-stats" class="tab-content active">
      <div style="display: flex; flex-direction: column; gap: 24px;">
        
        <div class="stats-top-grid">
          <!-- 카드 1: 쿠폰 발급 현황 -->
          <div class="stats-card-wrap">
            <h2 class="stats-title">쿠폰 발급 현황</h2>
            
            <div class="coupon-status-layout">
              <!-- 3단 가로형 지표 카드 -->
              <div class="metrics-grid">
                <div class="metric-card">
                  <span class="metric-label">총 배정 수량</span>
                  <span class="metric-value" id="metric-total">0장</span>
                </div>
                <div class="metric-card highlight-issued">
                  <span class="metric-label">누적 발급량</span>
                  <span class="metric-value" id="metric-issued">0장</span>
                </div>
                <div class="metric-card highlight-remaining">
                  <span class="metric-label">현재 잔여량</span>
                  <span class="metric-value" id="metric-remaining">0장</span>
                </div>
              </div>
            </div>
          </div>
        </div>



      </div>
    </section>

    <!-- ── 탭 B. 계정 정보 ── -->
    <section id="content-account" class="tab-content">
      <div class="settings-grid">
        <!-- Password Change Section -->
        <div class="settings-card">
          <h3 class="settings-card-title">비밀번호 변경</h3>
          
          <div class="form-row">
            <label for="change-current-password">현재 비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="change-current-password" placeholder="현재 비밀번호 입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-curr" aria-label="현재 비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-row">
            <label for="change-new-password">새 비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="change-new-password" placeholder="새 비밀번호 입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-new" aria-label="새 비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-row" style="margin-bottom: 24px;">
            <label for="change-new-password-confirm">새 비밀번호 확인</label>
            <div class="password-wrapper">
              <input type="password" id="change-new-password-confirm" placeholder="새 비밀번호 재입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-new-conf" aria-label="새 비밀번호 확인 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          
          <button class="btn-submit-action" onclick="submitChangePassword()">변경하기</button>
        </div>

        <!-- IP Config Section -->
        <div class="settings-card">
          <h3 class="settings-card-title">휴대폰 접속용 IP 설정</h3>
          <p class="settings-card-desc">
            Kiosk PC가 공유기 와이파이에서 할당받은 로컬 IP(예: 192.168.0.75) 주소로 설정해야 모바일 스캔이 원활하게 연동됩니다. (도커 컨테이너 IP 대역인 172.x.x.x는 사용이 불가능합니다.)
          </p>
          <div class="form-row" style="display: flex; gap: 8px; margin-bottom: 0; align-items: center;">
            <input type="text" id="kiosk-host-input" style="flex: 1;" placeholder="예: http://192.168.0.75:8080" />
            <button id="btn-save-host" class="btn-submit-action">반영 및 저장</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="toast-container"></div>


  <script type="module">
    import { api, showToast, fmtMoney } from '../shared/js/api.js';

    // ── 구버전 로컬스토리지 IP 마이그레이션 ──
    const savedHost = localStorage.getItem('ongjin_kiosk_target_host');
    if (savedHost) {
      if (savedHost.includes('localhost') || savedHost.includes('127.0.0.1') || savedHost.includes('192.168.0.10')) {
        localStorage.setItem('ongjin_kiosk_target_host', savedHost.replace('localhost', '192.168.0.75').replace('127.0.0.1', '192.168.0.75').replace('192.168.0.10', '192.168.0.75'));
      }
    }

    // ── 로그인 세션 인증 가드 ──
    const token = localStorage.getItem('ongjin_issuer_token');
    const infoStr = localStorage.getItem('ongjin_issuer_info');
    if (!token || !infoStr) {
      clearAndRedirect();
    }

    const info = JSON.parse(infoStr);
    const issuerNameEl = document.getElementById('header-issuer-name');
    if (issuerNameEl) {
      issuerNameEl.textContent = info.name;
    }

    function clearAndRedirect() {
      localStorage.removeItem('ongjin_issuer_token');
      localStorage.removeItem('ongjin_issuer_info');
      localStorage.removeItem('ongjin_token');
      window.location.replace('/issuer/login.html');
    }

    window.triggerLogout = function() {
      if (confirm('로그아웃 하시겠습니까?')) {
        clearAndRedirect();
      }
    };

    window.goToQrPage = function() {
      if (confirm('QR 화면으로 이동합니다.')) {
        window.location.href = './coupon-qr.html';
      }
    };

    // ── 상태 변수들 ──
    let cachedAllocation = null;
    let statsIntervalId = null;
    let serverLanIp = 'localhost';

    // ── 탭 전환 로직 ──
    window.switchTab = function(tabName) {
      // 모든 탭 버튼 active 클래스 해제
      document.getElementById('tab-btn-stats').classList.remove('active');
      document.getElementById('tab-btn-account').classList.remove('active');

      // 모든 콘텐츠 영역 숨김
      document.getElementById('content-stats').classList.remove('active');
      document.getElementById('content-account').classList.remove('active');

      // 폴링 주기 정리
      if (statsIntervalId) {
        clearInterval(statsIntervalId);
        statsIntervalId = null;
      }

      // 특정 탭 활성화
      if (tabName === 'stats') {
        document.getElementById('tab-btn-stats').classList.add('active');
        document.getElementById('content-stats').classList.add('active');
        
        if (cachedAllocation) {
          updateStatsUI(cachedAllocation);
        }
        loadAllocation();
        statsIntervalId = setInterval(loadAllocation, 3000);
      } else if (tabName === 'account') {
        document.getElementById('tab-btn-account').classList.add('active');
        document.getElementById('content-account').classList.add('active');
      }
    };

    // ── 데이터 연동 로직 ──
    async function loadIssuerInfo() {
      try {
        const res = await api.get('/auth/issuer/me');
        if (res.success && res.serverIp) {
          serverLanIp = res.serverIp;
        }
      } catch (err) {
        console.error('발행처 정보 로드 실패', err);
      }
    }

    async function loadAllocation() {
      localStorage.setItem('ongjin_token', token); // API 공통 헤더 대응

      try {
        if (serverLanIp === 'localhost') {
          await loadIssuerInfo();
        }

        const res = await api.get('/auth/issuer/allocations');
        if (res.success && res.data.length > 0) {
          const allocation = res.data[0];
          cachedAllocation = allocation;

          // IP input value 초기화 대응
          let targetOrigin = localStorage.getItem('ongjin_kiosk_target_host');
          if (targetOrigin) {
            if (targetOrigin.includes('localhost') || targetOrigin.includes('127.0.0.1') || targetOrigin.includes('192.168.0.10')) {
              targetOrigin = targetOrigin.replace('localhost', '192.168.0.75').replace('127.0.0.1', '192.168.0.75').replace('192.168.0.10', '192.168.0.75');
              localStorage.setItem('ongjin_kiosk_target_host', targetOrigin);
            }
          }
          if (!targetOrigin) {
            targetOrigin = window.location.origin;
            if (targetOrigin.includes('localhost') || targetOrigin.includes('127.0.0.1')) {
              targetOrigin = (serverLanIp && !serverLanIp.startsWith('172.')) 
                ? `http://${serverLanIp}:8080` 
                : `http://192.168.0.75:8080`;
            }
          }
          const inputEl = document.getElementById('kiosk-host-input');
          if (inputEl && !inputEl.value) {
            inputEl.value = targetOrigin;
          }

          updateStatsUI(allocation);
        } else {
          showToast('배정된 쿠폰 정보가 없습니다.', 'error');
        }
      } catch (err) {
        console.error('발행처 배정 로드 실패', err);
        if (err.status === 401 || err.status === 403) {
          clearAndRedirect();
        }
      }
    }

    let lastRemainingCount = null;

    function updateStatsUI(allocation) {
      if (!allocation) return;
      const remaining = allocation.total_count - allocation.issued_count;
      const rate = allocation.total_count > 0 
        ? Math.round((allocation.issued_count / allocation.total_count) * 100) 
        : 0;

      lastRemainingCount = remaining;

      // 1. 3열 수치 카드 업데이트 (발급 쿠폰, 남은 쿠폰, 총 배정 쿠폰 순서)
      const issuedEl = document.getElementById('metric-issued');
      if (issuedEl) issuedEl.textContent = `${allocation.issued_count.toLocaleString()}장`;

      const remainingEl = document.getElementById('metric-remaining');
      if (remainingEl) remainingEl.textContent = `${remaining.toLocaleString()}장`;

      const totalEl = document.getElementById('metric-total');
      if (totalEl) totalEl.textContent = `${allocation.total_count.toLocaleString()}장`;
    }

    // IP 설정 저장
    document.getElementById('btn-save-host').onclick = function() {
      let hostVal = document.getElementById('kiosk-host-input').value.trim();
      if (!hostVal) {
        showToast('접속 주소를 입력해 주세요.', 'error');
        return;
      }
      localStorage.setItem('ongjin_kiosk_target_host', hostVal);
      showToast('휴대폰 접속 주소가 반영되었습니다.', 'success');
      loadAllocation();
    };

    // 비밀번호 변경
    window.submitChangePassword = async function() {
      const currentPassword = document.getElementById('change-current-password').value.trim();
      const newPassword = document.getElementById('change-new-password').value;
      const newPasswordConfirm = document.getElementById('change-new-password-confirm').value;

      if (!currentPassword) {
        showToast('현재 비밀번호를 입력해 주세요.', 'error');
        return;
      }
      if (!newPassword || !newPasswordConfirm) {
        showToast('새 비밀번호를 입력해 주세요.', 'error');
        return;
      }
      if (newPassword !== newPasswordConfirm) {
        showToast('새 비밀번호가 일치하지 않습니다.', 'error');
        return;
      }
      if (newPassword.length < 5) {
        showToast('새 비밀번호는 5자 이상이어야 합니다.', 'error');
        return;
      }

      try {
        const res = await api.post('/auth/issuer/change-password', { currentPassword, newPassword });
        if (res.success) {
          showToast('비밀번호가 변경되었습니다. 다시 로그인 해주세요.', 'success');
          setTimeout(() => {
            clearAndRedirect();
          }, 1500);
        }
      } catch (err) {
        showToast(err.message || '비밀번호 변경에 실패했습니다.', 'error');
      }
    };

    // ── 패스워드 토글 기능 ──
    function setupPasswordToggle(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      if (!input || !toggle) return;
      
      toggle.addEventListener('click', () => {
        if (input.type === 'password') {
          input.type = 'text';
          toggle.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>`;
        } else {
          input.type = 'password';
          toggle.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>`;
        }
      });
    }

    setupPasswordToggle('change-current-password', 'pw-toggle-curr');
    setupPasswordToggle('change-new-password', 'pw-toggle-new');
    setupPasswordToggle('change-new-password-confirm', 'pw-toggle-new-conf');

    // 초기 실행
    loadAllocation();
    // 3초 주기 자동 갱신 시작
    statsIntervalId = setInterval(loadAllocation, 3000);
  </script>
</body>
</html>
