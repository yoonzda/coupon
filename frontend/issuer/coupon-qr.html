<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발행처 키오스크 | 옹진 관광 쿠폰</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f4f8ff !important;
      background-image: 
        radial-gradient(circle at 50% 50%, #f4f8ff 0%, #eef4ff 100%) !important;
      position: relative;
      overflow-x: hidden;
      color: #0f172a;
    }

    body.kiosk-mode {
      height: 100vh !important;
      overflow: hidden !important;
    }

    /* Decorative blurred glow circles */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.06) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating gear settings button on public Kiosk screen (Bottom Right, 72px) */
    .kiosk-gear-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.12);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      padding: 0;
    }
    .kiosk-gear-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(37, 99, 235, 0.25);
      box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.2);
    }
    .kiosk-gear-btn:active {
      transform: scale(0.95);
    }

    .btn-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .btn-border-bg {
      fill: none;
      stroke: rgba(0, 0, 0, 0.06);
      stroke-width: 1.5;
    }
    .btn-border-active {
      fill: none;
      stroke: #2563eb;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kiosk-gear-btn:hover .btn-border-active {
      stroke-dashoffset: 0;
    }

    .kiosk-gear-btn .gear-icon-svg {
      width: 28px;
      height: 28px;
      stroke: #475569;
      fill: none;
      z-index: 10;
      transform-origin: center;
      will-change: transform;
      transition: stroke 0.3s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kiosk-gear-btn:hover .gear-icon-svg {
      stroke: #2563eb;
      transform: rotate(90deg);
    }



    /* Screen containers */
    .screen-container {
      display: none;
      flex: 1;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 40px 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .screen-container.active {
      display: flex;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Clean QR Card styling */
    .issuer-kiosk-card {
      text-align: center;
      width: 100%;
      max-width: 1100px;
      margin-top: -10px;
      display: flex;
      flex-direction: column;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .kiosk-title-group {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      padding: 16px 0 !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .kiosk-title-main {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.4;
      margin: 0 0 10px 0;
      letter-spacing: -0.6px;
      word-break: keep-all;
    }
    .title-bracket {
      font-weight: 600;
      font-size: 1.3rem;
      opacity: 0.9;
      color: #0f172a !important; /* 색상 들어가지 않게 상위 색상 강제 지정 */
    }
    .highlight-issuer {
      font-size: 1.85rem;
      font-weight: 600;
      color: #2563eb;
      display: inline;
      margin: 0 6px;
      filter: drop-shadow(0 1px 2px rgba(37, 99, 235, 0.08));
    }
    .kiosk-title-sub {
      font-size: 1.3rem;
      font-weight: 600;
      color: #334155;
      line-height: 1.5;
      margin: 0;
      letter-spacing: -0.3px;
      word-break: keep-all;
    }
    .highlight-amount {
      font-size: 1.35rem;
      color: #2563eb;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin: 0 6px;
      text-decoration: none !important; /* 밑줄 없게 처리 */
      border-bottom: none !important;
    }

    /* Kiosk Steps Guide styles */
    .kiosk-steps-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 36px;
      width: 100%;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }
    .kiosk-step {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(37, 99, 235, 0.15);
      padding: 10px 18px;
      border-radius: 99px;
      box-shadow: 0 6px 15px -4px rgba(37, 99, 235, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .kiosk-step:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(37, 99, 235, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.1);
    }
    .step-num {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
      transition: transform 0.3s ease;
    }
    .kiosk-step:hover .step-num {
      transform: scale(1.1);
    }
    .step-icon {
      width: 20px;
      height: 20px;
      stroke: #2563eb;
      fill: none;
      flex-shrink: 0;
      transition: transform 0.3s ease, stroke 0.3s ease;
      stroke-width: 2;
    }
    .kiosk-step:hover .step-icon {
      stroke: #1e3a8a;
      transform: scale(1.1) rotate(5deg);
    }
    .step-text {
      font-size: 0.9rem;
      color: #334155;
      font-weight: 600;
      white-space: nowrap;
    }
    .kiosk-step:hover .step-text {
      color: #0f172a;
    }
    .step-arrow {
      width: 18px;
      height: 18px;
      color: #2563eb;
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* QR Scan Trigger Button styling (Scaled Up) */
    .btn-qr-trigger {
      background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
      color: #ffffff;
      border: none;
      width: 100%;
      max-width: 580px;
      padding: 24px 48px;
      font-size: 1.65rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.26);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }
    .btn-qr-trigger:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      transform: translateY(-2px);
      box-shadow: 0 16px 38px rgba(37, 99, 235, 0.36);
    }
    .btn-qr-trigger:active {
      transform: translateY(0);
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
    }
    .btn-qr-trigger svg {
      transition: transform 0.3s ease;
      width: 34px !important;
      height: 34px !important;
    }
    .btn-qr-trigger:hover svg {
      transform: scale(1.1);
    }

    @media (max-width: 960px) {
      .kiosk-title-main {
        font-size: 1.15rem;
      }
      .title-bracket {
        font-size: 1.15rem;
      }
      .highlight-issuer {
        font-size: 1.6rem;
      }
      .kiosk-title-sub {
        font-size: 1.15rem;
      }
      .highlight-amount {
        font-size: 1.2rem;
      }
      .kiosk-steps-container {
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }
      .step-arrow {
        transform: rotate(90deg);
        margin: -4px 0;
      }
      .btn-qr-trigger {
        font-size: 1.25rem;
        padding: 16px 32px;
        max-width: 360px;
      }
      .btn-qr-trigger svg {
        width: 26px !important;
        height: 26px !important;
      }
    }



    /* Password Modal overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 0;
      width: 360px;
      padding: 40px 28px 32px 28px;
      position: relative;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 1px rgba(0, 0, 0, 0.15);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }

    .modal-close-x {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .modal-close-x:hover {
      color: #0f172a;
    }
    .modal-close-x svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    .modal-header-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .title-divider {
      width: 28px;
      height: 2px;
      background: rgba(0, 0, 0, 0.08);
      margin: 12px auto 16px auto;
    }
    .modal-desc {
      color: #475569;
      font-size: 0.85rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
    .modal-desc span {
      display: block;
      margin-bottom: 4px;
    }

    .password-input-box {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.04);
      padding: 24px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-input-wrap {
      position: relative;
      width: 100%;
    }
    .modal-input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      pointer-events: none;
      transition: stroke 0.2s;
    }
    .modal-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    .modal-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    .modal-input:focus ~ .modal-input-icon {
      stroke: #2563eb;
    }
    .modal-input-wrap .modal-input {
      padding-right: 44px !important;
    }
    .pw-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      z-index: 5;
    }
    .pw-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle-btn:hover svg {
      stroke: #1e293b;
    }
    .modal-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-confirm {
      background: #2563eb;
      color: #fff;
    }
    .btn-confirm:hover {
      background: #1e40af;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }



    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    /* ── QR 블러 처리 및 오버레이 ── */
    .qr-container-relative {
      position: relative;
      display: inline-block;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(37, 99, 235, 0.15), 0 0 1px rgba(0, 0, 0, 0.05);
    }
    .qr-container-relative .qr-frame {
      box-shadow: none; /* 프레임 자체 섀도우 제거 */
    }
    .qr-image.blurred {
      filter: blur(14px);
      transition: filter 0.3s ease;
      transform: scale(1.02);
    }
    .qr-overlay-btn-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 5;
    }
    .btn-qr-view-large {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-qr-view-large:hover {
      background: #60a5fa;
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
    }
    .btn-qr-view-large:active {
      transform: scale(0.98);
    }

    /* ── QR 크게 보기 모달 전용 스타일 (티켓 형태) ── */
    .qr-modal-container {
      background: #ffffff;
      border-radius: 0;
      width: 480px;
      max-width: 90%;
      padding: 190px 40px 36px 40px; /* Space for overlapping floating QR frame */
      position: relative;
      text-align: center;
      box-shadow: 0 30px 70px rgba(15, 23, 42, 0.22), 0 0 1px rgba(0, 0, 0, 0.15);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: visible; /* Crucial for floating QR */
      margin-top: 130px; /* Space above to prevent clipping */
    }
    .modal-overlay.active .qr-modal-container {
      transform: scale(1);
    }
    .large-qr-frame {
      position: absolute;
      top: -150px; /* Overlaps top of the card */
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      padding: 20px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.14);
      z-index: 10;
      width: 300px;
      height: 300px;
    }
    .large-qr-image {
      width: 260px;
      height: 260px;
      display: block;
    }
    
    /* Ticket Details styling */
    .ticket-icon-wrap {
      width: 68px;
      height: 68px;
      background: rgba(37, 99, 235, 0.07);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .ticket-icon-svg {
      width: 34px;
      height: 34px;
      stroke: #2563eb;
    }
    .ticket-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }
    .ticket-desc {
      font-size: 1.1rem;
      color: #475569;
      line-height: 1.65;
      margin: 0;
      word-break: keep-all;
    }
    .ticket-desc strong {
      color: #2563eb;
      font-weight: 700;
    }
    .ticket-divider-dash {
      border-top: 2px dashed #cbd5e1;
      margin: 28px 0;
      width: 100%;
    }
    .btn-ticket-complete {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-ticket-complete:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35);
      transform: translateY(-1px);
    }
    .btn-ticket-complete:active {
      transform: translateY(0);
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.2);
    }

    /* ── 폴링 완료 성공 레이어 ── */
    .qr-success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0; /* Matches parent container border-radius */
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 24px;
    }
    .qr-success-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .success-check-badge {
      width: 76px;
      height: 76px;
      background: rgba(37, 99, 235, 0.08);
      border: 2px solid #2563eb;
      color: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(37, 99, 235, 0.1);
      animation: scaleBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes scaleBounce {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .success-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #2563eb;
      margin-bottom: 8px;
    }
    .success-desc {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.5;
    }
  </style>
</head>
<body class="kiosk-mode">

  <!-- Global SVG definitions for illustrations -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#60a5fa" />
        <stop offset="100%" stop-color="#2563eb" />
      </linearGradient>
      <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#1e3a8a" />
      </linearGradient>
      <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22d3ee" />
        <stop offset="100%" stop-color="#0891b2" />
      </linearGradient>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtMoney } from '../shared/js/api.js';

    // ── 구버전 로컬스토리지 IP 마이그레이션 ──
    const savedHost = localStorage.getItem('ongjin_kiosk_target_host');
    if (savedHost) {
      if (savedHost.includes('localhost') || savedHost.includes('127.0.0.1') || savedHost.includes('192.168.0.10')) {
        localStorage.setItem('ongjin_kiosk_target_host', savedHost.replace('localhost', '192.168.0.75').replace('127.0.0.1', '192.168.0.75').replace('192.168.0.10', '192.168.0.75'));
      }
    }

    // ── 로그인 세션 인증 가드 ──
    const token = localStorage.getItem('ongjin_issuer_token');
    const infoStr = localStorage.getItem('ongjin_issuer_info');
    if (!token || !infoStr) {
      clearAndRedirect();
    }

    const info = JSON.parse(infoStr);
    
    // UI 기본 바인딩
    document.getElementById('kiosk-name').textContent = info.name;

    function clearAndRedirect() {
      localStorage.removeItem('ongjin_issuer_token');
      localStorage.removeItem('ongjin_issuer_info');
      localStorage.removeItem('ongjin_token');
      window.location.replace('/issuer/login.html');
    }

    let cachedAllocation = null;
    let serverLanIp = 'localhost'; 
    let currentKioskSessionId = null;
    let kioskPollIntervalId = null;

    // ── 설정 버튼 제어 (Kiosk QR 화면 전용) ──
    window.openMenuBtnAction = function() {
      openPasswordModal();
    };

    // ── 비밀번호 입력 확인 ──
    window.openPasswordModal = function() {
      document.getElementById('issuer-password-input').value = '';
      document.getElementById('password-modal').classList.add('active');
      document.getElementById('issuer-password-input').focus();
    };

    window.closePasswordModal = function() {
      document.getElementById('password-modal').classList.remove('active');
    };

    window.handlePasswordKeydown = function(e) {
      if (e.key === 'Enter') {
        verifyPasswordAndEnter();
      }
    };

    window.verifyPasswordAndEnter = async function() {
      const password = document.getElementById('issuer-password-input').value.trim();
      if (!password) {
        showToast('비밀번호를 입력해 주세요.', 'error');
        return;
      }

      try {
        const res = await api.post('/auth/issuer/verify-password', { password });
        if (res.success) {
          closePasswordModal();
          showToast('인증 완료되었습니다.', 'success');
          setTimeout(() => {
            window.location.href = './manage.html';
          }, 500);
        }
      } catch (err) {
        showToast(err.message || '인증에 실패했습니다.', 'error');
      }
    };

    // ── QR 모달 열기 및 폴링 작동 ──
    window.openQrModal = function() {
      if (!cachedAllocation) {
        showToast('배정된 쿠폰 정보가 존재하지 않습니다.', 'error');
        return;
      }
      // 새로운 키오스크 세션 식별자 생성 (UUID 스타일)
      currentKioskSessionId = 'ks_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
      
      let targetOrigin = localStorage.getItem('ongjin_kiosk_target_host');
      
      // 만약 로컬스토리지에 저장된 값이 아예 localhost 이거나 127.0.0.1 이거나 192.168.0.10 이면 기본 192.168.0.75 치환
      if (targetOrigin) {
        if (targetOrigin.includes('localhost') || targetOrigin.includes('127.0.0.1') || targetOrigin.includes('192.168.0.10')) {
          targetOrigin = targetOrigin.replace('localhost', '192.168.0.75').replace('127.0.0.1', '192.168.0.75').replace('192.168.0.10', '192.168.0.75');
          localStorage.setItem('ongjin_kiosk_target_host', targetOrigin);
        }
      }

      if (!targetOrigin) {
        targetOrigin = window.location.origin;
      }

      if (targetOrigin.includes('localhost') || targetOrigin.includes('127.0.0.1')) {
        targetOrigin = (serverLanIp && !serverLanIp.startsWith('172.') && !serverLanIp.startsWith('127.')) 
          ? `http://${serverLanIp}:8080` 
          : `http://192.168.0.75:8080`;
      }
      
      if (targetOrigin.endsWith('/')) {
        targetOrigin = targetOrigin.slice(0, -1);
      }
      
      // QR 상세 화면에는 kioskSessionId를 실어서 모바일이 발급 시 전송하도록 구성
      const payload = `${targetOrigin}/tourist/landing.html?allocationId=${cachedAllocation.id}&kioskSessionId=${currentKioskSessionId}`;
      document.getElementById('kiosk-qr-large-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(payload)}`;
      
      // 모달 활성화 및 성공 오버레이 비활성화
      document.getElementById('qr-success-layer').classList.remove('active');
      document.getElementById('qr-modal').classList.add('active');
      
      startKioskPolling();
    };

    window.closeQrModal = function() {
      document.getElementById('qr-modal').classList.remove('active');
      stopKioskPolling();
    };

    function startKioskPolling() {
      stopKioskPolling();
      kioskPollIntervalId = setInterval(async () => {
        if (!cachedAllocation || !currentKioskSessionId) return;
        try {
          const res = await api.get(`/coupon/kiosk-poll?allocationId=${cachedAllocation.id}&kioskSessionId=${currentKioskSessionId}`);
          if (res.success && res.isIssued) {
            handleKioskIssueSuccess();
          }
        } catch (err) {
          console.error('Kiosk polling error:', err);
        }
      }, 2000);
    }

    function stopKioskPolling() {
      if (kioskPollIntervalId) {
        clearInterval(kioskPollIntervalId);
        kioskPollIntervalId = null;
      }
    }

    async function handleKioskIssueSuccess() {
      stopKioskPolling();
      
      // 발급 완료 성공 축하 레이어 활성화
      document.getElementById('qr-success-layer').classList.add('active');
      showToast('성공적으로 쿠폰이 발급되었습니다.', 'success');
      
      // 4초 뒤에 모달을 자동으로 닫고 최신 발급 통계를 동기화(loadAllocation)
      setTimeout(() => {
        closeQrModal();
        loadAllocation();
      }, 4000);
    }

    // [발급 완료 확인] 수동 버튼 클릭 처리 (즉시 1회 API 체크)
    window.verifyManuallyAndClose = async function() {
      if (!cachedAllocation || !currentKioskSessionId) return;
      try {
        const res = await api.get(`/coupon/kiosk-poll?allocationId=${cachedAllocation.id}&kioskSessionId=${currentKioskSessionId}`);
        if (res.success && res.isIssued) {
          handleKioskIssueSuccess();
        } else {
          showToast('아직 본인인증 및 발급이 완료되지 않았습니다. 휴대폰 화면을 확인해 주세요.', 'error');
        }
      } catch (err) {
        showToast('발급 상태 조회 중 오류가 발생했습니다.', 'error');
      }
    };

    // ── 데이터 연동 로직 ──
    async function loadIssuerInfo() {
      try {
        const res = await api.get('/auth/issuer/me');
        if (res.success && res.serverIp) {
          serverLanIp = res.serverIp;
        }
      } catch (err) {
        console.error('발행처 정보 로드 실패', err);
      }
    }

    async function loadAllocation() {
      localStorage.setItem('ongjin_token', token); // API 공통 헤더 대응

      try {
        if (serverLanIp === 'localhost') {
          await loadIssuerInfo();
        }

        const res = await api.get('/auth/issuer/allocations');
        if (res.success && res.data.length > 0) {
          const allocation = res.data[0];
          cachedAllocation = allocation;

          // 배정된 쿠폰 금액 반영
          const amountEl = document.getElementById('kiosk-amount');
          if (amountEl && allocation.face_value) {
            amountEl.textContent = `${allocation.face_value.toLocaleString()}원`;
          }
        } else {
          showToast('배정된 쿠폰 정보가 없습니다.', 'error');
        }
      } catch (err) {
        console.error('발행처 배정 로드 실패', err);
        if (err.status === 401 || err.status === 403) {
          clearAndRedirect();
        }
      }
    }

    function setupPasswordToggle(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      if (!input || !toggle) return;
      
      toggle.addEventListener('click', () => {
        if (input.type === 'password') {
          input.type = 'text';
          toggle.innerHTML = `
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          `;
        } else {
          input.type = 'password';
          toggle.innerHTML = `
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          `;
        }
      });
    }

    setupPasswordToggle('issuer-password-input', 'pw-toggle-kiosk');

    // 초기 로드 실행
    loadAllocation();

  </script>
