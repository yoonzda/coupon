<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>입점 심사 대기 안내 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f0fdf4;
      background-image: 
        radial-gradient(circle at 10% 20%, #dcfce7 0%, #f0fdf4 100%);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 40px 20px;
      color: #1e293b;
    }

    .bg-decorations {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .decor-circle {
      position: absolute;
      border-radius: 50%;
    }
    .decor-top {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
      top: -200px; right: -200px;
    }
    .decor-bottom {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.06) 0%, transparent 60%);
      bottom: -150px; left: -150px;
    }

    .apply-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-top: 4px solid #10b981;
      border-radius: 0; 
      padding: 56px 48px;
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }
    .logo-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #059669;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400; 
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .status-icon-svg {
      width: 64px; height: 64px;
      stroke: #10b981;
      fill: none;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    .status-desc {
      font-size: 1rem;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .status-desc strong {
      color: #0f172a;
    }

    /* Stepper UI */
    .stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 0 auto 40px auto;
      max-width: 440px;
      padding: 0 10px;
    }
    .stepper::before {
      content: '';
      position: absolute;
      top: 15px; left: 40px; right: 40px;
      height: 2px;
      background: #e2e8f0;
      z-index: 0;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      flex: 1;
    }
    .step-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    .step-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
    }

    /* Active State */
    .step-item.active .step-dot {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    .step-item.active .step-label {
      color: #059669;
      font-weight: 700;
    }

    /* Completed State */
    .step-item.completed .step-dot {
      background: #dcfce7;
      border-color: #10b981;
      color: #059669;
    }
    .step-item.completed .step-label {
      color: #475569;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn-action {
      display: block;
      padding: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }
    .btn-primary:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
    }
    .btn-secondary {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
    }
    .btn-secondary:hover {
      background: #f8fafc;
      color: #1e293b;
    }

    @media (max-width: 640px) {
      body {
        background: #ffffff;
        background-image: none;
        padding: 0;
        align-items: flex-start;
      }
      .apply-card {
        border: none;
        border-top: 4px solid #10b981;
        padding: 48px 24px;
        box-shadow: none;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Fixed background decoration circles -->
  <div class="bg-decorations">
    <div class="decor-circle decor-top"></div>
    <div class="decor-circle decor-bottom"></div>
  </div>

  <div class="apply-card">
    <div class="logo-area">
      <span class="logo-subtitle">옹진 관광 쿠폰</span>
      <h1 class="logo-title">입점 심사 대기</h1>
    </div>

    <svg class="status-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>

    <div class="status-desc">
      <p>
        가맹점 등록 신청서가 성공적으로 접수되어<br />
        <strong>관리자의 확인 및 심사</strong>가 진행 중입니다.
      </p>
      <p style="margin-top: 12px; font-size: 0.88rem; color: #64748b;">
        서류 검토 절차는 영업일 기준 1~2일이 소요되며,<br />
        승인이 완료되면 기재하신 연락처로 승인 안내 문자가 발송됩니다.
      </p>
    </div>

    <!-- Stepper progress -->
    <div class="stepper">
      <div class="step-item completed">
        <div class="step-dot">1</div>
        <span class="step-label">신청서 접수</span>
      </div>
      <div class="step-item active">
        <div class="step-dot">2</div>
        <span class="step-label">서류 심사</span>
      </div>
      <div class="step-item">
        <div class="step-dot">3</div>
        <span class="step-label">승인 완료</span>
      </div>
    </div>

    <div class="btn-group">
      <button type="button" onclick="window.logoutAndGoLogin()" class="btn-action btn-primary" style="width: 100%; border: none; cursor: pointer;">
        로그인 화면으로 돌아가기
      </button>
    </div>
  </div>

  <script type="module">
    import { api } from '../shared/js/api.js';

    window.logoutAndGoLogin = function() {
      localStorage.removeItem('ongjin_token');
      localStorage.removeItem('ongjin_refresh');
      localStorage.removeItem('ongjin_user');
      window.location.href = '/merchant/login.html';
    };

    async function checkMerchantStatus() {
      const token = localStorage.getItem('ongjin_token');
      const rawUser = localStorage.getItem('ongjin_user');

      if (!token || !rawUser) return;

      try {
        const userObj = JSON.parse(rawUser);
        if (userObj.role !== 'merchant') return;

        // 최신 가맹점 상태 조회
        const res = await api.get('/merchant/my-info');
        if (res.success && res.data) {
          const currentStatus = res.data.status;
          
          // status가 approved(승인 완료)로 변경된 경우에만 스캔 화면으로 자동 이동
          if (currentStatus === 'approved') {
            userObj.status = 'approved';
            localStorage.setItem('ongjin_user', JSON.stringify(userObj));
            window.location.replace('/merchant/scan.html');
          } else if (currentStatus === 'rejected') {
            userObj.status = 'rejected';
            localStorage.setItem('ongjin_user', JSON.stringify(userObj));

            // [반려 상태 전용] 연두빛 틴트를 모두 제거하고 세련된 레드/로즈 테마로 100% 통합
            document.body.style.background = '#fdf2f2';
            document.body.style.backgroundImage = 'radial-gradient(circle at 10% 20%, #fee2e2 0%, #fdf2f2 100%)';

            const decorTop = document.querySelector('.decor-top');
            const decorBottom = document.querySelector('.decor-bottom');
            if (decorTop) decorTop.style.background = 'radial-gradient(circle, rgba(220, 38, 38, 0.08) 0%, transparent 70%)';
            if (decorBottom) decorBottom.style.background = 'radial-gradient(circle, rgba(220, 38, 38, 0.05) 0%, transparent 60%)';

            const applyCard = document.querySelector('.apply-card');
            const logoTitle = document.querySelector('.logo-title');
            const logoSubtitle = document.querySelector('.logo-subtitle');
            const statusDesc = document.querySelector('.status-desc');
            const stepper = document.querySelector('.stepper');
            const btnGroup = document.querySelector('.btn-group');
            const statusIcon = document.querySelector('.status-icon-svg');

            if (applyCard) {
              applyCard.style.borderTop = '4px solid #dc2626';
              applyCard.style.borderColor = 'rgba(220, 38, 38, 0.15)';
              applyCard.style.boxShadow = '0 20px 40px rgba(220, 38, 38, 0.05), 0 1px 3px rgba(0, 0, 0, 0.05)';
            }

            if (logoSubtitle) {
              logoSubtitle.textContent = '옹진 관광 쿠폰';
              logoSubtitle.style.color = '#dc2626';
            }
            if (logoTitle) logoTitle.textContent = '입점 심사 결과 안내';

            if (statusIcon) {
              statusIcon.style.stroke = '#dc2626';
              statusIcon.style.animation = 'none';
              statusIcon.setAttribute('stroke-linecap', 'square');
              statusIcon.setAttribute('stroke-linejoin', 'miter');
              statusIcon.innerHTML = `
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              `;
            }

            let rawReason = res.data.rejection_reason || '제출하신 서류 불충분 또는 정보 불일치';
            let cleanReason = rawReason.replace(/\[사유\]/g, '').trim();

            if (statusDesc) {
              if (cleanReason.includes('유선') || cleanReason.includes('전화')) {
                statusDesc.innerHTML = `
                  <p style="font-size: 1rem; line-height: 1.6; color: #475569;">
                    가맹점 등록 신청서 심사 결과<br />
                    <strong style="color: #dc2626;">반려 처리</strong>되었습니다.
                  </p>
                  <p style="margin-top: 14px; font-size: 0.95rem; color: #b91c1c; font-weight: 700; line-height: 1.5;">
                    담당자가 유선(전화)으로 상세 사유를 안내해 드렸습니다.
                  </p>
                  <p style="margin-top: 12px; font-size: 0.88rem; color: #64748b; line-height: 1.6;">
                    안내받으신 내용을 바탕으로 아래 [재입점 신청하기] 버튼을 눌러<br />제출 정보를 수정 후 다시 신청해 주시기 바랍니다.
                  </p>
                `;
              } else {
                statusDesc.innerHTML = `
                  <p style="font-size: 1rem; line-height: 1.6; color: #475569;">
                    가맹점 등록 신청서 심사 결과<br />
                    <strong style="color: #dc2626;">아래 사유로 반려 처리</strong>되었습니다.
                  </p>
                  <p style="margin-top: 14px; font-size: 0.95rem; color: #b91c1c; font-weight: 700; line-height: 1.5;">
                    반려 사유: ${cleanReason}
                  </p>
                  <p style="margin-top: 12px; font-size: 0.88rem; color: #64748b; line-height: 1.6;">
                    위 사유를 확인하신 후 아래 [재입점 신청하기] 버튼을 눌러<br />제출 정보를 수정 후 다시 신청해 주시기 바랍니다.
                  </p>
                `;
              }
            }

            if (stepper) {
              stepper.innerHTML = `
                <div class="step-item completed">
                  <div class="step-dot" style="background: #f8fafc; border-color: #cbd5e1; color: #64748b;">1</div>
                  <span class="step-label" style="color: #64748b;">신청서 접수</span>
                </div>
                <div class="step-item active" style="color: #dc2626;">
                  <div class="step-dot" style="background: #fef2f2; border-color: #dc2626; color: #dc2626; font-weight: 700; box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15);">2</div>
                  <span class="step-label" style="color: #dc2626; font-weight: 700;">반려 처리</span>
                </div>
                <div class="step-item">
                  <div class="step-dot" style="background: #f8fafc; border-color: #cbd5e1; color: #64748b;">3</div>
                  <span class="step-label" style="color: #64748b;">승인 완료</span>
                </div>
              `;
            }

            if (btnGroup) {
              btnGroup.innerHTML = `
                <a href="/merchant/reapply.html" class="btn-action btn-primary" style="background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);">
                  재입점 신청하기
                </a>
                <button type="button" onclick="window.logoutAndGoLogin()" class="btn-action btn-secondary" style="width: 100%; cursor: pointer;">
                  로그인 화면으로 돌아가기
                </button>
              `;
            }
          }
        }
      } catch (err) {
        console.warn('가맹점 상태 확인 실패:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', checkMerchantStatus);
  </script>
</body>
</html>
