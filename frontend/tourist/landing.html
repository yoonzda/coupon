<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>쿠폰 등록 | 옹진관광 쿠폰</title>
  <link rel="stylesheet" href="./css/tourist-theme.css" />
  <style>
    .claim-container {
      padding: 24px 20px;
    }

    .claim-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--gray-border);
      padding: 32px 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
      margin-top: -30px;
      position: relative;
      z-index: 10;
    }

    .claim-amount-box {
      background: var(--primary-light);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin: 20px 0;
    }

    .claim-amount {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.8px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      display: block;
    }

    .phone-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--gray-border);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="tourist-app">
    <!-- 헤더 -->
    <header class="tourist-header">
      <div class="tourist-logo">
        <svg style="width:22px;height:22px;color:var(--primary)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        쿠폰 <span>수령 / 등록</span>
      </div>
    </header>

    <!-- 히어로 배너 -->
    <section class="hero-banner">
      <span class="hero-tag">현장 발급 쿠폰</span>
      <h1 class="hero-title">옹진관광 할인 쿠폰을<br>지갑에 등록하세요!</h1>
    </section>

    <!-- 수령 / 등록 카드 -->
    <main class="claim-container">
      <div class="claim-card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted);" id="issuer-name">발행처 확인 중...</div>

        <div class="claim-amount-box">
          <div style="font-size:0.82rem; font-weight:700; color:var(--primary-dark); margin-bottom:4px;">할인 쿠폰 금액</div>
          <div class="claim-amount" id="face-value">0원</div>
        </div>

        <form id="claim-form">
          <div class="form-group">
            <label class="form-label">휴대폰 번호 본인인증</label>
            <div style="display:flex; gap:8px;">
              <input type="tel" id="phone" class="phone-input" placeholder="010-0000-0000" maxlength="13" required />
              <button type="button" class="btn-navy-bold" id="btn-send-otp" style="width:110px; padding:0; height:52px; font-size:0.88rem;">인증발송</button>
            </div>
          </div>

          <div class="form-group" id="otp-group" style="display:none;">
            <label class="form-label">인증번호 6자리</label>
            <input type="text" id="otp-code" class="phone-input" placeholder="000000" maxlength="6" style="letter-spacing:4px; text-align:center;" />
          </div>

          <button type="submit" class="btn-primary-bold" id="btn-claim" style="margin-top:12px;">지갑으로 쿠폰 받기</button>
        </form>
      </div>
    </main>

    <!-- 하단 모바일 바텀 네비게이션 -->
    <nav class="bottom-nav">
      <a href="/tourist/index.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        홈
      </a>
      <a href="/tourist/map.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        가맹점 지도
      </a>
      <a href="/tourist/mypage.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 15a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z" />
        </svg>
        내 지갑
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtMoney, setTokens } from '../shared/js/api.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || params.get('allocationId');
    const kioskSessionId = params.get('kioskSessionId');

    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp-code');
    const btnSendOtp = document.getElementById('btn-send-otp');
    const otpGroup = document.getElementById('otp-group');

    // 하이픈 자동입력
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length >= 11) {
        val = val.substring(0, 11).replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      } else if (val.length >= 7) {
        val = val.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
      }
      e.target.value = val;
    });

    const savedPhone = localStorage.getItem('ongjin_phone');
    if (savedPhone) phoneInput.value = savedPhone;

    async function loadAllocationInfo() {
      if (!token) {
        showToast('유효하지 않은 발급 정보입니다.', 'error');
        return;
      }
      try {
        const res = await api.get(`/coupon/allocation-public/${token}`);
        if (res.success && res.data) {
          document.getElementById('issuer-name').textContent = res.data.issuer_name || '옹진군 발행처';
          document.getElementById('face-value').textContent = fmtMoney(res.data.face_value);
        }
      } catch (e) {
        showToast('발급 정황 정보를 조회하지 못했습니다.', 'error');
      }
    }

    btnSendOtp.addEventListener('click', async () => {
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      if (rawPhone.length < 10) {
        showToast('올바른 휴대폰 번호를 입력해주세요.', 'error');
        return;
      }
      try {
        const res = await api.post('/auth/tourist/otp/send', { phone: rawPhone });
        if (res.success) {
          localStorage.setItem('ongjin_phone', phoneInput.value);
          showToast('인증번호가 발송되었습니다.', 'info');
          otpGroup.style.display = 'block';
          otpInput.focus();
        }
      } catch (e) {
        showToast(e.message || '인증번호 발송 실패', 'error');
      }
    });

    document.getElementById('claim-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      const code = otpInput.value.trim();

      if (otpGroup.style.display !== 'block') {
        showToast('인증번호 발송 버튼을 먼저 눌러주세요.', 'error');
        return;
      }

      try {
        const verifyRes = await api.post('/auth/tourist/otp/verify', { phone: rawPhone, code });
        if (verifyRes.success) {
          setTokens(verifyRes.token, verifyRes.refreshToken);

          const issueRes = await api.post('/coupon/issue-by-qr', {
            token,
            kioskSessionId
          });

          if (issueRes.success) {
            showToast('쿠폰 수령 완료! 지갑으로 이동합니다.', 'info');
            setTimeout(() => {
              window.location.href = '/tourist/mypage.html';
            }, 1000);
          } else {
            showToast(issueRes.message || '쿠폰 발급 실패', 'error');
          }
        }
      } catch (err) {
        showToast(err.message || '쿠폰 수령 중 오류 발생', 'error');
      }
    });

    loadAllocationInfo();
  </script>
</body>
</html>
