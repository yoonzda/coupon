<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>쿠폰 등록 | 옹진관광 쿠폰</title>
  <link rel="stylesheet" href="./css/tourist-theme.css" />
  <style>
    .claim-container {
      padding: 24px 20px;
    }

    .claim-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--gray-border);
      padding: 32px 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
      margin-top: -30px;
      position: relative;
      z-index: 10;
    }

    .claim-amount-box {
      background: var(--primary-light);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin: 20px 0 16px;
    }

    .claim-amount {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.8px;
    }

    .claim-breakdown {
      margin-top: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #0369a1;
    }

    .claim-meta-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
    }

    .claim-meta-box .lbl {
      color: #64748b;
      font-weight: 600;
    }

    .claim-meta-box .val {
      color: #0f172a;
      font-weight: 700;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      display: block;
    }

    .phone-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--gray-border);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      outline: none;
    }

    .dev-otp-notice {
      margin: 8px 0 4px;
      font-size: 0.84rem;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    .dev-otp-notice strong {
      color: #0284c7;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 1px 4px;
    }

    .already-claimed-box {
      display: none;
      padding: 18px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      text-align: center;
      margin-top: 8px;
    }

    .already-claimed-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .already-claimed-desc {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="tourist-app">
    <!-- 헤더 -->
    <header class="tourist-header">
      <div class="tourist-logo">
        <svg style="width:22px;height:22px;color:var(--primary)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        쿠폰 <span>수령 / 등록</span>
      </div>
    </header>

    <!-- 히어로 배너 -->
    <section class="hero-banner">
      <span class="hero-tag">현장 발급 쿠폰</span>
      <h1 class="hero-title">옹진관광 할인 쿠폰을<br>지갑에 등록하세요!</h1>
    </section>

    <!-- 수령 / 등록 카드 -->
    <main class="claim-container">
      <div class="claim-card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted);" id="issuer-name">발행처 확인 중...</div>

        <div class="claim-amount-box">
          <div style="font-size:0.82rem; font-weight:700; color:var(--primary-dark); margin-bottom:4px;">할인 쿠폰 금액</div>
          <div class="claim-amount" id="face-value">0원</div>
          <div class="claim-breakdown" id="coupon-breakdown" style="display:none;"></div>
        </div>

        <div class="claim-meta-box">
          <span class="lbl">유효 기간</span>
          <span class="val" id="validity-text">발급일로부터 1년간 유효</span>
        </div>

        <div class="already-claimed-box" id="already-claimed-box">
          <div class="already-claimed-title" id="already-claimed-title">이미 수령 완료된 쿠폰입니다</div>
          <div class="already-claimed-desc" id="already-claimed-desc">
            본 쿠폰 링크는 1회성 보안 세션으로 이미 모바일 지갑에 등록되었습니다.
          </div>
          <a href="/tourist/mypage.html" class="btn-primary-bold" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
            내 쿠폰 지갑 확인하기
          </a>
        </div>

        <form id="claim-form">
          <div class="form-group">
            <label class="form-label">휴대폰 번호 본인인증</label>
            <div style="display:flex; gap:8px;">
              <input type="tel" id="phone" class="phone-input" placeholder="010-0000-0000" maxlength="13" required />
              <button type="button" class="btn-navy-bold" id="btn-send-otp" style="width:110px; padding:0; height:52px; font-size:0.88rem;">인증발송</button>
            </div>
          </div>

          <div class="form-group" id="otp-group" style="display:none;">
            <label class="form-label">인증번호 6자리</label>
            <input type="text" id="otp-code" class="phone-input" placeholder="000000" maxlength="6" inputmode="numeric" style="letter-spacing:4px; text-align:center;" />
            <p class="dev-otp-notice" id="dev-otp-notice" style="display:none;"></p>
          </div>

          <button type="submit" class="btn-primary-bold" id="btn-claim" style="margin-top:12px;">지갑으로 쿠폰 받기</button>
        </form>
      </div>
    </main>

    <!-- 하단 모바일 바텀 네비게이션 -->
    <nav class="bottom-nav">
      <a href="/tourist/index.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        홈
      </a>
      <a href="/tourist/mypage.html?tab=map" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        가맹점 지도
      </a>
      <a href="/tourist/mypage.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 15a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z" />
        </svg>
        내 지갑
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, fmtMoney, setTokens } from '../shared/js/api.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const kioskSessionId = params.get('kioskSessionId');

    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp-code');
    const btnSendOtp = document.getElementById('btn-send-otp');
    const btnClaim = document.getElementById('btn-claim');
    const otpGroup = document.getElementById('otp-group');
    const devNotice = document.getElementById('dev-otp-notice');
    const claimForm = document.getElementById('claim-form');
    const alreadyClaimedBox = document.getElementById('already-claimed-box');

    // 하이픈 자동입력
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '').slice(0, 11);
      if (val.length <= 3) {
        e.target.value = val;
      } else if (val.length <= 7) {
        e.target.value = `${val.slice(0, 3)}-${val.slice(3)}`;
      } else {
        e.target.value = `${val.slice(0, 3)}-${val.slice(3, 7)}-${val.slice(7)}`;
      }
    });

    otpInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    const savedPhone = localStorage.getItem('ongjin_user_phone') || localStorage.getItem('ongjin_phone');
    if (savedPhone) phoneInput.value = savedPhone;

    function showBlockedState(title, desc) {
      claimForm.style.display = 'none';
      alreadyClaimedBox.style.display = 'block';
      if (title) document.getElementById('already-claimed-title').textContent = title;
      if (desc) document.getElementById('already-claimed-desc').textContent = desc;
    }

    async function loadAllocationInfo() {
      if (!token || !isNaN(token)) {
        showBlockedState('유효하지 않은 접근입니다', '보안 토큰이 없거나 올바르지 않은 쿠폰 발급 주소입니다.');
        showToast('유효하지 않은 발급 정보입니다.', 'error');
        return;
      }
      try {
        const qs = kioskSessionId ? `?kioskSessionId=${encodeURIComponent(kioskSessionId)}` : '';
        const res = await api.get(`/coupon/allocation-public/${encodeURIComponent(token)}${qs}`);
        if (res.success && res.data) {
          const d = res.data;
          document.getElementById('issuer-name').textContent = d.issuer_name || '옹진군 발행처';
          document.getElementById('face-value').textContent = fmtMoney(d.face_value);
          if (d.validity_text) {
            document.getElementById('validity-text').textContent = d.validity_text;
          }

          const breakdownEl = document.getElementById('coupon-breakdown');
          if (breakdownEl && Array.isArray(d.breakdown) && d.coupon_count > 1) {
            const parts = d.breakdown.map(b => `${Number(b.face_value).toLocaleString()}원 ${b.count}장`).join(' · ');
            breakdownEl.textContent = `${parts} (총 ${d.coupon_count}장)`;
            breakdownEl.style.display = 'block';
          }

          if (d.already_used) {
            showBlockedState(
              '이미 사용 완료된 쿠폰입니다',
              '가맹점에서 이미 결제가 완료되어 등록할 수 없는 쿠폰입니다.'
            );
          } else if (d.already_claimed) {
            showBlockedState(
              '이미 수령 완료된 쿠폰입니다',
              '본 쿠폰 링크는 1회성 보안 세션으로 이미 모바일 지갑에 등록되었습니다.'
            );
          }
        }
      } catch (e) {
        showBlockedState('만료되었거나 유효하지 않은 링크입니다', e.message || '쿠폰 발급 정보를 조회하지 못했습니다.');
        showToast('발급 정보를 조회하지 못했습니다.', 'error');
      }
    }

    btnSendOtp.addEventListener('click', async () => {
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      if (rawPhone.length < 10 || !rawPhone.startsWith('01')) {
        showToast('올바른 휴대폰 번호를 입력해주세요.', 'error');
        return;
      }
      btnSendOtp.disabled = true;
      btnSendOtp.textContent = '발송 중...';
      try {
        const res = await api.post('/auth/tourist/otp/send', { phone: rawPhone });
        if (res.success) {
          localStorage.setItem('ongjin_phone', phoneInput.value);
          showToast('인증번호가 발송되었습니다.', 'info');
          otpGroup.style.display = 'block';

          if (res.devOtp && devNotice) {
            devNotice.innerHTML = `테스트 환경입니다. 인증번호는 <strong id="btn-fill-otp">${res.devOtp}</strong> 입니다.`;
            devNotice.style.display = 'block';
            const btnFill = document.getElementById('btn-fill-otp');
            if (btnFill) {
              btnFill.onclick = () => {
                otpInput.value = res.devOtp;
                otpInput.focus();
              };
            }
          }
          otpInput.focus();
          btnSendOtp.textContent = '재발송';
        }
      } catch (e) {
        showToast(e.message || '인증번호 발송 실패', 'error');
        btnSendOtp.textContent = '인증발송';
      } finally {
        btnSendOtp.disabled = false;
      }
    });

    claimForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      const otp = otpInput.value.trim();

      if (otpGroup.style.display !== 'block') {
        showToast('인증발송 버튼을 먼저 눌러주세요.', 'error');
        return;
      }
      if (otp.length !== 6) {
        showToast('인증번호 6자리를 입력해주세요.', 'error');
        return;
      }

      btnClaim.disabled = true;
      btnClaim.textContent = '쿠폰 등록 중...';

      try {
        const verifyRes = await api.post('/auth/tourist/otp/verify', { phone: rawPhone, otp });
        if (verifyRes.success) {
          setTokens(verifyRes.token, verifyRes.refresh || verifyRes.refreshToken);
          localStorage.setItem('ongjin_user_phone', phoneInput.value);
          localStorage.setItem('ongjin_phone', phoneInput.value);

          const issueRes = await api.post('/coupon/issue-by-qr', {
            token,
            kioskSessionId
          });

          if (issueRes.success) {
            showToast(issueRes.message || '쿠폰 수령 완료! 지갑으로 이동합니다.', 'info');
            setTimeout(() => {
              window.location.href = '/tourist/mypage.html';
            }, 800);
          } else {
            showToast(issueRes.message || '쿠폰 발급 실패', 'error');
          }
        }
      } catch (err) {
        showToast(err.message || '쿠폰 수령 중 오류 발생', 'error');
      } finally {
        btnClaim.disabled = false;
        btnClaim.textContent = '지갑으로 쿠폰 받기';
      }
    });

    loadAllocationInfo();
  </script>
</body>
</html>
