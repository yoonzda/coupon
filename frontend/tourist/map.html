<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="내 주변 가맹점 찾기 — 옹진관광 쿠폰 지도" />
  <title>가맹점 지도 | 옹진관광 쿠폰</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    #map {
      width: 100%;
      height: calc(100dvh - 56px - 60px);
      background: #e8f4fd;
    }
    .map-fab {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 52px; height: 52px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
      transition: transform var(--dur) var(--ease);
      z-index: 200;
    }
    .map-fab:hover { transform: scale(1.08); }

    /* 가맹점 바텀 시트 */
    .merchant-sheet {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 16px 20px 24px;
      z-index: 300;
      transition: transform .3s var(--ease);
      box-shadow: 0 -8px 32px rgba(0,0,0,.12);
    }
    .merchant-sheet.open { transform: translateX(-50%) translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 999px;
      margin: 0 auto 16px;
    }
    .merchant-name { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); }
    .merchant-addr { font-size: .83rem; color: var(--text-secondary); margin-top: 4px; }
    .merchant-cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    /* 검색 바 */
    .search-bar {
      position: absolute;
      top: 8px;
      left: 12px; right: 12px;
      z-index: 100;
    }
    .search-input-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
    }
    .search-input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: .95rem;
      background: transparent;
      color: var(--text-primary);
    }
    .map-relative { position: relative; }
  </style>
  <!-- 카카오맵 API (실제 키로 교체 필요) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_MAP_KEY__&libraries=services"></script>
</head>
<body>
  <div class="app-shell" style="max-width:100%;margin:0;">
    <header class="app-header" style="max-width:480px;margin:0 auto;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;z-index:200;">
      <div class="logo">📍 가맹점 지도</div>
    </header>

    <div style="padding-top:56px;" class="map-relative">
      <!-- 검색 바 -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="가맹점명, 지역으로 검색..." />
        </div>
      </div>
      <!-- 지도 -->
      <div id="map"></div>
    </div>

    <!-- 내 위치 FAB -->
    <button class="map-fab" id="btn-my-location" title="내 위치">📍</button>

    <!-- 가맹점 상세 시트 -->
    <div class="merchant-sheet" id="merchant-sheet">
      <div class="sheet-handle"></div>
      <div class="merchant-name" id="sheet-name">—</div>
      <div class="merchant-addr" id="sheet-addr">—</div>
      <div class="merchant-cats" id="sheet-cats"></div>
      <button class="btn btn-primary btn-full" style="margin-top:16px;" id="btn-navi">
        🗺️ 길찾기
      </button>
    </div>

    <!-- 바텀 네비 -->
    <nav class="bottom-nav">
      <a href="/tourist/mypage.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>
        </svg>
        내 쿠폰
      </a>
      <a href="/tourist/map.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        지도
      </a>
      <a href="/tourist/apply-merchant.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        입점신청
      </a>
      <a href="/tourist/mypage.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        마이
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast } from '../shared/js/api.js'

    let map, markers = [], selectedMerchant = null

    // ── 지도 초기화 ─────────────────────────────────
    function initMap(lat = 37.4553, lng = 126.4344) {
      const container = document.getElementById('map')
      map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(lat, lng),
        level: 7,
      })
      loadMerchants()
    }

    // ── 가맹점 마커 로드 ─────────────────────────────
    async function loadMerchants(q = '') {
      try {
        // 승인된 가맹점 목록 (위치 정보 포함)
        const { data } = await api.get('/merchant/map' + (q ? `?q=${encodeURIComponent(q)}` : ''))
        markers.forEach(m => m.setMap(null))
        markers = []

        data.forEach(merchant => {
          if (!merchant.lat || !merchant.lng) return
          const pos = new kakao.maps.LatLng(merchant.lat, merchant.lng)
          const marker = new kakao.maps.Marker({ position: pos, map })

          kakao.maps.event.addListener(marker, 'click', () => {
            openSheet(merchant)
          })
          markers.push(marker)
        })
      } catch (e) {
        // 지도 API 키 미설정 등 개발 중 에러는 무시
        console.warn('가맹점 로드 실패:', e.message)
      }
    }

    // ── 가맹점 시트 열기 ─────────────────────────────
    function openSheet(merchant) {
      selectedMerchant = merchant
      document.getElementById('sheet-name').textContent = merchant.name
      document.getElementById('sheet-addr').textContent = merchant.address || '주소 미등록'
      document.getElementById('sheet-cats').innerHTML =
        `<span class="badge badge-info">${merchant.category || '일반'}</span>`
      document.getElementById('merchant-sheet').classList.add('open')

      // 지도 중심 이동
      map.setCenter(new kakao.maps.LatLng(merchant.lat, merchant.lng))
    }

    // ── 길찾기 ───────────────────────────────────────
    document.getElementById('btn-navi').addEventListener('click', () => {
      if (!selectedMerchant) return
      const url = `https://map.kakao.com/link/to/${encodeURIComponent(selectedMerchant.name)},${selectedMerchant.lat},${selectedMerchant.lng}`
      window.open(url, '_blank')
    })

    // ── 내 위치 ─────────────────────────────────────
    document.getElementById('btn-my-location').addEventListener('click', () => {
      if (!navigator.geolocation) return showToast('위치 정보를 사용할 수 없습니다.', 'error')
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => {
          const pos = new kakao.maps.LatLng(coords.latitude, coords.longitude)
          map.setCenter(pos)
          map.setLevel(5)
        },
        () => showToast('위치 접근 권한을 허용해 주세요.', 'error')
      )
    })

    // ── 검색 ────────────────────────────────────────
    let searchTimer
    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => loadMerchants(e.target.value), 400)
    })

    // ── 지도 초기화 ─────────────────────────────────
    // kakao.maps.load 는 SDK가 비동기 로드될 때 사용
    if (window.kakao?.maps) {
      kakao.maps.load(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            ({ coords }) => initMap(coords.latitude, coords.longitude),
            () => initMap()
          )
        } else { initMap() }
      })
    } else {
      document.getElementById('map').innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:.9rem;">카카오맵 API 키를 설정해 주세요.</div>'
    }
  </script>
</body>
</html>
