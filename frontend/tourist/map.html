<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>가맹점 지도 | 옹진관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tourist-theme.css" />
  <style>
    .map-wrapper {
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-search-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: #ffffff;
      border-radius: 10px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border-color);
    }

    .map-search-input {
      flex: 1;
      height: 42px;
      border: none;
      background: transparent;
      padding: 0 10px;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      color: var(--text-dark);
    }

    .map-search-input::placeholder {
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="tourist-app" style="padding-bottom: 0;">
    <!-- 🌟 헤더 (파비콘 로고 이미지 적용) -->
    <header class="header-clean">
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="../shared/images/favicon.png" alt="옹진군 로고" style="width: 24px; height: 24px; object-fit: contain;" />
        <h1 class="header-title">가맹점 <span>지도</span></h1>
      </div>
      <a href="/tourist/mypage.html" style="font-size: 0.82rem; color: var(--text-slate); font-weight: 700; text-decoration: none;">쿠폰함 ➔</a>
    </header>

    <div class="map-wrapper">
      <div class="map-search-bar">
        <svg style="width:20px;height:20px;color:#10b981;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search-input" class="map-search-input" placeholder="가맹점 이름 또는 섬 이름을 검색하세요" />
      </div>

      <div id="map"></div>
    </div>

    <!-- 하단 알약 슬라이딩 네비게이션 -->
    <div class="floating-pill-nav">
      <div class="pill-slider" style="left: calc(100% - 110px); width: 104px;"></div>
      <a href="/tourist/mypage.html" class="pill-tab" title="쿠폰함">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 15a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z" />
        </svg>
        <span class="pill-label">쿠폰함</span>
      </a>
      <a href="/tourist/mypage.html#map" class="pill-tab active" title="가맹점 지도">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        <span class="pill-label">가맹점 지도</span>
      </a>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=KAKAO_APP_KEY_DUMMY&libraries=services"></script>
  <script type="module">
    import { api, showToast } from '../shared/js/api.js';

    let map = null;
    let markers = [];

    function initMap() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(37.2433, 126.1550),
        level: 8
      };
      map = new kakao.maps.Map(container, options);
      loadMerchants();
    }

    async function loadMerchants(query = '') {
      try {
        const res = await api.get(`/merchant/map${query ? `?q=${encodeURIComponent(query)}` : ''}`);
        if (res.success && res.data) {
          renderMarkers(res.data);
        }
      } catch (e) {
        showToast('가맹점 지도 정보를 불러오지 못했습니다.', 'error');
      }
    }

    function renderMarkers(data) {
      markers.forEach(m => m.setMap(null));
      markers = [];

      data.forEach(item => {
        if (!item.lat || !item.lng) return;
        const position = new kakao.maps.LatLng(item.lat, item.lng);
        const marker = new kakao.maps.Marker({
          position,
          map
        });
        markers.push(marker);

        const infowindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:8px 12px; font-size:0.85rem; font-weight:700; color:#0f172a;">${item.name}</div>`
        });

        kakao.maps.event.addListener(marker, 'click', () => {
          infowindow.open(map, marker);
        });
      });
    }

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loadMerchants(e.target.value.trim());
      }
    });

    if (typeof kakao !== 'undefined' && kakao.maps) {
      initMap();
    } else {
      document.getElementById('map').innerHTML = `
        <div style="padding:120px 20px; text-align:center; color:var(--text-slate);">
          <div style="font-family:'Gowun Dodum', sans-serif; font-size:1.4rem; color:var(--text-dark);">옹진군 가맹점 위치 지도</div>
          <div style="font-size:0.88rem; margin-top:6px; color:var(--text-slate);">카카오 맵 연동 시 옹진군 전역의 스마트 쿠폰 가맹점 위치가 표출됩니다.</div>
        </div>`;
    }
  </script>
</body>
</html>
