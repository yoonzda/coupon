<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옹진 관광 쿠폰 | 시작하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tourist-theme.css" />
  <style>
    .auth-card-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin: 6px 0 10px;
      line-height: 1.32;
      letter-spacing: -0.5px;
    }
    .logo-desc {
      font-size: 0.98rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
      width: 100%;
    }
    .form-group label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 10px;
      text-align: left;
      padding-left: 2px;
      display: block;
    }
    .form-group input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 16px;
      font-family: 'Pretendard', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      background: #ffffff;
      transition: border-color 0.15s ease;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .form-group input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 0.92rem;
      font-family: 'Pretendard', sans-serif;
      letter-spacing: 0;
    }
    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: none !important;
      outline: none;
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.96rem;
      font-weight: 500 !important;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
      transition: opacity 0.15s ease, transform 0.15s ease;
      letter-spacing: -0.2px;
    }
    .btn-submit:hover {
      opacity: 0.95;
    }
    .btn-submit:active {
      transform: translateY(1px);
    }
    .dev-otp-notice {
      margin: 8px 0 16px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
      font-weight: 400;
      background: none;
      border: none;
      padding: 0;
    }
    .dev-otp-notice strong {
      color: #0284c7;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 4px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .dev-otp-notice strong:hover {
      background-color: #e0f2fe;
      color: #0369a1;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .auth-divider span {
      padding: 0 12px;
      color: #94a3b8;
    }
    .sns-circle-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .btn-sns-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .btn-sns-circle:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .btn-sns-circle:active {
      transform: translateY(0);
    }
    .btn-kakao {
      background-color: #FEE500;
      color: #191919;
    }
    .btn-kakao svg {
      width: 20px;
      height: 20px;
    }
    .btn-naver {
      background-color: #03C75A;
      color: #FFFFFF;
    }
    .btn-naver svg {
      width: 15px;
      height: 15px;
    }
    .explore-wrap {
      margin-top: 10px;
    }
    .link-explore {
      font-size: 0.8rem;
      font-weight: 400;
      color: #94a3b8;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #e2e8f0;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
      letter-spacing: -0.2px;
    }
    .link-explore:hover {
      color: #64748b;
      text-decoration-color: #94a3b8;
    }
    .auth-step-view {
      width: 100%;
      animation: stepFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes stepFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .btn-vertical-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .btn-resend-full {
      width: 100%;
      height: 48px;
      background-color: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
      letter-spacing: -0.2px;
    }
    .btn-resend-full:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      color: #1e293b;
    }
    .btn-resend-full:active {
      transform: translateY(1px);
    }
    .otp-timer {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.88rem;
      font-weight: 600;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>
  <div class="tourist-app">
    <div class="auth-app-wrapper">
      <div class="auth-card-box">
        <!-- ── [1단계] 휴대폰 번호 입력 화면 ── -->
        <div id="step-phone" class="auth-step-view">
          <div class="logo-area" style="margin-bottom: 24px;">
            <img src="../shared/images/favicon.png" alt="옹진군 로고" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 12px;" />
            <h1 class="logo-title">옹진으로 떠나는 여행,<br>쿠폰 지갑으로 시작하세요</h1>
            <p class="logo-desc">
              로그인 후 발급받은 쿠폰을 간편하게 확인하고,<br>옹진의 다양한 섬 가맹점에서 바로 사용해보세요.
            </p>
          </div>

          <!-- 휴대폰 번호 인증 폼 -->
          <form id="otp-send-form" style="width: 100%;">
            <div class="form-group">
              <label>휴대폰 번호</label>
              <input type="tel" id="phone" placeholder="'-' 없이 숫자만 입력" maxlength="13" required autocomplete="off" />
            </div>
            <button type="submit" class="btn-submit" id="btn-send">인증번호 받기</button>
          </form>

          <!-- OR 구분선 -->
          <div class="auth-divider">
            <span>OR</span>
          </div>

          <!-- SNS 간편 로그인 원형 아이콘 2개 -->
          <div class="sns-circle-wrap">
            <a href="/auth/kakao" class="btn-sns-circle btn-kakao" title="카카오로 시작하기" aria-label="카카오로 시작하기">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.89 5.39 4.75 6.74l-.97 3.59c-.09.33.28.6.55.41l4.28-2.85c.45.06.91.11 1.39.11 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
              </svg>
            </a>
            <a href="/auth/naver" class="btn-sns-circle btn-naver" title="네이버로 시작하기" aria-label="네이버로 시작하기">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/>
              </svg>
            </a>
          </div>

          <!-- 둘러보기 텍스트 링크 -->
          <div class="explore-wrap">
            <a href="./mypage.html?tab=map" class="link-explore">둘러보기</a>
          </div>
        </div>

        <!-- ── [2단계] 인증번호 입력 화면 (1단계 제출 시 전환) ── -->
        <div id="step-otp" class="auth-step-view" style="display: none;">
          <div class="otp-header" style="margin-bottom: 24px; text-align: center;">
            <h1 class="logo-title" style="font-size: 1.65rem; font-weight: 700; color: #0f172a; margin: 0 0 10px;">인증번호가 발송되었습니다</h1>
            <div class="otp-timer-center" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span style="font-size: 0.96rem; color: #64748b; font-weight: 500;">유효시간</span>
              <strong id="otp-timer" style="font-size: 1.45rem; color: #0284c7; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;">03:00</strong>
            </div>
          </div>
          <form id="otp-verify-form" style="width: 100%;">
            <div class="form-group" style="margin-bottom: 8px;">
              <label>인증번호 6자리</label>
              <input type="text" id="otp-code" placeholder="6자리 숫자 입력" maxlength="6" autocomplete="off" required style="width: 100%; text-align: center;" />
            </div>
            <p id="dev-otp-notice" class="dev-otp-notice" style="display: none;"></p>
            <div class="btn-vertical-group">
              <button type="submit" class="btn-submit" id="btn-verify">인증하기</button>
              <button type="button" id="btn-resend" class="btn-resend-full">재발송</button>
            </div>
          </form>

          <!-- 둘러보기와 동일한 형태의 뒤로가기 링크 -->
          <div class="explore-wrap" style="margin-top: 14px;">
            <button type="button" id="btn-back" class="link-explore" style="background: none; border: none; cursor: pointer; padding: 0;">뒤로가기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 화면을 밀지 않는 상단 고정 토스트 컨테이너 -->
  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, setTokens, clearTokens } from '../shared/js/api.js';

    // 소셜 로그인 실패 시 에러 토스트 처리 및 QR 스캔 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const qrToken = urlParams.get('token');
    const kioskSessionId = urlParams.get('kioskSessionId');
    const errorParam = urlParams.get('error') || urlParams.get('notice');
    if (errorParam) {
      if (errorParam.includes('kakao') || errorParam.includes('naver') || errorParam.includes('google')) {
        showToast('SNS 연동 준비 중입니다. 휴대폰 번호로 인증을 진행해주세요.', 'info');
      } else {
        showToast('인증에 실패하였습니다. 다시 시도해주세요.', 'error');
      }
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // 카카오 / 네이버 버튼 클릭 시 상단 토스트 표출
    document.querySelectorAll('.btn-kakao, .btn-naver').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('SNS 연동 준비 중입니다. 휴대폰 번호로 인증을 진행해주세요.', 'info');
      });
    });

    // 이미 유효한 토큰이 있다면: QR 스캔 진입 시 즉시 쿠폰 자동 등록 후 이동, 일반 진입 시 바로 쿠폰함 이동
    const token = localStorage.getItem('ongjin_token');
    if (token) {
      if (qrToken) {
        (async () => {
          try {
            const issueRes = await api.post('/coupon/issue-by-qr', {
              token: qrToken,
              kioskSessionId
            });
            if (issueRes && issueRes.success) {
              showToast(issueRes.message || '쿠폰이 지갑에 자동 등록되었습니다.', 'info');
            }
            setTimeout(() => {
              window.location.href = './mypage.html';
            }, 350);
          } catch (err) {
            if (err.status === 401 || err.status === 403 || (err.message && err.message.includes('인증'))) {
              // 만료된 로그인 토큰이면 비우고 현재 로그인 화면에서 인증 후 자동 등록 진행
              clearTokens();
            } else {
              showToast(err.message || '이미 수령되었거나 만료된 쿠폰입니다.', 'error');
              setTimeout(() => {
                window.location.href = './mypage.html';
              }, 700);
            }
          }
        })();
      } else {
        window.location.href = './mypage.html';
      }
    }

    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const sendForm = document.getElementById('otp-send-form');
    const verifyForm = document.getElementById('otp-verify-form');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp-code');
    const btnSend = document.getElementById('btn-send');
    const btnVerify = document.getElementById('btn-verify');
    const btnResend = document.getElementById('btn-resend');
    const devNotice = document.getElementById('dev-otp-notice');
    const otpTimer = document.getElementById('otp-timer');
    const btnBack = document.getElementById('btn-back');

    phoneInput.value = '';

    // 타이머 관리 변수
    let timerInterval = null;
    let timeLeft = 180; // 3분

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startOtpTimer() {
      stopOtpTimer();
      timeLeft = 180;
      if (otpTimer) {
        otpTimer.textContent = formatTime(timeLeft);
        otpTimer.style.color = '#0284c7';
      }

      timerInterval = setInterval(() => {
        timeLeft--;
        if (otpTimer) {
          otpTimer.textContent = formatTime(timeLeft);
        }
        if (timeLeft <= 0) {
          stopOtpTimer();
          if (otpTimer) {
            otpTimer.textContent = '00:00';
          }
          showToast('인증번호 유효시간이 만료되었습니다. 재발송을 눌러주세요.', 'error');
        }
      }, 1000);
    }

    function stopOtpTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // 뒤로가기 버튼 클릭 이벤트
    if (btnBack) {
      btnBack.addEventListener('click', () => {
        stopOtpTimer();
        stepOtp.style.display = 'none';
        stepPhone.style.display = 'block';
        setTimeout(() => phoneInput.focus(), 50);
      });
    }

    // 실시간 하이픈 자동 포맷팅
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length > 11) {
        val = val.substring(0, 11);
      }

      if (val.length <= 3) {
        e.target.value = val;
      } else if (val.length <= 7) {
        e.target.value = `${val.slice(0, 3)}-${val.slice(3)}`;
      } else {
        e.target.value = `${val.slice(0, 3)}-${val.slice(3, 7)}-${val.slice(7)}`;
      }
    });

    // 단계 전환 함수
    function goToOtpStep(devOtp) {
      stepPhone.style.display = 'none';
      stepOtp.style.display = 'block';
      otpInput.value = '';

      startOtpTimer();

      if (devOtp) {
        devNotice.innerHTML = `테스트 환경입니다. 인증번호는 <strong id="btn-fill-otp" title="클릭하여 번호 입력">${devOtp}</strong> 입니다.`;
        devNotice.style.display = 'block';

        const btnFill = document.getElementById('btn-fill-otp');
        if (btnFill) {
          btnFill.onclick = () => {
            otpInput.value = devOtp;
            otpInput.focus();
          };
        }
      } else {
        devNotice.style.display = 'none';
      }

      setTimeout(() => {
        otpInput.focus();
      }, 50);
    }

    // [1단계] 인증번호 발송 요청
    sendForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      if (rawPhone.length < 10 || !rawPhone.startsWith('01')) {
        showToast('올바른 휴대폰 번호를 입력해 주세요.', 'error');
        return;
      }

      btnSend.disabled = true;
      btnSend.textContent = '인증번호 발송 중...';

      try {
        const res = await api.post('/auth/tourist/otp/send', { phone: rawPhone });
        if (res.success) {
          showToast('인증번호가 발송되었습니다.', 'info');
          goToOtpStep(res.devOtp);
        } else {
          showToast(res.message || (Array.isArray(res.errors) && res.errors[0]?.msg) || '인증번호 발송에 실패했습니다.', 'error');
        }
      } catch (err) {
        showToast(err.message || '인증번호 발송 오류가 발생했습니다.', 'error');
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = '인증번호 받기';
      }
    });

    // [2단계] 인증번호 재발송 클릭
    btnResend.addEventListener('click', async () => {
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      btnResend.disabled = true;
      btnResend.textContent = '발송 중...';

      try {
        const res = await api.post('/auth/tourist/otp/send', { phone: rawPhone });
        if (res.success) {
          showToast('인증번호가 재발송되었습니다.', 'info');
          otpInput.value = '';
          startOtpTimer();
          if (res.devOtp) {
            devNotice.innerHTML = `테스트 환경입니다. 인증번호는 <strong id="btn-fill-otp" title="클릭하여 번호 입력">${res.devOtp}</strong> 입니다.`;
            devNotice.style.display = 'block';

            const btnFill = document.getElementById('btn-fill-otp');
            if (btnFill) {
              btnFill.onclick = () => {
                otpInput.value = res.devOtp;
                otpInput.focus();
              };
            }
          }
          otpInput.focus();
        } else {
          showToast(res.message || (Array.isArray(res.errors) && res.errors[0]?.msg) || '인증번호 재발송에 실패했습니다.', 'error');
        }
      } catch (err) {
        showToast(err.message || '인증번호 재발송 오류가 발생했습니다.', 'error');
      } finally {
        btnResend.disabled = false;
        btnResend.textContent = '재발송';
      }
    });

    // 인증번호 입력 시 숫자만 허용 (최대 6자리)
    otpInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    // [2단계] 인증번호 검증 요청
    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (timeLeft <= 0) {
        showToast('인증번호 유효시간이 만료되었습니다. 재발송을 눌러주세요.', 'error');
        return;
      }

      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      const otp = otpInput.value.trim();

      if (otp.length !== 6) {
        showToast('6자리 인증번호를 입력해 주세요.', 'error');
        return;
      }

      btnVerify.disabled = true;
      btnVerify.textContent = '인증 확인 중...';

      try {
        const res = await api.post('/auth/tourist/otp/verify', { phone: rawPhone, otp });
        if (res.success) {
          stopOtpTimer();
          setTokens(res.token, res.refresh);
          localStorage.setItem('ongjin_user_phone', phoneInput.value);

          // QR 스캔을 통해 로그인 페이지로 들어온 경우 로그인 즉시 쿠폰 자동 등록 연동
          if (qrToken) {
            try {
              const issueRes = await api.post('/coupon/issue-by-qr', {
                token: qrToken,
                kioskSessionId
              });
              if (issueRes && issueRes.success) {
                showToast(issueRes.message || '인증 및 쿠폰 등록 완료! 지갑으로 이동합니다.', 'info');
              } else {
                showToast('인증 완료! 쿠폰 지갑으로 이동합니다.', 'info');
              }
            } catch (issueErr) {
              showToast(issueErr.message || '인증 완료! 쿠폰 지갑으로 이동합니다.', 'info');
            }
          } else {
            showToast('인증 완료! 쿠폰 지갑으로 이동합니다.', 'info');
          }

          setTimeout(() => {
            window.location.href = './mypage.html';
          }, 400);
        } else {
          showToast(res.message || (Array.isArray(res.errors) && res.errors[0]?.msg) || '인증번호가 일치하지 않습니다.', 'error');
        }
      } catch (err) {
        showToast(err.message || '인증 오류가 발생했습니다.', 'error');
      } finally {
        btnVerify.disabled = false;
        btnVerify.textContent = '인증하기';
      }
    });
  </script>
</body>
</html>
