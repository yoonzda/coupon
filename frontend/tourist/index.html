<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="옹진관광 쿠폰 플랫폼 — 옹진군 여행 필수 할인 쿠폰을 한 곳에서 관리하세요." />
  <title>옹진관광 쿠폰 | 로그인</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    .hero {
      background: linear-gradient(160deg, #0369a1 0%, #0ea5e9 50%, #38bdf8 100%);
      padding: 48px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-wave {
      position: absolute;
      bottom: -2px;
      left: 0; right: 0;
      height: 40px;
    }
    .hero-logo {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }
    .hero h1 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -.5px;
      position: relative;
    }
    .hero h1 em {
      display: block;
      font-size: .95rem;
      font-weight: 400;
      font-style: normal;
      opacity: .85;
      margin-top: 4px;
    }
    .login-section {
      padding: 32px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-title {
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: var(--radius);
      font-size: .95rem;
      font-weight: 700;
      transition: all var(--dur) var(--ease);
      width: 100%;
    }
    .social-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .social-btn:active { transform: none; }
    .social-btn .icon { width: 22px; height: 22px; flex-shrink: 0; }
    .social-btn span { flex: 1; text-align: center; }

    .btn-kakao { background: #FEE500; color: #191919; }
    .btn-naver  { background: #03C75A; color: #fff; }
    .btn-google { background: #fff;    color: #333; border: 1.5px solid var(--border); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: var(--border);
    }
    .merchant-link {
      text-align: center;
      padding: 16px;
      font-size: .85rem;
      color: var(--text-secondary);
    }
    .merchant-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 20px 32px;
    }
    .feature-item {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 14px 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .feature-icon { font-size: 1.6rem; margin-bottom: 6px; }
    .feature-label { font-size: .72rem; font-weight: 600; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 히어로 -->
    <div class="hero">
      <div class="hero-logo">🏝️</div>
      <h1>
        옹진관광 쿠폰
        <em>옹진군 여행 필수 할인 혜택</em>
      </h1>
      <svg class="hero-wave" viewBox="0 0 1440 40" preserveAspectRatio="none" fill="white">
        <path d="M0,20 C360,0 1080,40 1440,20 L1440,40 L0,40 Z"/>
      </svg>
    </div>

    <!-- 특징 -->
    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">🎟️</div>
        <div class="feature-label">디지털 쿠폰<br>지갑</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📍</div>
        <div class="feature-label">내 주변<br>가맹점 지도</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📄</div>
        <div class="feature-label">종이쿠폰<br>디지털 전환</div>
      </div>
    </div>

    <!-- 로그인 -->
    <div class="login-section">
      <p class="login-title">간편 로그인으로 시작하기</p>

      <a href="/auth/kakao" class="social-btn btn-kakao" id="btn-kakao">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3C6.477 3 2 6.477 2 12c0 3.5 1.9 6.5 4.8 8.3l-.7 2.7 3-2c.9.2 1.9.3 2.9.3 5.5 0 10-3.5 10-7.5S17.5 3 12 3z"/>
        </svg>
        <span>카카오로 시작하기</span>
      </a>

      <a href="/auth/naver" class="social-btn btn-naver" id="btn-naver">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/>
        </svg>
        <span>네이버로 시작하기</span>
      </a>

      <a href="/auth/google" class="social-btn btn-google" id="btn-google">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>구글로 시작하기</span>
      </a>

      <div class="divider">또는</div>

      <button class="social-btn btn-outline" id="btn-test-login" style="border: 1.5px solid var(--primary); color: var(--primary);">
        <span style="flex: 1; text-align: center;">테스트 계정으로 시작하기 (Dev)</span>
      </button>

      <div class="merchant-link">
        사장님이신가요?
        <a href="/merchant/index.html">가맹점 로그인 →</a>
      </div>
    </div>

    <script>
      // 테스트 로그인 클릭 시 실행
      document.getElementById('btn-test-login').onclick = function() {
        console.log('Test login clicked');
        // api.js에서 사용하는 키와 동일하게 설정 (ongjin_token)
        localStorage.setItem('ongjin_token', 'test_dummy_jwt_token');
        localStorage.setItem('ongjin_user', JSON.stringify({ id: 1, nickname: '옹진여행자', role: 'user' }));
        
        // 경로를 절대 경로로 명시
        window.location.href = '/tourist/mypage.html';
      };
    </script>

    <!-- 이미 로그인된 경우 redirect -->
    <script type="module">
      import { getToken } from '../shared/js/api.js'
      if (getToken()) window.location.href = '/tourist/mypage.html'
    </script>
  </div>
</body>
</html>
