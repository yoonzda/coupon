<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="../shared/images/favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옹진 관광 쿠폰 | 본인인증</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tourist-theme.css" />
</head>
<body>
  <div class="tourist-app">
    <div class="auth-app-wrapper">
      <!-- 깨끗한 흰색 중앙 모바일 본인인증 카드 -->
      <div style="width: 100%; max-width: 360px; margin: 0 auto; text-align: center;">
        <div class="logo-area">
          <img src="../shared/images/favicon.png" alt="옹진군 로고" style="width: 48px; height: 48px; object-fit: contain; margin-bottom: 12px;" />
          <div class="logo-subtitle">옹진군 관광 쿠폰</div>
          <h1 class="logo-title">나의 옹진 쿠폰</h1>
          <p class="logo-desc">
            휴대폰 본인 인증 후 수령 및 등록된 옹진관광 할인 쿠폰을 바로 확인하고 사용하실 수 있습니다.
          </p>
        </div>

        <form id="otp-send-form" style="width: 100%;">
          <div class="form-group">
            <label style="text-align: center;">휴대폰 번호</label>
            <input type="tel" id="phone" placeholder="휴대폰 번호를 입력해 주세요" maxlength="13" required autocomplete="off" />
          </div>
          <button type="submit" class="btn-submit" id="btn-send">인증번호 발송</button>
        </form>

        <form id="otp-verify-form" style="display: none; width: 100%; margin-top: 24px;">
          <div class="form-group">
            <label style="text-align: center;">인증번호 6자리</label>
            <input type="text" id="otp-code" placeholder="인증번호 6자리" maxlength="6" style="letter-spacing: 6px; font-size: 1.15rem;" required />
          </div>
          <button type="submit" class="btn-outline" id="btn-verify">인증하기</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 화면을 밀지 않는 상단 고정 토스트 컨테이너 -->
  <div id="toast-container"></div>

  <script type="module">
    import { api, showToast, setTokens } from '../shared/js/api.js';

    // 이미 유효한 토큰이 있다면 쿠폰함으로 이동
    const token = localStorage.getItem('ongjin_token');
    if (token) {
      window.location.href = '/tourist/mypage.html';
    }

    const sendForm = document.getElementById('otp-send-form');
    const verifyForm = document.getElementById('otp-verify-form');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp-code');
    const btnSend = document.getElementById('btn-send');

    phoneInput.value = '';

    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val.length >= 11) {
        val = val.substring(0, 11).replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      } else if (val.length >= 7) {
        val = val.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
      }
      e.target.value = val;
    });

    sendForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      if (rawPhone.length < 10) {
        showToast('올바른 휴대폰 번호를 입력해주세요.', 'error');
        return;
      }

      btnSend.disabled = true;
      btnSend.textContent = '발송 중...';

      try {
        const res = await api.post('/auth/tourist/otp/send', { phone: rawPhone });
        if (res.success) {
          showToast('인증번호가 발송되었습니다.', 'info');
          verifyForm.style.display = 'block';

          // 개발 중일 때 발송 성공 시 6자리 인증번호 자동 채움
          if (res.devOtp) {
            otpInput.value = res.devOtp;
          }

          otpInput.focus();
        } else {
          showToast(res.message || '인증번호 발송 실패', 'error');
        }
      } catch (err) {
        showToast(err.message || '인증번호 발송 오류', 'error');
      } finally {
        btnSend.disabled = false;
        btnSend.textContent = '인증번호 재발송';
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
      const otp = otpInput.value.trim();

      if (otp.length !== 6) {
        showToast('6자리 인증번호를 입력해 주세요.', 'error');
        return;
      }

      try {
        const res = await api.post('/auth/tourist/otp/verify', { phone: rawPhone, otp });
        if (res.success) {
          setTokens(res.token, res.refresh);
          showToast('본인인증 완료!', 'info');
          setTimeout(() => {
            window.location.href = '/tourist/mypage.html';
          }, 400);
        } else {
          showToast(res.message || '인증번호가 일치하지 않습니다.', 'error');
        }
      } catch (err) {
        showToast(err.message || '인증 실패', 'error');
      }
    });
  </script>
</body>
</html>
