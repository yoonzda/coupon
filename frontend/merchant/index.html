<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="가맹점 로그인 — 옹진관광 쿠폰 플랫폼" />
  <title>가맹점 로그인 | 옹진관광 쿠폰</title>
  <link rel="stylesheet" href="../shared/css/main.css" />
  <style>
    .merchant-hero {
      background: linear-gradient(160deg, #064e3b 0%, #059669 60%, #34d399 100%);
      padding: 44px 24px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .merchant-hero::before {
      content: '🏪';
      position: absolute;
      font-size: 8rem;
      opacity: .06;
      top: -10px; right: -10px;
      line-height: 1;
    }
    .merchant-hero h1 {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 900;
    }
    .merchant-hero p {
      color: rgba(255,255,255,.8);
      font-size: .88rem;
      margin-top: 6px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: .75rem;
      color: #fff;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .login-card {
      margin: -20px 16px 0;
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .step-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .otp-inputs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .otp-digit {
      aspect-ratio: 1;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      background: var(--surface-2);
      caret-color: var(--primary);
      transition: border-color var(--dur) var(--ease);
    }
    .otp-digit:focus { border-color: var(--primary); background: #fff; }
    .otp-digit.filled { border-color: var(--primary); background: var(--primary-light); }

    .resend-btn {
      font-size: .82rem;
      color: var(--primary);
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .resend-btn:disabled { color: var(--text-muted); text-decoration: none; cursor: not-allowed; }

    .timer {
      font-size: .82rem;
      color: var(--danger);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .notice {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: .8rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-top: 16px;
    }
    .notice strong { color: var(--text-primary); }

    .rejection-alert {
      background: #fff1f2;
      border: 1px solid #fee2e2;
      color: #e11d48;
      padding: 14px;
      border-radius: var(--radius-sm);
      margin-top: 16px;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="merchant-hero">
      <div style="position: absolute; top: 16px; right: 16px; z-index: 10;">
        <select id="lang-switcher-merchant" style="padding: 4px 8px; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; backdrop-filter: blur(4px);">
          <option value="ko" style="color:#000">한국어</option>
          <option value="en" style="color:#000">English</option>
          <option value="zh" style="color:#000">中文</option>
        </select>
      </div>
      <div class="hero-badge">🔐 가맹점 포털</div>
      <h1>가맹점 로그인</h1>
      <p>부여받은 아이디와 비밀번호로<br>안전하게 로그인합니다</p>
    </div>

    <!-- 로그인 카드 -->
    <div class="login-card">
      <!-- 반려 사유 알림 영역 -->
      <div id="rejection-box" class="rejection-alert">
        <strong>⚠️ 입점 신청 반려 안내</strong><br>
        <span id="rejection-msg"></span>
      </div>

      <div id="login-form-block">
        <p class="step-label">가맹점 계정 로그인</p>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="form-group">
            <label class="form-label">아이디</label>
            <input class="form-input" id="merchant-username" type="text"
              placeholder="가맹점 아이디 입력 (예: merchant01)" autocomplete="username" />
          </div>
          <div class="form-group">
            <label class="form-label">비밀번호</label>
            <input class="form-input" id="merchant-password" type="password"
              placeholder="비밀번호 입력 (예: merchant1234)" autocomplete="current-password" />
          </div>
          <button class="btn btn-primary btn-full" id="btn-merchant-login">
            로그인
          </button>
        </div>
      </div>
    </div>

    <!-- 안내 -->
    <div style="padding: 20px 16px;">
      <div class="notice">
        <strong>처음 오셨나요?</strong><br>
        입점 신청은 <a href="/tourist/apply-merchant.html" style="color:var(--primary);font-weight:700;">여기</a>에서 하실 수 있습니다.<br>
        관리자 승인 후 이 화면에서 로그인 가능합니다.
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { getToken } from '../shared/js/api.js'
    
    const existingToken = getToken();
    const existingUser = localStorage.getItem('ongjin_user');
    
    if (existingToken && existingUser) {
      try {
        const userObj = JSON.parse(existingUser);
        if (userObj.role === 'merchant') {
          window.location.replace('/merchant/scan.html');
        } else {
          window.location.replace('/merchant/login.html');
        }
      } catch (e) {
        window.location.replace('/merchant/login.html');
      }
    } else {
      window.location.replace('/merchant/login.html');
    }
  </script>
</body>
</html>
