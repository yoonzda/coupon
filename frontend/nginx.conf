server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS
    resolver 127.0.0.11 valid=30s;

    # ── 정적 파일 서빙 ──────────────────────────────
    # HTML 파일은 캐시하지 않음 (새로운 번들 강제 적용)
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /tourist/index.html;
    }

    location /tourist {
        try_files $uri $uri.html $uri/ /tourist/index.html;
    }

    location /merchant {
        try_files $uri $uri.html $uri/ /merchant/index.html;
    }

    location /admin {
        try_files $uri $uri.html $uri/ /admin/index.html;
    }

    location /issuer {
        try_files $uri $uri.html $uri/ /issuer/coupon-qr.html;
    }

    location /shared/ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # ── API / Auth 프록시 → 백엔드 ──────────────────
    location /api/ {
        set $upstream http://backend:3010;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location /auth/ {
        set $upstream http://backend:3010;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        set $upstream http://backend:3010;
        proxy_pass $upstream;
    }
}
