<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="옹진관광 쿠폰 플랫폼 — 백령도·연평도·덕적도 여행 필수 할인 쿠폰을 한 곳에서 관리하세요." />
  <title>옹진관광 쿠폰 | 서해의 보석, 옹진군</title>
  <style>
    /* ── 페이지 전체 배경 ── */
    body {
      background: #0c1a2e;
    }
    @media (min-width: 768px) {
      body { background: linear-gradient(160deg, #0c1a2e 0%, #0d2d4a 100%); }
    }

    .app-shell {
      background: #0c1a2e;
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    /* ── 히어로 ── */
    .hero {
      position: relative;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 56px;
      overflow: hidden;
    }

    /* 배경 그라디언트 — 서해 석양 */
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 60% at 50% 110%, #f97316 0%, transparent 55%),
        radial-gradient(ellipse 80% 50% at 30% 90%, #fb923c44 0%, transparent 60%),
        linear-gradient(180deg, #0c1a2e 0%, #0d3060 40%, #1a4a7a 70%, #c2520a 100%);
    }

    /* SVG 섬 실루엣 */
    .hero-islands {
      position: absolute;
      bottom: 32px;
      left: 0; right: 0;
      width: 100%;
      height: 120px;
    }

    /* 물결 반짝임 */
    .hero-glitter {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle 1px at 20% 65%, rgba(255,200,80,.7) 0%, transparent 1px),
        radial-gradient(circle 1px at 55% 70%, rgba(255,200,80,.5) 0%, transparent 1px),
        radial-gradient(circle 1px at 75% 60%, rgba(255,200,80,.6) 0%, transparent 1px),
        radial-gradient(circle 1px at 40% 75%, rgba(255,200,80,.4) 0%, transparent 1px),
        radial-gradient(circle 1.5px at 85% 68%, rgba(255,200,80,.6) 0%, transparent 1.5px),
        radial-gradient(circle 1px at 10% 72%, rgba(255,200,80,.5) 0%, transparent 1px);
      animation: glitter 3s ease-in-out infinite alternate;
    }
    @keyframes glitter {
      from { opacity: .6; }
      to   { opacity: 1; }
    }

    /* 로고 텍스트 영역 */
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
    }

    .hero-emblem {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 6px 16px;
      margin-bottom: 14px;
    }
    .hero-emblem-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #f97316;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { transform: scale(1); opacity:1; }
      50%      { transform: scale(1.5); opacity:.7; }
    }
    .hero-emblem span {
      font-size: .72rem;
      font-weight: 600;
      color: rgba(255,255,255,.85);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
      letter-spacing: -1px;
      text-shadow: 0 2px 16px rgba(0,0,0,.4);
    }
    .hero-title .highlight {
      color: #fdba74;
      display: block;
    }
    .hero-subtitle {
      margin-top: 8px;
      font-size: .88rem;
      color: rgba(255,255,255,.7);
      font-weight: 400;
      line-height: 1.6;
    }

    /* 파도 구분선 */
    .hero-wave {
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
    }

    /* ── 섬 카드 슬라이더 ── */
    .island-scroll {
      display: flex;
      gap: 12px;
      padding: 20px 20px 4px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      background: #0c1a2e;
    }
    .island-scroll::-webkit-scrollbar { display: none; }

    .island-chip {
      flex-shrink: 0;
      scroll-snap-align: start;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
      font-weight: 600;
      color: rgba(255,255,255,.8);
      white-space: nowrap;
      transition: all .2s;
      cursor: pointer;
    }
    .island-chip.active,
    .island-chip:hover {
      background: rgba(249,115,22,.2);
      border-color: #f97316;
      color: #fdba74;
    }
    .island-chip .chip-icon { font-size: .9rem; }

    /* ── 특징 카드 ── */
    .features-section {
      padding: 24px 20px 8px;
      background: #0c1a2e;
    }
    .features-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 12px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .feature-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      transition: all .25s;
      cursor: default;
    }
    .feature-card:hover {
      background: rgba(249,115,22,.1);
      border-color: rgba(249,115,22,.3);
      transform: translateY(-2px);
    }
    .feature-icon {
      font-size: 1.7rem;
      margin-bottom: 8px;
      display: block;
    }
    .feature-name {
      font-size: .68rem;
      font-weight: 700;
      color: rgba(255,255,255,.75);
      line-height: 1.4;
    }

    /* ── 로그인 섹션 ── */
    .login-section {
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0c1a2e;
    }
    .login-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      text-align: center;
      margin-bottom: 2px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: .95rem;
      font-weight: 700;
      transition: all .2s;
      width: 100%;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .social-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .social-btn:active { transform: none; filter: brightness(.97); }
    .social-btn .sicon { width: 22px; height: 22px; flex-shrink: 0; }
    .social-btn span   { flex: 1; text-align: center; }

    .btn-kakao  { background: #FEE500; color: #191919; }
    .btn-naver  { background: #03C75A; color: #fff; }
    .btn-google {
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.15) !important;
    }
    .btn-test {
      background: rgba(249,115,22,.12);
      color: #fdba74;
      border: 1.5px solid rgba(249,115,22,.35) !important;
    }

    /* 구분선 */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.25);
      font-size: .78rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: rgba(255,255,255,.1);
    }

    /* ── 가맹점 링크 ── */
    .merchant-link {
      text-align: center;
      padding: 18px 16px 32px;
      font-size: .82rem;
      color: rgba(255,255,255,.4);
      background: #0c1a2e;
    }
    .merchant-link a {
      color: #fdba74;
      font-weight: 600;
    }

    /* ── 배경 별빛 데코 ── */
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: .15; }
      50%      { opacity: .6; }
    }
  </style>
  <script type="module" crossorigin src="/assets/tourist-index-BsInMdBg.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/main-9hPShMGN.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CHX2GdQ8.js">
  <link rel="modulepreload" crossorigin href="/assets/i18n-DJszV0mx.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BkjUHGKL.css">
</head>
<body>
  <div class="app-shell">

    <!-- 히어로 -->
    <div class="hero">
      <div class="hero-bg"></div>
      <div class="hero-glitter"></div>

      <!-- 별빛 데코 -->
      <div class="star" style="width:2px;height:2px;top:8%;left:15%;animation-delay:.3s"></div>
      <div class="star" style="width:3px;height:3px;top:12%;left:70%;animation-delay:1.1s"></div>
      <div class="star" style="width:2px;height:2px;top:20%;left:45%;animation-delay:.7s"></div>
      <div class="star" style="width:2px;height:2px;top:5%;left:85%;animation-delay:1.8s"></div>
      <div class="star" style="width:3px;height:3px;top:18%;left:28%;animation-delay:2.2s"></div>

      <div style="position: absolute; top: 16px; right: 16px; z-index: 10;">
        <select id="lang-switcher-tourist" style="padding: 4px 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; backdrop-filter: blur(4px);">
          <option value="ko" style="color:#000">한국어</option>
          <option value="en" style="color:#000">English</option>
          <option value="zh" style="color:#000">中文</option>
        </select>
      </div>

      <!-- 섬 실루엣 SVG -->
      <svg class="hero-islands" viewBox="0 0 480 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 멀리 있는 섬 (어둡게) -->
        <ellipse cx="60" cy="95" rx="55" ry="18" fill="#0a2040" opacity=".9"/>
        <!-- 가운데 큰 섬 -->
        <path d="M160,100 Q185,70 220,78 Q240,72 260,80 Q285,68 310,82 Q330,76 355,95 Z" fill="#0d2d4a"/>
        <!-- 오른쪽 작은 섬 -->
        <ellipse cx="420" cy="98" rx="40" ry="14" fill="#0a2040" opacity=".85"/>
        <!-- 등대 -->
        <rect x="217" y="60" width="5" height="20" fill="#1e4a7a"/>
        <polygon points="217,60 222,60 219.5,54" fill="#c2520a"/>
        <circle cx="219.5" cy="54" r="2.5" fill="#fcd34d" opacity=".9">
          <animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <!-- 파도 라인 -->
        <path d="M0,108 Q60,102 120,108 Q180,114 240,108 Q300,102 360,108 Q420,114 480,108 L480,120 L0,120 Z" fill="#0c1a2e" opacity=".8"/>
      </svg>

      <!-- 로고 콘텐츠 -->
      <div class="hero-content">
        <div class="hero-emblem">
          <div class="hero-emblem-dot"></div>
          <span>Ongjin · 서해의 보석</span>
        </div>
        <h1 class="hero-title">
          옹진관광
          <span class="highlight">쿠폰 지갑</span>
        </h1>
        <p class="hero-subtitle">
          백령도부터 덕적도까지<br>섬마다 넘치는 할인 혜택
        </p>
      </div>

      <!-- 파도 구분선 -->
      <svg class="hero-wave" viewBox="0 0 480 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,24 C80,4 160,40 240,20 C320,0 400,36 480,20 L480,40 L0,40 Z" fill="#0c1a2e"/>
      </svg>
    </div>

    <!-- 섬 선택 칩 -->
    <div class="island-scroll">
      <div class="island-chip active"><span class="chip-icon">🏝️</span> 전체</div>
      <div class="island-chip"><span class="chip-icon">⛵</span> 백령도</div>
      <div class="island-chip"><span class="chip-icon">🐟</span> 연평도</div>
      <div class="island-chip"><span class="chip-icon">🌊</span> 덕적도</div>
      <div class="island-chip"><span class="chip-icon">🦀</span> 자월도</div>
      <div class="island-chip"><span class="chip-icon">🌅</span> 영흥도</div>
    </div>

    <!-- 서비스 특징 -->
    <div class="features-section">
      <p class="features-label">주요 서비스</p>
      <div class="features-grid">
        <div class="feature-card">
          <span class="feature-icon">🎟️</span>
          <div class="feature-name">디지털<br>쿠폰 지갑</div>
        </div>
        <div class="feature-card">
          <span class="feature-icon">📍</span>
          <div class="feature-name">내 주변<br>가맹점 지도</div>
        </div>
        <div class="feature-card">
          <span class="feature-icon">📷</span>
          <div class="feature-name">종이쿠폰<br>스캔 등록</div>
        </div>
      </div>
    </div>

    <!-- 로그인 -->
    <div class="login-section">
      <p class="login-label">간편 로그인으로 시작하기</p>

      <a href="/auth/kakao" class="social-btn btn-kakao" id="btn-kakao">
        <svg class="sicon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3C6.477 3 2 6.477 2 12c0 3.5 1.9 6.5 4.8 8.3l-.7 2.7 3-2c.9.2 1.9.3 2.9.3 5.5 0 10-3.5 10-7.5S17.5 3 12 3z"/>
        </svg>
        <span>카카오로 시작하기</span>
      </a>

      <a href="/auth/naver" class="social-btn btn-naver" id="btn-naver">
        <svg class="sicon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/>
        </svg>
        <span>네이버로 시작하기</span>
      </a>

      <a href="/auth/google" class="social-btn btn-google" id="btn-google">
        <svg class="sicon" viewBox="0 0 24 24">

          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>구글로 시작하기</span>

      <div class="divider">또는</div>

      <button class="social-btn btn-test" id="btn-test-login">
        <span style="flex:1;text-align:center;">🔑 테스트 계정으로 시작 (Dev)</span>
      </button>
    </div>

    <!-- 가맹점 링크 -->
    <div class="merchant-link">
      사장님이신가요?
      <a href="/merchant/index.html">가맹점 로그인 →</a>
    </div>

    <!-- 스크립트 -->
    <script>
      document.getElementById('btn-test-login').onclick = function() {
        localStorage.setItem('ongjin_token', 'test_dummy_jwt_token');
        localStorage.setItem('ongjin_user', JSON.stringify({ id: 1, nickname: '옹진여행자', role: 'user' }));
        window.location.href = '/tourist/mypage.html';
      };

      // 섬 칩 인터랙션
      document.querySelectorAll('.island-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          document.querySelectorAll('.island-chip').forEach(function(c) { c.classList.remove('active'); });
          chip.classList.add('active');
        });
      });
    </script>

  </div>
</body>
