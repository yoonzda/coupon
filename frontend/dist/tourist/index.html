<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옹진 관광 쿠폰 | 시작하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    .auth-card-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin: 6px 0 10px;
      line-height: 1.32;
      letter-spacing: -0.5px;
    }
    .logo-desc {
      font-size: 0.98rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
      width: 100%;
    }
    .form-group label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 10px;
      text-align: left;
      padding-left: 2px;
      display: block;
    }
    .form-group input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 16px;
      font-family: 'Pretendard', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      background: #ffffff;
      transition: border-color 0.15s ease;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .form-group input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 0.92rem;
      font-family: 'Pretendard', sans-serif;
      letter-spacing: 0;
    }
    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: none !important;
      outline: none;
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.96rem;
      font-weight: 500 !important;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
      transition: opacity 0.15s ease, transform 0.15s ease;
      letter-spacing: -0.2px;
    }
    .btn-submit:hover {
      opacity: 0.95;
    }
    .btn-submit:active {
      transform: translateY(1px);
    }
    .dev-otp-notice {
      margin: 8px 0 16px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
      font-weight: 400;
      background: none;
      border: none;
      padding: 0;
    }
    .dev-otp-notice strong {
      color: #0284c7;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 4px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .dev-otp-notice strong:hover {
      background-color: #e0f2fe;
      color: #0369a1;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .auth-divider span {
      padding: 0 12px;
      color: #94a3b8;
    }
    .sns-circle-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .btn-sns-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .btn-sns-circle:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .btn-sns-circle:active {
      transform: translateY(0);
    }
    .btn-kakao {
      background-color: #FEE500;
      color: #191919;
    }
    .btn-kakao svg {
      width: 20px;
      height: 20px;
    }
    .btn-naver {
      background-color: #03C75A;
      color: #FFFFFF;
    }
    .btn-naver svg {
      width: 15px;
      height: 15px;
    }
    .explore-wrap {
      margin-top: 10px;
    }
    .link-explore {
      font-size: 0.8rem;
      font-weight: 400;
      color: #94a3b8;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #e2e8f0;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
      letter-spacing: -0.2px;
    }
    .link-explore:hover {
      color: #64748b;
      text-decoration-color: #94a3b8;
    }
    .auth-step-view {
      width: 100%;
      animation: stepFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes stepFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .btn-vertical-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .btn-resend-full {
      width: 100%;
      height: 48px;
      background-color: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
      letter-spacing: -0.2px;
    }
    .btn-resend-full:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
      color: #1e293b;
    }
    .btn-resend-full:active {
      transform: translateY(1px);
    }
    .otp-timer {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.88rem;
      font-weight: 600;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      letter-spacing: -0.2px;
    }
  </style>
  <script type="module" crossorigin src="/assets/tourist-index-CgDQCh8G.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/mock-backend-Cm1IoOFL.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CKTZsajb.js">
  <link rel="stylesheet" crossorigin href="/assets/tourist-index-kNdEf_n5.css">
</head>
<body>
  <div class="tourist-app">
    <div class="auth-app-wrapper">
      <div class="auth-card-box">
        <!-- ── [1단계] 휴대폰 번호 입력 화면 ── -->
        <div id="step-phone" class="auth-step-view">
          <div class="logo-area" style="margin-bottom: 24px;">
            <img src="/assets/favicon-JK0pTB8M.png" alt="옹진군 로고" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 12px;" />
            <h1 class="logo-title">옹진으로 떠나는 여행,<br>쿠폰 지갑으로 시작하세요</h1>
            <p class="logo-desc">
              로그인 후 발급받은 쿠폰을 간편하게 확인하고,<br>옹진의 다양한 섬 가맹점에서 바로 사용해보세요.
            </p>
          </div>

          <!-- 휴대폰 번호 인증 폼 -->
          <form id="otp-send-form" style="width: 100%;">
            <div class="form-group">
              <label>휴대폰 번호</label>
              <input type="tel" id="phone" placeholder="'-' 없이 숫자만 입력" maxlength="13" required autocomplete="off" />
            </div>
            <button type="submit" class="btn-submit" id="btn-send">인증번호 받기</button>
          </form>

          <!-- OR 구분선 -->
          <div class="auth-divider">
            <span>OR</span>
          </div>

          <!-- SNS 간편 로그인 원형 아이콘 2개 -->
          <div class="sns-circle-wrap">
            <a href="/auth/kakao" class="btn-sns-circle btn-kakao" title="카카오로 시작하기" aria-label="카카오로 시작하기">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.89 5.39 4.75 6.74l-.97 3.59c-.09.33.28.6.55.41l4.28-2.85c.45.06.91.11 1.39.11 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
              </svg>
            </a>
            <a href="/auth/naver" class="btn-sns-circle btn-naver" title="네이버로 시작하기" aria-label="네이버로 시작하기">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z"/>
              </svg>
            </a>
          </div>

          <!-- 둘러보기 텍스트 링크 -->
          <div class="explore-wrap">
            <a href="./mypage.html?tab=map" class="link-explore">둘러보기</a>
          </div>
        </div>

        <!-- ── [2단계] 인증번호 입력 화면 (1단계 제출 시 전환) ── -->
        <div id="step-otp" class="auth-step-view" style="display: none;">
          <div class="otp-header" style="margin-bottom: 24px; text-align: center;">
            <h1 class="logo-title" style="font-size: 1.65rem; font-weight: 700; color: #0f172a; margin: 0 0 10px;">인증번호가 발송되었습니다</h1>
            <div class="otp-timer-center" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span style="font-size: 0.96rem; color: #64748b; font-weight: 500;">유효시간</span>
              <strong id="otp-timer" style="font-size: 1.45rem; color: #0284c7; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;">03:00</strong>
            </div>
          </div>
          <form id="otp-verify-form" style="width: 100%;">
            <div class="form-group" style="margin-bottom: 8px;">
              <label>인증번호 6자리</label>
              <input type="text" id="otp-code" placeholder="6자리 숫자 입력" maxlength="6" autocomplete="off" required style="width: 100%; text-align: center;" />
            </div>
            <p id="dev-otp-notice" class="dev-otp-notice" style="display: none;"></p>
            <div class="btn-vertical-group">
              <button type="submit" class="btn-submit" id="btn-verify">인증하기</button>
              <button type="button" id="btn-resend" class="btn-resend-full">재발송</button>
            </div>
          </form>

          <!-- 둘러보기와 동일한 형태의 뒤로가기 링크 -->
          <div class="explore-wrap" style="margin-top: 14px;">
            <button type="button" id="btn-back" class="link-explore" style="background: none; border: none; cursor: pointer; padding: 0;">뒤로가기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 화면을 밀지 않는 상단 고정 토스트 컨테이너 -->
  <div id="toast-container"></div>

</body>
</html>
