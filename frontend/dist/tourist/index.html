<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>옹진 관광 쿠폰 | 본인인증</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/tourist-index-fMEdahrG.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BrJ7NzZM.js">
  <link rel="stylesheet" crossorigin href="/assets/tourist-theme-MhiOuvHY.css">
</head>
<body>
  <div class="tourist-app">
    <div class="auth-app-wrapper">
      <!-- 깨끗한 흰색 중앙 모바일 본인인증 카드 -->
      <div style="width: 100%; max-width: 360px; margin: 0 auto; text-align: center;">
        <div class="logo-area">
          <img src="/assets/favicon-JK0pTB8M.png" alt="옹진군 로고" style="width: 48px; height: 48px; object-fit: contain; margin-bottom: 12px;" />
          <div class="logo-subtitle">옹진군 관광 쿠폰</div>
          <h1 class="logo-title">나의 옹진 쿠폰</h1>
          <p class="logo-desc">
            휴대폰 본인 인증 후 수령 및 등록된 옹진관광 할인 쿠폰을 바로 확인하고 사용하실 수 있습니다.
          </p>
        </div>

        <form id="otp-send-form" style="width: 100%;">
          <div class="form-group">
            <label style="text-align: center;">휴대폰 번호</label>
            <input type="tel" id="phone" placeholder="휴대폰 번호를 입력해 주세요" maxlength="13" required autocomplete="off" />
          </div>
          <button type="submit" class="btn-submit" id="btn-send">인증번호 발송</button>
        </form>

        <form id="otp-verify-form" style="display: none; width: 100%; margin-top: 24px;">
          <div class="form-group">
            <label style="text-align: center;">인증번호 6자리</label>
            <input type="text" id="otp-code" placeholder="인증번호 6자리" maxlength="6" style="letter-spacing: 6px; font-size: 1.15rem;" required />
          </div>
          <button type="submit" class="btn-outline" id="btn-verify">인증하기</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 화면을 밀지 않는 상단 고정 토스트 컨테이너 -->
  <div id="toast-container"></div>

</body>
</html>
