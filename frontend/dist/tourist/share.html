  <meta property="og:type" content="website">
  <meta property="og:title" content="옹진관광쿠폰 받기">
  <meta property="og:description" content="함께 온 일행분은 이 링크에서 옹진관광쿠폰을 1인 1장씩 받을 수 있어요.">

  <meta name="description" content="단체 입장권 결제로 발급된 옹진관광쿠폰을 일행이 1인 1장씩 받는 페이지" />
  <title>쿠폰 받기 | 옹진관광쿠폰</title>
  <style>
    :root {
      --primary: #0068f9; --primary-deep: #024bb1; --powder: #EBF3FA;
      --forest: #046645; --violet: #6736eb;
      --fg: #0f172a; --fg2: #475569; --fg3: #94a3b8; --line: #e2e8f0; --bg: #FAFAFB;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans, 'Pretendard', system-ui, sans-serif); }
    .share-app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
    .share-header { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .share-header a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .share-logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--primary), var(--violet)); }
    .share-header b { font-size: 16px; }
    .share-main { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    h1.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* 쿠폰 티켓 카드 */
    .ticket { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%); color: #fff; border-radius: 20px; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 10px 28px rgba(0, 104, 249, .25); }
    .ticket::after { content: ''; position: absolute; right: -36px; top: -36px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.1); }
    .ticket::before { content: ''; position: absolute; left: -24px; bottom: -48px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.06); }
    .ticket-loc { font-size: 12.5px; opacity: .88; }
    .ticket-amt { font-size: 28px; font-weight: 800; margin: 6px 0 2px; letter-spacing: -.5px; }
    .ticket-amt span { font-size: 15px; font-weight: 600; opacity: .92; }
    .ticket-meta { font-size: 12px; opacity: .86; }
    .ticket-bar { height: 7px; background: rgba(255,255,255,.25); border-radius: 99px; margin-top: 14px; overflow: hidden; }
    .ticket-bar i { display: block; height: 100%; background: #fff; border-radius: 99px; transition: width .6s cubic-bezier(.16,1,.3,1); }
    .ticket-remain { display: flex; justify-content: space-between; font-size: 12px; margin-top: 7px; font-weight: 600; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 15px 16px; }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    .rules div { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; font-size: 13.5px; color: var(--fg2); line-height: 1.45; }
    .rules b { color: var(--fg); }
    .dot { width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--powder); color: var(--primary); font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .hint { font-size: 12.5px; color: var(--fg2); margin-top: 10px; line-height: 1.55; }
    .hint b { color: var(--primary); }

    .btn { width: 100%; border: 0; border-radius: 14px; height: 54px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .12s ease, box-shadow .2s ease, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 18px rgba(0,104,249,.28); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 10px 22px rgba(0,104,249,.36); }
    .btn-share { background: #FEE500; color: #191919; }
    .btn-ghost { background: #fff; color: var(--fg); border: 1px solid var(--line); }
    .btn-sm { height: 48px; font-size: 14.5px; }
    .row { display: flex; gap: 8px; }
    .note { font-size: 12px; color: var(--fg3); text-align: center; margin: 0; line-height: 1.5; }
    .spacer { flex: 1; min-height: 8px; }

    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--forest); background: rgba(4,102,69,.1); border-radius: 99px; padding: 6px 11px; align-self: flex-start; }

    /* 수량 선택 */
    .stepper { display: flex; align-items: center; justify-content: space-between; }
    .stepper button { width: 52px; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font-size: 24px; color: var(--primary); font-weight: 700; cursor: pointer; }
    .stepper button:disabled { color: #cbd5e1; cursor: default; }
    .stepper-num { font-size: 34px; font-weight: 800; }
    .stepper-num small { font-size: 15px; color: var(--fg2); font-weight: 600; }
    .chips { display: flex; gap: 8px; margin-top: 12px; }
    .chip { flex: 1; text-align: center; font-size: 13px; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); color: var(--fg2); font-weight: 600; background: #fff; cursor: pointer; font-family: inherit; }
    .chip.on { border-color: var(--primary); color: var(--primary); background: var(--powder); }

    /* 완료 / 안내 */
    .done { text-align: center; padding-top: 14px; }
    .check { width: 78px; height: 78px; border-radius: 50%; background: #ecfdf5; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; animation: pop .5s ease; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    .done h2 { margin: 0 0 6px; font-size: 21px; }
    .done p { margin: 0; color: var(--fg2); font-size: 14px; }
    .kv { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; gap: 12px; }
    .kv span { color: var(--fg2); flex: none; }
    .kv b { text-align: right; }
    .kv b.blue { color: var(--primary); font-size: 18px; }
    .notice { display: flex; gap: 12px; align-items: flex-start; }
    .notice-ico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 19px; background: #f1f5f9; }
    .notice b { font-size: 15px; display: block; margin-bottom: 3px; }
    .notice span { font-size: 13px; color: var(--fg2); line-height: 1.5; }

    /* 로딩 스켈레톤 */
    .skel { border-radius: 16px; background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 37%, #eef2f7 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    #share-toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: rgba(15,23,42,.92); color: #fff; font-size: 13.5px; padding: 11px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s ease; max-width: 90%; text-align: center; z-index: 50; }
    #share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>

<body>
  <div class="share-app">
    <header class="share-header">
      <a href="/tourist/index.html" id="share-home-link"><div class="share-logo"></div><b>옹진관광쿠폰</b></a>
    </header>
    <main class="share-main" id="share-root">
      <h1 class="sr-only">옹진관광쿠폰 받기</h1>
      <div class="skel" style="height:150px"></div>
      <div class="skel" style="height:110px"></div>
      <div class="skel" style="height:54px; margin-top:auto"></div>
    </main>
  </div>
  <div id="share-toast" role="status" aria-live="polite"></div>

  <!-- 구매자 휴대폰 번호 인증 모달 (소셜 로그인 등 번호 미연동 시 즉시 구매자 인증) -->
  <div id="modal-phone-verify" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.65);backdrop-filter:blur(4px);z-index:9999;align-items:flex-end;justify-content:center;">
    <div style="background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom, 0px));box-sizing:border-box;box-shadow:0 -10px 30px rgba(0,0,0,0.15);">
      <div style="width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:0 auto 16px;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h3 style="margin:0;font-size:17px;font-weight:800;color:#0f172a;">구매자 휴대폰 번호 인증</h3>
        <button type="button" id="btn-close-verify" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:22px;padding:4px;line-height:1;">✕</button>
      </div>
      <p style="font-size:13px;color:#64748b;margin:0 0 16px;line-height:1.45;">
        키오스크 결제 시 입력하셨던 휴대폰 번호를 인증하시면 구매자 권한으로 일행 몫까지 모두 받을 수 있습니다.
      </p>
      
      <div style="margin-bottom:12px;">
        <label style="display:block;font-size:12.5px;font-weight:700;color:#334155;margin-bottom:6px;">구매자 휴대폰 번호</label>
        <div style="display:flex;gap:8px;">
          <input type="tel" id="input-verify-phone" placeholder="010-0000-0000" maxlength="13" style="flex:1;height:46px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;outline:none;">
          <button type="button" id="btn-send-verify-otp" style="height:46px;padding:0 14px;background:#0068f9;color:#fff;border:none;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;">인증번호 받기</button>
        </div>
      </div>

      <div id="verify-otp-area" style="display:none;margin-bottom:16px;">
        <label style="display:block;font-size:12.5px;font-weight:700;color:#334155;margin-bottom:6px;">인증번호 6자리</label>
        <div style="display:flex;gap:8px;position:relative;">
          <input type="tel" id="input-verify-otp" placeholder="123456" maxlength="6" style="flex:1;height:46px;border:1px solid #cbd5e1;border-radius:12px;padding:0 64px 0 14px;font-size:18px;font-weight:700;letter-spacing:4px;font-family:inherit;outline:none;">
          <span id="verify-timer" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:#ea580c;font-weight:700;">03:00</span>
        </div>
      </div>

      <button type="button" id="btn-submit-verify" style="width:100%;height:48px;background:#0068f9;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;display:none;">인증 완료</button>
    </div>
  </div>

</body>
</html>
