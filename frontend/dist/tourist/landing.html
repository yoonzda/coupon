<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>쿠폰 등록 | 옹진관광 쿠폰</title>
  <style>
    .claim-container {
      padding: 24px 20px;
    }

    .claim-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--gray-border);
      padding: 32px 24px;
      box-shadow: var(--shadow-card);
      text-align: center;
      margin-top: -30px;
      position: relative;
      z-index: 10;
    }

    .claim-amount-box {
      background: var(--primary-light);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin: 20px 0 16px;
    }

    .claim-amount {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.8px;
    }

    .claim-breakdown {
      margin-top: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #0369a1;
    }

    .claim-meta-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
    }

    .claim-meta-box .lbl {
      color: #64748b;
      font-weight: 600;
    }

    .claim-meta-box .val {
      color: #0f172a;
      font-weight: 700;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      display: block;
    }

    .phone-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--gray-border);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      outline: none;
    }

    .dev-otp-notice {
      margin: 8px 0 4px;
      font-size: 0.84rem;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    .dev-otp-notice strong {
      color: #0284c7;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 1px 4px;
    }

    .already-claimed-box {
      display: none;
      padding: 18px 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      text-align: center;
      margin-top: 8px;
    }

    .already-claimed-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .already-claimed-desc {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 16px;
    }
  </style>
  <script type="module" crossorigin src="/assets/tourist-landing-BMtVJBdK.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BxOpvEgq.js">
  <link rel="stylesheet" crossorigin href="/assets/tourist-theme-kNdEf_n5.css">
</head>
<body>
  <div class="tourist-app">
    <!-- 헤더 -->
    <header class="tourist-header">
      <div class="tourist-logo">
        <svg style="width:22px;height:22px;color:var(--primary)" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        쿠폰 <span>수령 / 등록</span>
      </div>
    </header>

    <!-- 히어로 배너 -->
    <section class="hero-banner">
      <span class="hero-tag">현장 발급 쿠폰</span>
      <h1 class="hero-title">옹진관광 할인 쿠폰을<br>지갑에 등록하세요!</h1>
    </section>

    <!-- 수령 / 등록 카드 -->
    <main class="claim-container">
      <div class="claim-card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted);" id="issuer-name">발행처 확인 중...</div>

        <div class="claim-amount-box">
          <div style="font-size:0.82rem; font-weight:700; color:var(--primary-dark); margin-bottom:4px;">할인 쿠폰 금액</div>
          <div class="claim-amount" id="face-value">0원</div>
          <div class="claim-breakdown" id="coupon-breakdown" style="display:none;"></div>
        </div>

        <div class="claim-meta-box">
          <span class="lbl">유효 기간</span>
          <span class="val" id="validity-text">발급일로부터 1년간 유효</span>
        </div>

        <div class="already-claimed-box" id="already-claimed-box">
          <div class="already-claimed-title" id="already-claimed-title">이미 수령 완료된 쿠폰입니다</div>
          <div class="already-claimed-desc" id="already-claimed-desc">
            본 쿠폰 링크는 1회성 보안 세션으로 이미 모바일 지갑에 등록되었습니다.
          </div>
          <a href="/tourist/mypage.html" class="btn-primary-bold" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
            내 쿠폰 지갑 확인하기
          </a>
        </div>

        <form id="claim-form">
          <div class="form-group">
            <label class="form-label">휴대폰 번호 본인인증</label>
            <div style="display:flex; gap:8px;">
              <input type="tel" id="phone" class="phone-input" placeholder="010-0000-0000" maxlength="13" required />
              <button type="button" class="btn-navy-bold" id="btn-send-otp" style="width:110px; padding:0; height:52px; font-size:0.88rem;">인증발송</button>
            </div>
          </div>

          <div class="form-group" id="otp-group" style="display:none;">
            <label class="form-label">인증번호 6자리</label>
            <input type="text" id="otp-code" class="phone-input" placeholder="000000" maxlength="6" inputmode="numeric" style="letter-spacing:4px; text-align:center;" />
            <p class="dev-otp-notice" id="dev-otp-notice" style="display:none;"></p>
          </div>

          <button type="submit" class="btn-primary-bold" id="btn-claim" style="margin-top:12px;">지갑으로 쿠폰 받기</button>
        </form>
      </div>
    </main>

    <!-- 하단 모바일 바텀 네비게이션 -->
    <nav class="bottom-nav">
      <a href="/tourist/index.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        홈
      </a>
      <a href="/tourist/mypage.html?tab=map" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        가맹점 지도
      </a>
      <a href="/tourist/mypage.html" class="nav-tab">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 15a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z" />
        </svg>
        내 지갑
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>

</body>
</html>
