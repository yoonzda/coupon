<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="내 쿠폰 지갑 — 옹진관광 쿠폰 마이페이지" />
  <title>내 쿠폰 지갑 | 옹진관광 쿠폰</title>
  <style>
    /* 파란색/남색 포인트 및 밝은 테마 설정 */
    :root {
      --primary: #0284c7;       /* Vibrant Sky Blue */
      --primary-dark: #1e3a8a;  /* Deep Navy Point */
      --primary-light: #e0f2fe; /* Soft Light Blue */
      --bg: #f0f9ff;            /* Bright light blue tint background */
      --surface: #ffffff;
      --border: #bae6fd;        /* Light blue border for soft, bright look */
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --shadow-sm: 0 4px 12px rgba(2, 132, 199, 0.05);
      --shadow: 0 8px 24px rgba(2, 132, 199, 0.08);
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
    }

    .app-shell {
      background: #f8fafc;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.1);
    }

    /* 헤더 스타일 정리 */
    .app-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0284c7 100%);
      height: 60px;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);
      border-bottom: none;
    }
    
    .app-header .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff !important;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-dark);
      border-left: 4px solid var(--primary);
      padding-left: 10px;
      margin-top: 20px;
      margin-bottom: 14px;
      line-height: 1.25;
    }

    /* 쿠폰 카드 */
    .coupon-card {
      background: var(--surface);
      border: 1.5px solid #bae6fd;
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .coupon-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .coupon-card.used, .coupon-card.expired {
      opacity: 0.65;
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    .coupon-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .coupon-value {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--primary-dark);
    }
    .coupon-card.used .coupon-value {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .coupon-info-grid {
      display: grid;
      grid-template-columns: 75px 1fr;
      row-gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      border-top: 1px dashed #bae6fd;
      padding-top: 8px;
    }
    .coupon-card.used .coupon-info-grid {
      border-top-color: #cbd5e1;
    }
    .coupon-info-label {
      color: var(--text-muted);
      font-weight: 500;
    }
    .coupon-info-value {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* 가맹점 카드 */
    .merchant-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .merchant-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      display: flex;
      flex-direction: column;
    }
    .merchant-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .merchant-img-container {
      height: 150px;
      position: relative;
      background: #f1f5f9;
    }
    .merchant-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .merchant-category {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
      backdrop-filter: blur(4px);
    }
    .merchant-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }
    .merchant-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .merchant-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .merchant-address {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 사용 QR 모달 */
    .use-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease);
    }
    .use-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .use-modal-sheet {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 360px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      transform: scale(0.92);
      transition: transform 0.25s var(--ease);
    }
    .use-modal-backdrop.active .use-modal-sheet {
      transform: scale(1);
    }
    .qr-container {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1;
    }
    .qr-img {
      width: 100%;
      height: 100%;
      max-width: 200px;
      max-height: 200px;
    }

    /* 발급 QR 모달 백드롭 (기존 Kiosk 발급 연동 유지용) */
    .qr-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .qr-modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .qr-modal-sheet {
      background: #fff;
      border-radius: 20px;
      width: 85%;
      max-width: 340px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }
    .qr-modal-backdrop.active .qr-modal-sheet { transform: scale(1); }
  </style>
  <script type="module" crossorigin src="/assets/tourist-mypage-Bx5dBif7.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-yYhXsohp.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BUpdExfZ.css">
</head>
<body>
  <div class="app-shell">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="logo">옹진 관광 쿠폰</div>
    </header>

    <!-- 컨텐츠 -->
    <main class="page-content">
      <!-- 쿠폰 목록 영역 -->
      <section>
        <h3 class="section-title">내 쿠폰 목록</h3>
        <div id="coupon-list" style="display:flex;flex-direction:column;gap:12px;">
          <!-- 쿠폰 스켈레톤 로더 -->
          <div class="skeleton" style="height:150px;"></div>
          <div class="skeleton" style="height:150px;"></div>
        </div>
      </section>

      <!-- 사용 가맹점 영역 -->
      <section style="margin-top: 24px;">
        <h3 class="section-title">사용 가능한 가맹점</h3>
        <div id="merchant-list" class="merchant-grid">
          <!-- 가맹점 스켈레톤 로더 -->
          <div class="skeleton" style="height:240px;"></div>
          <div class="skeleton" style="height:240px;"></div>
        </div>
      </section>
    </main>

    <!-- 바텀 네비 -->
    <nav class="bottom-nav">
      <a href="/tourist/mypage.html" class="active" style="color: var(--primary);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
        </svg>
        내 쿠폰
      </a>
      <a href="/tourist/map.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        지도
      </a>
      <a href="/tourist/apply-merchant.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        입점신청
      </a>
      <a href="/tourist/index.html" id="nav-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        로그아웃
      </a>
    </nav>
  </div>

  <!-- 쿠폰 사용 QR 모달 -->
  <div class="use-modal-backdrop" id="use-qr-modal">
    <div class="use-modal-sheet" style="position: relative;">
      <!-- 상단 X 닫기 버튼 -->
      <button class="close-x" onclick="window.closeUseModal()" style="position: absolute; top: 16px; right: 18px; font-size: 1.6rem; font-weight: 300; color: var(--text-muted); cursor: pointer; border: none; background: none; line-height: 1;">&times;</button>
      
      <!-- QR 및 타이머 영역 -->
      <div id="use-modal-qr-container" style="margin-top: 14px;">
        <div class="qr-container">
          <img id="use-modal-qr-img" class="qr-img" src="" alt="쿠폰 결제용 QR 코드" />
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 20px;">
          <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: 500;">남은 시간</div>
          <div id="use-modal-timer" style="font-size: 1.25rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums;">03:00</div>
        </div>
      </div>
      
      <!-- 만료된 화면 오버레이 -->
      <div id="use-modal-expired-container" style="display: none; margin: 30px 0; text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 12px;">⏰</div>
        <p style="font-size: 0.88rem; color: var(--danger); font-weight: 700; margin-bottom: 6px;">유효 시간이 만료되었습니다</p>
        <p style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 20px;">보안을 위해 QR 코드가 소멸되었습니다.</p>
        <button class="btn btn-outline" onclick="window.regenerateQr()" style="padding: 8px 16px; font-size: 0.8rem; border-radius: var(--radius-sm); border-color: var(--primary); color: var(--primary); margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 4px;">🔄 다시 받기</button>
      </div>
      
      <!-- 완료 버튼 -->
      <button class="btn btn-primary btn-full" id="btn-complete-payment" onclick="window.completePayment()" style="background: linear-gradient(135deg, #0284c7 0%, #1e3a8a 100%); border-radius: var(--radius-sm); font-weight: 700; border: none; color: #fff;">완료</button>
    </div>
  </div>

  <!-- Kiosk 자동 발급을 위한 기존 발급 처리 모달 (삭제되지 않음) -->
  <div class="qr-modal-backdrop" id="qr-modal">
    <div class="qr-modal-sheet">
      <div id="qr-state-loading" style="display: block;">
        <div class="spinner" style="width: 48px; height: 48px; border: 4px solid #e0f2fe; border-top-color: #0ea5e9; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <h3 style="font-size: 1.05rem; font-weight: 800; color: #0f172a; margin: 0 0 8px 0;">QR 코드 분석 중</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin: 0; line-height: 1.4;">카메라로 촬영된 이미지를 디코딩하여<br>쿠폰을 발급받고 있습니다. 잠시만 기다려주세요.</p>
      </div>
      
      <div id="qr-state-success" style="display: none;">
        <div style="font-size: 3.5rem; margin-bottom: 16px; animation: bounce 0.6s ease-out;">🎉</div>
        <h3 style="font-size: 1.15rem; font-weight: 800; color: #0f172a; margin: 0 0 8px 0;">쿠폰 발급 성공!</h3>
        <p id="qr-success-msg" style="font-size: 0.9rem; color: #0ea5e9; font-weight: 700; margin-bottom: 24px;">쿠폰이 지갑에 등록되었습니다.</p>
        <button class="btn btn-primary btn-full" id="btn-qr-success-ok" style="padding: 12px 0;">확인</button>
      </div>

      <div id="qr-state-error" style="display: none;">
        <div style="font-size: 3.5rem; margin-bottom: 16px;">❌</div>
        <h3 style="font-size: 1.1rem; font-weight: 800; color: #0f172a; margin: 0 0 8px 0;">인식 실패</h3>
        <p id="qr-error-msg" style="font-size: 0.85rem; color: #ef4444; margin-bottom: 24px; line-height: 1.4;">QR 코드를 찾을 수 없습니다.<br>밝은 곳에서 흔들림 없이 다시 찍어주세요.</p>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline" id="btn-qr-error-close" style="flex: 1; padding: 12px 0;">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
