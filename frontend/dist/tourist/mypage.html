<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="나의 쿠폰함 — 옹진관광 쿠폰" />
  <title>나의 쿠폰함 | 옹진관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <!-- 🌟 진짜 지도 타일 렌더링용 Leaflet 오픈스트리트맵 CSS & JS (Head에서 즉시 로드) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    .view-content {
      display: none !important;
      width: 100%;
    }

    .view-content.active-view {
      display: block !important;
    }

    /* 🌟 진짜 지도 타일 렌더링을 위한 명확한 높이 지정 */
    .real-map-wrapper {
      width: 100%;
      height: calc(100vh - 120px);
      min-height: 550px;
      position: relative;
      background: #e2e8f0;
    }

    #real-map {
      width: 100% !important;
      height: 100% !important;
      min-height: 550px !important;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* 검색 바 상단 오버레이 */
    .map-floating-search {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 100;
      background: #ffffff;
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
      border: 1px solid var(--border-color);
    }

    .map-floating-input {
      flex: 1;
      height: 40px;
      border: none;
      background: transparent;
      padding: 0 8px;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      color: var(--text-dark);
    }

    /* 커스텀 마커 팝업 스타일 */
    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      padding: 4px 6px !important;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18) !important;
    }
    .leaflet-popup-content {
      margin: 10px 12px !important;
      font-family: 'Pretendard', sans-serif !important;
    }

    /* QR 사용 모달 바텀시트 */
    .qr-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .qr-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-modal-sheet {
      width: 100vw;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px 20px 0 0;
      padding: 32px 24px 40px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      border-top: 3px solid var(--primary-blue);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }

    .qr-modal-backdrop.active .qr-modal-sheet {
      transform: translateY(0);
    }

    .qr-image-wrap {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      border: 2px solid var(--primary-blue);
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
    }

    .qr-timer {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--primary-blue);
      margin-bottom: 20px;
    }

    /* ─────────────────────────────────────────────────────────────
       🖼️ [시원시원하고 넓직한 비주얼 이미지 가맹점 카드 5종]
    ───────────────────────────────────────────────────────────── */

    /* 1번 넓은 시안: 큼직한 시그니처 썸네일 카드 (Wide Thumbnail Card) */
    .m-wide-1 {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
      transition: all 0.2s ease;
    }
    .m-wide-1:hover {
      border-color: #0284c7;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.12);
    }

    /* 2번 넓은 시안: 풀-Width 탑 배너 카드 (Hero Top Banner Card) */
    .m-wide-2 {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 6px 22px rgba(15, 23, 42, 0.06);
    }

    /* 3번 넓은 시안: 모던 아일랜드 매장 카드 (Modern Island Store Card) */
    .m-wide-3 {
      background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%);
      border: 1.5px solid #bae6fd;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.08);
    }

    /* 4번 넓은 시안: 풀-와이드 스플릿 비주얼 카드 (Full-Wide Split Visual Card) */
    .m-wide-4 {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-left: 6px solid #0284c7;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 3px 14px rgba(0,0,0,0.04);
    }

    /* 5번 넓은 시안: 럭셔리 라운드 갤러리 카드 (Luxury Gallery Pill Card) */
    .m-wide-5 {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
  </style>
  <script type="module" crossorigin src="/assets/tourist-mypage-Z-x0AHOA.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-Ba6NtGBQ.js">
  <link rel="stylesheet" crossorigin href="/assets/tourist-theme-MhiOuvHY.css">
</head>
<body>
  <div class="tourist-app" id="app-container" style="padding-bottom: 100px;">
    <!-- 상단 헤더 -->
    <header class="header-clean">
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="/assets/favicon-JK0pTB8M.png" alt="옹진군 로고" style="width: 24px; height: 24px; object-fit: contain;" />
        <h1 class="header-title" id="header-title-text">나의 <span>쿠폰함</span></h1>
      </div>
      <a href="#" id="nav-logout" style="font-size: 0.82rem; color: var(--text-slate); font-weight: 700; text-decoration: none;">로그아웃</a>
    </header>

    <!-- 1. 쿠폰함 뷰 (Wallet View) -->
    <main class="wallet-container view-content active-view" id="view-wallet">
      <div class="section-title-wrap">
        <h2 class="section-title">사용 가능 쿠폰</h2>
      </div>

      <!-- 쿠폰 카드 목록 -->
      <div id="coupon-list">
        <div style="padding: 40px; text-align: center; color: var(--text-slate);">쿠폰 정보를 불러오고 있습니다...</div>
      </div>

      <div class="section-title-wrap" style="margin-top: 40px;">
        <h2 class="section-title">쿠폰 사용처</h2>
      </div>

      <!-- 🌟 시원시원하고 넓직한 비주얼 이미지 가맹점 카드 5종 시안 -->
      <div id="merchant-list">
        <div style="padding: 20px; text-align: center; color: var(--text-slate);">가맹점 목록을 불러오는 중...</div>
      </div>
    </main>

    <!-- 2. 지도 뷰 (Map View) -->
    <main class="view-content" id="view-map" style="padding:0;">
      <div class="real-map-wrapper">
        <div class="map-floating-search">
          <svg style="width:20px;height:20px;color:var(--primary-blue);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="map-search-input" class="map-floating-input" placeholder="가맹점 이름을 검색하세요" />
        </div>
        <div id="real-map"></div>
      </div>
    </main>

    <!-- 하단 알약 슬라이딩 네비게이션 -->
    <div class="floating-pill-nav" id="pill-nav">
      <div class="pill-slider" id="pill-slider"></div>
      <button class="pill-tab active" data-tab="wallet" title="쿠폰함" onclick="window.switchTab('wallet')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5zM5 15a2 2 0 00-2 2v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 00-2-2H5z" />
        </svg>
        <span class="pill-label">쿠폰함</span>
      </button>
      <button class="pill-tab" data-tab="map" title="가맹점 지도" onclick="window.switchTab('map')">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        <span class="pill-label">가맹점 지도</span>
      </button>
    </div>
  </div>

  <!-- QR 제시 모달 바텀시트 -->
  <div class="qr-modal-backdrop" id="use-qr-modal">
    <div class="qr-modal-sheet">
      <div style="width: 40px; height: 4px; background: #cbd5e1; border-radius: 99px; margin: 0 auto 20px;"></div>
      <h3 style="font-family: 'Gowun Dodum', sans-serif; font-size: 1.5rem; font-weight: 400; color: var(--text-dark); margin-bottom: 6px;">가맹점 결제용 QR 코드</h3>
      <p style="font-size: 0.85rem; color: var(--text-slate); margin-bottom: 16px;">가맹점 대표님께 QR 코드를 보여주세요.</p>

      <div id="use-modal-qr-container">
        <div class="qr-image-wrap">
          <img id="use-modal-qr-img" src="" alt="결제 QR" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <div class="qr-timer" id="use-modal-timer">03:00</div>
        <button class="btn-outline" style="width:100%; height:48px; border:1px solid #cbd5e1; border-radius:8px; font-weight:700; cursor:pointer;" onclick="window.closeUseModal()">닫기</button>
      </div>

      <div id="use-modal-expired-container" style="display: none;">
        <p style="font-size: 0.9rem; color: #DC2626; font-weight: 700; margin: 20px 0;">유효 시간이 만료되었습니다.</p>
        <button class="btn-blue-fill" style="width:100%; height:48px;" id="btn-re-qr">QR 코드 재생성</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
