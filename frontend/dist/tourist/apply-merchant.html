<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="가맹점 입점 신청 — 옹진관광 쿠폰 플랫폼" />
  <title>가맹점 입점 신청 | 옹진관광 쿠폰</title>
  <style>
    .apply-hero {
      background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
      padding: 28px 20px;
      color: #fff;
      text-align: center;
    }
    .apply-hero h1 { font-size: 1.3rem; font-weight: 900; }
    .apply-hero p  { font-size: .85rem; opacity: .9; margin-top: 6px; }

    .apply-form {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .step-indicator {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 8px;
    }
    .step {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      transition: background .3s;
    }
    .step.done  { background: var(--success); }
    .step.active { background: var(--accent); }

    .required-mark { color: var(--danger); margin-left: 2px; }

    .info-box {
      background: #fef9c3;
      border: 1px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: .82rem;
      color: #92400e;
      line-height: 1.6;
    }

    .success-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      gap: 16px;
    }
    .success-screen .check { font-size: 4rem; }
    .success-screen h2 { font-size: 1.3rem; font-weight: 800; }
    .success-screen p  { font-size: .9rem; color: var(--text-secondary); }
  </style>
  <script type="module" crossorigin src="/assets/tourist-apply-cunx9Dlf.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BSX2ofZY.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button onclick="history.back()" style="padding:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <div class="logo" style="font-size:1rem;">가맹점 입점 신청</div>
    </header>

    <!-- 신청 폼 -->
    <div id="form-view">
      <div class="apply-hero">
        <div style="font-size:2.5rem;margin-bottom:8px;">🏪</div>
        <h1>옹진관광 쿠폰 가맹점</h1>
        <p>신청 후 관리자 승인 시 즉시 등록됩니다</p>
      </div>

      <div class="apply-form">
        <div class="info-box">
          ℹ️ 승인 완료 후 <strong>가맹점 로그인 페이지</strong>에서 휴대폰 번호 인증으로 바로 사용하실 수 있습니다.
        </div>

        <div class="form-group">
          <label class="form-label">상점명 <span class="required-mark">*</span></label>
          <input class="form-input" id="f-name" type="text" placeholder="예: 옹진 수산물 직판장" />
        </div>

        <div class="form-group">
          <label class="form-label">대표자 휴대폰 번호 <span class="required-mark">*</span></label>
          <input class="form-input" id="f-phone" type="tel" placeholder="01012345678"
            inputmode="numeric" maxlength="11" />
        </div>

        <div class="form-group">
          <label class="form-label">사업자등록번호</label>
          <input class="form-input" id="f-bno" type="text" placeholder="000-00-00000 (선택)" />
        </div>

        <div class="form-group">
          <label class="form-label">주소 <span class="required-mark">*</span></label>
          <input class="form-input" id="f-addr" type="text" placeholder="예: 인천 옹진군 백령면 ..." />
        </div>

        <div class="form-group">
          <label class="form-label">업종 카테고리</label>
          <select class="form-input" id="f-cat">
            <option value="">선택해 주세요</option>
            <option>음식점</option>
            <option>숙박</option>
            <option>수산물·농산물</option>
            <option>관광·레저</option>
            <option>쇼핑</option>
            <option>교통</option>
            <option>기타</option>
          </select>
        </div>

        <button class="btn btn-primary btn-full" id="btn-submit" style="margin-top:8px;">
          입점 신청하기
        </button>
      </div>
    </div>

    <!-- 성공 화면 -->
    <div id="success-view" class="hidden">
      <div class="success-screen">
        <div class="check">🎉</div>
        <h2>입점 신청 완료!</h2>
        <p>
          관리자 검토 후 승인 문자를 발송해 드립니다.<br>
          <strong>승인 후 가맹점 로그인 메뉴</strong>를 이용해 주세요.
        </p>
        <a href="/tourist/mypage.html" class="btn btn-primary btn-full" style="margin-top:16px;">
          내 쿠폰 지갑으로 이동
        </a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
