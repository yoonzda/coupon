  <style>
    .loading-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .loading-logo { font-size: 3rem; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .loading-text { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }
    .loading-bar {
      width: 200px; height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-bar::after {
      content: '';
      display: block;
      width: 60%;
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from{transform:translateX(-100%)} to{transform:translateX(200%)} }
  </style>
