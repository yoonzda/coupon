<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>로그인 처리 중 | 옹진관광 쿠폰</title>
  <style>
    .loading-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .loading-logo { font-size: 3rem; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    .loading-text { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }
    .loading-bar {
      width: 200px; height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-bar::after {
      content: '';
      display: block;
      width: 60%;
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      animation: slide 1s ease-in-out infinite alternate;
    }
    @keyframes slide { from{transform:translateX(-100%)} to{transform:translateX(200%)} }
  </style>
  <script type="module" crossorigin src="/assets/tourist-callback-Ba7yK0qR.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-Ba6NtGBQ.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <div class="loading-screen">
    <div class="loading-logo">🏝️</div>
    <p class="loading-text">로그인 처리 중...</p>
    <div class="loading-bar"></div>
  </div>

</body>
</html>
