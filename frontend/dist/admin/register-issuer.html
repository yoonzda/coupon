<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발행처 등록 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a !important;
    }
    .back-link svg {
      transition: transform 0.2s;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-register-issuer-Br3k7EhA.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-BQDM6Pi8.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BSX2ofZY.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Issuer Management</span>
          <h1>발행처 관리</h1>
          <p class="header-desc">발행처(안내소 등) 계정을 생성하고, 각 발행처별 배정할 쿠폰 액면가와 총 한도 수량을 제어합니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="issuers.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            뒤로가기
          </a>
        </div>
        <h2 class="page-subtitle">발행처 등록</h2>
      </div>

      <div class="form-container">
        
        <form id="form-create-issuer" onsubmit="createIssuer(event)">
          <div class="form-group">
            <label for="issuer-name">발행처 명칭</label>
            <input type="text" id="issuer-name" placeholder="예: 인천항 연안여객터미널 안내소" required />
          </div>
          <div class="form-group">
            <label for="issuer-username">로그인 아이디</label>
            <input type="text" id="issuer-username" placeholder="영문, 숫자 5자 이상" required />
          </div>
          <div class="form-group">
            <label for="issuer-password">로그인 비밀번호</label>
            <input type="password" id="issuer-password" placeholder="비밀번호 설정" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-neutral btn-sm" style="height: 42px; padding: 0 24px; border-radius: 6px; font-weight: 600; cursor: pointer;">등록하기</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

</body>
</html>
