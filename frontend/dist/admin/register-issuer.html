<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발행처 등록 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #0f172a !important;
    }
    .back-link svg {
      transition: transform 0.2s;
    }
    .back-link:hover svg {
      transform: translateX(-4px);
    }

    /* 등록 버튼 호버 효과 (떠오르지 않고 색상 변화) */
    .btn-register-submit {
      height: 42px;
      padding: 0 24px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      background: #0f172a;
      color: #fff;
      border: none;
      transition: background-color 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-register-submit:hover {
      background: #1e293b;
      opacity: 0.95;
      box-shadow: 0 0 10px rgba(15, 23, 42, 0.15);
    }
    .btn-register-submit:active {
      background: #0f172a;
    }

    /* Password visibility toggle styles */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px !important;
    }
    .pw-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle-btn:hover svg {
      stroke: #1e293b;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-register-issuer-BXuDyR-l.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-yYhXsohp.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-D2w6DInN.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BUpdExfZ.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Issuer Management</span>
          <h1>발행처 관리</h1>
          <p class="header-desc">발행처 계정을 생성하고 발행처를 등록하고 관리합니다. 각 발행처의 쿠폰 현황을 확인할 수 있습니다.</p>
        </div>
      </header>

      <div class="subpage-title-area">
        <div class="back-link-container">
          <a href="issuers.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
            뒤로가기
          </a>
        </div>
        <h2 class="page-subtitle">발행처 등록</h2>
      </div>

      <div class="form-container">
        
        <form id="form-create-issuer" onsubmit="createIssuer(event)">
          <div class="form-group">
            <label for="issuer-name">기관명</label>
            <input type="text" id="issuer-name" placeholder="" required />
          </div>
          <div class="form-group">
            <label for="issuer-username">아이디</label>
            <input type="text" id="issuer-username" placeholder="등록 후 아이디는 변경할 수 없습니다." required />
          </div>
          <div class="form-group">
            <label for="issuer-password">비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="issuer-password" placeholder="비밀번호 설정" required />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-1" aria-label="비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="issuer-password-confirm">비밀번호 확인</label>
            <div class="password-wrapper">
              <input type="password" id="issuer-password-confirm" placeholder="비밀번호 재입력" required />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-2" aria-label="비밀번호 확인 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-register-submit">등록하기</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

</body>
</html>
