<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }

    /* 통계 카드 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #fff;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }
    .stat-value { font-size: 1.8rem; font-weight: 900; color: var(--text-primary); }
    .stat-trend { font-size: 0.75rem; margin-top: 4px; }
    .trend-up { color: var(--success); }

    /* 데이터 테이블 */
    .admin-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table th {
      background: var(--surface-2);
      padding: 12px 24px;
      text-align: left;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    .admin-table td {
      padding: 16px 24px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }
    .admin-table tr:hover { background: var(--surface-2); }
  </style>
  <script type="module" crossorigin src="/assets/admin-index-CD3s8-y_.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-BQDM6Pi8.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BSX2ofZY.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Dashboard</span>
          <h1>대시보드</h1>
          <p class="header-desc">실시간 쿠폰 발행 및 결제 데이터를 확인합니다.</p>
        </div>
      </header>

      <!-- 통계 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_total_amount">금월 누적 결제액</div>
          <div class="stat-value" id="stat-total-amount">₩0</div>
          <div class="stat-trend" id="stat-tx-count" style="color: var(--text-muted); font-size:0.8rem;">결제 0건</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_users">가입 관광객</div>
          <div class="stat-value" id="stat-users">0</div>
          <div class="stat-trend" style="color: var(--text-muted); font-size:0.8rem;">누적 회원</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_merchants">승인 가맹점</div>
          <div class="stat-value" id="stat-merchants">0</div>
          <div class="stat-trend" id="stat-pending" style="color: var(--text-muted); font-size:0.8rem;">대기 0곳</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">발행 쿠폰 / 사용</div>
          <div class="stat-value" id="stat-coupon-issued">0</div>
          <div class="stat-trend" id="stat-coupon-rate" style="color: #10b981; font-size:0.8rem;">사용률 0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_fds">FDS 미해결 알림</div>
          <div class="stat-value" style="color: var(--danger);" id="stat-fds">0</div>
          <div class="stat-trend" style="color: var(--text-muted); font-size:0.8rem;">이상거래 탐지</div>
        </div>
      </div>

      <!-- 최근 FDS 알림 -->
      <div class="admin-card">
        <div class="card-header">
          <div class="card-title" data-i18n="fds_recent_title">️ 최근 이상거래 의심 내역 (FDS)</div>
          <a href="/admin/fds.html" class="btn btn-neutral-outline" data-i18n="btn_view_all" style="padding: 6px 12px; font-size: 0.8rem;">전체보기</a>
        </div>
        <table class="admin-table">
          <thead>
            <tr>
              <th data-i18n="th_date">탐지 일시</th>
              <th data-i18n="th_merchant">가맹점</th>
              <th data-i18n="th_user">사용자</th>
              <th data-i18n="th_rule">탐지 규칙</th>
              <th data-i18n="th_status">상태</th>
            </tr>
          </thead>
          <tbody id="fds-recent-list">
            <!-- JS로 렌더링 -->
            <tr><td colspan="5" class="text-center" style="padding: 40px; color: var(--text-muted);">데이터를 불러오고 있습니다...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</body>
</html>
