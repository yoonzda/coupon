<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="옹진 관광쿠폰">
  <meta property="og:description" content="옹진군 관광객을 위한 디지털 쿠폰 서비스 — 옹진 관광쿠폰으로 더 알뜰한 옹진 여행">
  <meta property="og:image" content="https://ongjincoupon.kr/og-image.png?v=20261007">
  <meta property="og:locale" content="ko_KR">
  <title>회원 상세 정보 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  
  <style>
    /* ── 상단 요약 정보 바 ── */
    .info-summary-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 1024px) {
      .info-summary-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .info-summary-bar { grid-template-columns: 1fr; }
    }
    .summary-block {
      background: #ffffff;
      border: 1px solid var(--adm-border, #e2e8f0);
      border-radius: var(--adm-radius-sm, 4px);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
      box-shadow: var(--adm-shadow-sm, 0 1px 2px rgba(0,0,0,0.05));
    }
    .summary-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--adm-text-sub, #64748b);
      margin-bottom: 6px;
    }
    .summary-val {
      font-size: 17px;
      font-weight: 700;
      color: var(--adm-text-main, #0f172a);
      display: flex;
      align-items: baseline;
      gap: 6px;
      word-break: break-all;
    }
    .summary-sub {
      font-size: 12px;
      color: var(--adm-text-sub, #64748b);
      margin-top: 5px;
    }

    /* ── 메인 탭 네비게이션 ── */
    .stats-tab-bar {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--adm-border, #e2e8f0);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .stats-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--adm-text-sub, #64748b);
      background: #ffffff;
      border: 1px solid var(--adm-border, #cbd5e1);
      border-radius: var(--adm-radius-sm, 4px);
      cursor: pointer;
      transition: all 0.15s ease;
      box-sizing: border-box;
    }
    .stats-tab-btn:hover {
      background: var(--adm-surface-sub, #f8fafc);
      color: var(--adm-text-main, #0f172a);
      border-color: #94a3b8;
    }
    .stats-tab-btn.active {
      background: var(--adm-primary, #0284c7);
      color: #ffffff;
      border-color: var(--adm-primary, #0284c7);
    }
    .stats-tab-btn svg {
      width: 17px;
      height: 17px;
    }

    /* ── 서브 탭 필터 ── */
    .filter-tabs-container {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 18px;
    }
    .filter-tab-pill {
      height: 32px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--adm-text-main, #0f172a);
      border: 1px solid var(--adm-border, #cbd5e1);
      border-radius: var(--adm-radius-sm, 4px);
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .filter-tab-pill:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .filter-tab-pill.active {
      background: var(--adm-primary, #0284c7);
      color: #ffffff;
      border-color: var(--adm-primary, #0284c7);
      font-weight: 600;
    }
    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      background: #e2e8f0;
      color: #475569;
    }
    .filter-tab-pill.active .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* ── 쿠폰 카드 목록 ── */
    .coupon-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .coupon-card {
      background: #ffffff;
      border: 1px solid var(--adm-border, #e2e8f0);
      border-radius: var(--adm-radius-sm, 4px);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--adm-shadow-sm, 0 1px 2px rgba(0,0,0,0.05));
      transition: border-color 0.15s ease;
      box-sizing: border-box;
    }
    .coupon-card:hover {
      border-color: #94a3b8;
    }
    .coupon-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
    }
    .badge-available {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .badge-used {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .badge-expired {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .badge-cancelled {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
    }
    .coupon-amount {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--adm-text-main, #0f172a);
    }
    .coupon-card-divider {
      border-top: 1px dashed var(--adm-border, #e2e8f0);
      margin: 2px 0;
    }
    .coupon-card-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .coupon-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }
    .info-label {
      color: var(--adm-text-sub, #64748b);
      font-weight: 500;
    }
    .info-value {
      color: var(--adm-text-main, #0f172a);
      font-weight: 600;
    }
    .info-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .info-section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--adm-text-sub, #64748b);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .info-section-divider {
      border-top: 1px solid #f1f5f9;
      margin: 2px 0;
    }
    .card-placeholder {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px;
      color: var(--adm-text-sub, #64748b);
      font-size: 13px;
      background: #ffffff;
      border: 1px dashed var(--adm-border, #cbd5e1);
      border-radius: var(--adm-radius-sm, 4px);
    }

    /* ── 테이블 카드 디자인 ── */
    .admin-card {
      background: #ffffff;
      border: 1px solid var(--adm-border, #e2e8f0);
      border-radius: var(--adm-radius-sm, 4px);
      box-sizing: border-box;
      overflow: hidden;
      box-shadow: var(--adm-shadow-sm, 0 1px 2px rgba(0,0,0,0.05));
    }
    .table-scroll-container {
      width: 100%;
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .admin-table th {
      background: #f8fafc;
      padding: 12px 16px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--adm-text-sub, #64748b);
      border-bottom: 1px solid var(--adm-border, #e2e8f0);
      white-space: nowrap;
      text-align: center;
    }
    .admin-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--adm-border, #e2e8f0);
      font-size: 13px;
      vertical-align: middle;
      color: var(--adm-text-main, #0f172a);
      text-align: center;
    }
    .admin-table th:first-child,
    .admin-table td:first-child {
      text-align: left !important;
      padding-left: 20px !important;
    }
    .table-placeholder {
      text-align: center;
      padding: 36px;
      color: var(--adm-text-sub, #64748b);
      font-size: 13px;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-detail-user-Blv36z8Z.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-DxYVQPuN.js">
  <link rel="stylesheet" crossorigin href="/assets/main-03q0TmgI.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header" style="justify-content: space-between; align-items: center; text-align: left;">
        <div class="header-title-area" style="text-align: left; align-items: flex-start;">
          <h1 style="text-align: left; margin: 0;">회원 상세 정보</h1>
          <p class="header-desc" style="text-align: left; margin: 4px 0 0 0;">일반 관광객 회원의 계정 상세 정보, 보유 쿠폰 및 실시간 접속 기록을 확인하고 관리합니다.</p>
        </div>
        <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
          <a href="users.html" class="btn btn-secondary" title="회원 목록으로 돌아가기">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
            <span>목록으로</span>
          </a>
          <button type="button" class="btn btn-secondary" id="btn-refresh-user" onclick="window.init(true)" title="회원 상세 정보 새로고침">
            <span>새로고침</span>
          </button>
          <div id="user-action-area" style="display: inline-flex;">
            <!-- 탈퇴 또는 복구 버튼이 동적 주입됩니다 -->
          </div>
        </div>
      </header>

      <!-- 프로필 정보 요약 (6개 주요 지표 그리드) -->
      <div class="info-summary-bar">
        <!-- 회원 식별 -->
        <div class="summary-block">
          <div class="summary-label">회원 식별 (닉네임 / 소셜 계정)</div>
          <div class="summary-val" id="profile-name">-</div>
          <div class="summary-sub" id="profile-sub">-</div>
        </div>

        <!-- 계정 상태 -->
        <div class="summary-block">
          <div class="summary-label">계정 상태</div>
          <div class="summary-val" id="profile-status">-</div>
          <div class="summary-sub" id="profile-status-desc"></div>
        </div>

        <!-- 남은 쿠폰 잔액 -->
        <div class="summary-block">
          <div class="summary-label">남은 쿠폰 잔액</div>
          <div class="summary-val" id="profile-coupon-balance" style="color: var(--adm-primary, #0284c7);">-</div>
          <div class="summary-sub" id="profile-coupon-summary">-</div>
        </div>

        <!-- 최근 접속 일시 -->
        <div class="summary-block">
          <div class="summary-label">최근 접속 일시</div>
          <div class="summary-val" id="profile-last-login">-</div>
          <div class="summary-sub">최근 온라인 세션 기록</div>
        </div>

        <!-- 최근 접속 IP / 누적 횟수 -->
        <div class="summary-block">
          <div class="summary-label">접속 IP / 누적 접속 횟수</div>
          <div class="summary-val" id="profile-last-ip">-</div>
          <div class="summary-sub">부정 접속 및 중복 확인용</div>
        </div>

        <!-- 가입 일시 -->
        <div class="summary-block">
          <div class="summary-label">가입 일시</div>
          <div class="summary-val" id="profile-regdate">-</div>
          <div class="summary-sub">최초 계정 등록 시점</div>
        </div>
      </div>

      <!-- 메인 탭 (쿠폰 내역 vs 접속 기록 로그) -->
      <nav class="stats-tab-bar">
        <button type="button" class="stats-tab-btn active" id="main-tab-coupons" onclick="window.switchMainTab('coupons')">
          <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 010 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 010-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
          </svg>
          보유 쿠폰 내역 (<span id="main-coupons-count">0</span>)
        </button>
        <button type="button" class="stats-tab-btn" id="main-tab-logs" onclick="window.switchMainTab('logs')">
          <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          접속 기록 로그 (<span id="main-logs-count">0</span>)
        </button>
      </nav>

      <!-- ── 섹션 1: 쿠폰 내역 ── -->
      <div id="section-coupons">
        <!-- 3탭 버튼 영역 (단정화된 사각 필터) -->
        <div class="filter-tabs-container">
          <button type="button" class="filter-tab-pill active" id="tab-btn-available" onclick="window.switchCouponTab('available')">
            사용 가능 <span class="tab-badge" id="count-available">0</span>
          </button>
          <button type="button" class="filter-tab-pill" id="tab-btn-used" onclick="window.switchCouponTab('used')">
            사용 완료 <span class="tab-badge" id="count-used">0</span>
          </button>
          <button type="button" class="filter-tab-pill" id="tab-btn-expired" onclick="window.switchCouponTab('expired')">
            만료 / 취소 <span class="tab-badge" id="count-expired">0</span>
          </button>
        </div>

        <!-- 쿠폰 카드 목록 -->
        <div class="coupon-cards-grid" id="couponsCardContainer">
          <div class="card-placeholder">쿠폰 내역이 로드되는 중입니다...</div>
        </div>
      </div>

      <!-- ── 섹션 2: 접속 기록 로그 ── -->
      <div id="section-logs" style="display: none;">
        <div class="admin-card">
          <div class="table-scroll-container">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width: 25%;">접속 일시</th>
                  <th style="width: 18%;">로그인 수단</th>
                  <th style="width: 22%;">접속 IP 주소</th>
                  <th style="width: 35%;">접속 환경 (기기 / 브라우저)</th>
                </tr>
              </thead>
              <tbody id="loginLogsTableBody">
                <tr><td colspan="4" class="table-placeholder">접속 로그를 불러오는 중입니다...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

</body>
</html>
