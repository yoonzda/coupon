<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예산 관리 | 옹진 관광 관리자</title>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: var(--bg);
      color: var(--text-primary); 
    }

    /* 통합 예산 디자인 (한 줄 구성 및 박스 제거) */
    .dashboard-budget-card {
      background: transparent;
      border: none;
      padding: 16px 0;
      box-shadow: none;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
    }

    /* 모달 레이아웃 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-container {
      background: var(--surface); border-radius: var(--radius); width: 440px; max-width: 90%;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transform: translateY(20px); transition: transform 0.25s ease; overflow: hidden;
    }
    .modal-overlay.active .modal-container { transform: translateY(0); }
    
    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
    .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; line-height: 1; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }

    /* 등록 & 수정 폼 스타일 (쿠폰 배정 페이지 스타일 준수) */
    .form-group {
      width: 100%;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-group input {
      width: 100%;
      padding: 10px 36px 10px 14px !important;
      text-align: right; /* 금액 인풋 우측 정렬 */
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem; /* 표준 글씨 크기 */
      font-weight: 600;
      height: 42px; /* 표준 높이 */
      outline: none;
      transition: all var(--dur) var(--ease);
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .input-group input:focus {
      border-color: var(--info);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .input-group .input-unit {
      position: absolute;
      right: 16px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 600;
      pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-budget-CYiMTU1a.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BrJ7NzZM.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-xv3IhYox.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Coupon Management</span>
          <h1>예산 관리</h1>
          <p class="header-desc">플랫폼 확보 예산의 전체 설정 금액을 확인하고 등록 및 수정합니다.</p>
        </div>
      </header>

      <!-- 테이블 조작 버튼 영역 -->
      <div class="table-actions-bar" id="budget-actions-bar" style="display: flex; gap: 12px; align-items: center; margin-bottom: 24px; justify-content: flex-start;">
        <button class="btn btn-neutral btn-sm" id="btn-action-trigger" onclick="enterEditMode()" style="height: 38px; display: inline-flex; align-items: center;">예산 금액 수정</button>
      </div>

      <div class="budget-container" style="max-width: 100%; margin: 0;">
        <!-- 예산 실시간 회계 관리 카드 -->
        <div class="dashboard-budget-card" id="budget-card">
          <!-- [조회 모드] -->
          <div id="view-mode" style="width: 100%; display: block;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; width: 100%;">
              <div style="background: #ffffff; border: 1.5px solid #e2e8f0; padding: 18px;">
                <div style="font-size: 0.82rem; font-weight: 600; color: #475569;">① 총 사업 예산</div>
                <div id="display-total-budget" style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
                <div style="font-size: 0.75rem; color: #64748b; margin-top: 2px;">전체 설정 예산</div>
              </div>
              <div style="background: #f0fdf4; border: 1.5px solid #bbf7d0; padding: 18px;">
                <div style="font-size: 0.82rem; font-weight: 700; color: #166534;">② 발행처 배정 예산</div>
                <div id="display-allocated-budget" style="font-size: 1.5rem; font-weight: 800; color: #15803d; margin-top: 4px;">—</div>
                <div style="font-size: 0.75rem; color: #166534; margin-top: 2px;">발행처에 배정 완료된 쿠폰액</div>
              </div>
              <div style="background: #faf5ff; border: 1.5px solid #e9d5ff; padding: 18px;">
                <div style="font-size: 0.82rem; font-weight: 700; color: #6b21a8;">③ 실제 집행 예산 (지출)</div>
                <div id="display-executed-budget" style="font-size: 1.5rem; font-weight: 800; color: #7e22ce; margin-top: 4px;">—</div>
                <div style="font-size: 0.75rem; color: #6b21a8; margin-top: 2px;">3단계 가맹점 할인 사용액</div>
              </div>
              <div style="background: #fffbeb; border: 1.5px solid #fde68a; padding: 18px;">
                <div style="font-size: 0.82rem; font-weight: 700; color: #92400e;">④ 점유/예약 예산 (대기)</div>
                <div id="display-reserved-budget" style="font-size: 1.5rem; font-weight: 800; color: #b45309; margin-top: 4px;">—</div>
                <div style="font-size: 0.75rem; color: #92400e; margin-top: 2px;">1·2단계 사용 대기 묶임 금액</div>
              </div>
              <div style="background: #eff6ff; border: 1.5px solid #bfdbfe; padding: 18px;">
                <div style="font-size: 0.82rem; font-weight: 700; color: #1e40af;">⑤ 추가 배정 가능 잔액</div>
                <div id="display-remaining-budget" style="font-size: 1.5rem; font-weight: 800; color: #1d4ed8; margin-top: 4px;">—</div>
                <div style="font-size: 0.75rem; color: #1e40af; margin-top: 2px;">발행처 추가 배정 가능 가용 잔액</div>
              </div>
            </div>
          </div>
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>발행 금액 :</span>
                <span id="display-issued-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
              <div style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px;">
                <span>정산 금액 :</span>
                <span id="display-used-budget" style="font-family: 'Inter', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 예산 등록/수정 모달 팝업 -->
  <div class="modal-overlay" id="budget-modal">
    <div class="modal-container">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">예산 금액 수정</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form onsubmit="saveBudget(event)">
        <div class="modal-body">
          <div class="form-group" style="position: relative;">
            <div class="input-group">
              <input type="text" id="input-total-budget" placeholder="0" required />
              <span class="input-unit">원</span>
            </div>
            <div id="error-message-area" style="color: var(--danger); font-size: 0.82rem; margin-top: 6px; text-align: left; display: none; font-weight: 500; line-height: 1.4; word-break: keep-all;"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" id="btn-submit-action" class="btn btn-primary" style="height: 40px; font-weight: 600; font-size: 0.9rem; border-radius: 6px;">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
