<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자월도 가맹점 비밀번호 관리</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Pretendard 공식 CDN 웹폰트 지정 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --text: #111827;
      --text-sub: #6b7280;
      --border: #e5e7eb;
      --border-dark: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* radius 전면 제거 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 폰트 지정 및 텍스트 렌더링 최적화 */
    body, input, button, a {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: #ffffff;
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 60px;
    }

    /* Top Header: 색상 부여 (단정한 다크 슬레이트), 타이틀 굵기 없음 */
    header.header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1e293b; /* 헤더에 색상 적용 */
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #0f172a;
    }

    .header-left {
      min-width: 0;
    }

    /* 타이틀 글씨 굵기 없음 */
    header h1 {
      font-size: 1.2rem;
      font-weight: 400; /* 굵기 제거 */
      letter-spacing: -0.3px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 아이콘 없이 텍스트만 깔끔한 로그인 페이지 버튼 */
    .btn-merchant-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      padding: 8px 14px;
      border: 1px solid #475569;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-merchant-link:hover {
      background: #475569;
    }
    .btn-merchant-link:active {
      background: #1e293b;
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-refresh:active {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Main Container */
    .container {
      width: 100%;
      padding: 18px 20px;
      background: #ffffff;
    }

    /* Search Bar */
    .search-wrap {
      margin-bottom: 18px;
    }

    .search-input {
      width: 100%;
      height: 48px;
      background: #ffffff;
      border: 1px solid var(--border-dark);
      padding: 0 16px;
      font-size: 1.05rem;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: #111827;
    }

    /* Clean Line-Separated List */
    .merchant-list-wrap {
      background: #ffffff;
      border-top: 1px solid var(--border);
    }

    .merchant-row {
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .row-content {
      padding: 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* Store Info (Line by Line with Clear Labels) */
    .store-details {
      flex: 1;
      min-width: 0;
    }

    /* 가게 이름: 강조 및 폰트 크기 확대 + 네이버 지도 링크 연동 */
    .store-title-link {
      display: inline-block;
      font-size: 1.45rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
      text-decoration: none;
      transition: color 0.15s ease;
      cursor: pointer;
    }
    .store-title-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }
    .store-title-link:active {
      color: #1d4ed8;
    }

    .store-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meta-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.98rem;
      line-height: 1.4;
    }

    .meta-label {
      color: var(--text-sub);
      font-size: 0.92rem;
      font-weight: 500;
      width: 50px;
      flex-shrink: 0;
    }

    .meta-value {
      color: #1f2937;
      font-weight: 500;
      word-break: break-all;
    }

    .meta-value.val-id {
      color: #1d4ed8;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* Action Buttons (Radius 0, Clean Flat) */
    .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-reset {
      height: 42px;
      padding: 0 16px;
      background: #f3f4f6;
      border: 1px solid var(--border-dark);
      color: #1f2937;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-reset:active {
      background: #e5e7eb;
    }

    .btn-change {
      height: 42px;
      padding: 0 18px;
      background: #111827;
      border: 1px solid #111827;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-change:active {
      background: #374151;
    }

    /* Slide-down Change Password Row */
    .change-panel {
      display: none;
      background: #fafafa;
      border-top: 1px solid var(--border);
      padding: 14px 10px;
    }

    .change-panel.active {
      display: block;
    }

    .change-form-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .change-form-row input {
      flex: 1;
      height: 44px;
      background: #ffffff;
      border: 1px solid #9ca3af;
      padding: 0 14px;
      font-size: 1rem;
      color: #000;
      outline: none;
    }

    .change-form-row input:focus {
      border-color: #111827;
    }

    .btn-confirm {
      height: 44px;
      padding: 0 20px;
      background: #111827;
      border: 1px solid #111827;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-confirm:active {
      background: #374151;
    }

    .btn-cancel {
      height: 44px;
      padding: 0 16px;
      background: #ffffff;
      border: 1px solid var(--border-dark);
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-cancel:active {
      background: #f3f4f6;
    }

    /* Login Modal */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #111827;
      padding: 24px 20px;
    }

    .login-box h2 {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 6px;
      text-align: center;
    }

    .login-box p {
      font-size: 0.88rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 16px;
    }

    .login-box input {
      width: 100%;
      height: 46px;
      background: #ffffff;
      border: 1px solid var(--border-dark);
      padding: 0 12px;
      margin-bottom: 12px;
      font-size: 1rem;
      outline: none;
    }

    .login-box input:focus {
      border-color: #111827;
    }

    .login-box button {
      width: 100%;
      height: 46px;
      background: #111827;
      color: #fff;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .loading-text, .empty-text {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Top Header with Color -->
  <header class="header">
    <div class="header-left">
      <h1>자월도 가맹점 비밀번호 관리</h1>
    </div>
    <div class="header-actions">
      <a href="/merchant/login.html" target="_blank" rel="noopener noreferrer" class="btn-merchant-link">로그인 페이지</a>
      <button type="button" class="btn-refresh" onclick="loadMerchants()">새로고침</button>
    </div>
  </header>

  <!-- Container -->
  <div class="container">
    <!-- Search Bar -->
    <div class="search-wrap">
      <input type="text" id="input-search" class="search-input" placeholder="가게 이름, 아이디, 연락처 검색..." oninput="handleSearch(this.value)" />
    </div>

    <!-- Line-Separated Merchant List -->
    <div class="merchant-list-wrap" id="merchants-container">
      <div class="loading-text">목록을 불러오는 중입니다...</div>
    </div>
  </div>

  <!-- Admin Login Overlay -->
  <div class="login-overlay" id="login-modal" style="display: none;">
    <div class="login-box">
      <h2>관리자 인증</h2>
      <p>가맹점 비밀번호 관리를 위해 관리자 로그인이 필요합니다.</p>
      <form onsubmit="handleLogin(event)">
        <input type="text" id="login-id" placeholder="관리자 아이디 (예: admin)" required autofocus />
        <input type="password" id="login-pw" placeholder="비밀번호" required />
        <button type="submit" id="btn-login-submit">로그인 후 시작</button>
      </form>
    </div>
  </div>

  <script>
    let allMerchants = [];

    // 네이버 지도 링크 매핑 사전
    const NAVER_MAP_MAP = {
      '엘림하우스': 'https://naver.me/5bVJMDb2',
      '자월식당': 'https://naver.me/FqZbQ6qs',
      '장골슈퍼': 'https://naver.me/FfBiWCDW',
      '장골수퍼': 'https://naver.me/FfBiWCDW',
      '장골식당': 'https://naver.me/x7nxAYD8',
      '하나펜션민박': 'https://naver.me/5qcCSyNv',
      '소망민박': 'https://naver.me/GI3VUjcV',
      '저녁노을펜션민박': 'https://naver.me/GVEWnb8X',
      '미란네 식당': 'https://naver.me/5XJRTM4q',
      '미란네식당': 'https://naver.me/5XJRTM4q',
      '옛날짜장': 'https://naver.me/GoDjAsfc',
      '온비치422': 'https://naver.me/5RhIAPF2',
      '자월담': 'https://naver.me/GCJhQCkQ'
    };

    function getToken() {
      return localStorage.getItem('ongjin_admin_token') || sessionStorage.getItem('ongjin_admin_token') || '';
    }

    function setToken(token) {
      localStorage.setItem('ongjin_admin_token', token);
      sessionStorage.setItem('ongjin_admin_token', token);
    }

    // Load Merchants List
    async function loadMerchants() {
      const token = getToken();
      if (!token) {
        document.getElementById('login-modal').style.display = 'flex';
        return;
      }

      const container = document.getElementById('merchants-container');
      container.innerHTML = '<div class="loading-text">목록을 불러오는 중입니다...</div>';

      try {
        const res = await fetch('/api/admin/jawol-merchants', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('ongjin_admin_token');
          sessionStorage.removeItem('ongjin_admin_token');
          document.getElementById('login-modal').style.display = 'flex';
          return;
        }

        const json = await res.json();
        if (!json.success) throw new Error(json.message || '목록 조회 실패');

        allMerchants = json.data || [];
        renderList(allMerchants);
      } catch (err) {
        container.innerHTML = `<div class="empty-text" style="color:#ef4444;">오류 발생: ${err.message}</div>`;
      }
    }

    // Render List (가게 이름 링크 클릭 시 네이버 지도로 이동)
    function renderList(list) {
      const container = document.getElementById('merchants-container');

      if (list.length === 0) {
        container.innerHTML = '<div class="empty-text">검색 결과가 없습니다.</div>';
        return;
      }

      container.innerHTML = list.map(m => {
        const username = m.username || '미부여';
        const phone = m.phone ? m.phone : '-';
        const owner = m.owner_name ? m.owner_name : '-';
        
        // 매핑된 네이버 지도 링크 확인
        const cleanName = (m.name || '').trim();
        const naverUrl = NAVER_MAP_MAP[cleanName] || NAVER_MAP_MAP[cleanName.replace(/\s+/g, '')] || `https://map.naver.com/v5/search/${encodeURIComponent(m.name)}`;

        return `
          <div class="merchant-row" id="row-${m.id}">
            <div class="row-content">
              <div class="store-details">
                <a href="${naverUrl}" target="_blank" rel="noopener noreferrer" class="store-title-link" title="네이버 지도에서 열기">
                  ${m.name}
                </a>
                <div class="store-meta">
                  <div class="meta-line">
                    <span class="meta-label">아이디</span>
                    <span class="meta-value val-id">${username}</span>
                  </div>
                  <div class="meta-line">
                    <span class="meta-label">연락처</span>
                    <span class="meta-value">${phone}</span>
                  </div>
                  <div class="meta-line">
                    <span class="meta-label">대표자</span>
                    <span class="meta-value">${owner}</span>
                  </div>
                </div>
              </div>

              <div class="row-actions">
                <button type="button" class="btn-reset" onclick="handleReset('${m.id}', '${m.name}')">초기화</button>
                <button type="button" class="btn-change" onclick="toggleChangePanel('${m.id}')">변경</button>
              </div>
            </div>

            <!-- Slide down Change Password Row -->
            <div class="change-panel" id="panel-${m.id}">
              <div class="change-form-row">
                <input type="text" id="input-pw-${m.id}" placeholder="새 비밀번호 입력 (4자 이상)" onkeydown="if(event.key==='Enter') submitChange('${m.id}', '${m.name}')" />
                <button type="button" class="btn-confirm" onclick="submitChange('${m.id}', '${m.name}')">확인</button>
                <button type="button" class="btn-cancel" onclick="toggleChangePanel('${m.id}')">취소</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Toggle Change Password Panel
    window.toggleChangePanel = function(id) {
      const panel = document.getElementById(`panel-${id}`);
      if (!panel) return;

      const isOpening = !panel.classList.contains('active');

      // Close all other open panels
      document.querySelectorAll('.change-panel.active').forEach(p => {
        if (p.id !== `panel-${id}`) p.classList.remove('active');
      });

      if (isOpening) {
        panel.classList.add('active');
        const input = document.getElementById(`input-pw-${id}`);
        if (input) {
          input.value = '';
          input.focus();
        }
      } else {
        panel.classList.remove('active');
      }
    };

    // 1. Reset Handler: Reset specifically to '0000'
    window.handleReset = async function(id, name) {
      const resetPw = '0000';
      
      const ok = confirm(`'${name}' 가맹점의 비밀번호를 기본값 '0000'(으)로 초기화하시겠습니까?`);
      if (!ok) return;

      const token = getToken();
      try {
        const res = await fetch(`/api/admin/jawol-merchants/${id}/password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ password: resetPw })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '초기화 실패');

        alert(`'${name}' 비밀번호가 '0000'(으)로 초기화되었습니다.`);
      } catch (err) {
        alert(`오류: ${err.message}`);
      }
    };

    // 2. Change Handler: Apply Custom Password
    window.submitChange = async function(id, name) {
      const input = document.getElementById(`input-pw-${id}`);
      const newPw = input ? input.value.trim() : '';

      if (!newPw) {
        alert('변경할 새 비밀번호를 입력해주세요.');
        input && input.focus();
        return;
      }
      if (newPw.length < 4) {
        alert('비밀번호는 최소 4자리 이상이어야 합니다.');
        input && input.focus();
        return;
      }

      const ok = confirm(`'${name}' 가맹점의 비밀번호를 '${newPw}'(으)로 변경하시겠습니까?`);
      if (!ok) return;

      const token = getToken();
      try {
        const res = await fetch(`/api/admin/jawol-merchants/${id}/password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ password: newPw })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '변경 실패');

        alert(`'${name}' 비밀번호가 성공적으로 변경되었습니다.`);
        
        // Hide panel
        const panel = document.getElementById(`panel-${id}`);
        if (panel) panel.classList.remove('active');
        if (input) input.value = '';
      } catch (err) {
        alert(`오류: ${err.message}`);
      }
    };

    // Search Filter
    window.handleSearch = function(query) {
      const q = (query || '').toLowerCase().trim();
      if (!q) {
        renderList(allMerchants);
        return;
      }
      const filtered = allMerchants.filter(m => {
        return (m.name || '').toLowerCase().includes(q) ||
               (m.username || '').toLowerCase().includes(q) ||
               (m.phone || '').includes(q) ||
               (m.owner_name || '').toLowerCase().includes(q);
      });
      renderList(filtered);
    };

    // Login Handler
    window.handleLogin = async function(e) {
      e.preventDefault();
      const username = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pw').value;
      const btn = document.getElementById('btn-login-submit');

      if (!username || !password) {
        alert('아이디와 비밀번호를 모두 입력해주세요.');
        return;
      }

      btn.disabled = true;
      btn.textContent = '인증 중...';

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '로그인 실패');

        setToken(data.token);
        document.getElementById('login-modal').style.display = 'none';
        loadMerchants();
      } catch (err) {
        alert(`로그인 실패: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '로그인 후 시작';
      }
    };

    // Auto-run on load
    loadMerchants();
  </script>
</body>
</html>
