<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="옹진 관광쿠폰">
  <meta property="og:description" content="옹진군 관광객을 위한 디지털 쿠폰 서비스 — 옹진 관광쿠폰으로 더 알뜰한 옹진 여행">
  <meta property="og:image" content="https://ongjincoupon.kr/og-image.png?v=20261007">
  <meta property="og:locale" content="ko_KR">
  <title>회원 계정 관리 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  
  <style>
    :root {
      --adm-primary: #0284c7;
      --adm-primary-hover: #0369a1;
      --adm-surface: #ffffff;
      --adm-bg: #f5f6f8;
      --adm-border: #e5e7eb;
      --adm-border-dark: #d1d5db;
      --adm-text-main: #202938;
      --adm-text-sub: #667085;
      --adm-success: #15803d;
      --adm-warning: #b45309;
      --adm-danger: #b91c1c;
      --adm-radius-sm: 4px;
      --adm-radius-md: 6px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    body { 
      margin: 0 !important; 
      padding: 0 !important; 
      width: 100% !important; 
      max-width: none !important; 
      background: var(--adm-bg);
      color: var(--adm-text-main); 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* ── 공통 헤더 ── */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header-title-area h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--adm-text-main);
      margin: 0 0 4px 0;
      letter-spacing: -0.3px;
    }
    .header-desc {
      font-size: 13.5px;
      color: var(--adm-text-sub);
      margin: 0;
    }

    /* ── 공통 버튼 ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--adm-radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      box-sizing: border-box;
      white-space: nowrap;
      line-height: 1;
      text-decoration: none;
    }
    .btn-secondary {
      background: #ffffff;
      color: #475569;
      border-color: var(--adm-border-dark);
    }
    .btn-secondary:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .btn-guide-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--adm-radius-sm);
      border: 1px solid var(--adm-border-dark);
      background: #ffffff;
      color: var(--adm-text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .btn-guide-action:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn-action-view {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 28px !important;
      padding: 0 10px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      border-radius: var(--adm-radius-sm) !important;
      border: 1px solid var(--adm-border-dark) !important;
      background: #ffffff !important;
      color: var(--adm-text-main) !important;
      cursor: pointer !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
      transition: all 0.15s ease !important;
    }
    .btn-action-view:hover {
      background: #f8fafc !important;
      border-color: #94a3b8 !important;
    }
    .btn-action-danger {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 28px !important;
      padding: 0 10px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      border-radius: var(--adm-radius-sm) !important;
      border: 1px solid #fecaca !important;
      background: #ffffff !important;
      color: var(--adm-danger) !important;
      cursor: pointer !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
      transition: all 0.15s ease !important;
    }
    .btn-action-danger:hover {
      background: #fef2f2 !important;
      border-color: #f87171 !important;
      color: #991b1b !important;
    }
    .btn-action-success {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 28px !important;
      padding: 0 10px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      border-radius: var(--adm-radius-sm) !important;
      border: 1px solid #a7f3d0 !important;
      background: #ffffff !important;
      color: var(--adm-success) !important;
      cursor: pointer !important;
      text-decoration: none !important;
      white-space: nowrap !important;
      box-sizing: border-box !important;
      transition: all 0.15s ease !important;
    }
    .btn-action-success:hover {
      background: #ecfdf5 !important;
      border-color: #6ee7b7 !important;
      color: #065f46 !important;
    }

    /* ── 상단 요약 정보 바 (info-summary) ── */
    .info-summary-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 1024px) {
      .info-summary-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .info-summary-bar { grid-template-columns: 1fr; }
    }
    .summary-block {
      background: #ffffff;
      border: 1px solid var(--adm-border);
      border-radius: var(--adm-radius-sm);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    .summary-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--adm-text-sub);
      margin-bottom: 4px;
    }
    .summary-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--adm-text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .summary-sub {
      font-size: 12px;
      color: var(--adm-text-sub);
      margin-top: 4px;
    }

    /* ── 필터 및 검색 바 ── */
    .table-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-tabs-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .filter-tab-pill {
      height: 32px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--adm-text-main);
      border: 1px solid var(--adm-border-dark);
      border-radius: var(--adm-radius-sm);
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .filter-tab-pill:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }
    .filter-tab-pill.active {
      background: var(--adm-primary);
      color: #ffffff;
      border-color: var(--adm-primary);
      font-weight: 600;
    }
    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      background: #e2e8f0;
      color: #475569;
    }
    .filter-tab-pill.active .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* 검색창 */
    .search-wrapper {
      position: relative !important;
      width: 280px;
      display: inline-flex !important;
      align-items: center !important;
    }
    .search-icon {
      position: absolute !important;
      left: 11px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      color: var(--adm-text-sub) !important;
      pointer-events: none !important;
      z-index: 2 !important;
      width: 16px !important;
      height: 16px !important;
    }
    .search-input {
      width: 100% !important;
      height: 36px !important;
      padding: 0 12px 0 36px !important;
      border: 1px solid var(--adm-border-dark) !important;
      border-radius: var(--adm-radius-sm) !important;
      font-size: 13px !important;
      outline: none !important;
      transition: border-color 0.15s ease !important;
      background: #ffffff !important;
      color: var(--adm-text-main) !important;
      box-sizing: border-box !important;
    }
    .search-input:focus {
      border-color: var(--adm-primary) !important;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15) !important;
    }

    /* ── 테이블 카드 디자인 ── */
    .admin-card {
      background: #ffffff;
      border: 1px solid var(--adm-border);
      border-radius: var(--adm-radius-sm);
      box-sizing: border-box;
      overflow: hidden;
    }
    .table-scroll-container {
      width: 100%;
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .admin-table th {
      background: #f8fafc;
      padding: 12px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--adm-text-sub);
      border-bottom: 1px solid var(--adm-border);
      white-space: nowrap;
      text-align: center;
    }
    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--adm-border);
      font-size: 13px;
      vertical-align: middle;
      color: var(--adm-text-main);
      text-align: center;
    }
    /* 회원(식별자/연락처) 첫 열은 왼쪽 정렬 강제 */
    .admin-table th:first-child,
    .admin-table td:first-child {
      text-align: left !important;
      padding-left: 20px !important;
    }
    .admin-table tbody tr.row-clickable {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .admin-table tbody tr.row-clickable:hover {
      background: #fafafa;
    }
    .admin-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── 사각 뱃지 (Pill 제거) ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.3;
    }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-warning { background: #fef3c7; color: #b45309; }
    .badge-danger  { background: #fee2e2; color: #b91c1c; }
    .badge-info    { background: #e0f2fe; color: #0369a1; }
    .badge-gray    { background: #f1f5f9; color: #475569; }

    /* 최근 접속 일시 */
    .login-info-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }
    .login-info-date {
      color: var(--adm-text-main);
      font-weight: 600;
    }
    .login-info-ip {
      color: var(--adm-text-sub);
      font-size: 11.5px;
    }

    /* ── 관리 액션 버튼들 ── */
    .admin-table-actions {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .table-placeholder {
      text-align: center;
      padding: 36px;
      color: var(--adm-text-sub);
      font-size: 13px;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-users-DxHLWpXz.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-DxYVQPuN.js">
  <link rel="stylesheet" crossorigin href="/assets/main-03q0TmgI.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <h1>회원 계정 관리</h1>
          <p class="header-desc">일반 관광객 회원의 가입/탈퇴 상태, 남은 쿠폰 및 최근 접속 기록을 종합 조회합니다.</p>
        </div>
        <div>
          <button type="button" class="btn btn-secondary" id="btn-refresh-users" onclick="window.loadUsers(true)" title="회원 목록 새로고침">
            <span>새로고침</span>
          </button>
        </div>
      </header>

      <!-- 상단 요약 정보 (info-summary) -->
      <div class="info-summary-bar">
        <!-- 전체 회원 -->
        <div class="summary-block">
          <div class="summary-label">전체 회원</div>
          <div class="summary-val" id="stat-total-users">-</div>
          <div class="summary-sub">누적 가입 회원</div>
        </div>

        <!-- 이용 중 회원 -->
        <div class="summary-block">
          <div class="summary-label">이용 중 회원</div>
          <div class="summary-val" id="stat-active-users" style="color: var(--adm-success);">-</div>
          <div class="summary-sub">정상 이용 계정</div>
        </div>

        <!-- 탈퇴 회원 -->
        <div class="summary-block">
          <div class="summary-label">탈퇴 회원</div>
          <div class="summary-val" id="stat-withdrawn-users" style="color: var(--adm-danger);">-</div>
          <div class="summary-sub">탈퇴 이력 보존</div>
        </div>

        <!-- 쿠폰 보유 회원 -->
        <div class="summary-block">
          <div class="summary-label">쿠폰 보유 회원</div>
          <div class="summary-val" id="stat-with-coupons">-</div>
          <div class="summary-sub">잔여 쿠폰 소지자</div>
        </div>
      </div>

      <!-- 상단 액션 바: 필터 탭 & 검색 -->
      <div class="table-actions-bar">
        <div class="filter-tabs-container">
          <button class="filter-tab-pill active" data-tab="all">
            전체 <span class="tab-badge" id="tab-count-all">0</span>
          </button>
          <button class="filter-tab-pill" data-tab="active">
            이용 중 <span class="tab-badge" id="tab-count-active">0</span>
          </button>
          <button class="filter-tab-pill" data-tab="withdrawn">
            탈퇴 <span class="tab-badge" id="tab-count-withdrawn">0</span>
          </button>
        </div>

        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="전화번호, 닉네임, IP 검색..." />
        </div>
      </div>

      <!-- 회원 목록 카드 -->
      <div class="admin-card">
        <div class="table-scroll-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width: 25%; text-align: left !important; padding-left: 20px !important;">회원 (식별자 / 연락처)</th>
                <th style="width: 14%;">계정 상태</th>
                <th style="width: 17%;">남은 쿠폰</th>
                <th style="width: 20%;">최근 접속</th>
                <th style="width: 12%;">가입 일시</th>
                <th style="width: 12%; text-align: center;">관리</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="6" class="table-placeholder">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
