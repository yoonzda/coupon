<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정산 관리 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }
    
    .admin-card { background: #fff; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
    .card-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { background: var(--surface-2); padding: 12px 24px; text-align: left; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
    .admin-table td { padding: 16px 24px; font-size: 0.9rem; border-bottom: 1px solid var(--border); }

    .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; }
  </style>
  <script type="module" crossorigin src="/assets/admin-settlement-CpNI4jC5.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-BQDM6Pi8.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BSX2ofZY.css">
</head>
<body>
  <div class="app-shell">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Settlement Management</span>
          <h1>정산 관리</h1>
          <p class="header-desc">월별 가맹점 정산 내역 및 XML 파일 생성을 관리합니다.</p>
        </div>
      </header>

      <div class="filter-bar">
        <select class="form-input" style="width: 150px;" id="filter-year">
          <option>2026년</option>
          <option>2025년</option>
        </select>
        <select class="form-input" style="width: 120px;" id="filter-month">
          <option value="04">4월</option>
          <option value="03">3월</option>
          <option value="02">2월</option>
          <option value="01">1월</option>
        </select>
        <button class="btn btn-neutral-outline" id="btn-search">검색</button>
        <button class="btn btn-neutral" id="btn-generate-file">이달의 정산파일 생성</button>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>가맹점명</th>
              <th>정산 기간</th>
              <th>총 결제 금액</th>
              <th>상태</th>
              <th>파일</th>
            </tr>
          </thead>
          <tbody id="settlement-list">
            <tr><td colspan="5" class="text-center" style="padding: 40px;">정산 기간을 선택해 주세요.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

</body>
</html>
