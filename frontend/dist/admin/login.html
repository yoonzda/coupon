<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 | 옹진관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      position: relative;
      overflow: hidden;
    }

    /* 배경 장식 */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
      top: -200px; right: -200px;
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      border-radius: 50%;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(59,130,246,0.4));
    }
    .logo-title {
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .admin-badge {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 14px 14px 42px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    input::placeholder { color: #475569; }

    /* 비밀번호 보기/숨기기 */
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      font-size: 1rem;
      padding: 4px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: #94a3b8; }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-top: 16px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 20px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }
    .divider span { font-size: 0.75rem; color: #475569; white-space: nowrap; }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #475569;
    }

    /* 입력 에러 상태 */
    input.error {
      border-color: rgba(239,68,68,0.5);
      background: rgba(239,68,68,0.05);
    }

    /* 애니메이션 */
    .login-card {
      animation: fadeUp 0.4s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <span class="logo-icon">🏝️</span>
      <div class="logo-title">옹진관광 쿠폰</div>
      <div class="logo-sub">
        <span class="admin-badge">ADMIN</span>
        관리자 전용 포털
      </div>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">관리자 아이디</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>

      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="divider"><span>보안 접속</span></div>
    <div class="security-note">
      🔐 이 페이지는 인가된 관리자만 접근 가능합니다
    </div>
  </div>

  <script>
    // 이미 로그인된 경우 대시보드로 이동
    const existing = localStorage.getItem('ongjin_admin_token');
    if (existing) {
      // 토큰 유효성 확인
      fetch('/api/admin/auth/me', {
        headers: { Authorization: `Bearer ${existing}` }
      }).then(r => {
        if (r.ok) window.location.replace('/admin/index.html');
        else localStorage.removeItem('ongjin_admin_token');
      }).catch(() => localStorage.removeItem('ongjin_admin_token'));
    }

    // 비밀번호 토글
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('pw-toggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        btn.textContent = '🙈';
      } else {
        pw.type = 'password';
        btn.textContent = '👁️';
      }
    });

    // 로그인 처리
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');

      // 입력 초기화
      errEl.classList.remove('show');
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!username || !password) {
        errEl.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        errEl.classList.add('show');
        return;
      }

      // 로딩 상태
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('ongjin_admin_token', data.token);
          localStorage.setItem('ongjin_token', data.token); // api.js 호환
          localStorage.setItem('ongjin_admin_info', JSON.stringify(data.admin));
          // 성공 애니메이션 후 이동
          btn.textContent = '✅ 로그인 성공!';
          btn.classList.remove('loading');
          setTimeout(() => window.location.replace('/admin/index.html'), 600);
        } else {
          throw new Error(data.message || '로그인에 실패했습니다.');
        }
      } catch (err) {
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.classList.remove('loading');
        // 입력 필드 흔들기 효과
        document.querySelector('.login-card').style.animation = 'none';
      }
    });

    // Enter 키 지원
    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
