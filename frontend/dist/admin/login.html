<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="관리자 로그인 | 옹진 관광 쿠폰" />
  <meta property="og:description" content="옹진 관광쿠폰 관리자 시스템" />
  <meta property="og:locale" content="ko_KR" />
  <title>관리자 로그인 — 옹진 관광 쿠폰</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    :root {
      --adm-primary: #0284c7;
      --adm-primary-hover: #0369a1;
      --adm-primary-light: #f0f9ff;
      --adm-text: #202938;
      --adm-text-sub: #667085;
      --adm-border-input: #D1D5DB;
      --adm-border-focus: #0284c7;
      --adm-danger: #DC2626;
      --adm-danger-light: #FEF2F2;
      --adm-danger-border: #FECACA;
      --adm-radius: 8px;
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: var(--adm-text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* ─── 좌측 비주얼 영역 (STIS 스타일 시네마틱 다크 오션 & 동적 비주얼) ─── */
    .login-visual {
      flex: 1 1 50%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 64px 72px;
      color: #ffffff;
      user-select: none;
      background-color: #021727;
    }

    /* 동적 배경 이미지 (Ken Burns 시네마틱 줌 효과) */
    .visual-bg-image {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      background-image: url('/assets/images/hero-issuer-deokjeok.jpg');
      background-size: cover;
      background-position: center;
      animation: kenBurns 26s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
      filter: saturate(1.1) brightness(0.85);
    }

    /* 딥 오션 사파이어 그라디언트 오버레이 (가독성 & STIS 무드) */
    .visual-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(2, 44, 77, 0.72) 0%, rgba(8, 47, 73, 0.82) 50%, rgba(2, 23, 39, 0.94) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 부드러운 오로라 라이팅 이펙트 */
    .visual-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }

    .visual-orb-1 {
      top: -10%;
      left: -10%;
      width: 65%;
      height: 65%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(2, 132, 199, 0.15) 60%, transparent 80%);
      animation: floatOrb1 16s ease-in-out infinite alternate;
    }

    .visual-orb-2 {
      bottom: -15%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.25) 0%, rgba(3, 105, 161, 0.1) 60%, transparent 80%);
      animation: floatOrb2 20s ease-in-out infinite alternate;
    }

    @keyframes kenBurns {
      0% {
        transform: scale(1) translate(0, 0);
      }
      50% {
        transform: scale(1.09) translate(-14px, -10px);
      }
      100% {
        transform: scale(1.04) translate(10px, 8px);
      }
    }

    @keyframes floatOrb1 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      100% { transform: scale(1.2) translate(35px, 25px); opacity: 1; }
    }

    @keyframes floatOrb2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      100% { transform: scale(1.15) translate(-30px, -20px); opacity: 0.9; }
    }

    /* 비주얼 중앙 엠블럼 및 메시지 */
    .visual-center {
      position: relative;
      z-index: 3;
      max-width: 480px;
    }

    .visual-symbol {
      width: 72px;
      height: 72px;
      margin-bottom: 28px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .visual-symbol::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 24px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, transparent 70%);
      opacity: 0.6;
      animation: pulseSymbol 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseSymbol {
      0% { transform: scale(0.96); opacity: 0.4; }
      100% { transform: scale(1.06); opacity: 0.8; }
    }

    .visual-symbol svg,
    .visual-symbol img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .visual-title {
      font-size: 2.35rem;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .visual-title span {
      background: linear-gradient(90deg, #38bdf8 0%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .visual-desc {
      font-size: 1.02rem;
      line-height: 1.68;
      color: #cbd5e1;
      font-weight: 400;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    /* ─── 우측 로그인 폼 영역 (STIS 스타일 클린 폼) ─── */
    .login-content {
      flex: 1 1 50%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: #ffffff;
      position: relative;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-header {
      margin-bottom: 32px;
    }

    .form-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--adm-text);
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }

    .form-header p {
      font-size: 0.9rem;
      color: var(--adm-text-sub);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      width: 19px;
      height: 19px;
      stroke: #9ca3af;
      fill: none;
      pointer-events: none;
      transition: stroke 0.2s;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 46px;
      background: #ffffff;
      border: 1px solid var(--adm-border-input);
      border-radius: var(--adm-radius);
      color: var(--adm-text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    #password {
      padding-right: 48px !important;
    }

    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--adm-border-focus);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.16);
    }

    input[type="text"]:focus ~ .input-icon, 
    input[type="password"]:focus ~ .input-icon {
      stroke: var(--adm-primary);
    }

    input::placeholder {
      color: #9ca3af;
      font-size: 0.92rem;
    }

    /* 브라우저 자동완성(Auto-fill) 시 파란색 배경 및 글자색 방지 */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: var(--adm-text) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* 비밀번호 보기 토글 */
    .pw-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      border-radius: 4px;
    }

    .pw-toggle svg {
      width: 20px;
      height: 20px;
      stroke: #9ca3af;
      fill: none;
      transition: stroke 0.2s;
    }

    .pw-toggle:hover svg {
      stroke: var(--adm-text);
    }

    /* 에러 표시 */
    .error-msg {
      display: none;
      color: var(--adm-danger);
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 14px;
      text-align: left;
      padding: 11px 14px;
      background: var(--adm-danger-light);
      border: 1px solid var(--adm-danger-border);
      border-radius: var(--adm-radius);
    }

    .error-msg.show {
      display: block;
    }

    input.error {
      border-color: var(--adm-danger);
      background: #fff5f5;
    }

    input.error ~ .input-icon {
      stroke: var(--adm-danger);
    }

    /* 로그인 버튼 (관리자 테마 오션블루 프라이머리 버튼 스타일과 일치) */
    .btn-login {
      width: 100%;
      height: 48px;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--adm-primary) 0%, var(--adm-primary-hover) 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--adm-radius);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      position: relative;
      font-family: inherit;
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--adm-primary-hover) 0%, #075985 100%);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.42);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .btn-login .spinner {
      display: none;
      width: 20px; 
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 하단 사이트 돌아가기 / 포털 링크 (STIS 스타일) */
    .form-footer {
      margin-top: 36px;
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #111827;
      text-decoration: underline;
    }

    .service-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #f3f4f6;
    }

    .service-link {
      font-size: 0.82rem;
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.2s;
    }

    .service-link:hover {
      color: #0284c7;
    }

    .service-dot {
      width: 3px;
      height: 3px;
      background: #e5e7eb;
      border-radius: 50%;
    }

    .copyright {
      margin-top: 24px;
      font-size: 0.76rem;
      color: #9ca3af;
      text-align: center;
    }

    /* ─── 반응형 처리 (960px 이하 태블릿 및 모바일) ─── */
    @media (max-width: 960px) {
      .login-wrap {
        flex-direction: column;
      }

      .login-visual {
        flex: none;
        min-height: auto;
        padding: 40px 24px;
      }

      .visual-center {
        margin: 20px 0;
      }

      .visual-symbol {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
      }

      .visual-symbol svg {
        width: 30px;
        height: 30px;
      }

      .visual-title {
        font-size: 1.75rem;
      }

      .visual-desc {
        font-size: 0.92rem;
      }

      .visual-footer {
        display: none;
      }

      .login-content {
        flex: none;
        min-height: auto;
        padding: 40px 20px 60px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <!-- 좌측 브랜드 비주얼 (STIS 스타일 동적 시네마틱 패널) -->
    <div class="login-visual" aria-hidden="true">
      <!-- 동적 배경 이미지 및 오버레이 -->
      <div class="visual-bg-image"></div>
      <div class="visual-overlay"></div>
      <div class="visual-orb visual-orb-1"></div>
      <div class="visual-orb visual-orb-2"></div>

      <div class="visual-center">
        <div class="visual-symbol" style="margin-bottom: 12px;">
          <img src="/assets/images/ongjin-coupon-logo.png" alt="옹진관광쿠폰" style="height: 52px; width: auto; max-width: 180px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));" />
        </div>
        <h2 class="visual-title">옹진 관광 쿠폰<br /><span>통합 관리 시스템</span></h2>
        <p class="visual-desc">
          청정 옹진의 섬과 바다를 잇는 스마트 관광 플랫폼.<br />
          디지털 쿠폰의 발행부터 정산, 가맹점 관리까지 체계적인 원스톱 운영 환경을 제공합니다.
        </p>
      </div>
    </div>

    <!-- 우측 로그인 입력 폼 (STIS 스타일) -->
    <div class="login-content">
      <div class="form-container">
        <div class="form-header">
          <div style="margin-bottom: 16px; display: flex; justify-content: center;">
            <img src="/assets/images/ongjin-coupon-logo.png" alt="옹진관광쿠폰" style="height: 46px; width: auto; max-width: 170px; object-fit: contain; display: block;" />
          </div>
          <h1>관리자 로그인</h1>
          <p>옹진 관광 쿠폰 관리 시스템 접근을 위해 계정 정보를 입력해주세요.</p>
        </div>

        <form id="login-form" novalidate autocomplete="off">
          <!-- 브라우저 자동완성 방지용 더미 필드 -->
          <input type="text" name="fakeusernameremembered" style="display:none;" aria-hidden="true" tabindex="-1" autocomplete="off" />
          <input type="password" name="fakepasswordremembered" style="display:none;" aria-hidden="true" tabindex="-1" autocomplete="new-password" />

          <div class="form-group">
            <label for="username">아이디</label>
            <div class="input-wrap">
              <input
                type="text"
                id="username"
                name="username"
                placeholder="아이디를 입력하세요"
                autocomplete="off"
                readonly
                onfocus="this.removeAttribute('readonly');"
                required
              />
              <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                autocomplete="new-password"
                readonly
                onfocus="this.removeAttribute('readonly');"
                required
              />
              <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="error-msg" id="error-msg"></div>

          <button type="submit" class="btn-login" id="btn-login">
            <span class="btn-text">로그인</span>
            <span class="spinner"></span>
          </button>
        </form>

        <div class="form-footer">
          <a href="/tourist/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            관광객 포털로 돌아가기
          </a>

          <div class="service-links">
            <a href="/tourist/" class="service-link" target="_blank" rel="noopener noreferrer">관광객 포털</a>
            <span class="service-dot"></span>
            <a href="/merchant/login.html?redirect=%2Fmerchant%2Fmanage-store.html" class="service-link" target="_blank" rel="noopener noreferrer">가맹점 관리</a>
          </div>

          <div class="copyright">
            © Ongjin-gun. All rights reserved.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 브라우저 자동완성(Auto-fill) 강제 초기화
    window.addEventListener('DOMContentLoaded', () => {
      const clearInputs = () => {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u) { u.value = ''; u.removeAttribute('readonly'); }
        if (p) { p.value = ''; p.removeAttribute('readonly'); }
      };
      clearInputs();
      setTimeout(clearInputs, 50);
      setTimeout(clearInputs, 250);
    });

    // 이미 로그인된 경우 대시보드로 이동
    const existing = localStorage.getItem('ongjin_admin_token');
    if (existing) {
      // 토큰 유효성 확인
      fetch('/api/admin/auth/me', {
        headers: { Authorization: `Bearer ${existing}` }
      }).then(r => {
        if (r.ok) window.location.replace('/admin/index.html');
        else localStorage.removeItem('ongjin_admin_token');
      }).catch(() => localStorage.removeItem('ongjin_admin_token'));
    }

    // 비밀번호 토글
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('pw-toggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        btn.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>`;
      } else {
        pw.type = 'password';
        btn.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>`;
      }
    });

    // 로그인 처리
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      const btnText = btn.querySelector('.btn-text');

      // 입력 초기화
      errEl.classList.remove('show');
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!username || !password) {
        errEl.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        errEl.classList.add('show');
        return;
      }

      // 로딩 상태
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('ongjin_admin_token', data.token);
          localStorage.setItem('ongjin_token', data.token); // api.js 호환
          localStorage.setItem('ongjin_admin_info', JSON.stringify(data.admin));
          // 성공 처리
          btnText.textContent = '로그인 성공';
          btnText.style.display = 'block';
          btn.querySelector('.spinner').style.display = 'none';
          btn.style.background = '#059669'; // Green success color
          btn.classList.remove('loading');
          setTimeout(() => window.location.replace('/admin/index.html'), 500);
        } else {
          throw new Error(data.message || '아이디 또는 비밀번호가 올바르지 않습니다.');
        }
      } catch (err) {
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });

    // Enter 키 지원
    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
