<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>관리자 로그인 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      background-image: 
        linear-gradient(45deg, rgba(37,99,235,0.02) 25%, transparent 25%, transparent 75%, rgba(37,99,235,0.02) 75%, rgba(37,99,235,0.02)),
        linear-gradient(45deg, rgba(37,99,235,0.02) 25%, transparent 25%, transparent 75%, rgba(37,99,235,0.02) 75%, rgba(37,99,235,0.02));
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      position: relative;
      overflow: hidden;
      color: #0f172a;
    }

    body::before {
      content: '';
      position: absolute;
      width: 800px; height: 800px;
      background: linear-gradient(135deg, #dbeafe 0%, transparent 70%);
      top: -300px; right: -300px;
      transform: rotate(45deg);
      opacity: 0.9;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: linear-gradient(315deg, #e0f2fe 0%, transparent 60%);
      bottom: -200px; left: -200px;
      transform: rotate(45deg);
      opacity: 0.9;
      z-index: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-top: 3px solid #2563eb;
      border-radius: 0; 
      padding: 56px 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.05);
    }

    /* 방패 툴팁 */
    .shield-tooltip-container {
      position: absolute;
      top: 24px;
      right: 24px;
      cursor: help;
    }
    .shield-icon {
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
      fill: none;
      transition: stroke 0.2s;
    }
    .shield-tooltip-container:hover .shield-icon {
      stroke: #2563eb;
    }
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      white-space: nowrap;
      background-color: #0f172a;
      color: #fff;
      text-align: center;
      padding: 10px 14px;
      position: absolute;
      z-index: 10;
      top: 140%;
      right: -10px;
      font-size: 0.75rem;
      font-family: 'Pretendard', sans-serif;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      pointer-events: none;
    }
    .tooltip-text::after {
      content: "";
      position: absolute;
      bottom: 100%;
      right: 16px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent #0f172a transparent;
    }
    .shield-tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 40px;
    }
    .logo-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2563eb; /* blue point color */
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400; 
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon-svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      pointer-events: none;
      transition: stroke 0.3s;
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px 16px 16px 46px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }
    #password {
      padding-right: 48px !important;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
    }
    input[type="text"]:focus ~ .input-icon-svg, 
    input[type="password"]:focus ~ .input-icon-svg {
      stroke: #2563eb;
    }
    input::placeholder { color: #94a3b8; }

    /* 비밀번호 보기/숨기기 (아이콘 형태) */
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle svg {
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle:hover svg { stroke: #0f172a; }

    .btn-login {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 40px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      text-transform: uppercase;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 16px;
      text-align: left;
    }
    .error-msg.show { display: block; }

    /* 입력 에러 상태 */
    input.error {
      border-color: #ef4444;
      background: #fef2f2;
    }
    input.error ~ .input-icon-svg {
      stroke: #ef4444;
    }

    /* 하단 포털 링크 영역 (미니멀 푸터 스타일) */
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }
    .footer-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }
    .footer-link:hover {
      color: #2563eb;
    }
    .dot-separator {
      width: 4px;
      height: 4px;
      background-color: #cbd5e1;
      border-radius: 0; /* 각진 스타일 유지 */
    }

    /* ── Responsive & Mobile First Styles ── */
    @media (max-width: 480px) {
      body {
        background: #ffffff;
        background-image: none;
        align-items: flex-start;
      }
      
      body::before, body::after {
        display: none;
      }

      .login-card {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        border: none;
        border-top: 4px solid #2563eb;
        padding: 48px 24px 32px 24px;
        box-shadow: none;
        background: #ffffff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo-area {
        margin-bottom: 32px;
      }
      
      .logo-title {
        font-size: 2rem;
      }

      input[type="text"], input[type="password"] {
        padding: 15px 15px 15px 44px;
        font-size: 0.95rem;
      }

      .btn-login {
        padding: 16px;
        margin-top: 24px;
      }

      .footer-links {
        margin-top: 36px;
        gap: 16px;
      }
      .footer-link {
        font-size: 0.85rem;
        padding: 6px 12px;
      }
    }

    /* 애니메이션 */
    .login-card {
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <span class="logo-subtitle">옹진 관광 쿠폰</span>
      <div class="logo-title">관리자 로그인</div>
    </div>

    <form id="login-form" novalidate>
      <!-- 브라우저 자동완성 방지용 더미 필드 -->
      <input type="text" style="display:none;" aria-hidden="true" />
      <input type="password" style="display:none;" aria-hidden="true" />

      <div class="form-group">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            autocomplete="off"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="off"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <rect x="3" y="11" width="18" height="11"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="footer-links">
      <a href="/tourist/" class="footer-link" target="_blank" rel="noopener noreferrer">관광객</a>
      <span class="dot-separator"></span>
      <a href="/merchant/" class="footer-link" target="_blank" rel="noopener noreferrer">가맹점</a>
      <span class="dot-separator"></span>
      <a href="/issuer/login.html" class="footer-link" target="_blank" rel="noopener noreferrer">발행처</a>
    </div>
  </div>

  <script>
    // 이미 로그인된 경우 대시보드로 이동
    const existing = localStorage.getItem('ongjin_admin_token');
    if (existing) {
      // 토큰 유효성 확인
      fetch('/api/admin/auth/me', {
        headers: { Authorization: `Bearer ${existing}` }
      }).then(r => {
        if (r.ok) window.location.replace('/admin/index.html');
        else localStorage.removeItem('ongjin_admin_token');
      }).catch(() => localStorage.removeItem('ongjin_admin_token'));
    }

    // 비밀번호 토글
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('pw-toggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        btn.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>`;
      } else {
        pw.type = 'password';
        btn.innerHTML = `<svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>`;
      }
    });

    // 로그인 처리
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      const btnText = btn.querySelector('.btn-text');

      // 입력 초기화
      errEl.classList.remove('show');
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      if (!username || !password) {
        errEl.textContent = '아이디와 비밀번호를 모두 입력해주세요.';
        errEl.classList.add('show');
        return;
      }

      // 로딩 상태
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('ongjin_admin_token', data.token);
          localStorage.setItem('ongjin_token', data.token); // api.js 호환
          localStorage.setItem('ongjin_admin_info', JSON.stringify(data.admin));
          // 성공 처리
          btnText.textContent = 'SUCCESS';
          btnText.style.display = 'block';
          btn.querySelector('.spinner').style.display = 'none';
          btn.style.background = '#059669'; // Green success color
          btn.classList.remove('loading');
          setTimeout(() => window.location.replace('/admin/index.html'), 600);
        } else {
          throw new Error(data.message || '로그인에 실패했습니다.');
        }
      } catch (err) {
        document.getElementById('username').classList.add('error');
        document.getElementById('password').classList.add('error');
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });

    // Enter 키 지원
    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
