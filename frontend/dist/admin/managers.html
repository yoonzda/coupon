<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 계정 관리 | 옹진 관광 쿠폰</title>
  <script>
    (function() {
      if (localStorage.getItem('ongjin_sidebar_collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/reset.css" />
  
  <style>
    body { 
      margin: 0 !important; padding: 0 !important; 
      width: 100% !important; max-width: none !important; 
      background: #f1f5f9;
      color: #1e293b; 
    }
    
    /* 데이터 테이블 */
    .admin-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .admin-table th, .admin-table td {
      padding: 16px 24px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .admin-table th {
      background: #f8fafc;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .admin-table tr:hover { background: #f8fafc; }
    
    .btn-export {
      padding: 10px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-export:hover { background: #f1f5f9; }
    .controls { display: flex; gap: 12px; }
    
    /* 체크박스 크기 통일 */
    .admin-table input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      vertical-align: middle;
      margin: 0;
    }
  </style>
  <script type="module" crossorigin src="/assets/admin-managers-AvDgjLWz.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-guard-xv3IhYox.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <div class="app-shell" style="min-height: 100vh;">
    <!-- 사이드바 -->
    <aside class="admin-sidebar"></aside>

    <!-- 메인 컨텐츠 -->
    <main class="admin-content">
      <header class="dashboard-header">
        <div class="header-title-area">
          <span class="header-category">Administrator Settings</span>
          <h1>관리자 계정 관리</h1>
          <p class="header-desc">관리자 계정을 추가하거나 권한을 설정할 수 있습니다.</p>
        </div>
      </header>

      <!-- 테이블 조작 버튼 영역 -->
      <div class="table-actions-bar" style="display: flex; gap: 12px; align-items: center; margin-bottom: 16px; justify-content: flex-start;">
        <a href="register-manager.html" id="btn-add-manager" class="btn btn-neutral btn-sm" style="height: 38px; display: flex; align-items: center;">관리자 등록</a>
        <button id="btn-delete-managers" class="btn btn-neutral-outline btn-sm" style="height: 38px; display: flex; align-items: center;">선택 삭제</button>
      </div>

      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="text-align: center; width: 8%;"><input type="checkbox" id="selectAllManagers" style="cursor: pointer;"></th>
              <th style="text-align: center; width: 20%;">이름</th>
              <th style="text-align: center; width: 32%;">아이디</th>
              <th style="text-align: center; width: 25%;">권한</th>
              <th style="text-align: center; width: 15%;">관리</th>
            </tr>
          </thead>
          <tbody id="managersTableBody">
            <!-- 데이터가 여기에 렌더링됩니다 -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

</body>
</html>
