<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>가맹점 포털 | 옹진관광 쿠폰</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html.font-scale-anim {
      transition: font-size 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body {
      background: #f8fafc;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      position: relative;
    }

    /* 우측 상단 글자 크기 조절 컨트롤 (login.html과 동일한 슬라이딩 화이트 필 스타일) */
    .font-size-control {
      position: absolute;
      top: 24px;
      right: 24px;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      height: 36px;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 999px !important;
      border: 1px solid #e2e8f0;
      user-select: none;
      z-index: 50;
    }
    .font-size-slider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background: #ffffff;
      border-radius: 999px !important;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14);
      transition: transform 0.42s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      z-index: 0;
    }
    html[data-font-scale="large"] .font-size-slider {
      transform: translateX(100%);
    }
    .font-size-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-width: 54px;
      padding: 0 14px;
      border: none;
      background: transparent;
      color: #64748b;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 999px !important;
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
      -webkit-appearance: none;
      appearance: none;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-size-btn:hover {
      color: #0f172a;
    }
    .font-size-btn.active {
      color: #059669;
    }

    .intro-wrapper {
      width: 100%;
      max-width: 580px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    html[data-font-scale="large"] .intro-wrapper {
      max-width: 660px;
    }

    /* 실시간 쿠폰 사용 요청 알림 영역 (요청이 있을 때만 표시) */
    .usage-requests-wrap {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .usage-requests-wrap.active {
      display: flex;
    }

    .usage-req-card {
      width: 100%;
      background: #ffffff;
      border: 2px solid #059669;
      border-radius: 12px !important;
      padding: 18px 20px;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: reqSlideIn 0.25s ease-out;
    }

    @keyframes reqSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .usage-req-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .usage-req-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #059669;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 99px !important;
      padding: 4px 10px;
    }

    .usage-req-dot {
      width: 7px;
      height: 7px;
      border-radius: 50% !important;
      background: #059669;
    }

    .usage-req-time {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }

    .usage-req-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .usage-req-phone {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0f172a;
    }

    .usage-req-sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 2px;
    }

    .usage-req-amount {
      font-size: 1.35rem;
      font-weight: 900;
      color: #059669;
      white-space: nowrap;
    }

    .usage-req-actions {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .btn-req-approve {
      padding: 13px 16px;
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 8px !important;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-req-approve:hover {
      background: #047857;
    }

    .btn-req-reject {
      padding: 13px 16px;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #cbd5e1;
      border-radius: 8px !important;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-req-reject:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fecaca;
    }

    /* 2열 4개 메인 카드 그리드 */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    .main-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px !important;
      padding: 42px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-decoration: none;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      aspect-ratio: 1 / 0.88;
    }

    .main-card:hover {
      transform: none !important;
      border-color: #059669;
      background: #fafdfb;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.08);
    }

    .main-card:hover .card-icon {
      color: #059669;
      stroke-width: 1.5;
    }

    .main-card:hover .card-name {
      color: #059669;
    }

    .icon-box {
      position: relative;
      width: 3rem;
      height: 3rem;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon {
      width: 2.75rem;
      height: 2.75rem;
      color: #1e293b;
      stroke-width: 1.25;
      stroke-linecap: square;
      stroke-linejoin: miter;
      transition: color 0.2s ease, stroke-width 0.2s ease;
    }

    .card-req-badge {
      position: absolute;
      top: -6px;
      right: -10px;
      min-width: 1.35rem;
      height: 1.35rem;
      padding: 0 0.35rem;
      border-radius: 999px !important;
      background: #ef4444;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
    }
    .card-req-badge.show {
      display: inline-flex;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
      transition: color 0.2s ease;
    }

    .btn-bottom-logout {
      margin-top: 4px;
      background: none;
      border: none;
      font-size: 0.85rem;
      font-weight: 500;
      color: #94a3b8;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: #e2e8f0;
      cursor: pointer;
      padding: 6px 12px;
      font-family: inherit;
      transition: color 0.15s ease, text-decoration-color 0.15s ease;
    }
    .btn-bottom-logout:hover {
      color: #475569;
      text-decoration-color: #94a3b8;
    }

    /* 스캔 결제 결과 모달 */
    .scan-result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.55);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .scan-result-overlay.show {
      display: flex;
    }
    .scan-result-card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 14px !important;
      padding: 28px 24px 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
      border: 1px solid #e2e8f0;
    }
    .scan-result-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px !important;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .scan-result-badge.success {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .scan-result-badge.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .scan-result-amount {
      font-size: 2rem;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .scan-result-msg {
      font-size: 0.95rem;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 20px;
      word-break: keep-all;
    }
    .btn-scan-result-close {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 8px !important;
      background: #059669;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        min-height: 100dvh;
      }
      .font-size-control {
        top: 16px;
        right: 16px;
      }
      .intro-wrapper {
        padding: 16px;
        gap: 14px;
      }
      .card-grid {
        gap: 12px;
      }
      .main-card {
        padding: 26px 14px;
        gap: 12px;
        aspect-ratio: auto;
        min-height: 124px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-index-A1yW_3hF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/mock-backend-a_Dp-F9x.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BGCgjaV1.js">
  <link rel="stylesheet" crossorigin href="/assets/main-CSqzwfnj.css">
</head>
<body>
  <div class="font-size-control" role="group" aria-label="글자 크기 조절">
    <span class="font-size-slider" aria-hidden="true"></span>
    <button type="button" class="font-size-btn active" data-scale="normal" title="글자 보통">보통</button>
    <button type="button" class="font-size-btn" data-scale="large" title="글자 크게">크게</button>
  </div>

  <div class="intro-wrapper">
    <!-- 실시간 쿠폰 사용 승인 요청 영역 (요청 도착 시에만 노출) -->
    <div class="usage-requests-wrap" id="usage-requests-wrap"></div>

    <div class="card-grid">
      <!-- 1. 쿠폰 스캔 (터치 시 중간 화면 없이 즉시 카메라 연결) -->
      <label class="main-card" for="direct-camera-input" id="card-scan-trigger">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M3.75 7.5V4.5h3m9 0h3v3m0 9v3h-3m-9 0h-3v-3M9 12h6" />
          </svg>
        </div>
        <span class="card-name" id="card-scan-label">쿠폰 스캔</span>
      </label>
      <input type="file" id="direct-camera-input" accept="image/*" capture="environment" style="display: none;" />

      <!-- 2. 요청 보기 -->
      <a class="main-card" href="/merchant/manual.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-width="1.25"/>
          </svg>
          <span class="card-req-badge" id="req-count-badge">0</span>
        </div>
        <span class="card-name">요청 보기</span>
      </a>

      <!-- 3. 거래내역 -->
      <a class="main-card" href="/merchant/history.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M12 6v6l4 2M12 21a9 9 0 100-18 9 9 0 000 18z" stroke-width="1.25"/>
          </svg>
        </div>
        <span class="card-name">거래내역</span>
      </a>

      <!-- 4. 기타 -->
      <a class="main-card" href="/merchant/etc.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M12 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
          </svg>
        </div>
        <span class="card-name">기타</span>
      </a>
    </div>

    <button type="button" class="btn-bottom-logout" id="btn-merchant-logout">로그아웃</button>
  </div>

  <!-- 스캔 결과 모달 -->
  <div class="scan-result-overlay" id="scan-result-overlay">
    <div class="scan-result-card">
      <span class="scan-result-badge success" id="scan-result-badge">승인 완료</span>
      <div class="scan-result-amount" id="scan-result-amount">0원</div>
      <p class="scan-result-msg" id="scan-result-msg">쿠폰 결제가 정상적으로 처리되었습니다.</p>
      <button type="button" class="btn-scan-result-close" id="btn-scan-result-close">확인</button>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
