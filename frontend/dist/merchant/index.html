<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>가맹점 포털 | 옹진관광 쿠폰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: #f8fafc;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .intro-wrapper {
      width: 100%;
      max-width: 580px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 2열 4개 메인 카드 그리드 */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    .main-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px !important;
      padding: 42px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-decoration: none;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.02);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      aspect-ratio: 1 / 0.88;
    }

    .main-card:hover {
      transform: none !important;
      border-color: #059669;
      background: #fafdfb;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.08);
    }

    .main-card:hover .card-icon {
      color: #059669;
      stroke-width: 1.5;
    }

    .main-card:hover .card-name {
      color: #059669;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      color: #1e293b;
      stroke-width: 1.25;
      stroke-linecap: square;
      stroke-linejoin: miter;
      transition: color 0.2s ease, stroke-width 0.2s ease;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
      transition: color 0.2s ease;
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-index-DY7dUNTd.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BrJ7NzZM.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <div class="intro-wrapper">
    <div class="card-grid">
      <!-- 1. 쿠폰 스캔 -->
      <a class="main-card" href="/merchant/scan.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M3.75 7.5V4.5h3m9 0h3v3m0 9v3h-3m-9 0h-3v-3M9 12h6" />
          </svg>
        </div>
        <span class="card-name">쿠폰 스캔</span>
      </a>

      <!-- 2. 수동 등록 (쿠폰 수동 입력/작성을 상징하는 샤프 씬 라인 연필 수동입력 SVG 아이콘) -->
      <a class="main-card" href="/merchant/manual.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zM3.75 20.25h16.5" stroke-width="1.25"/>
          </svg>
        </div>
        <span class="card-name">수동 등록</span>
      </a>

      <!-- 3. 거래내역 (히스토리 시계/타임라인 아이콘) -->
      <a class="main-card" href="/merchant/history.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M12 6v6l4 2M12 21a9 9 0 100-18 9 9 0 000 18z" stroke-width="1.25"/>
          </svg>
        </div>
        <span class="card-name">거래내역</span>
      </a>

      <!-- 4. 기타 -->
      <a class="main-card" href="/merchant/etc.html">
        <div class="icon-box">
          <svg class="card-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" d="M12 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm0 6.75a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
          </svg>
        </div>
        <span class="card-name">기타</span>
      </a>
    </div>
  </div>

</body>
</html>
