<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>가맹점 로그인 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }

    html.font-scale-anim {
      transition: font-size 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f0fdf4;
      background-image: 
        radial-gradient(circle at 10% 20%, #dcfce7 0%, #f0fdf4 100%);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      color: #1e293b;
    }

    /* Decorative blurred glow circles (bright green) */
    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.08) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
      pointer-events: none;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-top: 3px solid #10b981;
      border-radius: 0; 
      padding: 3rem 2.6rem;
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.5s ease-out;
    }

    html.font-scale-anim .login-card {
      transition: max-width 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                  padding 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    html[data-font-scale="large"] .login-card {
      max-width: 520px;
      padding: 2.3rem 1.8rem;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 2.1rem;
      width: 100%;
    }
    .logo-subtitle {
      font-size: 0.88rem;
      font-weight: 700;
      color: #059669;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
      line-height: 1.4;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.15rem;
      font-weight: 400; 
      color: #0f172a;
      letter-spacing: -0.5px;
      line-height: 1.28;
    }

    /* 글자 크기 조절 컨트롤 (상단 배치 & 슬라이딩 토글) */
    .font-size-control {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      height: 36px;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      flex-shrink: 0;
      margin-bottom: 1.15rem;
      align-self: flex-start;
      user-select: none;
    }
    .font-size-slider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.14);
      transition: transform 0.42s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      z-index: 0;
    }
    html[data-font-scale="large"] .font-size-slider {
      transform: translateX(100%);
    }
    .font-size-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-width: 54px;
      padding: 0 14px;
      border: none;
      background: transparent;
      color: #64748b;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
      -webkit-appearance: none;
      appearance: none;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-size-btn:hover {
      color: #0f172a;
    }
    .font-size-btn.active {
      color: #059669;
    }

    .form-group {
      margin-bottom: 1.65rem;
    }
    label {
      display: block;
      font-size: 0.98rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.42rem;
      letter-spacing: 0.2px;
      line-height: 1.4;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon-svg {
      position: absolute;
      left: 0.95rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.125rem;
      height: 1.125rem;
      stroke: #94a3b8;
      fill: none;
      pointer-events: none;
      transition: stroke 0.3s;
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.95rem 2.6rem 0.95rem 2.75rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }
    #username {
      cursor: pointer;
    }
    #password {
      padding-right: 2.85rem !important;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #10b981;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }
    input[type="text"]:focus ~ .input-icon-svg, 
    input[type="password"]:focus ~ .input-icon-svg {
      stroke: #10b981;
    }
    input::placeholder { color: #94a3b8; }

    /* Custom Select Chevron & Dropdown Menu */
    .select-chevron {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .select-chevron svg {
      width: 1.125rem;
      height: 1.125rem;
      stroke: #94a3b8;
      fill: none;
      transition: transform 0.2s ease, stroke 0.2s ease;
    }
    .input-wrap.open .select-chevron svg {
      transform: rotate(180deg);
      stroke: #10b981;
    }

    .custom-select-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 13.5rem;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
      z-index: 50;
      padding: 0.35rem;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .input-wrap.open .custom-select-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .custom-select-menu::-webkit-scrollbar {
      width: 6px;
    }
    .custom-select-menu::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-select-menu::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    .custom-select-menu::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .custom-select-option {
      padding: 0.7rem 0.85rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.2rem;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .custom-select-option:hover {
      background: #f0fdf4;
      color: #059669;
      font-weight: 600;
    }
    .custom-select-option.selected {
      background: #ecfdf5;
      color: #059669;
      font-weight: 700;
    }
    .custom-select-option .recent-label {
      font-size: 0.74rem;
      font-weight: 600;
      color: #059669;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .custom-select-divider {
      height: 1px;
      background: #e2e8f0;
      margin: 0.3rem 0.4rem;
    }
    .custom-select-empty {
      padding: 0.85rem;
      text-align: center;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle svg {
      width: 1.125rem;
      height: 1.125rem;
      stroke: #94a3b8;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle:hover svg { stroke: #10b981; }

    .btn-login {
      width: 100%;
      padding: 1.05rem 1.25rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.4;
      cursor: pointer;
      transition: filter 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      margin-top: 1.1rem;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.22);
    }
    .btn-login:active:not(:disabled) { transform: scale(0.99); }
    .btn-login:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.9rem;
      text-align: left;
    }
    .error-msg.show { display: block; }

    /* Input error state */
    input.error {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.03);
    }
    input.error ~ .input-icon-svg {
      stroke: #ef4444;
    }
    
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Verification Overlay */
    .verify-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .verify-overlay.active {
      display: flex;
    }
    .verify-overlay p {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #475569;
    }

    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    /* Floating Inquiry Button (bright theme) */
    .floating-inquiry-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      font-family: inherit;
      padding: 0;
    }
    .btn-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .btn-border-bg {
      fill: none;
      stroke: rgba(16, 185, 129, 0.1);
      stroke-width: 1.5;
    }
    .btn-border-active {
      fill: none;
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-text-q {
      color: #059669;
      font-size: 35px;
      font-weight: 500;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      z-index: 10;
    }
    .floating-inquiry-btn:hover .btn-border-active {
      stroke-dashoffset: 0;
    }
    .floating-inquiry-btn:hover .btn-text-q {
      color: #059669;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .floating-inquiry-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.2);
    }
    .floating-inquiry-btn:active {
      transform: scale(0.95);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      width: calc(100% - 2rem);
      max-width: 23.5rem;
      padding: 2rem 1.5rem 1.75rem;
      position: relative;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }
    
    .modal-close-x {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .modal-close-x:hover {
      background: #f1f5f9;
      color: #334155;
    }
    .modal-close-x svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    .modal-header-area {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .title-divider {
      width: 28px;
      height: 2px;
      background: rgba(16, 185, 129, 0.25);
      margin: 10px auto 14px auto;
    }
    .modal-desc {
      color: #475569;
      font-size: 0.9rem;
      line-height: 1.55;
      font-weight: 500;
      letter-spacing: -0.2px;
    }
    .modal-desc span {
      display: block;
      margin-bottom: 2px;
      font-weight: 700;
      color: #0f172a;
    }

    .inquiry-info-box {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }
    .inquiry-call-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      padding: 0.95rem 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .inquiry-call-item:hover {
      background: #f0fdf4;
      border-color: #10b981;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.1);
    }
    .inquiry-call-label {
      color: #64748b;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
    }
    .inquiry-call-number {
      color: #059669;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.35;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Secondary Outline Button (입점 신청하기) */
    .btn-apply-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.05rem 1.25rem;
      margin-top: 0.75rem;
      background: #ffffff;
      border: 1.5px solid #10b981;
      color: #059669;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      box-sizing: border-box;
    }
    .btn-apply-outline:hover {
      background: #f0fdf4;
      border-color: #059669;
      color: #047857;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.14);
    }
    .btn-apply-outline:active {
      transform: scale(0.99);
    }

    /* ── Responsive & Mobile First Styles ── */
    @media (max-width: 480px) {
      body {
        background: #ffffff;
        background-image: none;
        align-items: stretch;
        min-height: 100dvh;
      }
      
      body::before, body::after {
        display: none;
      }

      .login-card,
      html[data-font-scale="large"] .login-card {
        width: 100%;
        max-width: 100%;
        min-height: 100dvh;
        border: none;
        border-top: 4px solid #10b981;
        padding: 1.4rem 1.35rem 2.2rem 1.35rem;
        box-shadow: none;
        background: #ffffff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo-area {
        margin-bottom: 1.6rem;
      }
      
      .logo-title {
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 1.35rem;
      }

      .btn-login {
        margin-top: 0.85rem;
        padding: 1rem 1.2rem;
      }

      .btn-apply-outline {
        margin-top: 0.65rem;
        padding: 1rem 1.2rem;
      }

      .floating-inquiry-btn {
        bottom: 16px;
        right: 16px;
        width: 52px;
        height: 52px;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
      }
      .btn-text-q {
        font-size: 26px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── 토스트 알림 ── */
    #toast-container {
      position: fixed;
      bottom: 2.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      width: 90%;
      max-width: 420px;
    }
    .toast {
      width: 100%;
      padding: 0.85rem 1.15rem;
      border-radius: 8px;
      background: #1e293b;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
      animation: toastSlideUp 0.22s ease-out;
    }
    .toast.success { background: #059669; }
    .toast.error { background: #ef4444; }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-login-DlVGceFO.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BxOpvEgq.js">

<body>
  <div class="login-card" id="login-card-container">
    <!-- Active validation loading state -->
    <div class="verify-overlay" id="verify-loading">
      <div class="spinner" style="display: block; width: 28px; height: 28px; border-top-color: #10b981;"></div>
      <p>로그인 세션 검증 중...</p>
    </div>

    <div class="logo-area">
      <div class="font-size-control" role="group" aria-label="글자 크기 조절">
        <span class="font-size-slider" aria-hidden="true"></span>
        <button type="button" class="font-size-btn active" data-scale="normal" title="글자 보통">보통</button>
        <button type="button" class="font-size-btn" data-scale="large" title="글자 크게">크게</button>
      </div>
      <span class="logo-subtitle">옹진 관광 쿠폰</span>
      <div class="logo-title">가맹점 로그인</div>
    </div>

    <!-- 로그인 폼 -->
    <form id="form-merchant-login" novalidate>
      <div class="form-group">
        <label for="username">가맹점</label>
        <div class="input-wrap" id="store-select-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="가맹점을 선택하세요"
            autocomplete="off"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <button type="button" class="select-chevron" id="btn-select-chevron" aria-label="가맹점 목록 열기">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="custom-select-menu" id="custom-select-menu"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <rect x="3" y="11" width="18" height="11"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn-login" id="btn-submit">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>

      <a href="/merchant/apply.html" class="btn-apply-outline">입점 신청하기</a>
    </form>
  </div>

  <!-- 문의하기 모달 레이어 -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal-container">
      <button type="button" class="modal-close-x" id="btn-close-inquiry" aria-label="닫기">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-header-area">
        <h3 class="modal-title">문의 안내</h3>
        <div class="title-divider"></div>
        <p class="modal-desc">
          <span>도움이 필요하신 경우</span>
          아래 담당 부서로 문의해 주시기 바랍니다.
        </p>
      </div>
      
      <div class="inquiry-info-box">
        <a href="tel:032-899-2210" class="inquiry-call-item">
          <span class="inquiry-call-label">옹진군청 관광문화과</span>
          <span class="inquiry-call-number">032-899-2210</span>
        </a>
        <a href="tel:032-899-2114" class="inquiry-call-item">
          <span class="inquiry-call-label">프로그램 관리자</span>
          <span class="inquiry-call-number">032-899-2114</span>
        </a>
      </div>
    </div>
  </div>

  <!-- 우측 하단 플로팅 문의하기 버튼 -->
  <button type="button" class="floating-inquiry-btn" id="btn-inquiry" aria-label="문의하기">
    <svg class="btn-border-svg" viewBox="0 0 72 72">
      <!-- 배경 원 -->
      <circle class="btn-border-bg" cx="36" cy="36" r="34" />
      <!-- 호버 시 채워지는 원 -->
      <circle class="btn-border-active" cx="36" cy="36" r="34" />
    </svg>
    <span class="btn-text-q">?</span>
  </button>

  <div id="toast-container"></div>

</body>
</html>
