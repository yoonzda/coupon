<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="옹진 관광쿠폰">
  <meta property="og:description" content="옹진군 관광객을 위한 디지털 쿠폰 서비스 — 옹진 관광쿠폰으로 더 알뜰한 옹진 여행">
  <meta property="og:image" content="https://ongjincoupon.kr/og-image.png?v=20261007">
  <meta property="og:locale" content="ko_KR">
  <title>가맹점 로그인 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f0fdf4;
      background-image: 
        radial-gradient(circle at 10% 20%, #dcfce7 0%, #f0fdf4 100%);
      position: relative;
      overflow: hidden;
      color: #1e293b;
    }

    /* Decorative blurred glow circles (bright green) */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.08) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-top: 3px solid #10b981;
      border-radius: 0; 
      padding: 56px 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.5s ease-out;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 40px;
    }
    .logo-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #059669; /* green point color */
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400; 
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon-svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      pointer-events: none;
      transition: stroke 0.3s;
    }
    
    input[type="text"], 
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="email"] {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 46px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      font-size: 16px; /* iOS 자동 줌 방지 (16px 이상) */
      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.2s;
      outline: none;
      -webkit-appearance: none;
    }
    #password {
      padding-right: 48px !important;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="text"]:focus, 
    input[type="password"]:focus,
    input[type="tel"]:focus,
    input[type="number"]:focus,
    input[type="email"]:focus {
      border-color: #10b981;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }
    input[type="text"]:focus ~ .input-icon-svg, 
    input[type="password"]:focus ~ .input-icon-svg,
    input[type="tel"]:focus ~ .input-icon-svg,
    input[type="number"]:focus ~ .input-icon-svg,
    input[type="email"]:focus ~ .input-icon-svg {
      stroke: #10b981;
    }
    input::placeholder { color: #94a3b8; }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle svg {
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle:hover svg { stroke: #10b981; }

    .btn-login {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      text-transform: uppercase;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 16px;
      text-align: left;
    }
    .error-msg.show { display: block; }

    /* Input error state */
    input.error {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.03);
    }
    input.error ~ .input-icon-svg {
      stroke: #ef4444;
    }
    
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login Mode Tabs */
    .login-tabs {
      display: flex;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 24px;
      gap: 3px;
    }
    .login-tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      border: none;
      background: none;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    .login-tab-btn:hover {
      color: #0f172a;
    }
    .login-tab-btn.active {
      background: #ffffff;
      color: #059669;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.12);
    }
    .login-tab-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }

    /* OTP Form Styles */
    .phone-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
    }
    .phone-input-row .input-wrap {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
    }
    .phone-input-row input[type="tel"] {
      width: 100% !important;
      display: block;
      font-size: 17px !important;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .btn-send-otp {
      padding: 0 16px;
      background: #ffffff;
      border: 1.5px solid #10b981;
      color: #059669;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-send-otp:hover:not(:disabled) {
      background: #ecfdf5;
      border-color: #059669;
      color: #047857;
    }
    .btn-send-otp:disabled {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .otp-timer-badge {
      font-size: 0.82rem;
      font-weight: 700;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
    }
    .otp-info-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.8rem;
      color: #166534;
      line-height: 1.5;
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .otp-info-box svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
      color: #10b981;
    }

    /* Verification Overlay */
    .verify-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .verify-overlay.active {
      display: flex;
    }
    .verify-overlay p {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #475569;
    }

    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    /* Floating Inquiry Button (bright theme) */
    .floating-inquiry-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      font-family: inherit;
      padding: 0;
    }
    .btn-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .btn-border-bg {
      fill: none;
      stroke: rgba(16, 185, 129, 0.1);
      stroke-width: 1.5;
    }
    .btn-border-active {
      fill: none;
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-text-q {
      color: #059669;
      font-size: 2.2rem;
      font-weight: 500;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      z-index: 10;
    }
    .floating-inquiry-btn:hover .btn-border-active {
      stroke-dashoffset: 0;
    }
    .floating-inquiry-btn:hover .btn-text-q {
      color: #059669;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .floating-inquiry-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.2);
    }
    .floating-inquiry-btn:active {
      transform: scale(0.95);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 0;
      width: 360px;
      padding: 40px 28px 32px 28px;
      position: relative;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.15);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }
    
    .modal-close-x {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .modal-close-x:hover {
      color: #334155;
    }
    .modal-close-x svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    .modal-header-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .title-divider {
      width: 28px;
      height: 2px;
      background: rgba(16, 185, 129, 0.2);
      margin: 12px auto 16px auto;
    }
    .modal-desc {
      color: #475569;
      font-size: 0.85rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
    .modal-desc span {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #0f172a;
    }

    .inquiry-info-box {
      background: rgba(16, 185, 129, 0.05);
      padding: 22px 28px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      border: 1px solid rgba(16, 185, 129, 0.1);
    }
    .inquiry-info-item {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .apply-notice-container {
      margin-top: 32px;
      text-align: center;
    }
    .btn-apply-text-link {
      font-size: 0.88rem;
      color: #059669; /* green point color */
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.2s;
      outline: none;
    }
    .btn-apply-text-link:hover {
      color: #10b981;
    }

    /* ── Responsive & Mobile First Styles ── */
    @media (max-width: 480px) {
      body {
        background: #ffffff;
        background-image: none;
        align-items: flex-start; /* Start from top on mobile */
      }
      
      body::before, body::after {
        display: none; /* Hide background circles for a cleaner layout */
      }

      .login-card {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        border: none;
        border-top: 4px solid #10b981; /* Keep top accent line */
        padding: 48px 24px 32px 24px;
        box-shadow: none;
        background: #ffffff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo-area {
        margin-bottom: 32px;
      }
      
      .logo-title {
        font-size: 2rem; /* Slightly smaller for mobile header space */
      }

      input[type="text"], 
      input[type="password"],
      input[type="tel"],
      input[type="number"],
      input[type="email"] {
        height: 52px;
        padding: 0 14px 0 44px;
        font-size: 16px; /* iOS 자동 줌 방지 (16px 이상) */
        box-sizing: border-box;
      }
      .phone-input-row {
        gap: 8px;
      }
      .phone-input-row input[type="tel"] {
        font-size: 16.5px !important;
        padding-left: 42px !important;
      }
      .btn-send-otp {
        height: 52px;
        padding: 0 14px;
        font-size: 0.88rem;
      }

      .btn-login {
        padding: 16px;
        margin-top: 16px;
      }

      .floating-inquiry-btn {
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
      }
      .btn-text-q {
        font-size: 1.8rem;
      }

      .modal-container {
        width: 90%;
        max-width: 330px;
        padding: 32px 20px 24px 20px;
      }
      .inquiry-info-box {
        padding: 16px 20px;
        gap: 10px;
        margin-top: 20px;
      }
      .inquiry-info-item {
        font-size: 0.88rem;
      }
      
      .apply-notice-container {
        margin-top: 24px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-login-BUQl_qBo.js"></script>

<body>
  <div class="login-card" id="login-card-container">
    <!-- Active validation loading state -->
    <div class="verify-overlay" id="verify-loading">
      <div class="spinner" style="display: block; width: 28px; height: 28px; border-top-color: #10b981;"></div>
      <p>로그인 세션 검증 중...</p>
    </div>

    <div class="logo-area">
      <div style="margin-bottom: 16px;">
        <img src="/assets/images/ongjin-coupon-logo.png" alt="옹진관광쿠폰" style="height: 44px; width: auto; max-width: 160px; object-fit: contain; display: block;" />
      </div>
      <span class="logo-subtitle">옹진관광쿠폰 가맹점</span>
      <div class="logo-title">가맹점 로그인</div>
    </div>

    <!-- 탭 전환 컨트롤 (3분할: 휴대폰 OTP / 아이디 / 직원 PIN) -->
    <div class="login-tabs" role="tablist">
      <button type="button" class="login-tab-btn active" id="tab-otp" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        휴대폰 OTP
      </button>
      <button type="button" class="login-tab-btn" id="tab-id" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        아이디 로그인
      </button>
      <button type="button" class="login-tab-btn" id="tab-staff" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        직원 PIN (스캔)
      </button>
    </div>

    <!-- 1. 아이디 로그인 폼 -->
    <form id="form-merchant-login" style="display: none;" novalidate>
      <div class="form-group">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <rect x="3" y="11" width="18" height="11"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn-login" id="btn-submit">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>

      <div class="apply-notice-container">
        <a href="/tourist/apply-merchant.html" class="btn-apply-text-link">입점 신청하기</a>
      </div>
    </form>

    <!-- 2. 휴대폰 OTP 로그인 폼 (기본 활성) -->
    <form id="form-merchant-otp" novalidate>
      <div class="otp-info-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <div>
          담당 공무원이 직접 등록했거나 승인 완료된 <strong>대표자 휴대전화번호</strong>로 간편하게 인증하여 접속합니다.
        </div>
      </div>

      <div class="form-group">
        <label for="otp-phone">대표자 휴대폰 번호</label>
        <div class="phone-input-row">
          <div class="input-wrap" style="flex: 1; min-width: 0;">
            <input
              type="tel"
              id="otp-phone"
              name="phone"
              placeholder="010-0000-0000"
              maxlength="13"
              autocomplete="tel"
              required
            />
            <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <button type="button" class="btn-send-otp" id="btn-send-otp">인증번호 받기</button>
        </div>
      </div>

      <div class="form-group" id="group-otp-code" style="display: none;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
          <label for="otp-code" style="margin-bottom: 0;">인증번호 6자리</label>
          <span class="otp-timer-badge" id="otp-timer">03:00</span>
        </div>
        <div class="input-wrap">
          <input
            type="text"
            id="otp-code"
            name="otp"
            inputmode="numeric"
            pattern="[0-9]*"
            placeholder="인증번호 6자리 입력"
            maxlength="6"
            autocomplete="one-time-code"
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
      </div>

      <div class="error-msg" id="error-msg-otp"></div>

      <button type="submit" class="btn-login" id="btn-submit-otp" style="display: none;">
        <span class="btn-text">간편 로그인</span>
        <span class="spinner"></span>
      </button>

      <div class="apply-notice-container">
        <a href="/tourist/apply-merchant.html" class="btn-apply-text-link">입점 신청하기</a>
      </div>
    </form>

    <!-- 3. 직원 스캔 전용 PIN 로그인 폼 -->
    <form id="form-merchant-staff" style="display: none;" novalidate>
      <div class="otp-info-box" style="background: #eff6ff; border-color: #bfdbfe; color: #1e40af;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <div>
          점주님이 설정한 <strong>4자리 PIN 번호</strong>로 접속하여 스캔 결제를 진행합니다. (정산/계좌 정보는 안전하게 차단됩니다)
        </div>
      </div>

      <div class="form-group">
        <label for="staff-identifier">매장 번호(ID) 또는 대표자 휴대폰</label>
        <div class="input-wrap">
          <input
            type="text"
            id="staff-identifier"
            name="identifier"
            placeholder="매장 번호(예: 12) 또는 대표자 번호"
            autocomplete="off"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="staff-pin">직원 간편 PIN (4자리)</label>
        <div class="input-wrap">
          <input
            type="password"
            id="staff-pin"
            name="pin"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            placeholder="4자리 숫자 입력"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="staff-pw-toggle" aria-label="PIN 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg-staff"></div>

      <button type="submit" class="btn-login" id="btn-submit-staff" style="background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);">
        <span class="btn-text">스캔 모드로 로그인</span>
        <span class="spinner"></span>
      </button>

      <div class="apply-notice-container">
        <a href="/tourist/apply-merchant.html" class="btn-apply-text-link">가맹점 신규 입점 신청하기</a>
      </div>
    </form>
  </div>

  <!-- 문의하기 모달 레이어 -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal-container">
      <button type="button" class="modal-close-x" id="btn-close-inquiry" aria-label="닫기">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-header-area">
        <h3 class="modal-title">문의 안내</h3>
        <div class="title-divider"></div>
        <p class="modal-desc">
          <span>도움이 필요하신 경우</span>
          아래 담당 부서로 문의해 주시기 바랍니다.
        </p>
      </div>
      
      <div class="inquiry-info-box">
        <div class="inquiry-info-item">옹진군청 :</div>
        <div class="inquiry-info-item">프로그램 관리자 :</div>
      </div>
    </div>
  </div>

  <!-- 우측 하단 플로팅 문의하기 버튼 -->
  <button type="button" class="floating-inquiry-btn" id="btn-inquiry" aria-label="문의하기">
    <svg class="btn-border-svg" viewBox="0 0 72 72">
      <!-- 배경 원 -->
      <circle class="btn-border-bg" cx="36" cy="36" r="34" />
      <!-- 호버 시 채워지는 원 -->
      <circle class="btn-border-active" cx="36" cy="36" r="34" />
    </svg>
    <span class="btn-text-q">?</span>
  </button>

  <div id="toast-container"></div>

</body>
</html>
