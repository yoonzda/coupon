<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>가맹점 로그인 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f0fdf4;
      background-image: 
        radial-gradient(circle at 10% 20%, #dcfce7 0%, #f0fdf4 100%);
      position: relative;
      overflow: hidden;
      color: #1e293b;
    }

    /* Decorative blurred glow circles (bright green) */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(74, 222, 128, 0.08) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-top: 3px solid #10b981;
      border-radius: 0; 
      padding: 56px 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.5s ease-out;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 40px;
    }
    .logo-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: #059669; /* green point color */
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400; 
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon-svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      pointer-events: none;
      transition: stroke 0.3s;
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px 16px 16px 46px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }
    #password {
      padding-right: 48px !important;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #10b981;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
    }
    input[type="text"]:focus ~ .input-icon-svg, 
    input[type="password"]:focus ~ .input-icon-svg {
      stroke: #10b981;
    }
    input::placeholder { color: #94a3b8; }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle svg {
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle:hover svg { stroke: #10b981; }

    .btn-login {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      text-transform: uppercase;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 16px;
      text-align: left;
    }
    .error-msg.show { display: block; }

    /* Input error state */
    input.error {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.03);
    }
    input.error ~ .input-icon-svg {
      stroke: #ef4444;
    }
    
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Verification Overlay */
    .verify-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .verify-overlay.active {
      display: flex;
    }
    .verify-overlay p {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #475569;
    }

    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    /* Floating Inquiry Button (bright theme) */
    .floating-inquiry-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      font-family: inherit;
      padding: 0;
    }
    .btn-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .btn-border-bg {
      fill: none;
      stroke: rgba(16, 185, 129, 0.1);
      stroke-width: 1.5;
    }
    .btn-border-active {
      fill: none;
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-text-q {
      color: #059669;
      font-size: 2.2rem;
      font-weight: 500;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      z-index: 10;
    }
    .floating-inquiry-btn:hover .btn-border-active {
      stroke-dashoffset: 0;
    }
    .floating-inquiry-btn:hover .btn-text-q {
      color: #059669;
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .floating-inquiry-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.2);
    }
    .floating-inquiry-btn:active {
      transform: scale(0.95);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 0;
      width: 360px;
      padding: 40px 28px 32px 28px;
      position: relative;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.15);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }
    
    .modal-close-x {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .modal-close-x:hover {
      color: #334155;
    }
    .modal-close-x svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    .modal-header-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .title-divider {
      width: 28px;
      height: 2px;
      background: rgba(16, 185, 129, 0.2);
      margin: 12px auto 16px auto;
    }
    .modal-desc {
      color: #475569;
      font-size: 0.85rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
    .modal-desc span {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #0f172a;
    }

    .inquiry-info-box {
      background: rgba(16, 185, 129, 0.05);
      padding: 22px 28px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
      border: 1px solid rgba(16, 185, 129, 0.1);
    }
    .inquiry-info-item {
      color: #334155;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* Secondary Outline Button (입점 신청하기) */
    .btn-apply-outline {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      background: #ffffff;
      border: 1px solid #10b981;
      color: #059669;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .btn-apply-outline:hover {
      background: #f0fdf4;
      border-color: #059669;
      color: #047857;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
    }
    .btn-apply-outline:active {
      transform: scale(0.99);
    }

    /* ── Responsive & Mobile First Styles ── */
    @media (max-width: 480px) {
      body {
        background: #ffffff;
        background-image: none;
        align-items: flex-start; /* Start from top on mobile */
      }
      
      body::before, body::after {
        display: none; /* Hide background circles for a cleaner layout */
      }

      .login-card {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        border: none;
        border-top: 4px solid #10b981; /* Keep top accent line */
        padding: 48px 24px 32px 24px;
        box-shadow: none;
        background: #ffffff;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo-area {
        margin-bottom: 32px;
      }
      
      .logo-title {
        font-size: 2rem; /* Slightly smaller for mobile header space */
      }

      input[type="text"], input[type="password"] {
        padding: 15px 15px 15px 44px; /* Optimized mobile padding */
        font-size: 0.95rem;
      }

      .btn-login {
        padding: 16px;
        margin-top: 16px;
      }

      .floating-inquiry-btn {
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
      }
      .btn-text-q {
        font-size: 1.8rem;
      }

      .modal-container {
        width: 90%;
        max-width: 330px;
        padding: 32px 20px 24px 20px;
      }
      .inquiry-info-box {
        padding: 16px 20px;
        gap: 10px;
        margin-top: 20px;
      }
      .inquiry-info-item {
        font-size: 0.88rem;
      }
      
      .apply-notice-container {
        margin-top: 24px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-login-BIHJ-pi4.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BrJ7NzZM.js">
</head>
<body>
  <div class="login-card" id="login-card-container">
    <!-- Active validation loading state -->
    <div class="verify-overlay" id="verify-loading">
      <div class="spinner" style="display: block; width: 28px; height: 28px; border-top-color: #10b981;"></div>
      <p>로그인 세션 검증 중...</p>
    </div>

    <div class="logo-area">
      <span class="logo-subtitle">옹진 관광 쿠폰</span>
      <div class="logo-title">가맹점 로그인</div>
    </div>

    <!-- 로그인 폼 -->
    <form id="form-merchant-login" novalidate>
      <div class="form-group">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <rect x="3" y="11" width="18" height="11"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn-login" id="btn-submit">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>

      <a href="/tourist/apply-merchant.html" class="btn-apply-outline">입점 신청하기</a>
    </form>
  </div>

  <!-- 문의하기 모달 레이어 -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal-container">
      <button type="button" class="modal-close-x" id="btn-close-inquiry" aria-label="닫기">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-header-area">
        <h3 class="modal-title">문의 안내</h3>
        <div class="title-divider"></div>
        <p class="modal-desc">
          <span>도움이 필요하신 경우</span>
          아래 담당 부서로 문의해 주시기 바랍니다.
        </p>
      </div>
      
      <div class="inquiry-info-box">
        <div class="inquiry-info-item">옹진군청 :</div>
        <div class="inquiry-info-item">프로그램 관리자 :</div>
      </div>
    </div>
  </div>

  <!-- 우측 하단 플로팅 문의하기 버튼 -->
  <button type="button" class="floating-inquiry-btn" id="btn-inquiry" aria-label="문의하기">
    <svg class="btn-border-svg" viewBox="0 0 72 72">
      <!-- 배경 원 -->
      <circle class="btn-border-bg" cx="36" cy="36" r="34" />
      <!-- 호버 시 채워지는 원 -->
      <circle class="btn-border-active" cx="36" cy="36" r="34" />
    </svg>
    <span class="btn-text-q">?</span>
  </button>

  <div id="toast-container"></div>

</body>
</html>
