<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>거래 내역 | 옹진관광 가맹점</title>
  <style>
    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .summary-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }
    .summary-value { font-size: 1.3rem; font-weight: 900; color: var(--primary-dark); }
    .summary-label { font-size: .72rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-icon {
      width: 40px; height: 40px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .tx-icon.offline { background: #fef9c3; }
    .tx-info { flex: 1; min-width: 0; }
    .tx-type { font-size: .82rem; font-weight: 700; color: var(--text-primary); }
    .tx-date { font-size: .72rem; color: var(--text-muted); margin-top: 2px; }
    .tx-amount { font-size: 1rem; font-weight: 800; color: var(--success); flex-shrink: 0; }
  </style>
  <script type="module" crossorigin src="/assets/merchant-history-BwAfYjlN.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
  <link rel="stylesheet" crossorigin href="/assets/main-BSX2ofZY.css">
</head>
<body>

    <header class="app-header">
      <button onclick="history.back()" style="padding:8px;">

          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <div class="logo">📋 거래 내역</div>
    </header>

    <main class="page-content">
      <!-- 요약 -->
      <div class="summary-row" id="summary-row">
        <div class="summary-box skeleton" style="height:72px;"></div>
        <div class="summary-box skeleton" style="height:72px;"></div>
      </div>

      <!-- 목록 -->
      <div class="card" style="overflow:hidden;">
        <div id="tx-list">
          <div class="tx-item"><div class="skeleton" style="height:40px;width:100%;"></div></div>
          <div class="tx-item"><div class="skeleton" style="height:40px;width:100%;"></div></div>
          <div class="tx-item"><div class="skeleton" style="height:40px;width:100%;"></div></div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav">

          <rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/>
          <rect x="2" y="14" width="8" height="8" rx="1"/>
          <path d="M14 14h2v2h-2zm4 0h2v2h-2zm0 4h2v2h-2zm-4 0h2v4h-2z"/>

        스캔

      <a href="/merchant/history.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>
        </svg>
        거래 내역

    </nav>
  </div>
