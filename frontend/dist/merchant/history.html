    .tabbar .tab-item, .tab-bar .tab-item {

      align-items: center !important;
      justify-content: center !important;

    .tabbar .tab-item .label, .tab-bar .tab-item .label {

      letter-spacing: -0.02em !important;
      white-space: nowrap !important;
      line-height: 1 !important;
    }
    .tabbar .tab-item.active, .tab-bar .tab-item.active,

      padding: 16px;

    }

      gap: 4px;

    .tx-type-tag {

      align-items: center;

      font-weight: 700;

    .tx-type-tag.paper {

    .tx-right-col {

    .modal-overlay {

      backdrop-filter: blur(4px);

      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      padding: 20px;

    .modal-overlay.active {

    .modal-card {
