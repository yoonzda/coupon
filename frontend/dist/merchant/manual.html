<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>수동 등록 | 옹진관광 가맹점</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html, body {
      background: #f8fafc !important;
      color: #0f172a !important;
      min-height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* 좌측 상단 원형 동그라미 뒤로가기 버튼 */
    .btn-top-back {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 50% !important;
      text-decoration: none;
      transition: all 0.2s ease;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn-top-back:hover {
      color: #059669;
      border-color: #059669;
      background: #fafdfb;
      transform: scale(1.05);
    }

    /* 화면 전체 중앙 스케일 컨테이너 */
    .manual-fullscreen-container {
      width: 100vw;
      min-height: 100dvh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .manual-content-wrapper {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .manual-title-group {
      text-align: center;
    }

    /* 수동 등록 제목 */
    .manual-title {
      font-size: 2rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
      margin: 0;
    }

    /* 폼 그룹 스타일 */
    .manual-form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-field-wrapper {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    .input-field-wrapper:focus-within {
      border-color: #059669;
      box-shadow: 0 0 0 3.5px rgba(5, 150, 105, 0.12);
    }

    .input-field-wrapper input {
      width: 100%;
      padding: 18px 20px;
      font-size: 1.15rem;
      font-weight: 700;
      border: none !important;
      outline: none;
      color: #0f172a;
      background: transparent;
      text-align: center;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .input-field-wrapper input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }

    .btn-manual-submit {
      width: 100%;
      padding: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      background: #059669;
      color: #ffffff;
      border: none !important;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    .btn-manual-submit:hover {
      background: #047857;
    }

    .manual-desc {
      font-size: 0.93rem;
      color: #64748b;
      line-height: 1.65;
      text-align: center;
      margin: 0;
      width: 100%;
      word-break: keep-all;
    }

    /* 팝업 모달 오버레이 */
    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    .result-modal-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 !important;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      color: #0f172a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .result-modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #64748b !important;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .result-modal-amount {
      font-size: 2.3rem;
      font-weight: 900;
      color: #059669;
    }

    .result-modal-desc {
      font-size: 0.96rem;
      font-weight: 500;
      color: #475569;
      line-height: 1.6;
      margin: 2px 0 0 0;
      word-break: keep-all;
    }

    .btn-modal-confirm {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      background: #059669;
      color: #ffffff;
      border: none !important;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s ease;
    }

    .btn-modal-confirm:hover {
      background: #047857;
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-manual-BgVVpY98.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BxOpvEgq.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <!-- 좌측 상단 원형 동그라미 뒤로가기 버튼 -->
  <a class="btn-top-back" href="/merchant/index.html" title="메인 메뉴로 이동">
    <svg style="width: 22px; height: 22px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
    </svg>
  </a>

  <!-- 모던 수동 등록 레이아웃 -->
  <div class="manual-fullscreen-container">
    <div class="manual-content-wrapper">
      <div class="manual-title-group">
        <h1 class="manual-title">수동 등록</h1>
      </div>

      <div class="manual-form-group">
        <div class="input-field-wrapper">
          <!-- '예:' 문구 제거 및 자릿수 명시 깔끔한 플레이스홀더 -->
          <input type="text" id="manual-code" placeholder="쿠폰 번호 12자리를 입력해 주세요" autocomplete="off" maxLength="14" />
        </div>
        <button type="button" class="btn-manual-submit" id="btn-manual">
          조회 및 결제하기
        </button>
      </div>

      <p class="manual-desc">
        종이 지류 쿠폰 번호 또는 모바일 문자로 전달받으신 12자리 무작위 쿠폰 코드를 입력창에 타이핑하여 결제 승인을 진행할 수 있습니다.
      </p>
    </div>

    <!-- 결과 모달 -->
    <div class="result-overlay" id="result-overlay">
      <div class="result-modal-card">
        <h3 class="result-modal-title" id="result-badge">결제 실패</h3>
        <div class="result-modal-amount" id="result-amount"></div>
        <p class="result-modal-desc" id="result-msg">입력하신 쿠폰 번호를 다시 한번 확인해 주세요.</p>
        <button type="button" class="btn-modal-confirm" id="btn-result-confirm">확인</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
