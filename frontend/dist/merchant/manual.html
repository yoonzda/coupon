<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>요청 보기 | 옹진관광 가맹점</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html.font-scale-anim {
      transition: font-size 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    }

    html, body {
      background: #f8fafc !important;
      color: #0f172a !important;
      min-height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* 좌측 상단 원형 동그라미 뒤로가기 버튼 (history.html, etc.html과 완벽 통일) */
    .btn-top-back {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 50% !important;
      text-decoration: none;
      transition: all 0.2s ease;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn-top-back:hover {
      color: #059669;
      border-color: #059669;
      background: #fafdfb;
      transform: scale(1.05);
    }

    /* 화면 전체 레이아웃 (history.html과 동일) */
    .history-fullscreen-container {
      width: 100vw;
      min-height: 100dvh;
      padding: 80px 24px 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .history-content-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    html[data-font-scale="large"] .history-content-wrapper {
      max-width: 620px;
    }

    .history-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .history-title {
      font-size: 2rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.5px;
      margin: 0;
    }

    /* 2행 양끝 정렬 보드 (history.html과 동일) */
    .summary-rows-board {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 4px 20px 4px;
      border-bottom: 2px solid #e2e8f0;
    }

    .summary-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .summary-row-label {
      font-size: 1rem;
      font-weight: 600;
      color: #475569;
    }

    .summary-val-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .num-text {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }

    .unit-text {
      font-size: 1rem;
      font-weight: 600;
      color: #475569;
    }

    /* 섹션 공통 (history.html과 동일) */
    .tx-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tx-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1.5px solid #f1f5f9;
    }

    .tx-section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }

    .tx-section-sub {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 500;
    }

    .tx-list-container {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 플랫 요청 행 */
    .tx-item-row {
      padding: 18px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .tx-item-row.pending-row {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 20px 16px;
      background: #ffffff;
      border: 1.5px solid #059669;
      margin-bottom: 10px;
    }

    .pending-top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tx-info-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 9px;
      color: #059669;
      background: #ecfdf5;
      border: 1.5px solid #a7f3d0;
      white-space: nowrap;
    }

    .tx-badge.rejected {
      color: #dc2626;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .tx-badge.cancelled {
      color: #64748b;
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .tx-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #0f172a;
    }

    .tx-sub {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 3px;
    }

    .tx-val-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .tx-val-num {
      font-size: 1.05rem;
      font-weight: 700;
      color: #059669;
    }

    .pending-actions {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .btn-approve {
      height: 44px;
      background: #059669;
      color: #ffffff;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-approve:hover {
      background: #047857;
    }

    .btn-reject {
      height: 44px;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #cbd5e1;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-reject:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fecaca;
    }

    /* 빈 데이터 상태 (history.html과 동일) */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #64748b;
    }

    .empty-icon {
      width: 44px;
      height: 44px;
      color: #cbd5e1;
      stroke-width: 1.2;
    }

    .empty-text {
      font-size: 0.95rem;
      font-weight: 500;
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-manual-LgSKS_6f.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BxOpvEgq.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <!-- 좌측 상단 원형 동그라미 뒤로가기 버튼 -->
  <a class="btn-top-back" href="/merchant/index.html" title="메인 메뉴로 이동">
    <svg style="width: 22px; height: 22px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
    </svg>
  </a>

  <div class="history-fullscreen-container">
    <div class="history-content-wrapper">
      <div class="history-header">
        <h1 class="history-title">쿠폰 사용 요청</h1>
      </div>

      <!-- 요약 보드 (history.html과 동일 구조) -->
      <div class="summary-rows-board">
        <div class="summary-row">
          <span class="summary-row-label">승인 대기 요청</span>
          <div class="summary-val-wrap">
            <span class="num-text" id="pending-count-num">0</span>
            <span class="unit-text">건</span>
          </div>
        </div>
        <div class="summary-row">
          <span class="summary-row-label">대기 요청 금액</span>
          <div class="summary-val-wrap">
            <span class="num-text" id="pending-amount-num">0</span>
            <span class="unit-text">원</span>
          </div>
        </div>
      </div>

      <!-- 승인 대기 중인 요청 섹션 -->
      <div class="tx-section">
        <div class="tx-section-header">
          <h3 class="tx-section-title">승인 대기 요청</h3>
          <span class="tx-section-sub">실시간 갱신</span>
        </div>

        <div class="tx-list-container" id="pending-list">
          <div class="empty-state">
            <svg class="empty-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
            <span class="empty-text">현재 대기 중인 사용 요청이 없습니다.</span>
          </div>
        </div>
      </div>

      <!-- 최근 처리 내역 섹션 -->
      <div class="tx-section">
        <div class="tx-section-header">
          <h3 class="tx-section-title">최근 처리 내역</h3>
          <span class="tx-section-sub">최근 20건</span>
        </div>

        <div class="tx-list-container" id="processed-list">
          <div class="empty-state">
            <span class="empty-text">최근 처리된 요청 내역이 없습니다.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

</body>
</html>
