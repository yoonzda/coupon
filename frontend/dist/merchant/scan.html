<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="QR 스캔 결제 — 옹진관광 쿠폰 가맹점" />
  <title>쿠폰 스캔 | 옹진관광 가맹점</title>
  <style>
    /* 스캔 영역 */
    .scan-zone {
      background: linear-gradient(160deg, #065f46 0%, #059669 100%);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .scan-frame {
      width: 220px; height: 220px;
      border-radius: var(--radius-lg);
      border: 3px solid rgba(255,255,255,.4);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(0,0,0,.3);
    }
    /* 모서리 마커 */
    .scan-frame::before, .scan-frame::after,
    .scan-frame > span::before, .scan-frame > span::after {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-color: #fff;
      border-style: solid;
    }
    .scan-frame::before  { top:8px; left:8px;   border-width: 3px 0 0 3px; }
    .scan-frame::after   { top:8px; right:8px;  border-width: 3px 3px 0 0; }
    .scan-frame > span::before { bottom:8px; left:8px;  border-width: 0 0 3px 3px; }
    .scan-frame > span::after  { bottom:8px; right:8px; border-width: 0 3px 3px 0; }

    .scan-line {
      position: absolute;
      width: 80%; height: 2px;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%  { top: 20%; }
      50% { top: 80%; }
      100%{ top: 20%; }
    }

    .scan-placeholder {
      font-size: 3rem;
      opacity: .5;
    }

    .scan-label {
      color: rgba(255,255,255,.9);
      font-size: .88rem;
      font-weight: 500;
      text-align: center;
    }

    /* 결제 결과 */
    .result-card {
      border-radius: var(--radius-xl);
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: popIn .3s var(--ease);
    }
    @keyframes popIn {
      from { transform: scale(.92); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .result-card.success { background: #dcfce7; border: 2px solid #86efac; }
    .result-card.error   { background: #fee2e2; border: 2px solid #fca5a5; }
    .result-icon { font-size: 3rem; }
    .result-amount { font-size: 2rem; font-weight: 900; color: #15803d; }
    .result-msg    { font-size: .9rem; color: var(--text-secondary); }

    /* 오프라인 배너 */
    .offline-banner {
      background: #fef3c7;
      border: 1px solid #fde68a;
      padding: 10px 16px;
      font-size: .82rem;
      color: #92400e;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .offline-banner.hidden { display: none; }

    /* 수동 입력 */
    .manual-section {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-scan-BRC9GpMn.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-vtkRPzLV.js">
  <link rel="stylesheet" crossorigin href="/assets/api-BkjUHGKL.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="logo">🏪 쿠폰 스캔</div>
      <a href="/merchant/history.html" style="font-size:.8rem;color:var(--text-secondary);">거래 내역</a>
    </header>

    <!-- 오프라인 배너 -->
    <div class="offline-banner hidden" id="offline-banner">
      📡 오프라인 상태 — 스캔 결과가 임시 저장됩니다
    </div>

    <!-- 스캔 존 -->
    <div class="scan-zone">
      <!-- 카메라 촬영 트리거 -->
      <label class="scan-frame" for="camera-input" style="cursor:pointer;">
        <span></span><!-- 모서리 마커용 -->
        <div class="scan-line"></div>
        <div id="scan-placeholder" class="scan-placeholder">📷</div>
      </label>
      <input type="file" accept="image/*" capture="camera"
        id="camera-input" style="display:none;" />
      <p class="scan-label">카메라 아이콘을 눌러 QR / 바코드를 스캔하세요</p>
    </div>

    <!-- 결과 카드 -->
    <div id="result-area" style="padding:16px;display:none;"></div>

    <!-- 수동 입력 -->
    <div class="manual-section">
      <p class="section-title" style="margin-bottom:0;">수동 입력</p>
      <div style="display:flex;gap:8px;">
        <input class="form-input" id="manual-code" type="text"
          placeholder="쿠폰 번호 직접 입력" style="flex:1;"
          autocomplete="off" />
        <button class="btn btn-primary" id="btn-manual" style="padding:12px 16px;flex-shrink:0;">
          확인
        </button>
      </div>
    </div>

    <!-- 오프라인 대기열 현황 -->
    <div style="padding: 0 20px 16px;">
      <div class="card card-p" id="queue-card" style="display:none;">
        <p style="font-size:.82rem;color:var(--text-secondary);">
          📦 오프라인 임시 저장: <strong id="queue-count">0</strong>건
          <button id="btn-sync" style="margin-left:8px;font-size:.78rem;color:var(--primary);font-weight:600;text-decoration:underline;background:none;border:none;cursor:pointer;">
            지금 동기화
          </button>
        </p>
      </div>
    </div>

    <!-- 바텀 네비 -->
    <nav class="bottom-nav">
      <a href="/merchant/scan.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/>
          <rect x="2" y="14" width="8" height="8" rx="1"/>
          <path d="M14 14h2v2h-2zm4 0h2v2h-2zm0 4h2v2h-2zm-4 0h2v4h-2z"/>
        </svg>
        스캔
      </a>
      <a href="/merchant/history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 12h6M9 16h4"/>
        </svg>
        거래 내역
      </a>
      <a href="/merchant/index.html" id="nav-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        로그아웃
      </a>
    </nav>
  </div>

  <div id="toast-container"></div>

  <!-- jsQR CDN (QR 디코딩) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

</body>
</html>
