<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>쿠폰 스캔 | 옹진관광 가맹점</title>
  <style>
    * {
      box-sizing: border-box;
      border-radius: 0 !important;
    }

    html, body {
      background: #000000 !important;
      color: #ffffff !important;
      min-height: 100dvh;
      width: 100vw;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* 좌측 상단 원형 동그라미 뒤로가기 버튼 */
    .btn-top-back {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50% !important;
      text-decoration: none;
      transition: all 0.2s ease;
      z-index: 50;
    }

    .btn-top-back:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.05);
    }

    /* 화면 전체 중앙 스캐너 컨테이너 */
    .scan-fullscreen-container {
      width: 100vw;
      min-height: 100dvh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #000000 !important;
    }

    .scan-title-group {
      text-align: center;
    }

    .scan-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff !important;
      letter-spacing: -0.5px;
      margin: 0;
    }

    /* 깨끗하고 시원한 320px 대형 뷰파인더 */
    .viewfinder-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      max-width: 82vw;
      max-height: 82vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0 !important;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      transition: border-color 0.3s ease;
    }

    .viewfinder-wrapper:hover {
      border-color: rgba(16, 185, 129, 0.5);
    }

    /* 네 모서리 샤프 녹색 브래킷 */
    .corner-bracket {
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: #10b981;
      border-style: solid;
      z-index: 5;
    }
    .corner-tl { top: 0; left: 0; border-width: 3.5px 0 0 3.5px; }
    .corner-tr { top: 0; right: 0; border-width: 3.5px 3.5px 0 0; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 3.5px 3.5px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 3.5px 3.5px 0; }

    /* 미니멀 조준 타겟 (십자선) */
    .target-crosshair {
      position: absolute;
      width: 24px;
      height: 24px;
      opacity: 0.35;
    }
    .target-crosshair::before, .target-crosshair::after {
      content: '';
      position: absolute;
      background: #10b981;
    }
    .target-crosshair::before {
      top: 11px; left: 0; width: 24px; height: 2px;
    }
    .target-crosshair::after {
      top: 0; left: 11px; width: 2px; height: 24px;
    }

    /* 레이저 스캔 라이트 */
    .scan-laser {
      position: absolute;
      width: 100%;
      height: 2.5px;
      background: #10b981;
      box-shadow: 0 0 15px #10b981, 0 0 30px #10b981;
      animation: laserMove 2.2s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes laserMove {
      0% { top: 6%; opacity: 0.2; }
      50% { top: 94%; opacity: 1; }
      100% { top: 6%; opacity: 0.2; }
    }

    /* 하단 스캔 안내 설명 문구 */
    .scan-guide-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #94a3b8 !important;
      text-align: center;
      line-height: 1.65;
      width: 100%;
      word-break: keep-all;
    }

    /* PC 안내 팝업 모달 */
    .pc-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .pc-modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0 !important;
      padding: 40px 36px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .pc-modal-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .pc-modal-desc {
      width: 88%;
      margin: 0 auto;
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.65;
      word-break: keep-all;
      text-align: center;
    }

    .btn-manual-action {
      width: 88%;
      padding: 16px;
      background: #059669;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 0 !important;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .btn-manual-action:hover {
      background: #047857;
    }

    /* 스캔 결과 모달 오버레이 */
    .result-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    .result-modal-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1.5px solid #0f172a;
      border-radius: 0 !important;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      color: #0f172a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* 타이틀만 명확한 1.3rem */
    .result-modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #64748b !important;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .result-modal-amount {
      font-size: 2.3rem;
      font-weight: 900;
      color: #059669;
    }

    /* 본문 메시지는 과하게 크지 않고 정돈된 0.96rem 적용 */
    .result-modal-desc {
      font-size: 0.96rem;
      font-weight: 500;
      color: #475569;
      line-height: 1.6;
      margin: 2px 0 0 0;
      word-break: keep-all;
    }

    .btn-modal-confirm {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      background: #059669;
      color: #ffffff;
      border: none !important;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s ease;
    }

    .btn-modal-confirm:hover {
      background: #047857;
    }
  </style>
  <script type="module" crossorigin src="/assets/merchant-scan-DUaf9NtY.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BrJ7NzZM.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DX88ZaSx.css">
</head>
<body>
  <!-- 좌측 상단 원형 동그라미 뒤로가기 버튼 -->
  <a class="btn-top-back" href="/merchant/index.html" title="메인 메뉴로 이동">
    <svg style="width: 22px; height: 22px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
    </svg>
  </a>

  <!-- 화면 전체 검정 스캐너 영역 -->
  <div class="scan-fullscreen-container">
    <div class="scan-title-group">
      <h1 class="scan-title">쿠폰 스캔</h1>
    </div>

    <!-- 카메라 아이콘 없는 직각 320px 대형 뷰파인더 -->
    <label class="viewfinder-wrapper" id="scan-trigger-label" title="터치하여 카메라 스캔 시작">
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>
      <div class="target-crosshair"></div>
      <div class="scan-laser"></div>
    </label>

    <input type="file" accept="image/*" capture="camera" id="camera-input" style="display:none;" />

    <p class="scan-guide-text">
      스캐너 뷰파인더 영역을 터치하시면 카메라 스캔 모드가 실행됩니다.<br/>
      손님의 모바일 쿠폰 QR 코드 또는 바코드를 프레임에 맞춰주세요.
    </p>

    <!-- 결과 모달 -->
    <div class="result-overlay" id="result-overlay">
      <div class="result-modal-card">
        <h3 class="result-modal-title" id="result-badge">결제 실패</h3>
        <div class="result-modal-amount" id="result-amount"></div>
        <p class="result-modal-desc" id="result-msg">스캔하신 쿠폰 번호를 다시 한번 확인해 주세요.</p>
        <button type="button" class="btn-modal-confirm" id="btn-result-confirm">확인</button>
      </div>
    </div>
  </div>

  <!-- PC 모달 -->
  <div class="pc-modal" id="pc-modal">
    <div class="pc-modal-content">
      <h3 class="pc-modal-title">모바일 전용 카메라 스캔</h3>
      <p class="pc-modal-desc">
        현재 접속하신 PC 환경에서는 웹캠 장비 미연결이나 브라우저 권한 설정 문제로 <strong>카메라 자동 스캔이 제한</strong>될 수 있습니다.<br/><br/>
        손님이 제시한 쿠폰 번호(모바일 문자 또는 지류)를 직접 입력하여 즉시 승인할 수 있는 아래 버튼을 클릭하여 이동해 주세요.
      </p>
      <button class="btn-manual-action" id="btn-to-manual">
        수동으로 등록하기
      </button>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

</body>
</html>
