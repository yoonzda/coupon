<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    :root {
      --merchant-primary: #059669;
      --merchant-primary-deep: #064E3B;
      --merchant-accent: #10B981;
    }

    /* ── 가맹점 하단 네비게이션 탭바 (가로 균등 정렬 완벽 보장) ── */
    .tabbar, .tab-bar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      margin: 0 auto !important;
      width: 100% !important;
      max-width: 440px !important;
      height: calc(68px + env(safe-area-inset-bottom, 0px)) !important;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      background: rgba(255, 255, 255, 0.98) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-top: 1px solid #E2E8F0 !important;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-around !important;
      align-items: center !important;
      z-index: 9999 !important;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05) !important;
      box-sizing: border-box !important;
    }
    .tabbar .tab-item, .tab-bar .tab-item {
      flex: 1 1 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px !important;
      padding: 4px 2px !important;
      text-decoration: none !important;
      color: #64748B !important;
      cursor: pointer !important;
      background: transparent !important;
      border: none !important;
      font-family: inherit !important;
      transition: all 0.2s ease !important;
      -webkit-tap-highlight-color: transparent !important;
      min-width: 0 !important;
      box-sizing: border-box !important;
    }
    .tabbar .tab-item svg, .tab-bar .tab-item svg {
      width: 24px !important;
      height: 24px !important;
      stroke: #64748B !important;
      flex-shrink: 0 !important;
      transition: stroke 0.2s ease, transform 0.2s ease !important;
    }
    .tabbar .tab-item .label, .tab-bar .tab-item .label {
      font-size: 11.5px !important;
      font-weight: 500 !important;
      color: #64748B !important;
      letter-spacing: -0.02em !important;
      white-space: nowrap !important;
      line-height: 1 !important;
    }
    .tabbar .tab-item.active, .tab-bar .tab-item.active,
    .tabbar .tab-item[data-active="true"], .tab-bar .tab-item[data-active="true"] {
      color: var(--merchant-primary) !important;
    }
    .tabbar .tab-item.active svg, .tab-bar .tab-item.active svg,
    .tabbar .tab-item[data-active="true"] svg, .tab-bar .tab-item[data-active="true"] svg {
      stroke: var(--merchant-primary) !important;
      transform: translateY(-1px) !important;
    }
    .tabbar .tab-item.active .label, .tab-bar .tab-item.active .label,
    .tabbar .tab-item[data-active="true"] .label, .tab-bar .tab-item[data-active="true"] .label {
      font-weight: 700 !important;
      color: var(--merchant-primary) !important;
    }
    .app-container .scroll {
      padding-bottom: 96px !important;
    }

    /* ── 서브페이지 공통 헤더 ── */
    .subpage-header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-bottom: 1px solid #EEF0F2;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .subpage-header .btn-back {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--fg-strong, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .subpage-header .btn-back:hover {
      background: rgba(5, 150, 105, 0.08);
      color: var(--merchant-primary);
    }
    .subpage-header .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--fg-strong);
      letter-spacing: -0.03em;
    }

    /* ── 오프라인 감지 배너 ── */
    .offline-banner {
      background: #FEF3C7;
      border-bottom: 1px solid #FDE68A;
      padding: 10px 16px;
      font-size: 13px;
      color: #92400E;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .offline-banner.hidden { display: none; }

    /* ── 스캔 존 (POS 스타일 뷰파인더) ── */
    .scan-zone {
      background: linear-gradient(165deg, #064E3B 0%, #065F46 45%, #047857 100%);
      padding: 24px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .scan-zone::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.2) 0%, transparent 70%);
      top: -80px;
      pointer-events: none;
    }

    /* 실시간 카메라 뷰파인더 프레임 */
    .scan-frame {
      width: 270px;
      height: 270px;
      max-width: 78vw;
      max-height: 78vw;
      border-radius: 26px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0B1320;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scan-frame.scan-success {
      border-color: #10B981 !important;
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.6) !important;
      transform: scale(1.02);
    }
    .scan-frame.scan-error {
      border-color: #EF4444 !important;
      box-shadow: 0 0 32px rgba(239, 68, 68, 0.5) !important;
    }

    /* 실시간 비디오 엘리먼트 */
    #scanner-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0B1320;
      z-index: 1;
    }

    /* 4방 모서리 가이드 마커 */
    .scan-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }
    .scan-corners::before, .scan-corners::after,
    .scan-corners > span::before, .scan-corners > span::after {
      content: '';
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: #34D399;
      border-style: solid;
      filter: drop-shadow(0 0 4px rgba(52, 211, 153, 0.5));
    }
    .scan-corners::before  { top: 12px; left: 12px; border-width: 3.5px 0 0 3.5px; border-radius: 6px 0 0 0; }
    .scan-corners::after   { top: 12px; right: 12px; border-width: 3.5px 3.5px 0 0; border-radius: 0 6px 0 0; }
    .scan-corners > span::before { bottom: 12px; left: 12px; border-width: 0 0 3.5px 3.5px; border-radius: 0 0 0 6px; }
    .scan-corners > span::after  { bottom: 12px; right: 12px; border-width: 0 3.5px 3.5px 0; border-radius: 0 0 6px 0; }

    /* 레이저 스캔 애니메이션 */
    .scan-laser {
      position: absolute;
      left: 8%;
      width: 84%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #34D399, transparent);
      box-shadow: 0 0 14px 2px #34D399;
      z-index: 3;
      pointer-events: none;
      animation: scanLaserMove 2s ease-in-out infinite alternate;
    }
    @keyframes scanLaserMove {
      0%   { top: 15%; opacity: 0.3; }
      50%  { opacity: 1; }
      100% { top: 85%; opacity: 0.3; }
    }

    /* 카메라 오버레이 (로딩/에러/일시정지) */
    .scanner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 32, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #FFFFFF;
      transition: opacity 0.25s ease;
    }
    .scanner-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #34D399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 스캔 컨트롤 버튼 툴바 */
    .scan-toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 5;
      width: 100%;
      max-width: 320px;
    }
    .btn-tool {
      flex: 1;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
      white-space: nowrap;
      padding: 0 8px;
    }
    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .btn-tool:active {
      transform: scale(0.97);
    }
    .btn-tool.active {
      background: #10B981;
      border-color: #10B981;
      color: #FFFFFF;
    }

    .scan-label-text {
      color: rgba(255, 255, 255, 0.95);
      font-size: 13.5px;
      font-weight: 500;
      text-align: center;
      line-height: 1.45;
      margin: 0;
      z-index: 5;
    }

    /* ── 결과 모달/카드 ── */
    .result-card-box {
      margin: 16px 20px 0;
      padding: 22px 20px;
      border-radius: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    @keyframes popIn {
      from { transform: scale(0.93) translateY(8px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .result-card-box.success {
      background: #ECFDF5;
      border: 2px solid #A7F3D0;
    }
    .result-card-box.error {
      background: #FEF2F2;
      border: 2px solid #FECACA;
    }
    .result-card-box .res-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-card-box.success .res-icon { background: #10B981; color: #FFFFFF; }
    .result-card-box.error .res-icon { background: #EF4444; color: #FFFFFF; }
    .result-card-box .res-amount {
      font-size: 28px;
      font-weight: 800;
      color: #065F46;
      letter-spacing: -0.03em;
    }
    .result-card-box .res-msg {
      font-size: 16px;
      font-weight: 700;
      color: var(--fg-strong);
    }
    .result-card-box .res-detail {
      font-size: 13px;
      color: #DC2626;
      line-height: 1.45;
      background: rgba(254, 226, 226, 0.6);
      padding: 8px 12px;
      border-radius: 10px;
      word-break: keep-all;
    }
    .result-card-box .btn-next-scan {
      margin-top: 6px;
      padding: 10px 24px;
      background: #059669;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .result-card-box .btn-next-scan:hover {
      background: #047857;
    }

    /* ── 수동 입력 섹션 ── */
    .manual-section {
      padding: 20px 20px 16px;
    }
    .manual-card {
      background: #FFFFFF;
      border: 1px solid #EEF0F2;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .manual-card .card-t {
      font-size: 15px;
      font-weight: 700;
      color: var(--fg-strong);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .manual-input-row {
      display: flex;
      gap: 8px;
    }
    .manual-input-row input {
      flex: 1;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      outline: none;
      min-width: 0;
      text-transform: uppercase;
      font-family: monospace;
    }
    .manual-input-row input:focus {
      border-color: var(--merchant-primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .manual-input-row button {
      padding: 0 20px;
      height: 48px;
      background: var(--merchant-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .manual-input-row button:active {
      background: var(--merchant-primary-deep);
    }

    /* ── 오프라인 큐 알림 카드 ── */
    .queue-box {
      margin: 0 20px 20px;
      padding: 12px 16px;
      background: #FFFBEB;
      border: 1px dashed #F59E0B;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #B45309;
    }
    .queue-box button {
      background: #F59E0B;
      color: #FFFFFF;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── 토스트 알림 (명확한 피드백 표시) ── */
    #toast-container {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 20px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      line-height: 1.4;
      animation: toastSlideUp 0.3s ease, toastFadeOut 0.3s ease 2.7s forwards;
      pointer-events: auto;
    }
    .toast.success {
      background: #059669;
      border-color: #34D399;
    }
    .toast.error {
      background: #DC2626;
      border-color: #F87171;
    }
    .toast.warning {
      background: #D97706;
      border-color: #FBBF24;
    }
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastFadeOut {
      to   { opacity: 0; transform: translateY(-8px); }
    }
  </style>

<body>
  <div class="app-container">
    <div class="scroll">

      <!-- 서브페이지 공통 헤더 -->
      <div class="subpage-header">
        <a href="/merchant/index.html" class="btn-back" title="가맹점 홈으로 이동">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
        <div class="title">쿠폰 스캔 결제</div>
      </div>

      <!-- 오프라인 감지 배너 -->
      <div class="offline-banner hidden" id="offline-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        <span>오프라인 상태 — 스캔 결과가 기기에 임시 저장됩니다</span>
      </div>

      <!-- ── 실시간 카메라 스캔 존 ── -->
      <div class="scan-zone">
        <!-- 카메라 뷰파인더 -->
        <div class="scan-frame" id="scan-frame-box">
          <!-- 비디오 스트림 -->
          <video id="scanner-video" playsinline autoplay muted></video>
          <canvas id="scanner-canvas" style="display:none;"></canvas>

          <!-- 4방향 코너 마커 -->
          <div class="scan-corners">
            <span></span>
          </div>

          <!-- 실시간 스캔 레이저 라인 -->
          <div class="scan-laser" id="scan-laser"></div>

          <!-- 오버레이 (로딩/권한 거부 등) -->
          <div class="scanner-overlay" id="scanner-overlay">
            <div class="spinner" id="scanner-spinner"></div>
            <div id="overlay-msg" style="font-size:14px; font-weight:600; line-height:1.4;">카메라 연결 중...</div>
            <button type="button" id="btn-retry-camera" style="display:none; margin-top:12px; padding:7px 16px; background:#10B981; color:#fff; border:none; border-radius:10px; font-size:12.5px; font-weight:700; cursor:pointer;">카메라 다시 켜기</button>
          </div>
        </div>

        <!-- 스캐너 컨트롤 툴바 -->
        <div class="scan-toolbar">
          <button type="button" class="btn-tool" id="btn-switch-camera" title="전면/후면 카메라 전환">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.21.895 4.21 2.343 5.657L4 18h6v-6l-2.343 2.343A5.978 5.978 0 0 1 6 10c0-3.314 2.686-6 6-6s6 2.686 6 6c0 1.657-.672 3.157-1.757 4.243l1.414 1.414A7.963 7.963 0 0 0 20 10z"/>
            </svg>
            카메라 전환
          </button>
          <button type="button" class="btn-tool" id="btn-toggle-torch" title="플래시 켜기/끄기" style="display:none;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            플래시
          </button>
          <button type="button" class="btn-tool" id="btn-file-scan" title="갤러리 사진에서 QR 스캔">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            사진으로 스캔
          </button>
          <input type="file" accept="image/*" id="camera-file-input" style="position:absolute; opacity:0; width:0; height:0; pointer-events:none;" />
        </div>

        <p class="scan-label-text">
          고객의 <strong>스마트폰 화면 또는 종이쿠폰 QR</strong>을<br>
