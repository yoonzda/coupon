<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="/assets/favicon-JK0pTB8M.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>발행처 관리 페이지 | 옹진 관광 쿠폰</title>

  <!-- 웹폰트: 옹진 관광 플랫폼 공통 폰트 (Pretendard + Gowun Dodum + Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
      letter-spacing: -0.02em;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc !important;
      background-image: none !important;
      color: #0f172a;
      padding-bottom: 110px;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
      overflow-x: hidden;
    }

    /* ── 상단 네비게이션 (coupon-qr.html과 통일) ── */
    .top-nav {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      height: 60px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-nav-inner {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-brand-title {
      font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }

    /* ── 페이지 헤더 (coupon-qr.html의 page-header와 통일) ── */
    .manage-header {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 24px 20px;
    }

    .manage-title-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .manage-title {
      font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }

    .manage-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: #64748b;
      margin: 0;
    }

    /* ── 4열 탭 네비게이션 (coupon-qr.html의 method-cards-grid와 통일) ── */
    .tabs-nav-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 20px auto;
      padding: 0 20px;
      z-index: 10;
      position: relative;
    }

    .tab-nav-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 !important;
      padding: 18px 12px 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      box-shadow: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      outline: none;
      color: #334155;
    }

    .tab-nav-btn:hover {
      border-color: #94a3b8;
      background: #f8fafc;
      color: #0f172a;
    }

    .tab-nav-btn.active {
      border: 2px solid #0f172a;
      background: #f8fafc;
      padding: 17px 11px 15px 11px;
      color: #0f172a;
    }

    .tab-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: #475569;
      margin: 0;
      transition: color 0.15s ease;
    }

    .tab-nav-btn:hover .tab-icon-circle,
    .tab-nav-btn.active .tab-icon-circle {
      color: #0f172a;
    }

    /* 로그아웃 탭 호버 스타일 */
    .tab-nav-btn.logout-tab:hover {
      border-color: #fca5a5;
      background: #fef2f2;
    }

    .tab-nav-btn.logout-tab:hover .tab-icon-circle,
    .tab-nav-btn.logout-tab:hover .tab-label {
      color: #dc2626;
    }

    .tab-label {
      font-size: 1.02rem;
      font-weight: 600;
      color: #334155;
      letter-spacing: -0.02em;
      transition: color 0.15s ease;
    }

    .tab-nav-btn:hover .tab-label {
      color: #0f172a;
    }

    .tab-nav-btn.active .tab-label {
      color: #0f172a;
      font-weight: 700;
    }

    /* ── 본문 컨텐츠 영역 ── */
    .content-area-container {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
      z-index: 1;
      position: relative;
    }

    .tab-content {
      display: none;
      width: 100%;
    }

    .tab-content.active {
      display: block;
    }

    /* ── 쿠폰 발급 현황 및 설정 카드 (플랫 직각 박스) ── */
    .stats-top-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .stats-card-wrap,
    .settings-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 !important;
      padding: 24px 22px;
      box-shadow: none;
    }

    .stats-title,
    .chart-card-title,
    .settings-card-title {
      font-family: 'Gowun Dodum', 'Pretendard', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 18px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .coupon-status-layout {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0 !important;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: none;
    }

    .metric-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      font-feature-settings: 'tnum';
      font-variant-numeric: tabular-nums;
    }

    .metric-card.highlight-issued .metric-value,
    .metric-card.highlight-remaining .metric-value {
      color: #0f172a;
    }

    /* ── 계정 정보 및 설정 폼 스타일 ── */
    .settings-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-card-desc {
      font-size: 0.92rem;
      color: #475569;
      margin: -4px 0 20px 0;
      line-height: 1.6;
    }

    .form-row {
      margin-bottom: 16px;
    }

    .form-row label {
      display: block;
      font-size: 0.92rem;
      color: #334155;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-row input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 0 !important;
      color: #0f172a;
      font-size: 0.98rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s ease;
      font-family: inherit;
    }

    .form-row input:focus {
      border-color: #0f172a;
      background: #ffffff;
      box-shadow: none;
    }

    .form-row input::placeholder {
      color: #94a3b8;
    }

    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .form-action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .btn-submit-action {
      height: 46px;
      min-width: 130px;
      padding: 0 24px;
      border-radius: 0 !important;
      border: none;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      transition: background-color 0.15s ease;
      white-space: nowrap;
    }

    .btn-submit-action:hover {
      background: #1e293b;
      box-shadow: none;
    }

    .btn-submit-action:active {
      background: #334155;
    }

    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1100;
    }

    /* 비밀번호 보기 토글 */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 42px !important;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .pw-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.15s ease;
    }

    .pw-toggle-btn:hover svg {
      stroke: #0f172a;
    }

    /* ── 반응형 미디어 쿼리 (coupon-qr.html과 통일) ── */
    @media (max-width: 680px) {
      .top-nav-inner {
        padding: 0 14px;
      }
      .nav-brand-title {
        font-size: 1.05rem;
      }
      .manage-header {
        padding: 20px 14px 16px 14px;
      }
      .manage-title {
        font-size: 1.55rem;
      }
      .tabs-nav-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 0 14px;
        margin-bottom: 16px;
      }
      .tab-nav-btn {
        padding: 14px 8px 12px 8px;
      }
      .tab-nav-btn.active {
        padding: 13px 7px 11px 7px;
      }
      .tab-label {
        font-size: 0.95rem;
      }
      .content-area-container {
        padding: 0 14px;
      }
      .stats-card-wrap,
      .settings-card {
        padding: 18px 14px;
      }
      .metrics-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .metric-card {
        flex-direction: row;
        justify-content: space-between;
        padding: 14px 16px;
      }
      .metric-value {
        font-size: 1.25rem;
      }
      .btn-submit-action {
        width: 100%;
      }
      .ip-input-row {
        flex-direction: column;
        align-items: stretch !important;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/issuer-manage-Dqxc7HT2.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-BxOpvEgq.js">
  <link rel="stylesheet" crossorigin href="/assets/main-CSqzwfnj.css">
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header class="top-nav">
    <div class="top-nav-inner">
      <div class="nav-brand">
        <span class="nav-brand-title">옹진 관광 쿠폰 발행</span>
      </div>
    </div>
  </header>

  <!-- 1. Header with title -->
  <header class="manage-header">
    <div class="manage-title-group">
      <h1 class="manage-title" id="header-issuer-name">발행처</h1>
      <p class="manage-subtitle">발행 내역 및 계정 설정</p>
    </div>
  </header>

  <!-- 2. Horizontal Tab Navigation (4 columns) -->
  <nav class="tabs-nav-container">
    <!-- QR 화면 탭 -->
    <button class="tab-nav-btn" onclick="goToQrPage()">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <rect x="7" y="7" width="3" height="3"></rect>
          <rect x="14" y="7" width="3" height="3"></rect>
          <rect x="7" y="14" width="3" height="3"></rect>
          <rect x="14" y="14" width="3" height="3"></rect>
        </svg>
      </div>
      <span class="tab-label">QR 화면</span>
    </button>

    <!-- 쿠폰 발급 현황 탭 -->
    <button class="tab-nav-btn active" id="tab-btn-stats" onclick="switchTab('stats')">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>
      <span class="tab-label">쿠폰 발급 현황</span>
    </button>

    <!-- 계정 정보 탭 -->
    <button class="tab-nav-btn" id="tab-btn-account" onclick="switchTab('account')">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </div>
      <span class="tab-label">계정 정보</span>
    </button>

    <!-- 로그아웃 탭 -->
    <button class="tab-nav-btn logout-tab" onclick="triggerLogout()">
      <div class="tab-icon-circle">
        <svg style="width:24px;height:24px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <span class="tab-label">로그아웃</span>
    </button>
  </nav>

  <!-- 3. Dynamic Tab Content Area -->
  <main class="content-area-container">
    
    <!-- ── 탭 A. 쿠폰 발급 현황 ── -->
    <section id="content-stats" class="tab-content active">
      <div class="stats-top-grid">
        <!-- 카드 1: 쿠폰 발급 현황 -->
        <div class="stats-card-wrap">
          <h2 class="stats-title">쿠폰 발급 현황</h2>
          
          <div class="coupon-status-layout">
            <!-- 3단 가로형 지표 카드 -->
            <div class="metrics-grid">
              <div class="metric-card">
                <span class="metric-label">오늘 발급 수량</span>
                <span class="metric-value" id="metric-today">0장</span>
              </div>
              <div class="metric-card highlight-issued">
                <span class="metric-label">누적 발급 수량</span>
                <span class="metric-value" id="metric-issued">0장</span>
              </div>
              <div class="metric-card highlight-remaining">
                <span class="metric-label">누적 발급 금액</span>
                <span class="metric-value" id="metric-amount">0원</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ── 탭 B. 계정 정보 ── -->
    <section id="content-account" class="tab-content">
      <div class="settings-grid">
        <!-- Password Change Section -->
        <div class="settings-card">
          <h3 class="settings-card-title">비밀번호 변경</h3>
          
          <div class="form-row">
            <label for="change-current-password">현재 비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="change-current-password" placeholder="현재 비밀번호 입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-curr" aria-label="현재 비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-row">
            <label for="change-new-password">새 비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="change-new-password" placeholder="새 비밀번호 입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-new" aria-label="새 비밀번호 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-row" style="margin-bottom: 0;">
            <label for="change-new-password-confirm">새 비밀번호 확인</label>
            <div class="password-wrapper">
              <input type="password" id="change-new-password-confirm" placeholder="새 비밀번호 재입력" />
              <button type="button" class="pw-toggle-btn" id="pw-toggle-new-conf" aria-label="새 비밀번호 확인 보기">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          
          <div class="form-action-row">
            <button class="btn-submit-action" onclick="submitChangePassword()">변경하기</button>
          </div>
        </div>

        <!-- IP Config Section -->
        <div class="settings-card">
          <h3 class="settings-card-title">휴대폰 접속용 IP 설정</h3>
          <p class="settings-card-desc">
            Kiosk PC가 공유기 와이파이에서 할당받은 로컬 IP(예: 192.168.0.75) 주소로 설정해야 모바일 스캔이 원활하게 연동됩니다. (도커 컨테이너 IP 대역인 172.x.x.x는 사용이 불가능합니다.)
          </p>
          <div class="form-row ip-input-row" style="display: flex; gap: 8px; margin-bottom: 0; align-items: center;">
            <input type="text" id="kiosk-host-input" style="flex: 1;" placeholder="예: http://192.168.0.75:8080" />
            <button id="btn-save-host" class="btn-submit-action">반영 및 저장</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="toast-container"></div>


</body>
</html>
