<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발행처 로그인 | 옹진 관광 쿠폰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      word-break: keep-all; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #0f172a;
      background-image: 
        radial-gradient(circle at 10% 20%, #1e293b 0%, #0f172a 100%);
      position: relative;
      overflow: hidden;
      color: #f1f5f9;
    }

    /* Decorative blurred glow circles */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
      top: -200px; right: -200px;
      z-index: 0;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.06) 0%, transparent 60%);
      bottom: -150px; left: -150px;
      z-index: 0;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 3px solid #3b82f6;
      border-radius: 0; 
      padding: 56px 48px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    /* Shield tooltip style for Issuer */
    .shield-tooltip-container {
      position: absolute;
      top: 24px;
      right: 24px;
      cursor: help;
    }
    .shield-icon {
      width: 20px;
      height: 20px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.2s;
    }
    .shield-tooltip-container:hover .shield-icon {
      stroke: #3b82f6;
    }
    .tooltip-text {
      visibility: hidden;
      opacity: 0;
      white-space: nowrap;
      background-color: #0f172a;
      color: #fff;
      text-align: center;
      padding: 10px 14px;
      position: absolute;
      z-index: 10;
      top: 140%;
      right: -10px;
      font-size: 0.75rem;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
    }
    .tooltip-text::after {
      content: "";
      position: absolute;
      bottom: 100%;
      right: 16px;
      border-width: 6px;
      border-style: solid;
      border-color: transparent transparent #0f172a transparent;
    }
    .shield-tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 40px;
    }
    .issuer-badge {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .logo-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 2.2rem;
      font-weight: 400; 
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon-svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      pointer-events: none;
      transition: stroke 0.3s;
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 16px 16px 16px 46px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      outline: none;
    }
    #password {
      padding-right: 48px !important;
    }
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
    input[type="text"]:focus ~ .input-icon-svg, 
    input[type="password"]:focus ~ .input-icon-svg {
      stroke: #3b82f6;
    }
    input::placeholder { color: #475569; }

    /* Password visibility toggle */
    .pw-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .pw-toggle svg {
      width: 18px;
      height: 18px;
      stroke: #64748b;
      fill: none;
      transition: stroke 0.2s;
    }
    .pw-toggle:hover svg { stroke: #f1f5f9; }

    .btn-login {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
      text-transform: uppercase;
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 16px;
      text-align: left;
    }
    .error-msg.show { display: block; }

    /* 입력 에러 상태 */
    input.error {
      border-color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }
    input.error ~ .input-icon-svg {
      stroke: #f87171;
    }
    
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%; 
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }



    /* Verification Overlay (Loading state for existing token verification) */
    .verify-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .verify-overlay.active {
      display: flex;
    }
    .verify-overlay p {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    #toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 1100;
    }

    /* Floating Inquiry Button */
    .floating-inquiry-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: none;
      border-radius: 50%;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      font-family: inherit;
      padding: 0;
    }
    .btn-border-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: rotate(-90deg);
    }
    .btn-border-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.5;
    }
    .btn-border-active {
      fill: none;
      stroke: #3b82f6;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 213.6;
      stroke-dashoffset: 213.6;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-text-q {
      color: #94a3b8;
      font-size: 2.2rem;
      font-weight: 500;
      transition: color 0.3s ease, text-shadow 0.3s ease;
      z-index: 10;
    }
    .floating-inquiry-btn:hover .btn-border-active {
      stroke-dashoffset: 0;
    }
    .floating-inquiry-btn:hover .btn-text-q {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
    }
    .floating-inquiry-btn:hover {
      background: rgba(30, 41, 59, 0.65);
      box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.25);
    }
    .floating-inquiry-btn:active {
      transform: scale(0.95);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-container {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0; /* No radius */
      width: 360px;
      padding: 40px 28px 32px 28px;
      position: relative;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }
    
    .modal-close-x {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .modal-close-x:hover {
      color: #f1f5f9;
    }
    .modal-close-x svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    .modal-header-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 400;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .title-divider {
      width: 28px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      margin: 12px auto 16px auto;
    }
    .modal-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: -0.2px;
    }
    .modal-desc span {
      display: block;
      margin-bottom: 4px;
    }

    .inquiry-info-box {
      background: rgba(15, 23, 42, 0.4);
      padding: 22px 28px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
    }
    .inquiry-info-item {
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script type="module" crossorigin src="/assets/issuer-login-fpjidLvz.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/api-CJmOwHvj.js">
</head>
<body>
  <div class="login-card" id="login-card-container">
    <!-- Active validation loading state -->
    <div class="verify-overlay" id="verify-loading">
      <div class="spinner" style="display: block; width: 28px; height: 28px;"></div>
      <p>로그인 세션 검증 중...</p>
    </div>

    <div class="logo-area">
      <div class="logo-title">옹진 관광 쿠폰</div>
    </div>

    <form id="form-issuer-login" novalidate>
      <div class="form-group">
        <label for="username">아이디</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="아이디를 입력하세요"
            autocomplete="username"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            autocomplete="current-password"
            required
          />
          <svg class="input-icon-svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
            <rect x="3" y="11" width="18" height="11"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 보기">
            <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button type="submit" class="btn-login" id="btn-submit">
        <span class="btn-text">로그인</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <!-- 문의하기 모달 레이어 -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal-container">
      <button type="button" class="modal-close-x" id="btn-close-inquiry" aria-label="닫기">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-header-area">
        <h3 class="modal-title">문의 안내</h3>
        <div class="title-divider"></div>
        <p class="modal-desc">
          <span>도움이 필요하신 경우</span>
          아래 담당 부서로 문의해 주시기 바랍니다.
        </p>
      </div>
      
      <div class="inquiry-info-box">
        <div class="inquiry-info-item">옹진군청 :</div>
        <div class="inquiry-info-item">프로그램 관리자 :</div>
      </div>
    </div>
  </div>

  <!-- 우측 하단 플로팅 문의하기 버튼 -->
  <button type="button" class="floating-inquiry-btn" id="btn-inquiry" aria-label="문의하기">
    <svg class="btn-border-svg" viewBox="0 0 72 72">
      <!-- 배경 원 (정적 테두리) -->
      <circle class="btn-border-bg" cx="36" cy="36" r="34" />
      <!-- 호버 시 채워지는 원 (동적 테두리) -->
      <circle class="btn-border-active" cx="36" cy="36" r="34" />
    </svg>
    <span class="btn-text-q">?</span>
  </button>

  <div id="toast-container"></div>

</body>
</html>
