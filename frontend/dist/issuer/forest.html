<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>덕적도자연휴양림 쿠폰 발급 | 옹진 관광쿠폰</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #ffffff;
      color: #0f172a;
      padding: 32px 24px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 36px;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .form-group {
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      height: 60px;
      padding: 0 20px;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      font-size: 19px;
      font-family: inherit;
      color: #0f172a;
      background-color: #f8fafc;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder {
      color: #94a3b8;
      font-size: 18px;
    }
    input:focus {
      border-color: #0284c7;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }
    .btn-submit {
      width: 100%;
      height: 60px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 19px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s ease, transform 0.1s ease;
      letter-spacing: -0.01em;
    }
    .btn-submit:hover {
      background: #0369a1;
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .btn-submit:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    /* 닫기 엑스(X) 버튼 */
    .btn-close-x {
      position: absolute;
      top: 22px;
      right: 22px;
      width: 42px;
      height: 42px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #64748b;
      padding: 0;
      transition: all 0.2s ease;
    }
    .btn-close-x:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* 완료 화면 */
    .success-view {
      text-align: center;
      padding: 32px 0;
    }
    .success-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 28px;
      background: #e0f2fe;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0284c7;
    }
    .success-title {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .success-timer {
      font-size: 17px;
      color: #64748b;
      line-height: 1.6;
    }
    .btn-next-now {
      display: inline-block;
      height: 52px;
      line-height: 52px;
      padding: 0 28px;
      background: #f1f5f9;
      color: #0284c7;
      font-weight: 700;
      font-size: 17px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 28px;
      transition: background 0.2s ease;
    }
    .btn-next-now:hover {
      background: #e2e8f0;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .modal-title {
      font-size: 23px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    /* 발급 이력 버튼 및 모달 스타일 */
    .btn-history-link {
      background: none;
      border: none;
      color: #64748b;
      font-size: 17px;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }
    .btn-history-link:hover {
      color: #0284c7;
      background: #f1f5f9;
    }

    .modal-box-large {
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 30px 24px;
    }
    .history-list-scroll {
      overflow-y: auto;
      max-height: 52vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
      margin-top: 14px;
    }
    .history-item {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .history-item-left {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .history-item-name {
      font-size: 19px;
      font-weight: 700;
      color: #0f172a;
    }
    .history-item-phone {
      font-size: 17px;
      color: #334155;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .history-item-meta {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }
    .history-item-right {
      text-align: right;
      flex-shrink: 0;
    }
    .history-item-amount {
      font-size: 18px;
      font-weight: 800;
      color: #0284c7;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- [1] 로그인 화면 -->
    <div id="view-login">
      <h1>로그인</h1>
      <div class="form-group">
        <input type="text" id="login-id" placeholder="아이디" autocomplete="username" />
      </div>
      <div class="form-group">
        <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password" />
      </div>
      <button type="button" id="btn-login" class="btn-submit">로그인</button>
    </div>

    <!-- [2] 발급 화면 -->
    <div id="view-issue" style="display: none;">
      <h1>덕적도자연휴양림</h1>
      <p style="font-size: 16px; color: #64748b; margin-top: -12px; margin-bottom: 28px; line-height: 1.5; word-break: keep-all;">
        숙박 고객의 성함과 휴대폰 번호를 입력해 주세요.<br>
        쿠폰 링크 문자가 발송됩니다.
      </p>
      <div class="form-group">
        <input type="text" id="tourist-name" placeholder="이름" />
      </div>
      <div class="form-group">
        <input type="tel" id="tourist-phone" placeholder="전화번호" maxlength="13" />
      </div>
      <button type="button" id="btn-issue" class="btn-submit">쿠폰 받기</button>
      <div style="margin-top: 24px; text-align: center;">
        <button type="button" id="btn-open-history" class="btn-history-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          발급 이력 확인
        </button>
      </div>
    </div>

    <!-- [3] 발급 완료 화면 (10초 타이머 카운트다운) -->
    <div id="view-success" class="success-view" style="display: none;">
      <div class="success-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="success-title">쿠폰이 발급되었습니다</div>
      <div class="success-timer" id="timer-text">10초 후 입력 화면으로 이동합니다...</div>
    </div>
  </div>

  <!-- [4] 정보 확인 모달 (여백 및 폰트 대폭 확대, 취소 버튼 삭제, 엑스(X) 버튼 적용) -->
  <div id="modal-confirm-info" class="modal-overlay">
    <div class="modal-box" style="text-align: left;">
      <!-- 우측 상단 엑스(X) 버튼 -->
      <button type="button" id="btn-confirm-x" class="btn-close-x" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-title" style="text-align: center; margin-bottom: 26px;">정보 확인</div>
      <div style="background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 24px; margin-bottom: 28px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 18px;">
          <span style="color: #64748b; font-weight: 500;">이름</span>
          <span id="confirm-name" style="font-weight: 700; font-size: 21px; color: #0f172a;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 18px;">
          <span style="color: #64748b; font-weight: 500;">전화번호</span>
          <span id="confirm-phone" style="font-weight: 700; font-size: 21px; color: #0f172a; letter-spacing: 0.5px;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 18px; padding-top: 18px; border-top: 1.5px dashed #cbd5e1;">
          <span style="color: #64748b; font-weight: 500;">발급 금액</span>
          <span style="font-weight: 800; font-size: 24px; color: #0284c7;">10,000원</span>
        </div>
      </div>
      <!-- [발급하기] 버튼만 꽉 차게 배치 -->
      <button type="button" id="btn-confirm-execute" class="btn-submit" style="margin-top: 0;">발급하기</button>
    </div>
  </div>

  <!-- [5] 일반 안내/경고 모달 (alert 대체, 넉넉한 여백) -->
  <div id="modal-notice" class="modal-overlay">
    <div class="modal-box">
      <button type="button" id="btn-notice-x" class="btn-close-x" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="modal-notice-message" class="modal-title" style="margin-bottom: 26px; font-size: 19px; font-weight: 600; line-height: 1.5; padding: 0 12px;">안내</div>
      <button type="button" id="btn-notice-confirm" class="btn-submit" style="margin-top: 0;">확인</button>
    </div>
  </div>

  <!-- [6] 비밀번호 재입력 모달 (세션 만료 시) -->
  <div id="modal-reauth" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" style="font-size: 19px; font-weight: 600;">관리자 비밀번호를 입력해주세요</div>
      <input type="password" id="modal-pw" placeholder="비밀번호" style="margin-bottom: 16px;" />
      <button type="button" id="btn-modal-confirm" class="btn-submit" style="margin-top: 0;">확인</button>
    </div>
  </div>

  <!-- [7] 발급 이력 확인 비밀번호 입력 모달 -->
  <div id="modal-history-pw" class="modal-overlay">
    <div class="modal-box">
      <button type="button" id="btn-history-pw-x" class="btn-close-x" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-title" style="margin-bottom: 22px; font-size: 20px;">비밀번호를 입력해주세요</div>
      <div class="form-group" style="margin-bottom: 22px;">
        <input type="password" id="input-history-pw" placeholder="관리자 비밀번호" autocomplete="current-password" />
      </div>
      <button type="button" id="btn-submit-history-pw" class="btn-submit" style="margin-top: 0;">확인</button>
    </div>
  </div>

  <!-- [8] 발급 이력 목록 모달 -->
  <div id="modal-history-list" class="modal-overlay">
    <div class="modal-box modal-box-large" style="text-align: left;">
      <button type="button" id="btn-history-list-x" class="btn-close-x" aria-label="닫기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      
      <div style="margin-bottom: 12px; padding-right: 32px;">
        <div class="modal-title" style="margin-bottom: 0; font-size: 22px;">발급 이력</div>
      </div>

      <div id="history-list-container" class="history-list-scroll">
        <!-- 동적 렌더링 -->
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = 'ongjin_forest_token';
    const LOGIN_DATE_KEY = 'ongjin_forest_login_date';
    let returnTimer = null;
    let pendingIssueData = null;

    // 기존 localStorage 잔여 데이터 완전 제거 (창 닫기 시 세션 종료 보장)
    try {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(LOGIN_DATE_KEY);
    } catch (_) {}

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    // ── 안내 모달 (alert 완전 대체) ──
    const modalNotice = document.getElementById('modal-notice');
    const modalNoticeMsg = document.getElementById('modal-notice-message');
    const btnNoticeConfirm = document.getElementById('btn-notice-confirm');
    const btnNoticeX = document.getElementById('btn-notice-x');
    let noticeCloseCallback = null;

    function showNotice(message, callback) {
      modalNoticeMsg.textContent = message;
      noticeCloseCallback = callback || null;
      modalNotice.classList.add('active');
    }

    function closeNotice() {
      modalNotice.classList.remove('active');
      if (noticeCloseCallback) {
        const cb = noticeCloseCallback;
        noticeCloseCallback = null;
        cb();
      }
    }

    btnNoticeConfirm.addEventListener('click', closeNotice);
    btnNoticeX.addEventListener('click', closeNotice);

    function checkSession() {
      // 탭/창 닫기 시 자동 소멸되는 sessionStorage 사용
      const token = sessionStorage.getItem(TOKEN_KEY);
      const loginDate = sessionStorage.getItem(LOGIN_DATE_KEY);
      const today = getTodayString();

      // 창을 닫았거나 날짜가 바뀌었거나 토큰이 없으면 무조건 로그인 화면
      if (!token || loginDate !== today) {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(LOGIN_DATE_KEY);
        showView('login');
        return false;
      }
      showView('issue');
      return true;
    }

    function showView(view) {
      document.getElementById('view-login').style.display = view === 'login' ? 'block' : 'none';
      document.getElementById('view-issue').style.display = view === 'issue' ? 'block' : 'none';
      document.getElementById('view-success').style.display = view === 'success' ? 'block' : 'none';

      if (view === 'login') {
        setTimeout(() => document.getElementById('login-id').focus(), 100);
      } else if (view === 'issue') {
        setTimeout(() => document.getElementById('tourist-name').focus(), 100);
      }
    }

    // 완료 화면에서 입력 화면으로 복귀
    function returnToIssue() {
      if (returnTimer) {
        clearInterval(returnTimer);
        returnTimer = null;
      }
      document.getElementById('tourist-name').value = '';
      phoneInput.value = '';
      showView('issue');
    }

    // 전화번호 실시간 자동 하이픈 (010-XXXX-XXXX)
    const phoneInput = document.getElementById('tourist-phone');
    phoneInput.addEventListener('input', function(e) {
      let val = this.value.replace(/[^0-9]/g, '');
      if (val.length > 3 && val.length <= 7) {
        val = val.slice(0, 3) + '-' + val.slice(3);
      } else if (val.length > 7) {
        val = val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
      }
      this.value = val;
    });

    // ── 로그인 ──
    const btnLogin = document.getElementById('btn-login');
    async function doLogin() {
      const username = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pw').value;

      if (!username || !password) {
        return showNotice('아이디와 비밀번호를 모두 입력해주세요.');
      }

      btnLogin.disabled = true;
      btnLogin.textContent = '로그인 중...';

      try {
        const res = await fetch('/api/auth/issuer/forest-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          sessionStorage.setItem(LOGIN_DATE_KEY, data.loginDate || getTodayString());
          document.getElementById('login-pw').value = '';
          showView('issue');
        } else {
          showNotice(data.message || '아이디 또는 비밀번호가 올바르지 않습니다.');
        }
      } catch (err) {
        showNotice('로그인 요청 중 오류가 발생했습니다.');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = '로그인';
      }
    }

    btnLogin.addEventListener('click', doLogin);
    document.getElementById('login-pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    // ── 쿠폰 발급 (정보 확인 모달 띄우기) ──
    const btnIssue = document.getElementById('btn-issue');
    const modalConfirm = document.getElementById('modal-confirm-info');
    const confirmNameEl = document.getElementById('confirm-name');
    const confirmPhoneEl = document.getElementById('confirm-phone');
    const btnConfirmX = document.getElementById('btn-confirm-x');
    const btnConfirmExecute = document.getElementById('btn-confirm-execute');

    function handleClickIssue() {
      const name = document.getElementById('tourist-name').value.trim();
      const rawPhone = phoneInput.value;
      const cleanPhone = rawPhone.replace(/[^0-9]/g, '');

      if (!name) {
        showNotice('이름을 입력해주세요.', () => {
          document.getElementById('tourist-name').focus();
        });
        return;
      }
      if (!cleanPhone || !/^010\d{8}$/.test(cleanPhone)) {
        showNotice('올바른 휴대폰 번호를 입력해주세요.', () => {
          phoneInput.focus();
        });
        return;
      }

      // 모달에 정보 요약 채우기
      pendingIssueData = { name, cleanPhone, formattedPhone: rawPhone };
      confirmNameEl.textContent = name;
      confirmPhoneEl.textContent = rawPhone;

      // 정보 확인 모달 오픈
      modalConfirm.classList.add('active');
    }

    btnIssue.addEventListener('click', handleClickIssue);
    phoneInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleClickIssue();
    });

    // 모달 우측 상단 엑스(X) 버튼 닫기
    btnConfirmX.addEventListener('click', () => {
      modalConfirm.classList.remove('active');
      pendingIssueData = null;
    });

    // 모달 [발급하기] -> 실제 발급 수행
    btnConfirmExecute.addEventListener('click', async () => {
      if (!pendingIssueData) return;
      modalConfirm.classList.remove('active');
      await executeIssue(pendingIssueData.name, pendingIssueData.cleanPhone);
    });

    async function executeIssue(name, phone) {
      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token || !checkSession()) {
        openReauthModal();
        return;
      }

      btnIssue.disabled = true;
      btnIssue.textContent = '쿠폰 발급 중...';

      try {
        const res = await fetch('/api/auth/issuer/forest-issue', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            recipientName: name,
            recipientPhone: phone
          })
        });

        if (res.status === 401) {
          openReauthModal();
          return;
        }

        const data = await res.json();
        if (data.success) {
          // 완료 화면으로 전환 및 10초 카운트다운 타이머 시작
          showView('success');
          let secondsLeft = 10;
          const timerEl = document.getElementById('timer-text');
          timerEl.textContent = `${secondsLeft}초 후 입력 화면으로 이동합니다...`;

          if (returnTimer) clearInterval(returnTimer);
          returnTimer = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
              timerEl.textContent = `${secondsLeft}초 후 입력 화면으로 이동합니다...`;
            } else {
              returnToIssue();
            }
          }, 1000);
        } else {
          showNotice(data.message || '쿠폰 발급에 실패했습니다.');
        }
      } catch (err) {
        showNotice('쿠폰 발급 처리 중 오류가 발생했습니다.');
      } finally {
        btnIssue.disabled = false;
        btnIssue.textContent = '쿠폰 받기';
      }
    }

    // ── 세션 오류 대비 비밀번호 재입력 모달 ──
    const modalReauth = document.getElementById('modal-reauth');
    const modalPwInput = document.getElementById('modal-pw');
    const btnModalConfirm = document.getElementById('btn-modal-confirm');

    function openReauthModal() {
      modalPwInput.value = '';
      modalReauth.classList.add('active');
      setTimeout(() => modalPwInput.focus(), 150);
    }

    async function handleReauth() {
      const password = modalPwInput.value;
      if (!password) {
        return showNotice('비밀번호를 입력해주세요.');
      }

      btnModalConfirm.disabled = true;
      try {
        const res = await fetch('/api/auth/issuer/forest-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'dj', password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          sessionStorage.setItem(LOGIN_DATE_KEY, getTodayString());
          modalReauth.classList.remove('active');
          if (pendingIssueData) {
            executeIssue(pendingIssueData.name, pendingIssueData.cleanPhone);
          }
        } else {
          showNotice('비밀번호가 올바르지 않습니다.', () => {
            modalPwInput.value = '';
            modalPwInput.focus();
          });
        }
      } catch (e) {
        showNotice('인증 처리 중 오류가 발생했습니다.');
      } finally {
        btnModalConfirm.disabled = false;
      }
    }

    btnModalConfirm.addEventListener('click', handleReauth);
    modalPwInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleReauth();
    });

    // ── 발급 이력 확인 로직 ──
    const btnOpenHistory = document.getElementById('btn-open-history');
    const modalHistoryPw = document.getElementById('modal-history-pw');
    const inputHistoryPw = document.getElementById('input-history-pw');
    const btnHistoryPwX = document.getElementById('btn-history-pw-x');
    const btnSubmitHistoryPw = document.getElementById('btn-submit-history-pw');

    const modalHistoryList = document.getElementById('modal-history-list');
    const btnHistoryListX = document.getElementById('btn-history-list-x');
    const historyListContainer = document.getElementById('history-list-container');

    btnOpenHistory.addEventListener('click', () => {
      inputHistoryPw.value = '';
      modalHistoryPw.classList.add('active');
      setTimeout(() => inputHistoryPw.focus(), 150);
    });

    btnHistoryPwX.addEventListener('click', () => {
      modalHistoryPw.classList.remove('active');
    });

    async function checkHistoryPwAndOpen() {
      const password = inputHistoryPw.value;
      if (!password) {
        return showNotice('비밀번호를 입력해주세요.', () => inputHistoryPw.focus());
      }

      const token = sessionStorage.getItem(TOKEN_KEY);
      if (!token) {
        modalHistoryPw.classList.remove('active');
        showView('login');
        return;
      }

      btnSubmitHistoryPw.disabled = true;
      btnSubmitHistoryPw.textContent = '확인 중...';

      try {
        const verifyRes = await fetch('/api/auth/issuer/verify-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ password })
        });
        const verifyData = await verifyRes.json();

        if (!verifyData.success) {
          showNotice(verifyData.message || '비밀번호가 올바르지 않습니다.', () => {
            inputHistoryPw.value = '';
            inputHistoryPw.focus();
          });
          return;
        }

        // 비밀번호 일치 -> 이력 조회
        modalHistoryPw.classList.remove('active');
        loadAndShowHistory();
      } catch (err) {
        showNotice('비밀번호 확인 중 오류가 발생했습니다.');
      } finally {
        btnSubmitHistoryPw.disabled = false;
        btnSubmitHistoryPw.textContent = '확인';
      }
    }

    btnSubmitHistoryPw.addEventListener('click', checkHistoryPwAndOpen);
    inputHistoryPw.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkHistoryPwAndOpen();
    });

    async function loadAndShowHistory() {
      const token = sessionStorage.getItem(TOKEN_KEY);
      historyListContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #64748b;">이력을 불러오는 중입니다...</div>';
      modalHistoryList.classList.add('active');

      try {
        const res = await fetch('/api/auth/issuer/forest-history', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        if (data.success) {
          renderHistoryItems(data.data || [], data.totalCount || 0);
        } else {
          historyListContainer.innerHTML = `<div style="text-align: center; padding: 40px; color: #ef4444;">${data.message || '이력을 불러오지 못했습니다.'}</div>`;
        }
      } catch (err) {
        historyListContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: #ef4444;">이력 조회 중 오류가 발생했습니다.</div>';
      }
    }

    function formatPhone(phone) {
      if (!phone) return '-';
      const clean = phone.replace(/\\D/g, '');
      if (clean.length === 11) {
        return clean.slice(0, 3) + '-' + clean.slice(3, 7) + '-' + clean.slice(7);
      }
      return phone;
    }

    function renderHistoryItems(items) {
      if (items.length === 0) {
        historyListContainer.innerHTML = '<div style="text-align: center; padding: 50px 10px; color: #94a3b8; font-size: 16px;">발급된 이력이 없습니다.</div>';
        return;
      }

      historyListContainer.innerHTML = items.map(item => `
        <div class="history-item">
          <div class="history-item-left">
            <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;">
              <span class="history-item-name">${escapeHtml(item.recipient_name || '')}</span>
              <span class="history-item-phone">${formatPhone(item.recipient_phone)}</span>
            </div>
            <div class="history-item-meta">
              <span>쿠폰번호: <strong>${item.coupon_code || '-'}</strong></span>
              <span style="margin: 0 6px; color: #cbd5e1;">|</span>
              <span>발행시간: ${item.issued_at || '-'}</span>
            </div>
          </div>
          <div class="history-item-right">
            <span class="history-item-amount">${Number(item.face_value || 10000).toLocaleString()}원</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    btnHistoryListX.addEventListener('click', () => {
      modalHistoryList.classList.remove('active');
    });

    // 초기 실행
    checkSession();
  </script>
</body>
</html>
