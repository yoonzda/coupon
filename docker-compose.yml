name: ongjin-coupon-platform

services:
  # ── MySQL 8.0 ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ongjin-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ongjin_coupon_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_pass}
      MYSQL_USER: ${MYSQL_USER:-ongjin_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ongjin_local_pass}
      TZ: Asia/Seoul
    ports:
      - "3310:3306"   # 로컬 3310 → 컨테이너 3306 (기존 MySQL/seal-db 충돌 방지)
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d   # 초기 SQL 자동 실행
      # 자동 시드 데이터 주입 설정 (컨테이너 최초 실행 시 자동 구동)
      - ./database/seeds/001_initial_admin.sql:/docker-entrypoint-initdb.d/005_initial_admin.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_local_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Node.js Backend (Port 3010) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ongjin-backend
    restart: unless-stopped
    env_file:
      - .env.local        # 로컬 시크릿 (git 제외)
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-ongjin_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ongjin_local_pass}
      DB_NAME: ongjin_coupon_db
      PORT: 3010
      NODE_ENV: development
      CALLBACK_URL: http://localhost:8080/tourist/auth-callback.html
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy   # DB 준비 완료 후 기동
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r)=>{ process.exit(r.statusCode===200?0:1) }).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Nginx + Vite 빌드 프론트엔드 (Port 8080) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ongjin-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"       # http://localhost:8080 으로 접속
    depends_on:
      backend:
        condition: service_healthy   # 백엔드 헬스 확인 후 기동

volumes:
  db_data:
    name: ongjin_db_data
